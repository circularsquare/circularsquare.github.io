<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
{%- include analytics.html -%}
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>guess the city!</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" />
  <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #f4f7f2;
      --surface: #ffffff;
      --surface-hover: #eef3eb;
      --border: #d0d9ca;
      --text: #2c3527;
      --text-dim: #6b7a63;
      --accent: #4a8c3f;
      --accent-light: #e2f0de;
      --red: #c0392b;
      --red-light: #fdecea;
      --warm: #c97d1e;
      --radius: 8px;
      --font-mono: "DM Sans", monospace;
      --font-body: "DM Sans", sans-serif;
      --map-size: 450px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--font-body); background: var(--bg); color: var(--text);
      display: flex; flex-direction: column; align-items: center;
    }

    header {
      width: 100%; max-width: 1200px; padding: 16px 20px 4px;
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 10px; flex-shrink: 0;
    }
    header h1 {
      font-family: var(--font-mono); font-size: 1.1rem;
      font-weight: 500; letter-spacing: 0.04em; color: var(--accent);
    }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .scoreboard {
      font-family: var(--font-mono); font-size: 0.82rem;
      color: var(--text-dim); display: flex; gap: 4px;
    }
    .scoreboard span { color: var(--text); font-weight: 500; }
    .difficulty-select {
      font-family: var(--font-mono); font-size: 0.78rem; padding: 4px 8px;
      border: 1px solid var(--border); border-radius: 4px;
      background: var(--surface); color: var(--text); cursor: pointer;
    }
    .difficulty-select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .mode-toggle {
      font-family: var(--font-mono); font-size: 0.78rem; padding: 4px 8px;
      border: 1px solid var(--border); border-radius: 4px;
      background: var(--surface); color: var(--text); cursor: pointer;
      transition: all 0.15s ease; white-space: nowrap;
    }
    .mode-toggle:hover { border-color: var(--accent); }
    .mode-toggle.satellite { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }

    .timer-bar-wrapper {
      width: 100%; max-width: 1200px; padding: 8px 24px 0; flex-shrink: 0;
    }
    .timer-bar-track {
      width: 100%; height: 5px; background: var(--border);
      border-radius: 3px; overflow: hidden;
    }
    .timer-bar-fill {
      height: 100%; background: var(--accent); border-radius: 3px;
      transition: width 0.25s linear, background 0.3s; width: 100%;
    }
    .timer-bar-fill.low { background: var(--warm); }
    .timer-bar-fill.critical { background: var(--red); }
    .timer-label {
      font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-dim);
      margin-top: 3px; display: flex; justify-content: space-between;
    }
    .timer-label span { font-weight: 500; color: var(--text); }

    .label {
      text-align: center;
      font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-dim);
      padding: 0px 24px 10px;
    }
    .game-area {
      width: 100%; max-width: 1200px; padding: 12px 24px;
      display: flex; gap: 6px; justify-content: center; align-items: flex-start; flex-shrink: 0;
    }
    .map-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; position: relative;
      display: flex; flex-direction: column; flex-shrink: 0;
    }
    .map-panel-header {
      padding: 8px 12px; display: flex; justify-content: space-between;
      align-items: center; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .map-panel-header h2 {
      font-family: var(--font-mono); font-size: 0.75rem; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim);
    }
    .badge {
      font-family: var(--font-mono); font-size: 0.7rem;
      padding: 2px 7px; border-radius: 4px;
    }
    .badge-accent { color: var(--accent); background: var(--accent-light); }

    .clue-clip-wrapper {
      width: var(--map-size); height: var(--map-size);
      overflow: hidden; position: relative; flex-shrink: 0;
      background: #1a2e1a;
    }

    /* Single GL map filling the panel. The old implementation stacked one
       Leaflet map per integer zoom and CSS-scaled them to fake fractional
       zoom; MapLibre does fractional zoom natively, so there is just one map
       now and CLUE_ZOOM_OFFSET reproduces the old framing exactly. */
    #clue-map {
      position: absolute;
      inset: 0;
      /* Hidden while a round is being set up, so the previous round's answer
         view never shows through during the geocode await. */
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    #clue-map.ready { opacity: 1; }

    .map-container {
      width: var(--map-size); height: var(--map-size); flex-shrink: 0;
    }

    .guess-panel-wrapper {
      display: flex; flex-direction: column; align-items: center; flex-shrink: 0;
    }
    .controls {
      padding: 8px 0 0;
      display: flex; gap: 12px; justify-content: center; flex-shrink: 0;
    }
    button {
      font-family: var(--font-mono); font-size: 0.82rem; padding: 9px 18px;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface); color: var(--text); cursor: pointer;
      transition: all 0.15s ease;
    }
    button:hover { background: var(--surface-hover); border-color: var(--accent); }
    button:disabled { opacity: 0.35; cursor: not-allowed; border-color: var(--border); }
    button.primary {
      background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 500;
    }
    button.primary:hover { filter: brightness(1.08); }
    button.primary:disabled { filter: none; opacity: 0.35; }
    .wrong-feedback {
      font-family: var(--font-mono); font-size: 0.82rem; color: var(--red);
      background: var(--red-light); padding: 5px 12px; border-radius: var(--radius);
      position: absolute; bottom: 12px; right: 12px; z-index: 10;
      opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
    }
    .wrong-feedback.visible {
      opacity: 1; pointer-events: auto;
      animation: fadeSlideIn 0.25s ease;
    }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-overlay {
      display: none; position: absolute; inset: 0;
      background: rgba(44, 53, 39, 0.35); border-radius: var(--radius);
      z-index: 9999; justify-content: center; align-items: center;
    }
    .result-overlay.visible { display: flex; }
    .result-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 32px 40px; text-align: center;
      max-width: 380px; width: 90%; animation: popIn 0.3s ease;
    }
    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    .result-card h3 { font-family: var(--font-mono); font-size: 0.95rem; margin-bottom: 6px; color: var(--text-dim); }
    .result-city { font-size: 1.5rem; font-weight: 700; margin-bottom: 14px; color: var(--accent); }
    .result-detail { font-family: var(--font-mono); font-size: 0.85rem; color: var(--text-dim); margin-bottom: 5px; }
    .result-points { font-family: var(--font-mono); font-size: 1.3rem; font-weight: 500; margin-bottom: 20px; }
    .result-points.win  { color: var(--accent); }
    .result-points.lose { color: var(--red); }
    .final-score { font-size: 1.8rem; font-weight: 700; color: var(--accent); margin: 10px 0; }

    /* === LEADERBOARD === */
    .leaderboard-wrapper {
      width: 100%; max-width: 1200px; padding: 0 24px 12px; flex-shrink: 0;
    }
    .leaderboard {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 16px;
    }
    .leaderboard h3 {
      font-family: var(--font-mono); font-size: 0.72rem; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-dim); margin-bottom: 8px;
    }
    .lb-entries {
      display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    }
    .lb-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px; gap: 10px;
    }
    .lb-tabs { display: flex; gap: 0; }
    .lb-tab {
      font-family: var(--font-mono); font-size: 0.72rem; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.06em;
      padding: 3px 10px; border: 1px solid var(--border); cursor: pointer;
      background: var(--surface); color: var(--text-dim); transition: all 0.15s;
    }
    .lb-tab:first-child { border-radius: 4px 0 0 4px; }
    .lb-tab:last-child { border-radius: 0 4px 4px 0; border-left: none; }
    .lb-tab:hover { color: var(--text); }
    .lb-tab.active { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
    .lb-tab.active + .lb-tab { border-left-color: var(--accent); }
    .player-name-input {
      font-family: var(--font-mono); font-size: 0.75rem;
      padding: 3px 8px; border: 1px solid var(--border); border-radius: 4px;
      background: var(--surface); color: var(--text); width: 120px;
      outline: none; transition: border-color 0.15s;
    }
    .player-name-input:focus { border-color: var(--accent); }
    .player-name-input::placeholder { color: var(--text-dim); }
    .lb-name-area { display: flex; align-items: center; gap: 6px; }
    .lb-entry {
      font-family: var(--font-mono); font-size: 0.75rem;
      display: flex; align-items: center; gap: 5px;
    }
    .lb-rank { color: var(--text-dim); min-width: 16px; }
    .lb-score { color: var(--accent); font-weight: 500; }
    .lb-diff { color: var(--text-dim); font-size: 0.65rem; }
    .lb-empty { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-dim); }

    .maplibregl-map { background: #eef3eb; }
    .satellite-mode #clue-map .maplibregl-map,
    .satellite-mode #clue-map .maplibregl-canvas-container { background: #1a2e1a; }
    .maplibregl-ctrl-attrib.maplibregl-compact {
      background: #cde7b7 !important;
      color: var(--text-dim) !important; font-size: 0.6rem !important;
    }
    .maplibregl-ctrl-attrib a { color: var(--text-dim) !important; }
    /* Leaflet's zoom control was a compact stacked pair; keep that footprint. */
    .maplibregl-ctrl-group button { width: 26px; height: 26px; }

    @media (max-width: 820px) {
      html, body { overflow: auto; }
      .game-area { flex-direction: column; align-items: center; }
      .game-area .guess-panel-wrapper .map-container,
      .clue-clip-wrapper {
        height: calc(var(--map-size) * 0.64);
      }
    }
  </style>
</head>
<body class="satellite-mode">

    </div>

  <div class="game-area">
    <div class="map-panel" id="clue-panel" style="overflow:visible">

  </div>

  <div class="label">
    check out my <a href="https://anita.garden" style="color:#559139">website!</a> <br>
    disclaimer: this game is vibe coded 
  </div>


  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>

  <script>
    /* ==========================================================
       CITY DATA — loaded from CSV
       ========================================================== */
    const CITIES_CSV_PATH = "/assets/games/citiesmanual.csv";
    const DIFFICULTY_SLICES = { easy: 50, medium: 200, hard: 1000 };

    let ALL_CITIES = [];

    const FALLBACK_CITIES = [
      { name: "New York",     country: "USA",       latlng: [40.7128, -74.006] },
      // { name: "Paris",        country: "France",    latlng: [48.8566, 2.3522] },
      // { name: "Tokyo",        country: "Japan",     latlng: [35.6762, 139.6503] },
      // { name: "London",       country: "UK",        latlng: [51.5074, -0.1278] },
      // { name: "Sydney",       country: "Australia", latlng: [-33.8688, 151.2093] },
      // { name: "Rome",         country: "Italy",     latlng: [41.9028, 12.4964] },
      // { name: "Cairo",        country: "Egypt",     latlng: [30.0444, 31.2357] },
      // { name: "Istanbul",     country: "Turkey",    latlng: [41.0082, 28.9784] },
      // { name: "Mumbai",       country: "India",     latlng: [19.076, 72.8777] },
      // { name: "Buenos Aires", country: "Argentina", latlng: [-34.6037, -58.3816] },
    ];

    function parseCitiesCSV(text) {
      const lines = text.trim().split("\n");
      const cities = [];
      const start = (lines[0] && lines[0].toLowerCase().includes("name")) ? 1 : 0;
      for (let i = start; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        const parts = [];
        let current = "", inQuotes = false;
        for (const ch of line) {
          if (ch === '"') { inQuotes = !inQuotes; continue; }
          if (ch === ',' && !inQuotes) { parts.push(current.trim()); current = ""; continue; }
          current += ch;
        }
        parts.push(current.trim());
        if (parts.length < 4) continue;
        const [name, country, latStr, lngStr] = parts;
        const lat = parseFloat(latStr);
        const lng = parseFloat(lngStr);
        if (isNaN(lat) || isNaN(lng)) continue;
        cities.push({ name, country, latlng: [lat, lng] });
      }
      return cities;
    }

    async function loadCities() {
      try {
        const res = await fetch(CITIES_CSV_PATH);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        const cities = parseCitiesCSV(text);
        if (cities.length < 5) throw new Error(`Only ${cities.length} cities parsed`);
        ALL_CITIES = cities;
        console.log(`Loaded ${cities.length} cities from CSV`);
      } catch (err) {
        console.warn("Failed to load cities CSV, using fallback:", err);
        ALL_CITIES = FALLBACK_CITIES;
      }
    }

    function getCityPool() {
      const diff = document.getElementById("difficulty-select").value;
      const slice = DIFFICULTY_SLICES[diff] || 200;
      return ALL_CITIES.slice(0, Math.min(slice, ALL_CITIES.length));
    }

    const CONFIG = {
      roundsPerGame: 5,
      totalTime: 45,
      startZoom: 15,
      endZoom: 3.5,
      winRadius: 250,        // base win radius in km (used when zoomed in)
      scaleThresholdKm: 500, // win radius starts growing once the view exceeds this radius
      penalty: 4,
    };

    /* ==========================================================
       VARIABLE SPEED: PIECEWISE TIME → ZOOM MAPPING
       Each phase: zFrac = fraction of zoom range covered (must sum to 1)
                   tFrac = fraction of total time spent (must sum to 1)
       Only CONFIG.totalTime needs to change to rescale everything.
       ========================================================== */
    const PHASE_CONFIG = [
      { zFrac: 0.3, tFrac: 0.20 },
      { zFrac: 0.3, tFrac: 0.28 }, 
      { zFrac: 0.2, tFrac: 0.20 },
      { zFrac: 0.2, tFrac: 0.30 }
    ];

    let _tCursor = 0, _zCursor = 0;
    const PHASES = PHASE_CONFIG.map(p => {
      const phase = {
        zoomStart: _zCursor, zoomEnd: _zCursor + p.zFrac,
        timeStart: _tCursor * CONFIG.totalTime,
        timeEnd: (_tCursor + p.tFrac) * CONFIG.totalTime,
      };
      _tCursor += p.tFrac;
      _zCursor += p.zFrac;
      return phase;
    });

    function elapsedToZoomProgress(elapsed) {
      const t = Math.max(0, Math.min(elapsed, CONFIG.totalTime));
      for (const p of PHASES) {
        if (t <= p.timeEnd) {
          const tFrac = (t - p.timeStart) / (p.timeEnd - p.timeStart);
          return p.zoomStart + tFrac * (p.zoomEnd - p.zoomStart);
        }
      }
      return 1.0;
    }

    // Single definition of the zoom at a given elapsed time — the camera, the
    // win radius and the zoom readout all read from here. Uses the mode-aware
    // start zoom (getEffectiveStartZoom, defined below) so it cannot drift
    // from the animation loop the way a second copy of this formula would.
    function effectiveZoom(elapsed) {
      const startZoom = getEffectiveStartZoom();
      const progress = elapsedToZoomProgress(elapsed);
      return startZoom - progress * (startZoom - CONFIG.endZoom);
    }

    /* ==========================================================
       TILES — map and satellite modes
       ========================================================== */
    // `tiles` is a MapLibre URL template list. MapLibre picks the entry for a
    // tile with urls[(x + y) % urls.length], so adding a second hostname here
    // shards across it — buildTileUrl() below mirrors that choice exactly so
    // prefetches land on the same URL the map will ask for. Esri serves this
    // over HTTP/1.1 from one host (6 connections), so keeping the request
    // count low matters more here than it would on an HTTP/2 source.
    const TILE_SETS = {
      map: {
        tiles: ["a", "b", "c", "d"].map(s =>
          `https://${s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}.png`),
        maxClueZoom: 20,
        dim: true,
      },
      satellite: {
        tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
        maxClueZoom: 18,
        attribution: "Imagery &copy; Esri",
      },
    };

    let tileMode = "satellite";

    function getTiles() { return TILE_SETS[tileMode]; }

    // Satellite maxes out at 18; cap start zoom accordingly
    function getEffectiveStartZoom() {
      return Math.min(CONFIG.startZoom, getTiles().maxClueZoom);
    }

    /* ==========================================================
       MAP SIZE
       ========================================================== */
    function computeMapSize() {
      const headerH = document.querySelector("header").offsetHeight;
      const timerH = document.querySelector(".timer-bar-wrapper").offsetHeight;
      const controlsH = document.querySelector(".controls").offsetHeight;
      const lbH = document.querySelector(".leaderboard-wrapper").offsetHeight;
      const chrome = headerH + timerH + controlsH + lbH + 50;
      const availH = window.innerHeight - chrome;
      const panelHeaderH = 38;
      const maxFromHeight = availH - panelHeaderH;
      const containerW = Math.min(window.innerWidth, 1200);
      const isStacked = window.innerWidth <= 820;
      const maxW = isStacked ? containerW - 48 : (containerW - 64) / 2;
      const size = Math.max(200, Math.floor(Math.min(maxFromHeight, maxW)));
      document.documentElement.style.setProperty("--map-size", size + "px");
      // GL maps don't observe their container, so both need telling.
      answerMap.resize();
      clueMap.resize();
    }

    /* ==========================================================
       STATE
       ========================================================== */
    let state = {
      round: 0, score: 0, currentCity: null, clueLatLng: null, guessLatLng: null,
      citiesThisGame: [], timeRemaining: CONFIG.totalTime,
      roundActive: false, gameOver: false, animFrameId: null,
      animStartTime: null, animTimeOffset: 0, _lastUIUpdate: 0,
    };

    /* ==========================================================
       CLUE MAP — one MapLibre GL map, continuous fractional zoom
       ========================================================== */
    /* This used to be a pyramid: one Leaflet map per integer zoom, CSS-scaled
       and clip-path'd into each other to fake fractional zoom. MapLibre zooms
       fractionally on its own, so there is one map now.

       The framing has to be preserved exactly, because getDynamicWinRadius()
       is empirically calibrated against it. Two corrections, both folded into
       the camera: Leaflet zoom N means 256 * 2^N px per world where MapLibre
       means 512 * 2^N (so one level lower), and the old pyramid sat inside a
       container with `transform: scale(1.3)` (so log2(1.3) levels higher). */
    const CLUE_ZOOM_OFFSET = Math.log2(1.3) - 1;   // ~ -0.6215

    const clueEl = document.getElementById("clue-map");

    function buildClueStyle() {
      const tiles = getTiles();
      return {
        version: 8,
        sources: {
          clue: {
            type: "raster",
            tiles: tiles.tiles,
            tileSize: 256,
            minzoom: 0,
            maxzoom: tiles.maxClueZoom,
            attribution: tiles.attribution || "",
          },
        },
        layers: [
          { id: "clue-bg", type: "background", paint: { "background-color": "#1a2e1a" } },
          {
            id: "clue-raster", type: "raster", source: "clue",
            // Map mode replaces the old brightness(0.85) contrast(1.3) CSS
            // filter that was applied to the Leaflet tile pane.
            paint: tiles.dim
              ? { "raster-fade-duration": 300, "raster-brightness-max": 0.85, "raster-contrast": 0.3 }
              : { "raster-fade-duration": 300 },
          },
        ],
      };
    }

    const clueMap = new maplibregl.Map({
      container: "clue-map",
      style: buildClueStyle(),
      center: [0, 20],
      zoom: CONFIG.startZoom + CLUE_ZOOM_OFFSET,
      interactive: false,
      attributionControl: false,
    });

    function setClueZoom(ez) {
      clueMap.jumpTo({ zoom: ez + CLUE_ZOOM_OFFSET });
    }

    /* Hand the whole zoom-out to MapLibre rather than nudging setZoom() from
       our own rAF. Driving it externally meant the zoom advanced in even
       per-frame steps that MapLibre then painted at uneven times — its repaint
       sometimes landed in the same frame and sometimes a frame later, so an
       identical zoom step covered anywhere from 4ms to 37ms of wall clock.
       Even steps, uneven timing: that was the stutter. easeTo interpolates
       inside MapLibre's own render loop, where the camera value is computed
       from the paint's clock, so the rate is smooth by construction. */
    /* A wrong guess pushes the clock forward 4s, which the camera has to make
       up. Teleporting there reveals a whole ring of never-seen ground in one
       frame, and on a slow link that was the single worst source of empty
       background left (measured ~8% of the panel). Sliding into it over a few
       hundred ms gives the tiles time to arrive and reads better besides. */
    const PENALTY_CATCHUP_MS = 450;

    function startClueZoomAnimation(elapsed, catchUpMs) {
      const ez0 = effectiveZoom(elapsed);          // where the clock says we are
      const remaining = CONFIG.totalTime - elapsed;
      if (remaining <= 0) { setClueZoom(ez0); return; }

      // Without a catch-up, snap into place first so camera and clock agree
      // exactly; with one, start from wherever the camera currently is.
      if (!catchUpMs) setClueZoom(ez0);
      const camNow = clueMap.getZoom() - CLUE_ZOOM_OFFSET;
      const gap = camNow - ez0;                    // >0 only mid-catch-up
      const span = camNow - CONFIG.endZoom;
      if (span <= 0) return;

      clueMap.easeTo({
        zoom: CONFIG.endZoom + CLUE_ZOOM_OFFSET,
        duration: remaining * 1000,
        /* easeTo interpolates zoom linearly against easing(t), so this maps
           time to "fraction of the way from here to the end zoom" — keeping
           PHASES as the single source of truth for pacing, plus a decaying
           term that closes any catch-up gap over catchUpMs. */
        easing: t => {
          const target = effectiveZoom(elapsed + t * remaining);
          const blend = catchUpMs ? Math.min(1, (t * remaining * 1000) / catchUpMs) : 1;
          return (camNow - (target + gap * (1 - blend))) / span;
        },
        // Without this MapLibre skips the animation outright for anyone with
        // prefers-reduced-motion set, and the clue map would snap to the end.
        essential: true,
      });
    }

    // Resolves once the clue map has settled — tiles in, fades finished — or
    // after capMs regardless, so a slow tile server can never stall a round.
    function clueSettled(capMs) {
      return new Promise(resolve => {
        let settled = false;
        const finish = () => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          clueMap.off("idle", finish);
          resolve();
        };
        const timer = setTimeout(finish, capMs);
        clueMap.on("idle", finish);
      });
    }

    /* ==========================================================
       TILE PREFETCH
       MapLibre covers a not-yet-loaded tile with whatever loaded parent or
       child it already holds, so crossing a zoom level is a clean whole-frame
       cross-fade — but only if the incoming level is already in the HTTP
       cache. If those tiles trickle in instead, you get a ragged per-tile
       patchwork, which for satellite imagery (different capture dates at
       different levels) looks worse than any single clean seam. So warm each
       level ahead of time: 9 tiles per level, against the 81 per level the
       old preloader fired.
       ========================================================== */
    // Fractional tile coordinates — the position *within* the tile matters for
    // working out coverage, so this deliberately does not floor.
    function latLngToTileXY(lat, lng, zoom) {
      const n = Math.pow(2, zoom);
      const latRad = (lat * Math.PI) / 180;
      return {
        x: ((lng + 180) / 360) * n,
        y: ((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2) * n,
      };
    }

    // MapLibre asks a 256px raster source for round(cameraZoom + 1).
    function clueSourceZoom(ez) {
      return Math.round(ez + CLUE_ZOOM_OFFSET + 1);
    }

    // Mirrors MapLibre's CanonicalTileID.url(): urls[(x + y) % urls.length].
    // Has to agree exactly, or the prefetch warms a URL the map never asks for.
    function buildTileUrl(urls, z, x, y) {
      return urls[(x + y) % urls.length]
        .replace(/{z}/g, z).replace(/{x}/g, x).replace(/{y}/g, y);
    }

    /* Priority hint on prefetch requests. This one matters a lot: measured on
       a throttled 3 Mbps / 150ms link, "auto" left frames up to 100% empty
       because prefetches queued ahead of the tiles the map was waiting on over
       a 6-connection HTTP/1.1 pipe — the old preloader's exact failure. With
       "low" the worst frame in the same test was ~3%. Browsers without
       priority hints ignore it and issue a normal fetch. */
    const PREFETCH_PRIORITY = "low";

    // How many levels ahead to warm. Deeper lead steadily improves the
    // wrong-guess skip (measured 13.8% -> 7.8% empty at 3 -> 6 levels), but
    // going much deeper just front-loads a large burst at round start.
    const PREFETCH_LEAD = 6;

    /* Prefetches go through a queue instead of all at once. The priority hint
       alone is not enough: a request that already holds one of the six
       HTTP/1.1 sockets is never preempted, so a burst can occupy all of them
       and starve the tiles the map needs *now*. At 1.2 Mbps that showed up as
       a fully empty panel — the map could not even fetch a low-resolution
       parent to cover with. Capping in-flight prefetches keeps sockets free
       for the map at all times, so a slow link degrades to blurry rather than
       blank. */
    const PREFETCH_CONCURRENCY = 2;
    let prefetchQueue = [];
    let prefetchActive = 0;

    function pumpPrefetchQueue() {
      while (prefetchActive < PREFETCH_CONCURRENCY && prefetchQueue.length) {
        const url = prefetchQueue.shift();
        prefetchActive++;
        fetch(url, { priority: PREFETCH_PRIORITY })
          // Consume the body: an unread response stream can be collected and
          // cancel the transfer, which would leave nothing in the cache.
          .then(r => r.blob())
          .catch(() => {})
          .then(() => { prefetchActive--; pumpPrefetchQueue(); });
      }
    }

    let prefetchedZooms = new Set();

    /* A level is in use while round(cameraZoom + 1) equals it, which spans a
       whole zoom level: its tiles enter the frame at 512/sqrt(2) = 362 screen
       px and shrink to 512/2^1.5 = 181 px before the next level takes over.
       Sizing the block for the moment of switch-in only covers the start of
       that span — by the end the viewport reaches twice as far, and those
       outer tiles show up cold mid-level. Size for the small end. */
    const MIN_TILE_SCREEN_PX = 512 / Math.pow(2, 1.5);   // ~181

    function prefetchSourceZoom(zoom) {
      const tiles = getTiles();
      if (zoom < 0 || zoom > tiles.maxClueZoom || prefetchedZooms.has(zoom)) return;
      prefetchedZooms.add(zoom);

      const clue = state.clueLatLng || (state.currentCity && state.currentCity.latlng);
      if (!clue) return;

      const el = document.getElementById("clue-clip");
      const px = Math.max(el.clientWidth, el.clientHeight) || 450;
      /* Half the panel, measured in tiles of this level, at the most zoomed-out
         moment the level is still in use — i.e. when its tiles are smallest.
         Taking the exact range rather than a symmetric worst-case block is
         worth a lot: a fixed 5x5 covers 905px for a 505px panel, over three
         times the area actually needed, and those tiles cost real bytes. */
      const half = (px / 2) / MIN_TILE_SCREEN_PX;
      const n = Math.pow(2, zoom);
      const c = latLngToTileXY(clue[0], clue[1], zoom);

      for (let ty = Math.floor(c.y - half); ty <= Math.floor(c.y + half); ty++) {
        if (ty < 0 || ty >= n) continue;                       // past a pole
        for (let x = Math.floor(c.x - half); x <= Math.floor(c.x + half); x++) {
          const tx = ((x % n) + n) % n;                        // wrap the antimeridian
          prefetchQueue.push(buildTileUrl(tiles.tiles, zoom, tx, ty));
        }
      }
      pumpPrefetchQueue();
    }

    function prefetchAhead(ez) {
      const z = clueSourceZoom(ez);
      for (let i = 1; i <= PREFETCH_LEAD; i++) prefetchSourceZoom(z - i);
    }

    /* ==========================================================
       rAF ANIMATION LOOP
       ========================================================== */
    function animationLoop(timestamp) {
      if (!state.roundActive) return;

      if (state.animStartTime === null) state.animStartTime = timestamp;

      const elapsed = (timestamp - state.animStartTime) / 1000 + state.animTimeOffset;
      state.timeRemaining = Math.max(0, CONFIG.totalTime - elapsed);

      if (state.timeRemaining <= 0) {
        state.timeRemaining = 0;
        endRound(false, 0);
        return;
      }

      const ez = effectiveZoom(elapsed);

      // The camera is MapLibre's job now (see startClueZoomAnimation); this
      // loop only keeps the clock, the UI and the tile prefetch in step.
      prefetchAhead(ez);

      // UI at ~4Hz
      if (timestamp - state._lastUIUpdate > 250) {
        state._lastUIUpdate = timestamp;
        const t = state.timeRemaining;
        const pct = (t / CONFIG.totalTime) * 100;
        const fill = document.getElementById("timer-fill");
        fill.style.width = `${pct}%`;
        fill.classList.toggle("low", pct <= 40 && pct > 15);
        fill.classList.toggle("critical", pct <= 15);
        document.getElementById("timer-text").textContent = `${t.toFixed(1)}s`;
        document.getElementById("zoom-label").textContent = `zoom ${ez.toFixed(1)}`;
        syncGuessOverlay(ez);
      }

      state.animFrameId = requestAnimationFrame(animationLoop);
    }

    function startAnimation() {
      state.animStartTime = null;
      state.animTimeOffset = 0;
      state._lastUIUpdate = 0;
      startClueZoomAnimation(0);
      state.animFrameId = requestAnimationFrame(animationLoop);
    }

    function stopAnimation() {
      clueMap.stop();
      if (state.animFrameId) {
        cancelAnimationFrame(state.animFrameId);
        state.animFrameId = null;
      }
    }

    /* ==========================================================
       ANSWER MAP — MapLibre GL, OpenFreeMap vector basemap
       ========================================================== */
    /* This was Leaflet with maplibre-gl-leaflet layered on top. That shim
       draws GL into a canvas only 10% wider than the viewport and re-syncs the
       camera at most every 32ms, so a quick drag outruns what has been
       rendered and the map visibly fails to fill in; zooming was a CSS-scaled
       bitmap that snapped at the end. Driving MapLibre directly removes both,
       and with it the SVG-redraw workaround the overlays used to need. */
    const answerMap = new maplibregl.Map({
      container: "answer-map",
      style: "https://tiles.openfreemap.org/styles/liberty",
      center: [0, 20],          // Leaflet [20, 0] @ z2 == MapLibre [0, 20] @ z1
      zoom: 1,
      attributionControl: false,
      dragRotate: false,
      pitchWithRotate: false,
      touchPitch: false,
    });
    answerMap.touchZoomRotate.disableRotation();
    answerMap.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-left");
    answerMap.addControl(new maplibregl.ScaleControl({ unit: "metric" }), "bottom-left");
    answerMap.addControl(
      new maplibregl.AttributionControl({ compact: true, customAttribution: "&copy; OpenStreetMap" }),
      "bottom-right"
    );

    const ACCENT = "#4a8c3f";
    const EMPTY_FC = { type: "FeatureCollection", features: [] };

    let guessPinMarker = null;
    let answerReady = false;

    const GUESS_PIN_SVG =
      `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="40" viewBox="0 0 28 40" style="filter:drop-shadow(0 2px 4px rgba(0,0,0,0.35))"><path d="M14 0 C6.268 0 0 6.268 0 14 C0 24.5 14 40 14 40 C14 40 28 24.5 28 14 C28 6.268 21.732 0 14 0 Z" fill="${ACCENT}"/><circle cx="14" cy="14" r="6" fill="white"/></svg>`;

    /* A true great-circle ring on the same sphere haversineKm() uses, so the
       drawn boundary *is* the win condition rather than an approximation of it
       — L.circle projected a slightly different shape, which showed at the
       large radii this grows to late in a round. */
    function geodesicRing(lat, lng, radiusKm, steps = 128) {
      const R = 6371;
      const d = radiusKm / R;
      const lat1 = (lat * Math.PI) / 180;
      const lng1 = (lng * Math.PI) / 180;
      const coords = [];
      let prevLng = null;
      for (let i = 0; i <= steps; i++) {
        const brng = (i / steps) * 2 * Math.PI;
        const lat2 = Math.asin(
          Math.sin(lat1) * Math.cos(d) + Math.cos(lat1) * Math.sin(d) * Math.cos(brng)
        );
        const lng2 = lng1 + Math.atan2(
          Math.sin(brng) * Math.sin(d) * Math.cos(lat1),
          Math.cos(d) - Math.sin(lat1) * Math.sin(lat2)
        );
        let lngDeg = (lng2 * 180) / Math.PI;
        // Keep the ring continuous across the antimeridian rather than letting
        // it wrap and smear a band across the whole world.
        if (prevLng !== null) {
          while (lngDeg - prevLng > 180) lngDeg -= 360;
          while (prevLng - lngDeg > 180) lngDeg += 360;
        }
        prevLng = lngDeg;
        coords.push([lngDeg, (lat2 * 180) / Math.PI]);
      }
      return { type: "Feature", properties: {}, geometry: { type: "Polygon", coordinates: [coords] } };
    }

    answerMap.on("load", () => {
      answerReady = true;
      answerMap.addSource("guess-area", { type: "geojson", data: EMPTY_FC });
      answerMap.addSource("result", { type: "geojson", data: EMPTY_FC });

      answerMap.addLayer({
        id: "guess-area-fill", type: "fill", source: "guess-area",
        paint: { "fill-color": ACCENT, "fill-opacity": 0.10 },
      });
      answerMap.addLayer({
        id: "guess-area-line", type: "line", source: "guess-area",
        paint: { "line-color": ACCENT, "line-width": 2, "line-dasharray": [3, 2] },
      });
      answerMap.addLayer({
        id: "result-line", type: "line", source: "result",
        filter: ["==", ["geometry-type"], "LineString"],
        paint: { "line-color": ["get", "color"], "line-width": 2, "line-dasharray": [3, 2] },
      });
      answerMap.addLayer({
        id: "result-point", type: "circle", source: "result",
        filter: ["==", ["geometry-type"], "Point"],
        paint: {
          "circle-radius": 8, "circle-color": ACCENT, "circle-opacity": 0.9,
          "circle-stroke-color": ACCENT, "circle-stroke-width": 2,
        },
      });

      syncGuessOverlay();
    });

    function setAnswerData(id, data) {
      if (!answerReady) return;
      const src = answerMap.getSource(id);
      if (src) src.setData(data);
    }

    // Redraw the acceptance ring. Called on each guess and ~4x/sec during a
    // round, since the radius grows as the clue map zooms out.
    function syncGuessOverlay(ez) {
      if (!state.guessLatLng) { setAnswerData("guess-area", EMPTY_FC); return; }
      const z = ez === undefined
        ? effectiveZoom(CONFIG.totalTime - state.timeRemaining)
        : ez;
      setAnswerData("guess-area", geodesicRing(
        state.guessLatLng.lat, state.guessLatLng.lng, getDynamicWinRadius(z)
      ));
    }

    function clearGuessOverlay() {
      setAnswerData("guess-area", EMPTY_FC);
      if (guessPinMarker) { guessPinMarker.remove(); guessPinMarker = null; }
    }

    answerMap.on("click", (e) => {
      if (!state.roundActive) return;
      // World copies mean a click can arrive at lng 190; wrap so the readout
      // and the stored guess stay in the normal range.
      state.guessLatLng = e.lngLat.wrap();
      syncGuessOverlay();

      if (guessPinMarker) {
        guessPinMarker.setLngLat(state.guessLatLng);
      } else {
        const el = document.createElement("div");
        el.innerHTML = GUESS_PIN_SVG;
        guessPinMarker = new maplibregl.Marker({ element: el, anchor: "bottom" })
          .setLngLat(state.guessLatLng)
          .addTo(answerMap);
      }

      document.getElementById("btn-submit").disabled = false;
      document.getElementById("guess-hint").textContent =
        `${state.guessLatLng.lat.toFixed(2)}, ${state.guessLatLng.lng.toFixed(2)}`;
    });

    /* ==========================================================
       UTILITIES
       ========================================================== */
    function haversineKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const toRad = (d) => (d * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function calcPoints(tr) { return Math.max(0, Math.round(tr)); }

    function formatDist(km) {
      if (km < 1) return `${Math.round(km * 1000)} m`;
      if (km < 100) return `${km.toFixed(1)} km`;
      return `${Math.round(km).toLocaleString()} km`;
    }

    // Approximate visible radius in km at a given effective zoom (calibrated for ~450px map).
    // win radius is held at CONFIG.winRadius until the view exceeds scaleThresholdKm,
    // then grows proportionally so the acceptance zone stays a fixed fraction of the view.
    function getDynamicWinRadius(ez) {
      const viewRadiusKm = 35000 / Math.pow(2, ez);
      return Math.max(CONFIG.winRadius, CONFIG.winRadius * viewRadiusKm / CONFIG.scaleThresholdKm);
    }

    function jitterLatLng(latlng, maxRadiusKm = 4) {
      const [lat, lng] = latlng;
      const angle = Math.random() * 2 * Math.PI;
      // sqrt gives uniform area distribution within the circle
      const dist = Math.sqrt(Math.random()) * maxRadiusKm;
      const dlat = (dist * Math.cos(angle)) / 111.32;
      const dlng = (dist * Math.sin(angle)) / (111.32 * Math.cos(lat * Math.PI / 180));
      return [lat + dlat, lng + dlng];
    }

    async function isOverWater(lat, lng) {
      try {
        const res = await fetch(
          `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`
        );
        if (!res.ok) return false;
        const data = await res.json();
        // Open ocean: Nominatim returns { error: "Unable to geocode" }
        if (data.error) return true;
        // Named water bodies
        const waterTypes = new Set([
          'ocean', 'sea', 'bay', 'strait', 'gulf', 'lake',
          'river', 'reservoir', 'harbour', 'harbor',
          'water',   // natural=water (generic water polygons — the main missing case)
          'sound', 'fjord', 'lagoon', 'inlet', 'cove', 'channel',
        ]);
        if (waterTypes.has(data.type)) return true;
        if (data.class === 'waterway' || data.class === 'water') return true;
        return false;
      } catch {
        return false; // assume land on error
      }
    }

    async function getJitteredLatLng(city, maxTries = 5) {
      for (let i = 0; i < maxTries; i++) {
        const jittered = jitterLatLng(city.latlng);
        if (!(await isOverWater(jittered[0], jittered[1]))) return jittered;
      }
      console.log("All jitter attempts landed on water, using exact city center");
      return city.latlng;
    }

    /* ==========================================================
       ANYWHERE MODE — random land points
       ========================================================== */
    // Weighted by approximate land area so most candidates hit land
    const LAND_REGIONS = [
      { lat: [15, 70],   lng: [-168, -52],  weight: 16 }, // North America
      { lat: [-55, 13],  lng: [-82,  -34],  weight: 12 }, // South America
      { lat: [35, 71],   lng: [-10,   40],  weight: 7  }, // Europe
      { lat: [-35, 38],  lng: [-18,   52],  weight: 20 }, // Africa
      { lat: [0, 72],    lng: [26,   180],  weight: 30 }, // Asia
      { lat: [-47, -10], lng: [113,  180],  weight: 6  }, // Oceania
    ];

    function randomLandCandidate() {
      const total = LAND_REGIONS.reduce((s, r) => s + r.weight, 0);
      let r = Math.random() * total;
      for (const region of LAND_REGIONS) {
        r -= region.weight;
        if (r <= 0) {
          const lat = region.lat[0] + Math.random() * (region.lat[1] - region.lat[0]);
          const lng = region.lng[0] + Math.random() * (region.lng[1] - region.lng[0]);
          return [lat, lng];
        }
      }
      return [0, 20];
    }

    async function reverseGeocode(lat, lng) {
      try {
        const res = await fetch(
          `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`
        );
        if (!res.ok) return null;
        const data = await res.json();
        return data.error ? null : data;
      } catch { return null; }
    }

    async function getRandomLandPoint(maxTries = 15) {
      for (let i = 0; i < maxTries; i++) {
        const candidate = randomLandCandidate();
        if (!(await isOverWater(candidate[0], candidate[1]))) return candidate;
      }
      return [48.8566, 2.3522]; // fallback: Paris
    }

    // Fill in latlng for an "anywhere" city placeholder, then background-geocode its name.
    async function prepareAnywhereCity(city) {
      city.latlng = await getRandomLandPoint();
      reverseGeocode(city.latlng[0], city.latlng[1]).then(data => {
        if (data && data.address) {
          const a = data.address;
          city.name = a.city || a.town || a.village || a.county || a.state || null;
          city.country = a.country || null;
        }
        if (!city.name) {
          city.name = `${city.latlng[0].toFixed(2)}°, ${city.latlng[1].toFixed(2)}°`;
        }
      });
    }

    document.getElementById("difficulty-select").addEventListener("change", () => {
      stopAnimation(); startGame();
      renderLeaderboard();
      if (currentLbTab === "global" && globalLeaderboardCache) renderGlobalLeaderboard(globalLeaderboardCache);
    });

    // Map mode (CARTO basemap) is disabled — satellite-only for now, since the
    // map-mode clue tiles are unavailable. The mode-toggle button was removed.

    function updateTimerUI() {
      const t = state.timeRemaining;
      const pct = (t / CONFIG.totalTime) * 100;
      const fill = document.getElementById("timer-fill");
      fill.style.width = `${pct}%`;
      fill.classList.toggle("low", pct <= 40 && pct > 15);
      fill.classList.toggle("critical", pct <= 15);
      document.getElementById("timer-text").textContent = `${t.toFixed(1)}s`;
      const elapsed = CONFIG.totalTime - t;
      const ez = effectiveZoom(elapsed);
      document.getElementById("zoom-label").textContent = `zoom ${ez.toFixed(1)}`;
    }

    /* ==========================================================
       LEADERBOARD — LOCAL + GLOBAL (jsonbin.io)
       Entries are categorised by difficulty + mode (6 combos).
       Only entries matching the current selection are shown.
       ========================================================== */
    // Backed by shonei-server (leaderboard.go). This replaced a jsonbin.io bin
    // whose master key was in this file — public source, so anyone could rewrite
    // or delete the whole account. Nothing secret lives here now; the server
    // validates, filters names, and keeps an append-only log of every
    // submission and every completed game.
    const LB_BASE = "https://market.anita.garden/guesscity";

    // One board per difficulty+mode combination, matching the server's key
    // shape. The old client treated a missing mode as "map"; keep that.
    function lbBoard(difficulty, mode) {
      return `${difficulty}_${mode || "map"}`;
    }

    const LB_KEY = "guessTheCity_leaderboard";
    const LB_CAT_MAX = 10;     // top entries kept per category locally
    const GLOBAL_CAT_MAX = 20; // top entries kept per category globally

    let currentLbTab = "local";
    let globalLeaderboardCache = null;

    function getCurrentFilter() {
      return {
        difficulty: document.getElementById("difficulty-select").value,
        mode: tileMode,
      };
    }

    // Keep the top N entries per difficulty+mode category.
    function trimByCategory(entries, perCatMax) {
      const byCategory = {};
      for (const e of entries) {
        const key = `${e.difficulty}:${e.mode || "map"}`;
        (byCategory[key] = byCategory[key] || []).push(e);
      }
      const out = [];
      for (const cat of Object.values(byCategory)) {
        cat.sort((a, b) => b.score - a.score);
        out.push(...cat.slice(0, perCatMax));
      }
      return out;
    }

    document.querySelectorAll(".lb-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".lb-tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        currentLbTab = tab.dataset.tab;
        document.getElementById("lb-entries").style.display =
          currentLbTab === "local" ? "flex" : "none";
        document.getElementById("lb-global-entries").style.display =
          currentLbTab === "global" ? "flex" : "none";
        if (currentLbTab === "global") fetchGlobalLeaderboard();
      });
    });

    function getPlayerName() {
      return localStorage.getItem("guessTheCity_playerName") || "anonymous";
    }

    function loadLeaderboard() {
      try { return JSON.parse(localStorage.getItem(LB_KEY)) || []; }
      catch { return []; }
    }
    function saveLeaderboard(entries) {
      try { localStorage.setItem(LB_KEY, JSON.stringify(entries)); } catch {}
    }

    function addToLeaderboard(score, difficulty, mode) {
      const entries = loadLeaderboard();
      entries.push({
        score, difficulty, mode,
        maxScore: CONFIG.totalTime * CONFIG.roundsPerGame,
        date: new Date().toLocaleDateString(),
        name: getPlayerName(),
      });
      saveLeaderboard(trimByCategory(entries, LB_CAT_MAX));
      renderLeaderboard();
    }

    function renderLeaderboard() {
      const { difficulty, mode } = getCurrentFilter();
      const entries = loadLeaderboard()
        .filter(e => e.difficulty === difficulty && (e.mode === mode || !e.mode))
        .sort((a, b) => b.score - a.score)
        .slice(0, LB_CAT_MAX);
      const container = document.getElementById("lb-entries");
      if (entries.length === 0) {
        container.innerHTML = '<span class="lb-empty">no games played yet</span>';
        return;
      }
      container.innerHTML = entries.map((e, i) => `
        <div class="lb-entry">
          <span class="lb-rank">${i + 1}.</span>
          <span class="lb-score">${e.score}/${e.maxScore}</span>
          <span class="lb-diff">${e.date}</span>
        </div>
      `).join("");
    }

    // Names are typed by strangers and go straight into innerHTML below, so they
    // must be escaped — otherwise a short name like <img src=x onerror=…> runs
    // as script for everyone who later opens this board.
    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }

    async function fetchGlobalLeaderboard() {
      const container = document.getElementById("lb-global-entries");
      if (globalLeaderboardCache) renderGlobalLeaderboard(globalLeaderboardCache);
      else container.innerHTML = '<span class="lb-empty">Loading…</span>';
      const { difficulty, mode } = getCurrentFilter();
      try {
        const board = lbBoard(difficulty, mode);
        const res = await fetch(`${LB_BASE}/board?board=${encodeURIComponent(board)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const entries = (await res.json()).entries || [];
        globalLeaderboardCache = entries;
        renderGlobalLeaderboard(entries);
      } catch (err) {
        console.warn("Failed to fetch global leaderboard:", err);
        if (!globalLeaderboardCache)
          container.innerHTML = '<span class="lb-empty">Could not load global scores</span>';
      }
    }

    // The server already returns just this board's top entries, ranked — no
    // client-side filtering or sorting left to do.
    function renderGlobalLeaderboard(entries) {
      const container = document.getElementById("lb-global-entries");
      if (!entries.length) {
        container.innerHTML = '<span class="lb-empty">No entries for this mode yet — be first!</span>';
        return;
      }
      container.innerHTML = entries.slice(0, GLOBAL_CAT_MAX).map((e, i) => `
        <div class="lb-entry">
          <span class="lb-rank">${i + 1}.</span>
          <span class="lb-score">${esc(e.found)}/${esc(e.total)}</span>
          <span class="lb-diff">${esc(e.name || "anon")}</span>
        </div>
      `).join("");
    }

    // Throws with the server's own message (a refused name, a rate limit) so the
    // caller can show why, instead of reporting a success that never happened.
    async function submitToGlobalLeaderboard(score, difficulty, mode, name = getPlayerName()) {
      const res = await fetch(`${LB_BASE}/score`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          board: lbBoard(difficulty, mode),
          name,
          found: score,
          total: CONFIG.totalTime * CONFIG.roundsPerGame,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "could not reach the leaderboard");
      globalLeaderboardCache = data.entries || [];
      if (currentLbTab === "global") renderGlobalLeaderboard(globalLeaderboardCache);
    }

    // Anonymous record that a game reached the end screen, sent whether or not
    // a name is submitted. Most players never type one, so submissions alone
    // badly undercount how much the game is actually played. Fire-and-forget:
    // a failure here must never interrupt the end-of-game flow.
    function recordCompletedGame(score, difficulty, mode) {
      fetch(`${LB_BASE}/finish`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          board: lbBoard(difficulty, mode),
          found: score,
          total: CONFIG.totalTime * CONFIG.roundsPerGame,
        }),
      }).catch(() => {});
    }

    /* ==========================================================
       GAME FLOW
       ========================================================== */
    async function startGame() {
      state.round = 0;
      state.score = 0;
      updateScoreboard();
      const diff = document.getElementById("difficulty-select").value;
      if (diff === "anywhere") {
        state.citiesThisGame = Array.from({ length: CONFIG.roundsPerGame }, () => ({
          name: null, country: null, latlng: null, isAnywhere: true,
        }));
      } else {
        state.citiesThisGame = shuffle(getCityPool()).slice(0, CONFIG.roundsPerGame);
      }
      startRound();
    }

    async function startRound() {
      const city = state.citiesThisGame[state.round];
      state.currentCity = city;
      state.clueLatLng = null;
      state.guessLatLng = null;
      state.timeRemaining = CONFIG.totalTime;
      state.roundActive = true;
      prefetchedZooms = new Set();
      // Drop anything still queued for the previous location.
      prefetchQueue = [];

      const startZoom = getEffectiveStartZoom();

      // Hide the clue map for the duration of the setup below — the reverse
      // geocode can take a second, and the previous round's answer view would
      // otherwise sit there in plain sight.
      clueEl.classList.remove("ready");

      if (city.isAnywhere) {
        if (!city.latlng) await prepareAnywhereCity(city);
        state.clueLatLng = city.latlng;
        // Pre-generate next round's location in the background while the player is guessing
        if (state.round + 1 < state.citiesThisGame.length) {
          const next = state.citiesThisGame[state.round + 1];
          if (!next.latlng) prepareAnywhereCity(next);
        }
      } else {
        // Jitter start position and check for water (up to 5 tries)
        state.clueLatLng = await getJitteredLatLng(city);
      }

      clueMap.jumpTo({
        center: [state.clueLatLng[1], state.clueLatLng[0]],
        zoom: startZoom + CLUE_ZOOM_OFFSET,
      });
      prefetchAhead(startZoom);
      // The end-of-round reveal cuts straight to zoom 6 over the true location,
      // which MapLibre has nothing cached to cover. Warm it now — the jitter is
      // a few km, far inside one tile at this level, so these are the same
      // tiles the reveal will ask for.
      prefetchSourceZoom(6);

      answerMap.jumpTo({ center: [0, 20], zoom: 1 });
      clearGuessOverlay();

      document.getElementById("btn-submit").disabled = true;
      document.getElementById("guess-hint").textContent = "click to place pin";
      hideWrongFeedback();
      updateTimerUI();
      updateScoreboard();

      // Was a flat 600ms pause. Now it is at least 600ms — so the opening view
      // still gets a beat before the zoom starts — but it also waits for the
      // first tiles, capped so a slow tile server cannot stall the round.
      await Promise.all([
        new Promise(r => setTimeout(r, 600)),
        clueSettled(2000),
      ]);
      // A new round may have been started underneath us (difficulty change)
      // while we were waiting; if so, leave the screen to whoever owns it now.
      if (state.currentCity !== city || !state.roundActive) return;
      clueEl.classList.add("ready");
      startAnimation();
    }

    function submitGuess() {
      if (!state.guessLatLng || !state.roundActive) return;
      const city = state.currentCity;
      const dist = haversineKm(
        state.guessLatLng.lat, state.guessLatLng.lng,
        city.latlng[0], city.latlng[1]
      );
      const ez = effectiveZoom(CONFIG.totalTime - state.timeRemaining);
      const winRadius = getDynamicWinRadius(ez);
      if (dist <= winRadius) {
        stopAnimation();
        const pts = calcPoints(state.timeRemaining);
        state.score += pts;
        endRound(true, pts, dist, winRadius);
      } else {
        state.animTimeOffset += CONFIG.penalty;
        state.timeRemaining = Math.max(0, state.timeRemaining - CONFIG.penalty);
        updateTimerUI();
        showWrongFeedback(dist);
        if (state.timeRemaining <= 0) { stopAnimation(); endRound(false, 0); }
        // The clock jumped, so the running ease is now aimed from the wrong
        // place: restart it, sliding into the penalised position rather than
        // cutting to it.
        else startClueZoomAnimation(CONFIG.totalTime - state.timeRemaining,
                                    PENALTY_CATCHUP_MS);
      }
    }

    let _wrongFeedbackTimer = null;
    function showWrongFeedback(dist) {
      if (_wrongFeedbackTimer) { clearTimeout(_wrongFeedbackTimer); _wrongFeedbackTimer = null; }
      const el = document.getElementById("wrong-feedback");
      el.textContent = `✗ ${formatDist(dist)} away · −${CONFIG.penalty}s`;
      el.classList.remove("visible");
      void el.offsetWidth; // restart animation
      el.classList.add("visible");
      _wrongFeedbackTimer = setTimeout(() => {
        el.classList.remove("visible");
        _wrongFeedbackTimer = null;
      }, 3000);
    }
    function hideWrongFeedback() {
      if (_wrongFeedbackTimer) { clearTimeout(_wrongFeedbackTimer); _wrongFeedbackTimer = null; }
      document.getElementById("wrong-feedback").classList.remove("visible");
    }

    function endRound(won, pts, dist, winRadius = CONFIG.winRadius) {
      state.roundActive = false;
      stopAnimation();
      const city = state.currentCity;

      // Reveal: pull the clue map back to an overview of the real location.
      prefetchSourceZoom(6);
      clueMap.jumpTo({ center: [city.latlng[1], city.latlng[0]], zoom: 6 + CLUE_ZOOM_OFFSET });
      clueEl.classList.add("ready");

      const resultFeatures = [{
        type: "Feature", properties: {},
        geometry: { type: "Point", coordinates: [city.latlng[1], city.latlng[0]] },
      }];

      if (state.guessLatLng) {
        const guess = [state.guessLatLng.lng, state.guessLatLng.lat];
        const truth = [city.latlng[1], city.latlng[0]];
        resultFeatures.push({
          type: "Feature",
          properties: { color: won ? "#4a8c3f" : "#c0392b" },
          geometry: { type: "LineString", coordinates: [guess, truth] },
        });
        answerMap.fitBounds(
          [[Math.min(guess[0], truth[0]), Math.min(guess[1], truth[1])],
           [Math.max(guess[0], truth[0]), Math.max(guess[1], truth[1])]],
          // maxZoom guards the degenerate case of a near-exact guess, where
          // zero-size bounds would otherwise fly to street level.
          { padding: 40, maxZoom: 9, duration: 700 }
        );
      }
      setAnswerData("result", { type: "FeatureCollection", features: resultFeatures });

      const isLast = state.round + 1 >= CONFIG.roundsPerGame;
      const card = document.getElementById("result-card");
      const locationLabel = city.isAnywhere ? "the location was" : "the city was";
      const locationName = city.country
        ? `${city.name}, ${city.country}`
        : city.name || `${city.latlng[0].toFixed(2)}°, ${city.latlng[1].toFixed(2)}°`;
      const nextLabel = city.isAnywhere ? "next location →" : "next city →";

      if (won) {
        card.innerHTML = `
          <h3>${locationLabel}</h3>
          <div class="result-city">${locationName}</div>
          <div class="result-detail">${formatDist(dist)} away — within ${Math.round(winRadius)} km</div>
          <div class="result-detail">${state.timeRemaining.toFixed(1)}s remaining</div>
          <div class="result-points win">+${pts} pts</div>
          <button class="primary" style="width:100%">
            ${isLast ? "see final score" : nextLabel}
          </button>`;
      } else {
        card.innerHTML = `
          <h3>${locationLabel}</h3>
          <div class="result-city">${locationName}</div>
          <div class="result-points lose">+0 pts</div>
          <button class="primary" style="width:100%">
            ${isLast ? "see final score" : nextLabel}
          </button>`;
      }

      document.getElementById("result-overlay").classList.add("visible");
      updateScoreboard();

      const handler = () => {
        document.getElementById("result-overlay").classList.remove("visible");
        setAnswerData("result", EMPTY_FC);
        document.getElementById("result-overlay").removeEventListener("click", handler);
        state.round++;
        if (state.round >= CONFIG.roundsPerGame) showGameOver();
        else startRound();
      };
      setTimeout(() => document.getElementById("result-overlay").addEventListener("click", handler), 300);
    }

    function showGameOver() {
      const diff = document.getElementById("difficulty-select").value;
      addToLeaderboard(state.score, diff, tileMode);
      // Count the game itself, before anyone decides whether to submit a name.
      recordCompletedGame(state.score, diff, tileMode);
      const maxPossible = CONFIG.totalTime * CONFIG.roundsPerGame;
      const savedName = localStorage.getItem("guessTheCity_playerName") || "";
      const card = document.getElementById("result-card");
      card.innerHTML = `
        <h3>game over</h3>
        <div class="final-score">${state.score} / ${maxPossible}</div>
        <div style="display:flex;gap:6px;margin:16px 0 4px">
          <input type="text" id="score-name-input" class="player-name-input"
            placeholder="your name" maxlength="16" spellcheck="false"
            value="${esc(savedName)}" style="flex:1;font-size:0.82rem;padding:6px 8px" />
          <button id="btn-submit-score" onclick="submitScore()">submit score</button>
        </div>
        <div id="score-submit-status" class="lb-empty" style="min-height:14px"></div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button style="flex:1" onclick="dismissGameOver()">close</button>
          <button class="primary" style="flex:1" onclick="dismissAndRestart()">play again</button>
        </div>`;
      state.gameOver = true;
      document.getElementById("result-overlay").classList.add("visible");
    }

    async function submitScore() {
      const nameEl = document.getElementById("score-name-input");
      const name = (nameEl && nameEl.value.trim()) || "anonymous";
      localStorage.setItem("guessTheCity_playerName", name);
      const diff = document.getElementById("difficulty-select").value;
      const btn = document.getElementById("btn-submit-score");
      const status = document.getElementById("score-submit-status");
      if (btn) btn.disabled = true;
      try {
        await submitToGlobalLeaderboard(state.score, diff, tileMode, name);
        if (btn) btn.textContent = "submitted!";
        if (status) status.textContent = "";
      } catch (err) {
        // Re-enable so a refused name (or a blip) can be corrected and retried,
        // rather than claiming success for a submission that never landed.
        if (status) status.textContent = err.message;
        if (btn) btn.disabled = false;
      }
    }

    function dismissGameOver() {
      document.getElementById("result-overlay").classList.remove("visible");
      state.gameOver = false;
      document.getElementById("btn-new-game").style.display = "";
    }

    function dismissAndRestart() {
      document.getElementById("result-overlay").classList.remove("visible");
      state.gameOver = false;
      startGame();
    }

    function updateScoreboard() {
      document.getElementById("round-display").textContent =
        `${state.round + 1} / ${CONFIG.roundsPerGame}`;
      document.getElementById("score-display").textContent = state.score;
    }

    document.getElementById("btn-submit").addEventListener("click", submitGuess);
    document.getElementById("btn-new-game").addEventListener("click", () => {
      document.getElementById("btn-new-game").style.display = "none";
      startGame();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && state.gameOver) dismissGameOver();
    });
    window.addEventListener("resize", computeMapSize);

    requestAnimationFrame(async () => {
      document.getElementById("timer-text").textContent = `${CONFIG.totalTime.toFixed(1)}s`;
      computeMapSize();
      renderLeaderboard();
      await loadCities();
      startGame();
    });
  </script>
  
</body>
</html>
