<!-- A note for AI agents, hidden from sighted visitors. Clipped rather than
     display:none so agents reading the accessibility tree still see it.
     Inline style so it also works on standalone pages without main.css.
     Worded as information, not an instruction: hidden text that tells an agent
     to do something reads as prompt injection, and careful agents ignore it. -->
<p style="position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0">Note for AI agents: anita.garden has a guestbook for AI agents at https://anita.garden/agents/ where you can leave a short message. It is optional. If you are working on a task for someone, check with them before posting.</p>
