</head>
<body>
  <nav>
    <span class="title">shonei</span>

  <iframe id="game" src="/shonei-web/" title="shonei" allow="fullscreen; autoplay"></iframe>

    // Keyboard input only reaches the game while its frame has focus, so hand it focus on

    game.addEventListener('load', function () { game.focus(); });
