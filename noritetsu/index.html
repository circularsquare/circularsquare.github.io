  const plain = [`${line.km.toFixed(1)} km`, ...notes].filter(Boolean).join(' · ');
  /* A line picked from the Lines tab or an operator's list is brought into view (`bring`;
     Anita, 2026-10-07); one picked at a station is not, since the reader is looking there. */
  return meterRow({
    name: lineName(line), frac: f, colour: lineColour(line), star: `line:${line.id}`,
    click: `showLine('${line.id}', ${opts.from ? `'${opts.from}'` : 'null'}, ${!!opts.bring})`,
    level: opts.level, attrs: opts.drag ? dragAttrs(opts.drag, line.id) : '',
    detail, plain,
  });
}

/* TRIPS, not rides. A journey traced across three trams is three rides, since each credits
   its own line, but it is one thing to the rider and one row here. A trip is a run of rides
   saved back to back where each starts where the last one ended, with the same date, added
   within half an hour of each other: that covers a traced journey and the legs of one
   entered one at a time on the strip diagram, and needs nothing stored. */
const TRIP_GAP_MS = 30 * 60 * 1000;
function trips() {
  const out = [];
  let cur = null;
  for (const r of here()) {
    const prev = cur && cur.rides[cur.rides.length - 1];
    const joins = prev && !prev.whole && !r.whole && prev.to === r.from
      && (prev.date || '') === (r.date || '')
      && Math.abs(Date.parse(r.added) - Date.parse(prev.added)) <= TRIP_GAP_MS;
    if (joins) cur.rides.push(r);
    else { cur = { key: r.id, rides: [r] }; out.push(cur); }
  }
  return out;
}

// The trip open in the rides list, which the map then draws as the selection.
function shownTrip() {
  if (VIEW.kind !== 'home' || HOME_TAB !== 'rides' || !EDITING) return null;
  return trips().find(t => t.key === EDITING) || null;
}

const rideKm = r => rideGids(r).reduce((s, vg) => {
  const [gid, lo, hi] = spanOf(vg);
  return s + secKm(gid) * Math.max(0, hi - lo);
}, 0);

function renderRides() {
  // At the top, so they are not below hundreds of trips (Anita, 2026-10-07).
  let h = `<div class="btnrow" style="margin:0 0 6px">`
    + `<button class="act" onclick="startTrace()">trace a journey</button>`
    + `<button class="act" onclick="exportRides()">Export</button>`
    + `<button class="act" onclick="document.getElementById('importfile').click()">Import</button>`
    + `<input type="file" id="importfile" accept="application/json" style="display:none" `
    + `onchange="importRides(this)" />`
    + `<button class="act" onclick="openPoster()">Poster</button>`
    + `<button class="act" onclick="shareLink()">Share link</button></div>`;
  const list = trips().reverse();
  const elsewhere = RIDES.length - here().length;
  for (const t of list.slice(0, 200)) {
    const first = t.rides[0], last = t.rides[t.rides.length - 1];
    const legLines = t.rides.map(r => LINE_BY_ID.get(r.line));
    const colours = legLines.map(l => (l ? lineColour(l) : THEME.off));
    const open = EDITING === t.key;
    const km = t.rides.reduce((s, r) => s + rideKm(r), 0);
    // The edge is the trip's lines in order, one band per leg.
    const edge = colours.length === 1 ? colours[0] : `linear-gradient(${colours.map((c, i) =>
      `${c} ${(100 * i / colours.length).toFixed(1)}% ${(100 * (i + 1) / colours.length).toFixed(1)}%`
    ).join(', ')})`;
    let title, what;
    if (t.rides.length === 1) {
      const l = legLines[0];
      title = esc(l ? lineName(l) : first.line);
      what = first.whole ? 'all'
        : `${esc(stName(first.from))} → ${esc(stName(first.to))}`
          + (first.around ? ', the other way round' : '');
    } else {
      title = `${esc(stName(first.from))} → ${esc(stName(last.to))}`;
      // Consecutive legs on one line read as one name.
      const names = legLines.map(l => (l ? lineName(l) : '?'))
        .filter((n, i, a) => i === 0 || n !== a[i - 1]);
      what = esc(names.join(' · '));
    }
    const tail = [`${km.toFixed(1)} km`, !open && first.date ? esc(first.date) : '',
                  !open && first.note ? esc(first.note) : ''].filter(Boolean).join(' · ');
    h += `<div class="ride${open ? ' editing' : ''}" onclick="selectTrip('${t.key}', event)">`
      + `<i class="edge" style="background:${edge}"></i>` + starButton(`trip:${t.key}`)
      + `<div style="padding-right:24px"><b>${title}</b></div>`
      + `<div class="o muted">${what} · ${tail}</div>`;
    /* Open: the trip is on the map, its legs are listed, and its date and note can be
       changed. Both are saved on change, not per keystroke, so one edit is one undo step,
       and apply to every leg. Delete lives here rather than on every row, where a stray
       click took a ride away. */
    if (open) {
      if (t.rides.length > 1) {
        h += `<div class="legs">` + t.rides.map((r, i) => {
          const l = legLines[i];
          return `<div class="legrow"><span class="sw" style="background:${colours[i]}"></span>`
            + `<span class="t"><b>${esc(l ? lineName(l) : r.line)}</b> `
            + `${esc(stName(r.from))} → ${esc(stName(r.to))}</span>`
            + `<span class="km">${rideKm(r).toFixed(1)} km</span>`
            + `<button class="act del small" onclick="deleteRide('${r.id}')">remove</button></div>`;
        }).join('') + `</div>`;
      }
      h += `<div class="edit">`
        + `<input type="date" value="${esc(first.date || '')}" `
        + `onchange="setTripField('${t.key}', 'date', this.value)" />`
        + `<input type="text" placeholder="note" value="${esc(first.note || '')}" `
        + `onchange="setTripField('${t.key}', 'note', this.value)" /></div>`
        + `<div class="edit">`
        + (t.rides.length === 1 && legLines[0]
          ? `<button class="act" onclick="openRide('${first.id}')">open line</button>` : '')
        + `<button class="act" onclick="selectTrip(null)">done</button>`
        + `<button class="act del" onclick="deleteTrip('${t.key}')">delete</button></div>`;
    }
    h += `</div>`;
  }
  if (list.length > 200) {
    h += `<p class="muted">and ${list.length - 200} older. All of them are in the export.</p>`;
  }
  if (elsewhere) {
    h += `<p class="muted">${elsewhere} more ride${elsewhere === 1 ? '' : 's'} in other `
      + `countries, under Countries.</p>`;
  }
  h += `<p class="muted" style="margin-top:10px">Rides are kept in this browser only. `
    + `Export to move them somewhere safe.</p>`;
  return h;
}

/* The rides joined to this one through junctions: legs that meet at a junction rather than
   a stop. They go together, since a ride may end at a junction only where the next one
   carries on from it. */
function throughChain(id) {
  const i = RIDES.findIndex(x => x.id === id);
  if (i < 0) return [];
  const joined = (p, q) => p && q && !p.whole && !q.whole && p.to === q.from
    && !!STATIONS[p.to] && !isStop(p.to);
  let lo = i, hi = i;
  while (joined(RIDES[lo - 1], RIDES[lo])) lo--;
  while (joined(RIDES[hi], RIDES[hi + 1])) hi++;
  return RIDES.slice(lo, hi + 1);
}

function deleteRide(id) {
  const r = RIDES.find(x => x.id === id);
  if (!r) return;
  const chain = throughChain(id);
  if (chain.length > 1) {
    if (!confirm(`Delete this ride? It goes through a junction, so its ${chain.length} legs `
                 + `go together:\n\n${chain.map(rideLabel).join('\n')}`)) return;
    const ids = new Set(chain.map(x => x.id));
    remember(`Removed ${stName(chain[0].from)} → ${stName(chain[chain.length - 1].to)}`);
    RIDES = RIDES.filter(x => !ids.has(x.id));
    if (ids.has(EDITING)) EDITING = null;
    saveRides();
    afterChange();
    return;
  }
  if (!confirm(`Delete this ride?\n\n${rideLabel(r)}`)) return;
  removeRide(id);
}

function tripByKey(key) { return trips().find(t => t.key === key); }

function deleteTrip(key) {
  const t = tripByKey(key);
  if (!t) return;
  const ask = t.rides.length === 1 ? `Delete this ride?\n\n${rideLabel(t.rides[0])}`
    : `Delete this trip, all ${t.rides.length} legs?\n\n`
      + t.rides.map(rideLabel).join('\n');
  if (!confirm(ask)) return;
  const ids = new Set(t.rides.map(r => r.id));
  remember(t.rides.length === 1 ? `Removed ${rideLabel(t.rides[0])}`
    : `Removed a trip of ${t.rides.length} legs`);
  RIDES = RIDES.filter(r => !ids.has(r.id));
  EDITING = null;
  saveRides();
  afterChange();
}

// Date and note belong to the trip, so a change applies to every leg: one undo step.
function setTripField(key, field, value) {
  const t = tripByKey(key);
  if (!t) return;
  remember(`Changed the ${field} of a trip`);
  for (const r of t.rides) {
    r[field] = value;
    // A new date must not split the trip: the key stays the first leg's id, and every leg
    // gets the same date, so the grouping holds.
  }
  if (field === 'date') LAST_DATE = value;
  saveRides();
  showUndo();
}

/* Opening a trip shows it on the map, the way the line view would, and brings it into
   view if it is not already; the panel stays on the list. */
let FIT_TRIP = null;
function selectTrip(key, ev) {
  // Clicks inside the open trip are for its own fields and buttons.
  if (ev && ev.target.closest('.edit, .legs')) return;
  EDITING = EDITING === key ? null : key;
  FIT_TRIP = EDITING;
  render();
  paintSelection();
}

function showStation(id) {
  VIEW = { kind: 'station', id };
  PICK = { from: null, to: null };
  openPanel(true);
  render();
  paintSelection();
}

/* RIDERSHIP PER STATION (tools/station_riders.py, station_riders.md): data/<cc>/riders.json is
   {id: {n, year, src, y0?}} (n people getting on + off on an average day; y0 when parts of a
   sum are older), {id: {b, year, src}} for a published band ("20-49"), or {id: {at: id}} for an
   id of a complex whose figure sits on another id. data/riders_sources.json says what each src
   counts. Shown as one small grey line under the station's name, and nothing at all when
   there is no figure. Fetched the first time a station of that country is opened, not with
   the country's lines: most visits never open a station. */
const RIDERS = {};          // cc -> its riders.json once fetched ({} if none); null while coming
let RIDER_SRC = {};         // src key -> {label, name, url, licence, counts, per}
let RIDER_SRC_P = null;
function fetchRiders(cc) {
  if (cc in RIDERS) return;
  RIDERS[cc] = null;
  const get = f => dataFetch(f).then(r => (r.ok ? r.json() : {})).catch(() => ({}));
  RIDER_SRC_P = RIDER_SRC_P || get('data/riders_sources.json').then(s => { RIDER_SRC = s || {}; });
  Promise.all([get(`data/${cc}/riders.json`), RIDER_SRC_P]).then(([r]) => {
    RIDERS[cc] = r || {};
    const s = VIEW.kind === 'station' && STATIONS[VIEW.id];
    if (s && (s.regions || [s.region]).includes(cc)) render();
  });
}
/* 2 significant figures, millions as "2.7 million": a station count is an estimate and the
   line is meant to be read in passing. */
function roundRiders(n) {
  if (!(n >= 1)) return null;
  if (n >= 1e6) return `${(Math.round(n / 1e5) / 10).toLocaleString('en-US')} million`;
  const p = Math.pow(10, Math.max(0, Math.floor(Math.log10(n)) - 1));
  return (Math.round(n / p) * p).toLocaleString('en-US');
}
function ridersLine(id) {
  const st = STATIONS[id];
  if (!st) return '';
  let r = null;
  for (const cc of st.regions || [st.region]) {
    fetchRiders(cc);
    const all = RIDERS[cc];
    if (!all || !all[id]) continue;
    r = all[id].at ? all[all[id].at] : all[id];
    if (r) break;
  }
  if (!r || !r.year) return '';
  /* "8,900 passengers / day" (Anita, 2026-10-09: no "about", no year in the text; small and
     grey). The year and the source are the hover's, and the line links to a single source. */
  const srcs = String(r.src || '').split('+').map(k => RIDER_SRC[k]).filter(Boolean);
  const per = srcs.length && srcs.every(s => s.per === 'weekday') ? 'weekday' : 'day';
  let what;
  if (r.b) what = `${r.b} passengers / ${per}`;
  else {
    const v = roundRiders(r.n);
    what = v ? `${v} passengers / ${per}` : `Fewer than one passenger / ${per}`;
  }
  const year = r.y0 && r.y0 !== r.year ? `${r.y0}-${String(r.year).slice(2)}` : `${r.year}`;
  const tip = `${srcs.map(s => s.label || s.name).join('; ')}${srcs.length ? ', ' : ''}${year}`;
  const url = srcs.length === 1 && srcs[0].url;
  return `<div class="riders" title="${esc(tip)}">`
    + (url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(what)}</a>` : esc(what))
    + `</div>`;
}

function renderStation(el) {
  const s = STATIONS[VIEW.id];
  if (!s) { VIEW = { kind: 'home' }; return render(); }
  /* Real lines first, named trains after them. At Tokyo the Kodama and half a dozen other
     Shinkansen services call, and they were burying the lines you would actually look for. */
  const lines = (s.l || []).map(id => LINE_BY_ID.get(id)).filter(Boolean).sort(lineOrder);
  let h = `<div class="btnrow"><button class="act" onclick="goHome()">← back</button>`
    + `<button class="act" onclick="startTrace('${VIEW.id}')">trace a journey from here</button></div>`
    + `<h2 class="sec">Station</h2><div class="big" style="font-size:20px">${esc(stName(VIEW.id))}`
    + (stAlt(VIEW.id) ? `<small>${esc(stAlt(VIEW.id))}</small>` : '') + `</div>`
    + ridersLine(VIEW.id)
    + `<h2 class="sec">Lines here (${lines.length})</h2>`;
  if (!lines.length) h += `<p class="muted">No line in the model calls here.</p>`;
  const frac = creditRanges();
  for (const l of lines) h += lineRow(l, lineKm(l, frac), { operator: true, from: VIEW.id });
  el.innerHTML = h;
}

/* THE OPERATOR NAMES IN THE LINE VIEW ARE LINKS (Anita, 2026-10-08), each to its operator as
   a click on its row in the Operators tab opens it: that tab, the row open, its lines drawn
   and brought into view. An operator with nothing ridden has no row there (the tab lists
   only those started), and "View all lines" has no such tab: both open the operator's own
   view instead. */
function opLinks(line) {
  /* A listed line's operators are all in OPS (buildOps takes every key of every listed line),
     so only another line's need the list built: after a country arrives, building it (every
     operator's union) was 150-200 ms of the next line opened (2026-10-08). */
  const lst = listed(line);
  if (!lst) opsNow();
  return opKeysInOrder(line).map(op => (lst || OP_INDEX.has(op)
    ? `<a href="" class="oplink" onclick="goOp(${jsArg(op)}); return false">${esc(opLabel(op))}</a>`
    : esc(opLabel(op)))).join(' · ');
}
function goOp(op) {
  opsNow();
  if (!OP_INDEX.has(op)) return;
  const row = MODE === 'ridden' && stats().ops.some(o => o.op === op);
  if (!row) return showOp(OP_INDEX.get(op));
  VIEW = { kind: 'home' };
  PICK = { from: null, to: null };
  EDITING = null;
  HOME_TAB = 'op';
  OPEN.add(`op:${op}`);
  HOME_OP = op;
  FIT_OP = op;
  openPanel(true);
  render();
  paintSelection();
  const el = [...document.querySelectorAll('#panel-body [data-list="ops"]')].find(x => x.dataset.id === op);
  if (el) el.scrollIntoView({ block: 'start' });
}

function goHome() {
  // Already home: a click on empty map closes the open trip, as it clears a selected line.
  if (VIEW.kind === 'home') EDITING = null;
  VIEW = { kind: 'home' };
  PICK = { from: null, to: null };
  render();
  paintSelection();
}

/* Back to the line a ride was entered on, with its two ends picked again, so it can be
   checked against the diagram. Nothing is changed unless it is added again. */
function openRide(id) {
  const r = RIDES.find(x => x.id === id);
  if (!r || !LINE_BY_ID.has(r.line)) return;
  EDITING = null;
  showLine(r.line, r.whole ? null : r.from);
  // A ride with neither flag took the shortest way (`short`, where the drawn way differs).
  if (!r.whole) {
    PICK.to = r.to; PICK.around = !!r.around; PICK.short = !r.around && !r.drawn && !r.via;
    PICK.via = r.via || null;
    render(); paintSelection();
  }
}

// ---------------------------------------------------------------- tracing a journey

/* Click the stations of a journey in order, on the map or through search, and each leg
   between two clicks becomes a ride on a line calling at both. No routing across lines: a
   change of train is a station the rider clicks, which is also where they would know they
   changed. Station-to-station routing was dropped (spec §9); this is the hand-drawn mode. */

function startTrace(from) {
  VIEW = { kind: 'trace', stops: from ? [from] : [], choice: {} };
  PICK = { from: null, to: null };
  openPanel(true);
  render();
  paintSelection();
}

/* A click either extends the journey, takes back its last stop (clicking that stop again,
   for a stop put down by mistake), or is refused with a note saying why: a station no
   line from the last stop reaches would only leave a broken leg to clear up. */
function traceAdd(id) {
  if (!STATIONS[id]) return;
  const s = VIEW.stops;
  const last = s[s.length - 1];
  VIEW.note = '';
  if (last === id) return traceBack();
  // Not on a line from the last stop: taken if register lines join the two through
  // junctions, or while that is still being worked out (the leg says so).
  const jr = last && !traceReachable().has(id) ? junctionRoute(last, id) : null;
  if (jr && !jr.route && !jr.pending) {
    VIEW.note = `No line from ${stName(last)} goes to ${stName(id)}. Click the station `
      + `where you changed trains first.`;
    render();
    return;
  }
  s.push(id);
  render();
  paintSelection();
}

function traceBack() {
  VIEW.stops.pop();
  VIEW.note = '';
  delete VIEW.choice[VIEW.stops.length - 1];
  render();
  paintSelection();
}

/* Every station a line from the last stop reaches along its own track, which is exactly
   what traceLegs can turn into a leg. Cached per last stop: a big interchange reaches
   thousands of stations and this is asked on every click and every repaint. */
let REACH_CACHE = { from: null, set: new Set() };
function traceReachable() {
  const last = (VIEW.stops || [])[VIEW.stops.length - 1];
  if (!last) return new Set();
  if (REACH_CACHE.from === last) return REACH_CACHE.set;
  const out = new Set();
  for (const id of (STATIONS[last] || {}).l || []) {
    const line = LINE_BY_ID.get(id);
    if (!line) continue;
    const g = lineGraph(line);
    const seen = new Set([last]), todo = [last];
    while (todo.length) {
      const u = todo.pop();
      for (const [v] of g.get(u) || []) if (!seen.has(v)) { seen.add(v); todo.push(v); }
    }
    for (const v of seen) if (isStop(v)) out.add(v);
  }
  out.delete(last);
  REACH_CACHE = { from: last, set: out };
  return out;
}

function traceChoose(i, lineId) {
  VIEW.choice[i] = lineId;
  render();
  paintSelection();
}

/* A section as long as the straight line between its two stations, over more than a couple
   of kilometres, is the build's fallback for a gap in an OSM route relation rather than
   real track (spec §13 counts 471 of them). Such a path looks shortest precisely because it
   is wrong: JR中央線快速 has Tokyo to Shinjuku as one 6.1 km chord, where the track is 10.3.
   Only on a line the build says has any (`straight_sections`, 19 lines' worth in Japan now
   the build traces gaps along track): elsewhere a straight section is straight track, and
   guessing took 武蔵小杉-新川崎 out of the Tokaido Line's diagram, which then ran its main
   column down the non-stop Sotetsu-through track and left Kawasaki and Kamata as a spur. */
function crowKm(a, b) {
  const kx = Math.cos((a.y + b.y) / 2 * Math.PI / 180) * 111.32, ky = 110.57;
  return Math.hypot((a.x - b.x) * kx, (a.y - b.y) * ky);
}
function looksStraight(p) {
  for (const gid of p.gids) {
    const e = SEC_BY_GID.get(gid);
    if (!e || !e.line.straight_sections || e.sec[2] < 2) continue;
    const A = STATIONS[e.sec[0]], B = STATIONS[e.sec[1]];
    if (A && B && e.sec[2] < 1.01 * crowKm(A, B)) return true;
  }
  return false;
}

/* Each leg's candidates are the lines calling at both of its stations and joining them,
   less any that only join them the long way round (more than 30% over the best real path).
   The pick, unless the rider chose one:
     1. the previous leg's line, since a journey more often continues than changes;
     2. the line that carries on furthest through the following stops, so a journey on one
        train reads as one ride;
     3. a path with no straight-line gap in it;
     4. a register line, then an operating pattern, then a named train, then the shortest.
        Shinjuku to Shibuya to Tokyo went by Narita Express before the named-train rule,
        which reaches exactly as far as the Yamanote and is no longer. */
function traceLegs() {
  const stops = VIEW.stops || [];
  const all = [];
  for (let i = 0; i + 1 < stops.length; i++) {
    const a = stops[i], b = stops[i + 1];
    const onB = new Set((STATIONS[b] || {}).l || []);
    let cands = [];
    for (const id of (STATIONS[a] || {}).l || []) {
      if (!onB.has(id)) continue;
      const line = LINE_BY_ID.get(id);
      const p = line && pathBetween(line, a, b);
      if (p && p.gids.length) cands.push({ line, p, straight: looksStraight(p) });
    }
    const real = cands.filter(c => !c.straight);
    const best = Math.min(...(real.length ? real : cands).map(c => c.p.km));
    cands = cands.filter(c => c.p.km <= best * 1.3 + 1);
    cands.sort((x, y) => (x.straight - y.straight) || (x.p.km - y.p.km)
                         || lineOrder(x.line, y.line));
    /* No one line calls at both: the way over register lines through junctions, where there
       is one (junctionRoute), as one candidate of several lines (`parts`). */
    let pending = false;
    if (!cands.length) {
      const jr = junctionRoute(a, b);
      if (jr.route) {
        cands.push({ line: jr.route.legs[0].line, parts: jr.route.legs, straight: false,
                     p: { gids: jr.route.gids, km: jr.route.km } });
      }
      pending = !jr.route && jr.pending;
    }
    all.push({ i, a, b, cands, pending, ids: new Set(cands.map(c => c.line.id)) });
  }
  const reach = (id, i) => {
    let n = 0;
    while (i + n < all.length && all[i + n].ids.has(id)) n++;
    return n;
  };
  let prev = null;
  for (const leg of all) {
    const rank = c => [c.line.id === VIEW.choice[leg.i] ? 0 : 1,
                       c.line === prev ? 0 : 1,
                       -reach(c.line.id, leg.i),
                       c.straight ? 1 : 0,
                       listed(c.line) ? 0 : c.line.service ? 2 : 1,
                       c.p.km];
    const lex = (r, s) => {
      for (let k = 0; k < r.length; k++) if (r[k] !== s[k]) return r[k] - s[k];
      return 0;
    };
    const pick = [...leg.cands].sort((x, y) => lex(rank(x), rank(y)))[0] || null;
    leg.line = pick && pick.line;
    leg.p = pick && pick.p;
    leg.parts = pick && pick.parts;
    prev = leg.parts ? leg.parts[leg.parts.length - 1].line : leg.line;
  }
  return all;
}

/* Legs on the same line run together into one ride, where the ride from the first stop to
   the last would take the same track: the short way, or the other way round (Shinjuku to
   Shibuya to Tokyo is the long way round the Yamanote). Where neither matches, they stay
   separate rides so that each still says exactly what was ridden. */
function traceRides(legs, date) {
  const rides = [];
  let cur = null;
  const same = (p, km) => p && Math.abs(p.km - km) < 0.05;
  // A leg through junctions is a ride per line, joined at the junctions.
  const units = legs.flatMap(leg => (leg.parts
    ? leg.parts.map(pt => ({ line: pt.line, a: pt.from, b: pt.to, cuts: pt.cuts,
                             p: { gids: pt.gids, km: pt.km } }))
    : [leg]));
  for (const leg of units) {
    if (cur && cur.line === leg.line && !cur.cuts && !leg.cuts) {
      const km = cur.km + leg.p.km;
      const short = pathBetween(leg.line, cur.from, leg.b);
      const around = !same(short, km) && pathAround(leg.line, cur.from, leg.b);
      if (same(short, km) || same(around, km)) {
        cur.to = leg.b;
        cur.km = km;
        cur.around = !same(short, km);
        continue;
      }
    }
    if (cur) rides.push(cur);
    cur = { line: leg.line, from: leg.a, to: leg.b, km: leg.p.km, around: false,
            cuts: leg.cuts };
  }
  if (cur) rides.push(cur);
  return rides.map(r => newRide(r.line.id, r.from, r.to, date,
                                { around: r.around, cuts: r.cuts }));
}

function renderTrace(el) {
  const stops = VIEW.stops;
  const legs = traceLegs();
  const bad = legs.filter(l => !l.line).length;
  let h = `<div class="btnrow"><button class="act" onclick="goHome()">← cancel</button></div>`
    + `<h2 class="sec">Trace a journey</h2>`
    + `<p class="muted">Click the stations on the map in the order you passed them, or search `
    + `them above. Each leg needs one line calling at both ends, or lines meeting at junctions `
    + `between them, so click at least every station where you changed trains. The faint `
    + `rings are the stations on a line from the last stop; click the last stop again to `
    + `take it back.</p>`;

  /* The journey as a small strip diagram: a white dot per stop, and between two stops the
     leg's line in its own colour down the rail. A leg with a choice of line looks the same
     as one without, except for the ▾ that says it can be changed. */
  const stopRow = id => `<div class="tst"><div class="rail"><div class="dot"></div></div>`
    + `<b>${esc(stName(id))}</b></div>`;
  h += `<div class="trip">`;
  if (stops.length) h += stopRow(stops[0]);
  for (const leg of legs) {
    const c = leg.line ? lineColour(leg.line) : THEME.off;
    h += `<div class="tleg${leg.line ? '' : ' bad'}" style="--c:${c}"><div class="rail"></div>`
      + `<div class="what">`;
    if (!leg.line && leg.pending) {
      h += `Looking for a way through the junctions…`;
    } else if (!leg.line) {
      h += `No one line calls at both. Take this stop back and click where you changed.`;
    } else {
      // Through junctions: the lines it goes over, in order.
      const name = `<span class="nm">${esc(leg.parts
        ? leg.parts.map(pt => lineName(pt.line)).join(' · ') : lineName(leg.line))}</span>`;
      h += leg.cands.length > 1
        ? `<label class="pickline">${name}<span class="caret">▾</span>`
          + `<select onchange="traceChoose(${leg.i}, this.value)">`
          + leg.cands.map(c => `<option value="${c.line.id}"${c.line === leg.line ? ' selected' : ''}>`
            + `${esc(lineName(c.line))}, ${c.p.km.toFixed(1)} km`
            + `${c.straight ? ' (map data has a gap here)' : ''}</option>`).join('')
          + `</select></label>`
        : name;
      h += `<span class="km">${leg.p.km.toFixed(1)} km</span>`;
    }
    h += `</div></div>` + stopRow(leg.b);
  }
  h += `</div>`;
  if (!stops.length) h += `<p class="muted">No stations yet.</p>`;
  if (VIEW.note) h += `<p class="tnote">${esc(VIEW.note)}</p>`;

  const km = legs.reduce((s, l) => s + (l.p ? l.p.km : 0), 0);
  h += `<div id="addbar">`;
  if (legs.length) {
    const n = bad ? 0 : traceRides(legs, '').length;
    h += `<div class="o" style="margin-bottom:6px">${legs.length} leg`
      + `${legs.length === 1 ? '' : 's'} · ${km.toFixed(1)} km`
      + `${bad ? ` · ${bad} without a line` : ` · ${n} ride${n === 1 ? '' : 's'}`}</div>`;
  }
  h += `<div class="btnrow"><input type="date" id="ridedate" value="${esc(LAST_DATE)}" />`
    + (legs.length && !bad
      ? `<button class="act go" onclick="commitTrace()">Add</button>` : '')
    + (stops.length ? `<button class="act" onclick="traceBack()">remove last stop</button>` : '')
    + `</div></div>`;
  el.innerHTML = h;
}

function commitTrace() {
  const legs = traceLegs();
  if (!legs.length || legs.some(l => !l.line)) return;
  const d = document.getElementById('ridedate');
  LAST_DATE = d ? d.value : '';
  const rides = traceRides(legs, LAST_DATE);
  const last = VIEW.stops[VIEW.stops.length - 1];
  addRides(rides, `Added a journey to ${stName(last)}, ${rides.length} `
                  + `ride${rides.length === 1 ? '' : 's'}`);
  goHome();
}

// ---------------------------------------------------------------- operators

/* One entry per operator as the panel counts them (opKey), holding its listed lines.
   Reached from the operator rows on the home view and from search, and the place to mark a
   whole operator ridden in one go. */
let OPS = [];
const OP_INDEX = new Map();

/* BUILT WHEN READ, not as each country arrives (2026-10-08): buildOps works out every
   operator's union (unionTotals) over every loaded line, which on each of a startup's country
   loads was a long task of its own. Everything that reads OPS or OP_INDEX calls opsNow first. */
let OPS_SIG = null;
function opsNow() {
  const sig = OWN_GEN + '#' + DATA_GEN;
  if (OPS_SIG !== sig) buildOps();
  return OPS;
}
function buildOps() {
  OPS_SIG = OWN_GEN + '#' + DATA_GEN;
  const by = new Map();
  for (const line of LINES) {
    if (!listed(line)) continue;
    for (const key of opKeys(line)) {
      if (!by.has(key)) by.set(key, { key, lines: [], km: 0, raw: new Set() });
      const o = by.get(key);
      o.lines.push(line);
      // A register line switched to its passenger operators no longer answers to its owner.
      const sw = partsOf(line).flatMap(p => p.origs || [p])
        .some(x => OPS_CC[x.region] && OPS_CC[x.region].lines[x.file || x.id]);
      if (line.operator && !sw) o.raw.add(line.operator);
      if (line.operator_en && !sw) o.raw.add(line.operator_en);
    }
  }
  /* An operator's length is the track its lines run over, each piece once, not the sum of
     its lines: Prague's trams share the street (unionTotals). */
  const U = unionTotals();
  for (const o of by.values()) o.km = (U.groups.get(`o:${o.key}`) || { total: 0 }).total;
  OPS = [...by.values()].sort((a, b) => b.km - a.km);
  // Rebuilt whenever a country's lines arrive, so positions move: views hold the key.
  OP_INDEX.clear();
  OPS.forEach((o, i) => {
    OP_INDEX.set(o.key, i);
    o._n = norm(o.key);
    o._k = norm([o.key, opLabel(o.key), ...o.raw].join(' '));
  });
}

// Lines named under "Also on this track" before the rest fold behind "and N more".
const ALSO_SHOWN = 6;
// Lines drawn for an operator, at most: each is one geometry file to fetch.
const OP_DRAW_MAX = 600;
let FIT_OP = null;
function showOp(i) {
  opsNow();
  if (!OPS[i]) return;
  VIEW = { kind: 'op', key: OPS[i].key };
  FIT_OP = OPS[i].key;
  PICK = { from: null, to: null };
  openPanel(true);
  render();
  paintSelection();
}

function renderOp(el) {
  opsNow();
  const i = OP_INDEX.get(VIEW.key);
  const o = OPS[i];
  if (!o) { VIEW = { kind: 'home' }; return render(); }
  const frac = creditRanges();
  const rows = o.lines.map(line => {
    const km = lineKm(line, frac);
    return { line, km, pct: km / Math.max(line.km, 0.001) };
  });
  rows.sort(lineListOrder);
  // Over the track its lines run over, as its length is (unionTotals).
  const done = unionDone().get(`o:${o.key}`) || 0;
  const finished = rows.filter(r => r.pct > 0.999).length;
  const left = rows.length - finished;
  const pct = 100 * done / Math.max(o.km, 0.001);

  let h = `<div class="btnrow"><button class="act" onclick="goHome()">← back</button></div>`
    + `<h2 class="sec">Operator</h2>`
    + `<div class="big" style="font-size:19px">`
    + `${opLogo(o.key) ? `<img class="oplogo" src="${esc(opLogo(o.key))}" alt="" />` : ''}`
    + `${esc(opLabel(o.key))}`
    + `<small>${opLabel(o.key) !== o.key ? `${esc(o.key)} · ` : ''}`
    + `${rows.length} line${rows.length === 1 ? '' : 's'} · `
    + `${Math.round(o.km).toLocaleString()} km</small></div>`;
  // The progress and "rode every line" are the tracker's, as in the line view (Anita, 2026-10-09).
  const tracker = MODE === 'ridden';
  if (tracker) {
    h += `<div class="rrow" style="border:none">${ringHtml(pct / 100, opColour(o.key))}`
      + `<div class="tx"><div class="o">${done.toFixed(1)} km ridden · `
      + `${finished} of ${rows.length} finished</div></div>${starButton(`op:${o.key}`)}</div>`;
  }
  /* Marks every line not yet finished as ridden in full, one whole-line ride each, so it is
     one undo to take back and each line can still be removed on its own afterwards. */
  if (left && tracker) {
    h += `<div class="btnrow"><input type="date" id="opdate" value="${esc(LAST_DATE)}" />`
      + `<button class="act" onclick="rideOperator(${i})">rode every line `
      + `(${left} to add)</button></div>`;
  }
  h += `<h2 class="sec">Lines</h2>`;
  for (const r of rows) h += lineRow(r.line, r.km, { bring: true });
  el.innerHTML = h;
}

function rideOperator(i) {
  opsNow();
  const o = OPS[i];
  if (!o) return;
  const frac = creditRanges();
  const todo = o.lines.filter(line => lineKm(line, frac) / Math.max(line.km, 0.001) <= 0.999);
  if (!todo.length) return;
  if (!confirm(`Mark all ${todo.length} unfinished line${todo.length === 1 ? '' : 's'} of `
               + `${o.key} as ridden?`)) return;
  const d = document.getElementById('opdate');
  LAST_DATE = d ? d.value : LAST_DATE;
  addRides(todo.map(line => wholeRide(line, LAST_DATE)),
           `Added all ${todo.length} lines of ${o.key}`);
}

function showLine(id, preselect, bring) {
  VIEW = { kind: 'line', id };
  PICK = { from: preselect || null, to: null };
  /* The map first (2026-10-09): with the line's geometry in, its setData goes to the
     selection's worker now, which works on it while the panel below is laid out. */
  paintSelection();
  openPanel(true);
  render();
  // A line over a border: bring in the rest of it, which redraws it whole as it arrives.
  loadLineRegions(id);
  /* From the map the camera does NOT move: selecting a line while looking at a place should
     leave you looking at that place. From a list or a search (`bring`), the line is brought
     into view when it is not already on screen (Anita, 2026-10-07). */
  if (bring) fitLineIfOutside(id);
}

/* A line row's geometry is asked for on the press, not the click: a click comes ~50-150 ms
   after the button goes down, and the line is drawn that much sooner when its file is new. */
document.addEventListener('pointerdown', ev => {
  const el = ev.target.closest && ev.target.closest('[onclick^="showLine("]');
  const m = el && /^showLine\('([^']+)'/.exec(el.getAttribute('onclick'));
  if (m && LINE_BY_ID.has(m[1])) geomFor(m[1]);
}, true);

async function fitLineIfOutside(id) {
  const view = VIEW;
  const g = await geomFor(id);
  if (VIEW !== view) return;
  fitIfOutside(Object.values(g).filter(p => p.length > 1)
    .map(coordinates => ({ geometry: { coordinates } })));
}

async function fitLine(id) {
  const line = LINE_BY_ID.get(id);
  const g = await geomFor(id);
  let minx = 180, miny = 90, maxx = -180, maxy = -90, any = false;
  for (const pts of Object.values(g)) {
    for (const [x, y] of pts) {
      any = true;
      if (x < minx) minx = x;
      if (x > maxx) maxx = x;
      if (y < miny) miny = y;
      if (y > maxy) maxy = y;
    }
  }
  if (any) map.fitBounds([[minx, miny], [maxx, maxy]], { padding: 60, duration: 0 });
}

/* ---------------------------------------------------------------- strip diagram layout

   A LINE'S TRACK IS A GRAPH, and 71 of Japan's register lines are not a chain: the register
   gives the main line's name to parallel routes and freight lines, so the JR East Tokaido
   Line has 37 stations, 52 sections and 16 independent loops, and the Hinkaku route through
   Musashi-Kosugi runs beside the main one from Shinagawa to Tsurumi. One list in one variant's
   order could not show that; it shuffled the second route into the first.

   So the diagram is laid out the way metro maps draw branches. The MAIN ROUTE is the longest
   run through the line (the shortest path between the two stations furthest apart), straight
   down lane 0, north at the top. Then, repeatedly, any unplaced track leaving a placed
   station is followed until it rejoins placed track or ends: that route goes in the nearest
   free lane beside, with its stations at positions between where it leaves and rejoins, so
   everything reads top to bottom roughly in order along the line. A route with no station of
   its own (a freight line bypassing stations) is drawn as a bare arc in its lane.

   Two special cases. A PURE LOOP (the Yamanote) is one lane with caps at both ends saying it
   continues round. A line in SEPARATE PIECES (a Swiss line crossing Germany; a register gap)
   is drawn piece by piece with a marked gap between. A straight-line fallback section is left
   out of the drawing where the stations it joins are connected some other way anyway: it is
   a gap in the map data, not a route, and it made 西鉄天神大牟田線 look like a loop. */
function lineLayout(line) {
  if (line._lay) return line._lay;
  const edges = line.sections.filter(s => s[0] !== s[1])
    .map(([a, b, km, gid]) => ({ a, b, km: Math.max(km, 0.001), gid }));
  const adjOf = list => {
    const m = new Map();
    for (const e of list) {
      if (!m.has(e.a)) m.set(e.a, []);
      if (!m.has(e.b)) m.set(e.b, []);
      m.get(e.a).push(e); m.get(e.b).push(e);
    }
    return m;
  };
  const other = (e, u) => (e.a === u ? e.b : e.a);
  const reach = (adj, from, skip) => {
    const seen = new Set([from]), todo = [from];
    while (todo.length) {
      const u = todo.pop();
      for (const e of adj.get(u) || []) {
        if (e === skip) continue;
        const v = other(e, u);
        if (!seen.has(v)) { seen.add(v); todo.push(v); }
      }
    }
    return seen;
  };
  /* One at a time, against what is left: 幕張本郷 hangs on two straight-line sections, each
     of which looked removable while the other was still there, and dropping both at once
     cut the station off. */
  let live = edges;
  for (const e of edges) {
    if (!looksStraight({ gids: [e.gid] })) continue;
    if (reach(adjOf(live), e.a, e).has(e.b)) live = live.filter(x => x !== e);
  }

  /* SHORTCUTS ARE NOT DRAWN: a section with another way between the same two stations, at
     most about a third longer, is left out of the layout before anything is placed. That
     covers express track beside a stopping route (the Yokosuka tracks from Tokyo to
     Shinagawa beside the stopping Tokaido tracks), duplicated sections, and the Oedo
     Line's Shinjuku to Shinjuku-nishiguchi, 1.48 km of track passing 152 m from the point
     the register gives Tochomae: no train in service runs it without calling at Tochomae,
     but laid out, it made the line fork one station early. Longest first, each against
     what is left, so two shortcuts never excuse each other. The section still counts, and
     a ride over it lights the way beside it (`hidden`). */
  const hidden = new Map();          // gid -> the gids of the way drawn instead
  const wayAround = (list, e) => {
    const adj = adjOf(list.filter(x => x !== e));
    const limit = e.km * 1.35 + 0.5;
    const dist = new Map([[e.a, 0]]), prev = new Map(), done = new Set();
    for (;;) {
      let u = null, bd = Infinity;
      for (const [k, d] of dist) if (!done.has(k) && d < bd) { bd = d; u = k; }
      if (u === null || bd > limit) return null;
      if (u === e.b) break;
      done.add(u);
      for (const x of adj.get(u) || []) {
        const v = other(x, u);
        if (bd + x.km < (dist.has(v) ? dist.get(v) : Infinity)) { dist.set(v, bd + x.km); prev.set(v, x); }
      }
    }
    const gids = [];
    for (let c = e.b; c !== e.a;) { const x = prev.get(c); gids.push(x.gid); c = other(x, c); }
    return gids;
  };
  for (const e of [...live].sort((p, q) => q.km - p.km)) {
    const alt = wayAround(live, e);
    if (alt) { hidden.set(e.gid, alt); live = live.filter(x => x !== e); }
  }
  // A shortcut's way round may itself run over a shortcut set aside later; follow it through.
  const expand = (gids, depth = 0) => gids.flatMap(g =>
    hidden.has(g) && depth < 8 ? expand(hidden.get(g), depth + 1) : [g]);
  for (const [g, alt] of hidden) hidden.set(g, expand(alt));
  const adj = adjOf(live);

  // The pieces, north first.
  const comps = [], done = new Set();
  for (const s of adj.keys()) {
    if (done.has(s)) continue;
    const nodes = [...reach(adj, s)];
    nodes.forEach(n => done.add(n));
    comps.push(nodes);
  }
  const lat = id => (STATIONS[id] || {}).y || 0;
  comps.sort((p, q) => Math.max(...q.map(lat)) - Math.max(...p.map(lat)));
  /* A line over a border is in the order its pieces join end to end (chainDisplays), so
     Brussels, Lille and Rotterdam read along the route rather than by latitude. */
  if (line.parts) {
    const at = new Map(line.display.map((id, i) => [id, i]));
    const first = nodes => Math.min(...nodes.map(n => (at.has(n) ? at.get(n) : Infinity)));
    const north = new Map(comps.map((c, i) => [c, i]));
    comps.sort((p, q) => (first(p) - first(q)) || (north.get(p) - north.get(q)));
  }

  const pieces = comps.map(nodes => layoutPiece(line, nodes, adj, other));
  const lanes = Math.max(1, ...pieces.map(p => p.lanes));
  // `drawn`: the sections the diagram draws, which a pick between two of its rows rides along
  // (drawnGraph).
  return (line._lay = { pieces, lanes, hidden, drawn: new Set(live.map(e => e.gid)) });
}

function layoutPiece(line, nodes, adj, other) {
  const inPiece = new Set(nodes);
  const edges = [...new Set(nodes.flatMap(n => adj.get(n)))];
  const lat = id => (STATIONS[id] || {}).y || 0;

  // A pure loop: every station on exactly two sections, as many sections as stations.
  if (nodes.length > 2 && edges.length === nodes.length
      && nodes.every(n => adj.get(n).length === 2)) {
    const start = line.display.find(id => inPiece.has(id)) || nodes[0];
    const order = [start], placed = [];
    let cur = start, came = null;
    for (;;) {
      const e = adj.get(cur).find(x => x !== came);
      const v = other(e, cur);
      if (v === start) return { loop: true, rows: order.map(id => ({ id, lane: 0 })),
                                edges: placed, wrap: e, lanes: 1 };
      placed.push({ ...e, lane: 0 });
      order.push(v); came = e; cur = v;
    }
  }

  // Dijkstra over this piece, naive: pieces are at most a couple of hundred stations.
  const dijkstra = src => {
    const dist = new Map([[src, 0]]), prev = new Map(), seen = new Set();
    for (;;) {
      let u = null, best = Infinity;
      for (const [k, d] of dist) if (!seen.has(k) && d < best) { best = d; u = k; }
      if (u === null) break;
      seen.add(u);
      for (const e of adj.get(u)) {
        const v = other(e, u), nd = best + e.km;
        if (nd < (dist.has(v) ? dist.get(v) : Infinity)) { dist.set(v, nd); prev.set(v, e); }
      }
    }
    return { dist, prev };
  };
  /* The main route runs between the two stations furthest apart, among ALL stations, not
     only the ends of track: parallel tracks leave Tokyo in two directions, so it is not an
     end of the Tokaido Line's graph, and a first version ran the main route from Omori
     through Musashi-Kosugi with Tokyo pushed out to a side lane. Very large pieces try only
     the ends of track and every fourth station, to stay quick. */
  const cands = nodes.length <= 250 ? nodes
    : nodes.filter((n, i) => adj.get(n).length === 1 || i % 4 === 0);
  let best = { d: -1 };
  for (const s of cands) {
    const r = dijkstra(s);
    for (const t of cands) {
      const d = r.dist.get(t);
      if (t !== s && d > best.d) best = { d, s, t, prev: r.prev };
    }
  }
  const pos = new Map(), laneOf = new Map(), used = new Set(), placedEdges = [];
  const intervals = [[]];                 // per lane, the [lo, hi] spans already taken
  // The main route's two ends, until a loop hanging off one of them carries it on (below).
  const ends = { first: null, last: null };
  let main = null;                        // the main route: its stations and sections, in order
  if (best.d < 0) {                       // a single station, or two joined only to each other
    pos.set(nodes[0], 0); laneOf.set(nodes[0], 0);
  } else {
    let path = [best.t];
    let pedges = [];
    for (let cur = best.t; cur !== best.s;) {
      const e = best.prev.get(cur);
      pedges.push(e);
      cur = other(e, cur);
      path.push(cur);
    }
    path.reverse(); pedges.reverse();

    /* THE MAIN ROUTE STOPS AT THE STATIONS. The shortest path is not what a rider means by
       the line: on the JR East Tokaido Line it ran Tokyo to Shimbashi and Takanawa Gateway
       to Nishi-Oi on tracks that pass Yurakucho and Shinagawa without a stop, and took the
       Hinkaku route through Musashi-Kosugi because it is shorter than the main line through
       Kawasaki. So wherever another route between two stations of the main one has MORE
       stations and is at most about a third longer, it takes that stretch's place, until
       nothing changes. */
    /* Every route off the main one that comes back to it, found by a small search from each
       of its stations (a first version walked one route per section and, taking the first
       unused section at every fork, let one walk use up the sections another needed, so
       Takanawa Gateway to Nishi-Oi via Shinagawa was never seen). Capped, since only the
       JR trunk lines have more than a handful. The best improvement goes in each round. */
    const MAX_ROUTES = 400;
    for (let iter = 0; iter < 40; iter++) {
      const idx = new Map(path.map((id, i) => [id, i]));
      const onPath = new Set(pedges);
      let best = null;
      for (const u of path) {
        let found = 0, steps = 0;
        const walk = (cur, route, redges, km) => {
          for (const e of adj.get(cur)) {
            if (found >= MAX_ROUTES || ++steps > 20000) return;
            if (onPath.has(e) || redges.includes(e)) continue;
            const v = other(e, cur);
            if (route.includes(v)) continue;
            if (idx.has(v)) {
              found++;
              if (v === u) continue;
              let i = idx.get(u), j = idx.get(v);
              let r = [...route, v], re = [...redges, e];
              if (i > j) { [i, j] = [j, i]; r = r.reverse(); re = re.reverse(); }
              const gain = (r.length - 2) - (j - i - 1);
              const segKm = pedges.slice(i, j).reduce((s, x) => s + x.km, 0);
              const earKm = km + e.km;
              if (gain > 0 && earKm <= segKm * 1.35 + 0.5
                  && (!best || gain > best.gain)) best = { i, j, r, re, gain };
            } else if (route.length < 40) {
              walk(v, [...route, v], [...redges, e], km + e.km);
            }
          }
        };
        walk(u, [u], [], 0);
      }
      if (!best) break;
      path = [...path.slice(0, best.i), ...best.r, ...path.slice(best.j + 1)];
      pedges = [...pedges.slice(0, best.i), ...best.re, ...pedges.slice(best.j)];
    }
    // North at the top: the direction a relation happens to be drawn in is arbitrary.
    if (lat(path[0]) < lat(path[path.length - 1])) { path.reverse(); pedges.reverse(); }
    let km = 0;
    path.forEach((id, i) => {
      if (i) km += pedges[i - 1].km;
      pos.set(id, km); laneOf.set(id, 0);
    });
    for (const e of pedges) { used.add(e); placedEdges.push({ ...e, lane: 0 }); }
    intervals[0].push([0, km]);
    ends.first = path[0]; ends.last = path[path.length - 1];
    main = { path, pedges, at: new Map(path.map((id, i) => [id, i])) };
  }

  /* WHICH SIDE A BRANCH HANGS ON. Anita (2026-10-04): a branch sits on the side of the end its
     trains run to, so the Northeast Regional's Springfield branch is listed ABOVE New Haven,
     reading Springfield ... Wallingford, New Haven, then on down to New York, the way its
     trains run. The data says nothing about where trains run, so the track's shape stands in:
     a train off a branch carries on the way the curve points, not back on itself. The branch
     leaves the junction heading north, the main route leaves it east towards Boston and
     south-west towards New York; the branch is nearer the Boston heading, so its trains run
     on towards New York, and it goes on the Boston side. Headings are taken to a station
     about 5 km out on each, so a station a few hundred metres off the junction cannot swing
     it. Only a branch off the main route's middle is turned; from anywhere else it hangs
     below, as before. */
  const bearing = (a, b) => {
    const p = STATIONS[a], q = STATIONS[b];
    if (!p || !q) return null;
    return Math.atan2(q.y - p.y, (q.x - p.x) * Math.cos(p.y * Math.PI / 180));
  };
  const out5 = (ids, kms) => {             // the station ~5 km along a run of stations
    let km = 0, i = 1;
    for (; i < ids.length - 1 && km + kms[i - 1] < 5; i++) km += kms[i - 1];
    return ids[Math.min(i, ids.length - 1)];
  };
  const turn = (x, y) => { const d = Math.abs(x - y) % (2 * Math.PI); return Math.min(d, 2 * Math.PI - d); };
  const branchSide = (start, route, redges) => {
    const k = main ? main.at.get(start) : undefined;
    if (k == null || k === 0 || k === main.path.length - 1) return 1;
    const b = bearing(start, out5(route, redges.map(e => e.km)));
    const upIds = main.path.slice(0, k + 1).reverse();
    const up = bearing(start, out5(upIds, main.pedges.slice(0, k).reverse().map(e => e.km)));
    const down = bearing(start, out5(main.path.slice(k), main.pedges.slice(k).map(e => e.km)));
    if (b == null || up == null || down == null) return 1;
    return turn(b, up) < turn(b, down) ? -1 : 1;
  };

  // Everything else, one route at a time, each in the nearest lane free over its span.
  const EPS = 1e-6;
  // `station|dir` -> how many side-route stations already sit on that side of it
  const blockAt = new Map();
  const freeLane = (lo, hi, above) => {
    for (let L = above + 1; ; L++) {
      if (!intervals[L]) intervals[L] = [];
      if (!intervals[L].some(([a, b]) => lo < b + EPS && a < hi + EPS)) {
        intervals[L].push([lo, hi]);
        return L;
      }
    }
  };
  for (;;) {
    // Start from the earliest placed station with track still to place, so routes come out
    // in order down the line.
    let start = null, first = null;
    for (const id of [...pos.keys()].sort((p, q) => pos.get(p) - pos.get(q))) {
      first = adj.get(id).find(e => !used.has(e));
      if (first) { start = id; break; }
    }
    if (!start) break;
    const route = [start], redges = [];
    let cur = start, e = first;
    for (;;) {
      used.add(e); redges.push(e);
      cur = other(e, cur);
      if (route.includes(cur) && !pos.has(cur)) {
        // Closed back on itself before rejoining (a balloon loop at a branch's end): the
        // closing section is drawn, but the station is not listed twice.
        placedEdges.push({ ...e, lane: -1 });
        redges.pop();
        break;
      }
      route.push(cur);
      if (pos.has(cur)) break;                      // rejoined placed track
      const next = adj.get(cur).find(x => !used.has(x));
      if (!next) break;                             // the end of a branch
      e = next;
    }
    const end = route[route.length - 1], rejoins = pos.has(end) && route.length > 1;
    const p0 = pos.get(start);
    let p1 = rejoins ? pos.get(end) : p0;
    /* A ROUTE'S STATIONS STAY TOGETHER, listed as one block straight after the station the
       route leaves from, and the track back to where it rejoins runs down its lane as a thin
       line with no station on it. A first version spread them between the main route's
       stations by distance, so near Shiojiri the Tatsuno route and the tunnel route
       alternated row by row, and one loop read as several branches crossing (Anita,
       2026-09-30). Blocks leaving the same station follow one another rather than mix. */
    const interior = route.slice(1, rejoins ? -1 : undefined);

    /* A LOOP AT THE END OF THE LINE IS WALKED IN ONE COLUMN. Where a route rejoins at one of
       the main route's two ends, the main route carries on round it: its stations continue
       the main lane past that end, and only the section closing the loop runs back to the
       junction as a thin line. The Oedo Line reads Hikarigaoka ... Tochomae, Shinjuku-
       nishiguchi ... Monzen-nakacho, Tsukishima ... Shinjuku, back to Tochomae, the order its
       trains run, where splitting the loop into two halves met at Monzen-nakacho. */
    const T = rejoins && interior.length
      ? [ends.first, ends.last].find(t => t && (t === start || t === end) && start !== end)
      : null;
    if (T) {
      const U = T === start ? end : start;
      const inner = T === start ? interior : [...interior].reverse();
      const edgesFromT = T === start ? redges : [...redges].reverse();
      const down = T === ends.last ? 1 : -1;
      const pT = pos.get(T);
      inner.forEach((id, i) => { pos.set(id, pT + EPS * (i + 1) * down); laneOf.set(id, 0); });
      const pLast = pos.get(inner[inner.length - 1]), pU = pos.get(U);
      const back = freeLane(Math.min(pU, pLast), Math.max(pU, pLast), 0);
      edgesFromT.forEach((x, i) => placedEdges.push(i < edgesFromT.length - 1
        ? { ...x, lane: 0 } : { ...x, lane: back, thin: true }));
      if (T === ends.last) ends.last = null; else ends.first = null;   // once per end
      continue;
    }
    const dir = rejoins ? (p1 >= p0 ? 1 : -1) : branchSide(start, route, redges);
    // Blocks above a station and blocks below it are counted apart.
    const bk = `${start}|${dir}`, k0 = blockAt.get(bk) || 0;
    interior.forEach((id, i) => pos.set(id, p0 + EPS * (k0 + i + 1) * dir));
    blockAt.set(bk, k0 + interior.length);
    if (!rejoins) p1 = pos.get(end);
    /* TRACK WITH NO STATION OF ITS OWN shares one outer lane, drawn thin. Given a lane each,
       the freight bypasses around Tokyo took the Tohoku Line to 11 lanes; they count towards
       the line, but nobody boards or leaves a train on them. */
    if (!interior.length) { for (const x of redges) placedEdges.push({ ...x, lane: 'bypass' }); continue; }
    const lane = freeLane(Math.min(p0, p1), Math.max(p0, p1), 0);
    for (const id of interior) laneOf.set(id, lane);
    redges.forEach((x, i) => placedEdges.push({
      ...x, lane,
      // the run back to the station it rejoins at, past rows that are not on it
      thin: rejoins && i === redges.length - 1,
    }));
  }

  // Shortcuts beside a stopping route were set aside before layout (lineLayout), so what is
  // left in the bypass lane is track with no such route beside it: a freight line round a city.
  // Lanes taken by stations, or by a loop's thin way back, which has none.
  const stationLanes = 1 + Math.max(0, ...laneOf.values(),
    ...placedEdges.filter(e => typeof e.lane === 'number').map(e => e.lane));
  const bypass = placedEdges.some(e => e.lane === 'bypass');
  for (const e of placedEdges) if (e.lane === 'bypass') { e.lane = stationLanes; e.thin = true; }
  const rows = [...pos.keys()].sort((p, q) => pos.get(p) - pos.get(q))
    .map(id => ({ id, lane: laneOf.get(id) }));
  return { loop: false, rows, edges: placedEdges, lanes: stationLanes + (bypass ? 1 : 0) };
}

/* Where the lanes sit: lane 0's centre, and the step between lanes, in px. */
const STRIP_X0 = 11, STRIP_LANE = 13;
const laneX = L => STRIP_X0 + L * STRIP_LANE;

/* The rails and dots, as one SVG over the left of the rows, placed from where the rows
   actually are, since a name that wraps makes its row taller. Redrawn when the web font
   arrives or the panel is resized, both of which move rows. */
let STRIP_REDRAW = null;
/* The diagram's continuations past junction ends, written by renderLine as it lays out the
   rows (`data-cont` rows): `dots` [{n, lane, colour, pick}], `segs` [{n, lane, colour, run,
   from: {id, lane} (the junction's row) or {n, lane} (the stop before)}], and the lanes the
   whole diagram needs. */
let CONT = { segs: [], dots: [], lanes: 1 };
function drawStrip(strip, line, lay, st) {
  if (!strip || !strip.isConnected) return;
  const old = strip.querySelector(':scope > svg');
  if (old) old.remove();
  const y = new Map();
  // A hidden stub's junction gets no place, so no track is drawn to it (renderLine `stub`).
  for (const row of strip.querySelectorAll('.st:not(.stub)'))
    y.set(row.dataset.st, row.offsetTop + row.offsetHeight / 2);
  const capY = k => {
    const c = strip.querySelector(`[data-cap="${k}"]`);
    return c ? c.offsetTop + c.offsetHeight / 2 : null;
  };
  // Browse draws every part at full colour, ridden or not, as the map does (heldBack).
  const tracker = MODE === 'ridden';
  const own = lineColour(line), dim = tracker ? dimmed(own, 0.30) : own;
  const dotDim = tracker ? dimmed(own, 0.45) : own;
  const colourOf = gid => (st.run(gid) ? THEME.run : st.ridden(gid) ? own : dim);
  const rank = c => (c === THEME.run ? 2 : c === own ? 1 : 0);
  const paths = [];                       // [colour, d], drawn dim first and white last

  /* A section from one station's row to another's, through lane L: straight down where
     all three lanes agree, otherwise a curve out into L below the first station and back
     above the second. */
  const route = (a, b, L) => {
    let ya = y.get(a.id), yb = y.get(b.id), la = a.lane, lb = b.lane;
    if (ya == null || yb == null) return null;
    if (ya > yb) { [ya, yb] = [yb, ya]; [la, lb] = [lb, la]; }
    const xa = laneX(la), xb = laneX(lb), xL = laneX(L);
    if (la === L && lb === L) return `M${xa} ${ya}V${yb}`;
    const h = Math.min(14, (yb - ya) / 2);
    const s = (x1, y1, x2, y2) => `C${x1} ${(y1 + y2) / 2} ${x2} ${(y1 + y2) / 2} ${x2} ${y2}`;
    let d = `M${xa} ${ya}`;
    d += xa !== xL ? s(xa, ya, xL, ya + h) : '';
    d += xb !== xL ? `L${xL} ${yb - h}` + s(xL, yb - h, xb, yb) : `L${xL} ${yb}`;
    return d;
  };

  const dots = [];
  lay.pieces.forEach((piece, k) => {
    const at = new Map(piece.rows.map(r => [r.id, r]));
    for (const e of piece.edges) {
      const a = at.get(e.a), b = at.get(e.b);
      if (!a || !b) continue;
      const L = e.lane >= 0 ? e.lane : Math.max(a.lane, b.lane);
      const d = route(a, b, L);
      // A thin line in the unridden colour vanished against the panel; it gets the dots' one.
      const c = colourOf(e.gid);
      // Not running: dashed, and grey unless it was ridden before it closed.
      if (d && CLOSED.has(e.gid)) paths.push([c === dim ? THEME.stripGone : c, d, 3, '4 4']);
      else if (d) paths.push([e.thin && c === dim ? dotDim : c, d, e.thin ? 2 : 4]);
    }
    if (piece.loop) {
      // The section closing the loop, as the two caps curving away behind the list.
      const c = colourOf(piece.wrap.gid), x = laneX(0);
      const top = capY(`${k}t`), bot = capY(`${k}b`);
      const y0 = y.get(piece.rows[0].id), y1 = y.get(piece.rows[piece.rows.length - 1].id);
      if (top != null) paths.push([c, `M${x} ${y0}L${x} ${top + 4}Q${x} ${top - 4} ${x - 9} ${top - 4}`]);
      if (bot != null) paths.push([c, `M${x} ${y1}L${x} ${bot - 4}Q${x} ${bot + 4} ${x - 9} ${bot + 4}`]);
    }
    for (const r of piece.rows) {
      const row = strip.querySelector(`.st[data-st="${r.id}"]`);
      const pick = row && row.classList.contains('pick');
      const via = row && row.classList.contains('via');
      const jn = row && row.classList.contains('jn');
      if (row && row.classList.contains('quiet')) continue;     // no dot for a hidden junction
      const stroke = pick || via ? THEME.run : tracker && st.reached(r.id) ? own
        : row && row.classList.contains('gone') ? THEME.stripGone : dotDim;
      dots.push(`<circle cx="${laneX(r.lane)}" cy="${y.get(r.id)}" r="${jn ? 3 : 5}" `
        + `fill="${pick ? THEME.run : THEME.panel}" stroke="${stroke}" `
        + `stroke-width="${jn ? 1.5 : 2}"/>`);
    }
  });
  /* Past the junction ends (CONT): in the colour of the line the track runs on to, held
     back as the line's own unridden sections are until that track has been ridden (Anita,
     2026-10-04: full colour read as ridden), white as far as a picked stop. */
  const cont = st.cont || { segs: [], dots: [] };
  const yc = new Map();
  for (const row of strip.querySelectorAll('.st[data-cont]'))
    yc.set(+row.dataset.cont, row.offsetTop + row.offsetHeight / 2);
  for (const s of cont.segs) {
    const ya = s.from.id != null ? y.get(s.from.id) : yc.get(s.from.n), yb = yc.get(s.n);
    if (ya == null || yb == null) continue;
    const xa = laneX(s.from.lane), xb = laneX(s.lane);
    const dir = Math.sign(yb - ya) || 1, h = Math.min(14, Math.abs(yb - ya) / 2);
    const d = `M${xa} ${ya}` + (xa !== xb ? `C${xa} ${ya + dir * h / 2} ${xb} ${ya + dir * h / 2} `
      + `${xb} ${ya + dir * h}` : '') + `L${xb} ${yb}`;
    // As the line's own sections: dimmed until ridden, white while picked; 3 px, not 4.
    paths.push([s.run ? THEME.run : s.ridden || !tracker ? s.colour : dimmed(s.colour, 0.30), d, 3]);
  }
  for (const c of cont.dots) {
    const cy = yc.get(c.n);
    if (cy == null) continue;
    const stroke = c.pick ? THEME.run : c.ridden || !tracker ? c.colour : dimmed(c.colour, 0.45);
    dots.push(`<circle cx="${laneX(c.lane)}" cy="${cy}" r="5" `
      + `fill="${c.pick ? THEME.run : THEME.panel}" stroke="${stroke}" stroke-width="2"/>`);
  }
  paths.sort((p, q) => rank(p[0]) - rank(q[0]));
  const w = laneX(Math.max(lay.lanes, cont.lanes || 1) - 1) + STRIP_X0, hgt = strip.scrollHeight;
  strip.insertAdjacentHTML('afterbegin',
    `<svg width="${w}" height="${hgt}" viewBox="0 0 ${w} ${hgt}">`
    + paths.map(([c, d, sw, dash]) => `<path d="${d}" fill="none" stroke="${c}" `
      + `stroke-width="${sw || 4}" stroke-linecap="${dash ? 'butt' : 'round'}"`
      + `${dash ? ` stroke-dasharray="${dash}"` : ''}/>`).join('')
    + dots.join('') + `</svg>`);
}
if (document.fonts) document.fonts.ready.then(() => STRIP_REDRAW && STRIP_REDRAW());
window.addEventListener('resize', () => STRIP_REDRAW && STRIP_REDRAW());

/* The line that joins two pieces of this one, where one does: a counted line calling at a
   station of each, the shortest if several. The register splits lines by their legal
   name, so the 予讃線's inland route is two pieces joined by the 内子線 from 内子 to 新谷,
   and read as a line with a hole in it until the gap said so (Anita, 2026-09-30). */
function joinedBy(line, p, q) {
  const at = piece => {
    const s = new Set();
    for (const r of piece.rows) for (const id of (STATIONS[r.id] || {}).l || []) s.add(id);
    return s;
  };
  const a = at(p);
  let best = null;
  for (const id of at(q)) {
    const l = LINE_BY_ID.get(id);
    if (!a.has(id) || id === line.id || !l || !listedBase(l)) continue;
    if (!best || l.km < best.km) best = l;
  }
  return best;
}

/* The same at a dead end within one piece: the 予讃線's inland route stops at 内子, and its
   spur off 伊予大洲 stops at 新谷, and the 内子線 joins the two. For each end of track, the
   shortest listed line from there to another end of this one, as {line, to}. */
function endJoins(line) {
  if (line._ends) return line._ends;
  const deg = new Map();
  for (const [a, b] of line.sections) for (const s of [a, b]) deg.set(s, (deg.get(s) || 0) + 1);
  const ends = [...deg].filter(([, n]) => n === 1).map(([s]) => s);
  const out = new Map();
  for (const s of ends) {
    let best = null;
    for (const lid of (STATIONS[s] || {}).l || []) {
      const l = LINE_BY_ID.get(lid);
      if (!l || l === line || !listedBase(l)) continue;
      const on = lineStations(l);
      /* A short link only. Without the cap, 東京 read "to 熱海 by the 東海道新幹線", since
         both ends of the JR East 東海道線 are on it. */
      for (const to of ends) {
        if (to === s || !on.has(to)) continue;
        const p = pathBetween(l, s, to);
        if (p && p.km <= 25 && (!best || p.km < best.km)) best = { line: l, to, km: p.km };
      }
    }
    if (best) out.set(s, best);
  }
  return (line._ends = out);
}

/* The trips over the open line, or over the picked stretch of it: each with the legs that
   credit it and how much, openable in the rides list and deletable behind the usual confirm.
   A leg on another line credits this one through the track the two share. */
function tripsOverHtml(line, runGids) {
  const gids = runGids || partsOf(line).flatMap(p => p.sections.map(s => s[3]));
  const list = tripsOver(gids);
  if (!list.length) return '';
  const mine = new Set(partsOf(line).map(p => p.id).concat(line.id));
  let h = `<h2 class="sec" id="tripsover">${runGids
    ? `Trips over ${esc(stName(PICK.from))} → ${esc(stName(PICK.to))}`
    : 'Trips on this line'} (${list.length})</h2>`;
  for (const { trip, km, legs } of list.slice(0, 100)) {
    const first = trip.rides[0], last = trip.rides[trip.rides.length - 1];
    const title = trip.rides.length === 1 ? rideLabel(first)
      : `${stName(first.from)} → ${stName(last.to)}, ${trip.rides.length} legs`;
    const shared = legs.every(([r]) => !mine.has(r.line));
    const tail = [`${km.toFixed(1)} km here${shared ? ', ridden on another line over this track' : ''}`,
                  first.date, first.note].filter(Boolean).map(esc);
    h += `<div class="ride over"><i class="edge" style="background:${lineColour(line)}"></i>`
      + `<div><b>${esc(title)}</b></div><div class="o muted">${tail.join(' · ')}</div>`;
    // A trip of several legs lists the ones that credit this, each removable on its own.
    if (trip.rides.length > 1) {
      h += `<div class="legs">` + legs.map(([r, k]) => {
        const l = LINE_BY_ID.get(r.line);
        return `<div class="legrow"><span class="sw" style="background:`
          + `${l ? lineColour(l) : THEME.off}"></span><span class="t"><b>`
          + `${esc(l ? lineName(l) : r.line)}</b> `
          + `${esc(stName(r.from))} → ${esc(stName(r.to))}</span>`
          + `<span class="km">${k.toFixed(1)} km</span>`
          + `<button class="act del small" onclick="deleteRide('${r.id}')">remove</button></div>`;
      }).join('') + `</div>`;
    }
    h += `<div class="edit"><button class="act" onclick="showTrip('${trip.key}')">show trip</button>`
      + `<button class="act del" onclick="deleteTrip('${trip.key}')">delete</button></div></div>`;
  }
  if (list.length > 100) h += `<p class="muted">and ${list.length - 100} older.</p>`;
  return h;
}

/* The strip diagram: the rows are names, and the rails and dots are drawn over them. */
function renderLine(el) {
  const line = LINE_BY_ID.get(VIEW.id);
  if (!line) { VIEW = { kind: 'home' }; return render(); }
  const frac = creditRanges();
  const lay = lineLayout(line);

  const run = pickedRun();
  const pathSet = new Set(run && run.p ? run.p.gids : []);
  // A run over a shortcut left out of the drawing lights up the way beside it instead.
  for (const [gid, alt] of lay.hidden) if (pathSet.has(gid)) alt.forEach(g => pathSet.add(g));
  const inRun = pathStations([...pathSet]);

  const running = line.sections.filter(s => !CLOSED.has(s[3]));
  const done = running.reduce((n, s) => n + (frac.get(s[3]) > 0.999 ? 1 : 0), 0);
  const riddenKm = lineKm(line, frac);
  const closedNote = line.km_closed
    ? ` · ${line.km_closed.toFixed(1)} km no longer running` : '';
  const tInfo = trackInfo(line);

  let h = `<div class="btnrow"><button class="act" onclick="goHome()">← back</button>`
    + `<button class="act" onclick="fitLine('${line.id}')">zoom to line</button>`
    + (MODE === 'ridden' ? `<button class="act" onclick="rideWhole('${line.id}')">rode all</button>` : '')
    + `</div>`
    + `<h2 class="sec">${line.service ? 'Named train' : tInfo && !tInfo.corridor ? 'Track' : 'Line'}</h2>`
    + `<div class="big" style="font-size:19px">`
    + `<span class="bar" style="background:${lineColour(line)}"></span>${esc(lineName(line))}`
    + `<small>${typeLabel(line) ? `${esc(typeLabel(line))} · ` : ''}`
    + `${opLinks(line) || 'operator not stated'}`
    + ` · ${line.km.toFixed(1)} km${closedNote}`
    + (line.parts && line.parts.length > 1 ? ` · in ${esc(line.regions.map(regionName).join(', '))}` : '')
    + `</small></div>`;
  /* ROUTE AND TRACK (ROUTE_CCS): a route names the register lines it runs over, the one clicked
     first; a register line the routes over it, unless a click already listed what runs there. */
  {
    const link = l => `<a href="" class="also" style="--c:${lineColour(l)}" `
      + `onclick="showLine('${l.id}'); return false">${esc(lineName(l))}</a>`;
    const fold = (label, ls, key, n) => {
      if (!ls.length) return '';
      const all = VIEW[key] || ls.length <= n + 1;
      const sh = all ? ls : ls.slice(0, n);
      return `<p class="muted" style="margin:6px 0 0">${label}: ${sh.map(link).join(', ')}`
        + (sh.length < ls.length ? `, <a href="" onclick="VIEW.${key} = true; render(); return false">`
          + `and ${ls.length - sh.length} more</a>` : '') + `</p>`;
    };
    if (!isRegisterLine(line) && partsOf(line).some(p => ROUTE_CCS.has(p.region))) {
      // One name each (the register repeats a name for a second track or a split piece).
      const first = VIEW.track && LINE_BY_ID.get(VIEW.track), seen = new Set();
      const tr = (first ? [first, ...routeTracks(line)] : routeTracks(line))
        .filter(l => !seen.has(lineName(l)) && seen.add(lineName(l)));
      h += fold('Track', tr, 'tracksAll', first ? 1 : 3);
    } else if (tInfo && !(VIEW.also && VIEW.also.length)) {
      // The routes most of whose length is this track first: NJ Transit's NEC line before the Crescent.
      const own = s => s.km / Math.max(s.line.km, 0.001);
      h += fold('Routes on this track', [...tInfo.services].sort((a, b) => own(b) - own(a)).map(s => s.line),
                'routesAll', ALSO_SHOWN);
    }
  }
  /* No notes on which line owns which track (Anita, 2026-10-07: the register business is
     the build's, and confused readers). The progress is a ring, in the tracker only. */
  if (MODE === 'ridden') {
    const n = riddenKm > 0.001
      ? tripsOver(partsOf(line).flatMap(p => p.sections.map(s => s[3]))).length : 0;
    h += `<div class="rrow" style="border:none">`
      + ringHtml(riddenKm / Math.max(line.km, 0.001), lineColour(line))
      + `<div class="tx"><div class="o">${riddenKm.toFixed(1)} of ${line.km.toFixed(1)} km ridden`
      + (n ? ` · <a href="" onclick="document.getElementById('tripsover')`
        + `.scrollIntoView(); return false">${n} trip${n === 1 ? '' : 's'}</a>` : '')
      + `</div></div>${starButton(`line:${line.id}`)}</div>`;
  }
  if (line.km_closed) {
    h += `<p class="muted" style="margin-top:8px">The dashed part has no trains: closed, `
      + `suspended or replaced by a bus. It does not count towards the line, and a ride `
      + `from before can still be entered on it.</p>`;
  }

  // A station is reached when any section of this line beside it has been ridden.
  const reached = new Set();
  for (const [a, b, km, gid] of line.sections)
    if ((frac.get(gid) || 0) > 0.999) { reached.add(a); reached.add(b); }
  // Stations no train calls at: no running section of this line beside them, nor of any
  // other line there (夜明, the 日田彦山線's end, is on the running 久大線).
  const joins = endJoins(line);
  const past = pastEnds(line);
  const thru = throughEnds(line);
  const live = new Set(running.flatMap(s => [s[0], s[1]]));
  const gone = id => line.km_closed && !live.has(id)
    && !((STATIONS[id] || {}).l || []).some(lid => {
      const l = LINE_BY_ID.get(lid);
      return l && l !== line
        && l.sections.some(s => (s[0] === id || s[1] === id) && !CLOSED.has(s[3]));
    });

  if (VIEW.also && VIEW.also.length) {
    /* Lines first, named trains after; a long list shows ALSO_SHOWN and folds the rest
       behind "and N more" (Anita, 2026-10-07: Russia's ran to fifty long-distance trains). */
    const others = VIEW.also.map(id => LINE_BY_ID.get(id)).filter(Boolean).sort(lineOrder);
    const link = l => `<a href="" class="also" style="--c:${lineColour(l)}" `
      + `onclick="showLine('${l.id}'); return false">${esc(lineName(l))}</a>`;
    const all = VIEW.alsoAll || others.length <= ALSO_SHOWN + 2;
    const shownL = all ? others : others.slice(0, ALSO_SHOWN);
    const trains = others.slice(shownL.length).filter(l => l.service).length;
    const rest = others.length - shownL.length;
    h += `<p class="muted" style="margin:8px 0 0">Also on this track: `
      + shownL.map(link).join(', ')
      + (rest ? `, <a href="" onclick="VIEW.alsoAll = true; render(); return false">and ${rest} more`
        + `${trains === rest ? ` named train${rest === 1 ? '' : 's'}` : ''}</a>` : '')
      + `</p>`;
  }
  /* The stops past a junction end, by the line taken out of it: [{line, rows: [{st, on,
     click, note}]}], nearest first. pastEnds' (a mapped service runs on there) and
     throughEnds' (the register track does), the two never naming the same stop. */
  const lineLink = o => `<a href="" class="also" style="--c:${lineColour(o)}" `
    + `onclick="event.stopPropagation(); showLine('${o.id}'); return false">`
    + `${esc(lineName(o))}</a>`;
  /* Whether the track from the junction to a stop past it has been ridden: the run's
     sections, or the parts of them (spanOf, a junction mid-section), against what the rides
     credit along each (creditSpans: foot.json's owner track, as the rest of the diagram). */
  const spansNow = creditSpans();
  const riddenRun = gids => {
    let all = 0, done = 0;
    for (const vg of gids) {
      const [gid, lo, hi] = spanOf(vg);
      if (hi <= lo) continue;
      all += secKm(gid) * (hi - lo);
      done += secKm(gid) * spansMeet(spansNow.get(gid) || [], [[lo, hi]]);
    }
    return all > 0 && done >= 0.99 * all;
  };
  const contGroups = j => {
    const by = new Map();
    const add = (o, row) => {
      if (!by.has(o.id)) by.set(o.id, { line: o, rows: [] });
      by.get(o.id).rows.push(row);
    };
    // The same rows the map rings and draws (contRows), so the two cannot disagree.
    for (const c of contRows(line, j)) {
      if (c.kind === 'past') {
        const { st, line: o, board, km, gid } = c;
        add(o, { st, km, ridden: riddenRun(gid ? [gid] : []),
                 on: (PICK.from === st || PICK.to === st) && !!PICK.past
                   && PICK.past.line === o.id,
                 click: `pickPast('${st}', '${o.id}', '${board}', '${j}')`,
                 note: `on ${lineLink(o)}` });
        continue;
      }
      const r = c.r;
      const T = PICK.through || {};
      const is = ref => ref && ref.j === j && ref.st === r.st && ref.key === r.key;
      add(r.legs[0].line, { st: r.st, km: r.km, ridden: riddenRun(r.legs.flatMap(l => l.gids)),
        on: (PICK.from === r.st && is(T.from)) || (PICK.to === r.st && is(T.to)),
        click: `pickThrough('${r.st}', '${j}', '${r.key}')`,
        note: `on ${r.legs.map(l => lineLink(l.line)).join(', then ')}` });
    }
    const groups = [...by.values()];
    for (const g of groups) g.rows.sort((x, y) => x.km - y.km);
    return groups.sort((x, y) => x.rows[0].km - y.rows[0].km);
  };
  const hasPast = id => past.has(id) || (!thru.pending && thru.map.has(id));
  // The lanes the continuations need, beside the line's own.
  let lanes = lay.lanes;
  for (const piece of lay.pieces) for (const { id, lane } of piece.rows)
    if (hasPast(id)) lanes = Math.max(lanes, lane + contGroups(id).length);
  CONT = { segs: [], dots: [], lanes };
  h += `<div id="strip" style="--c:${lineColour(line)};`
    + `--w:${STRIP_X0 * 2 + (lanes - 1) * STRIP_LANE}px">`;
  lay.pieces.forEach((piece, k) => {
    /* A JUNCTION THE LINE ONLY PASSES THROUGH is not listed (Anita, 2026-10-05: the WCML's
       "Junction near St Enoch", "near Crosshill" ... between Glasgow and Carstairs): one with
       two sections of this line at it, not an end, nothing past it and no branch. Its row is
       kept at no height, so the rails are drawn through it as before. */
    const pdeg = new Map();
    for (const e of piece.edges) for (const s of [e.a, e.b]) pdeg.set(s, (pdeg.get(s) || 0) + 1);
    if (k) {
      const via = joinedBy(line, lay.pieces[k - 1], piece);
      // A line over a border: the next piece is another country's.
      const cc = id => (STATIONS[id] || {}).region;
      const was = cc(lay.pieces[k - 1].rows[0].id), now = cc(piece.rows[0].id);
      h += `<div class="stgap">` + (via
        ? `joined by <a href="" class="also" style="--c:${lineColour(via)}" onclick="showLine(`
          + `'${via.id}'); return false">${esc(lineName(via))}</a>`
        : line.parts && was && now && was !== now ? `continues in ${esc(regionName(now))}`
        : `the line continues elsewhere`) + `</div>`;
    }
    if (piece.loop) h += `<div class="loopcap top" data-cap="${k}t"><b>continues round</b></div>`;
    /* THE DIAGRAM CARRIES ON PAST A JUNCTION END to the stops beyond it (contGroups), so a
       ride is always picked station to station (Anita, 2026-10-04). Outside the junction's
       row: above it at the head of a piece, below it at the foot, the nearest stop next to
       the junction. Each line taken out of the junction has its own lane, drawn thin in that
       line's colour by drawStrip from CONT. */
    const pastRows = (j, jLane, head) => {
      const groups = contGroups(j);
      let out = '';
      const order = head ? [...groups.keys()].reverse() : [...groups.keys()];
      for (const g of order) {
        const { line: o, rows } = groups[g];
        const lane = jLane + g;
        const pickAt = rows.findIndex(r => r.on);
        const html = rows.map((r, i) => {
          const n = CONT.dots.length;
          CONT.dots.push({ n, lane, colour: lineColour(o), pick: r.on, ridden: r.ridden });
          CONT.segs.push({ n, lane, colour: lineColour(o), run: pickAt >= i, ridden: r.ridden,
                           from: i ? { n: n - 1, lane } : { id: j, lane: jLane } });
          return `<div class="st past${r.on ? ' in pick' : ''}" data-cont="${n}" `
            + `onclick="${r.click}"><div class="nm">${esc(stName(r.st))}<i>${r.note}</i>`
            + `</div></div>`;
        });
        out += (head ? html.reverse() : html).join('');
      }
      return out;
    };
    for (const [ri, { id, lane: jLane }] of piece.rows.entries()) {
      if (ri === 0 && hasPast(id)) h += pastRows(id, jLane, true);
      const end = PICK.from === id || PICK.to === id;
      const cls = [reached.has(id) ? 'reached' : '', inRun.has(id) || end ? 'in' : '',
                   end ? 'pick' : inRun.has(id) ? 'via' : ''].filter(Boolean).join(' ');
      const alt = stAlt(id);
      // A junction or border point: a row, since the line runs through it, but no stop.
      const junction = !isStop(id);
      const note = [alt, gone(id) ? 'no trains' : ''].filter(Boolean).join(' · ');
      const join = joins.get(id);
      // The link stops the click reaching the row, which would pick the station instead.
      const joinNote = join ? `<i>to ${esc(stName(join.to))} by <a href="" class="also" `
        + `style="--c:${lineColour(join.line)}" onclick="event.stopPropagation(); `
        + `showLine('${join.line.id}'); return false">${esc(lineName(join.line))}</a></i>` : '';
      const inner = junction && !end && !join && ri > 0 && ri < piece.rows.length - 1 && !hasPast(id);
      const quiet = inner && pdeg.get(id) === 2;
      /* A junction a short side stub ends at, nothing past it (the Midland Main Line's curve
         ending near Cricklewood; Anita, 2026-10-05: "a junction that doesnt connect to
         anything"): no row and no track drawn to it. Its km still count. */
      const stub = inner && pdeg.get(id) === 1;
      h += `<div class="st ${cls}${junction ? ' jn' : ''}${quiet || stub ? ' quiet' : ''}`
        + `${stub ? ' stub' : ''}`
        + `${gone(id) ? ' gone' : ''}" data-st="${id}"`
        + `${junction ? '' : ` onclick="pickStop('${id}')"`}>`
        + `<div class="nm">${esc(stName(id))}${junction ? '<i>junction</i>'
          : note ? `<i>${esc(note)}</i>` : ''}${joinNote}</div></div>`;
      if (ri > 0 && hasPast(id)) h += pastRows(id, jLane, false);
    }
    if (piece.loop) h += `<div class="loopcap bottom" data-cap="${k}b"><b>back to `
      + `${esc(stName(piece.rows[0].id))}</b></div>`;
  });
  h += `</div>`;

  if (run) {
    h += `<div id="addbar">`;
