---
sitemap: false
---
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
{%- include analytics.html -%}
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>noritetsu</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<style>
  /* THE THEME. Every colour the page uses is one of these. The greys are named by their
     value in the dark theme (--g0a is #0a0a0a), so they read as a ramp in order; the
     light theme gives each a hand-picked counterpart rather than a formula, because
     text greys need to darken further than an inversion takes them. */
  :root {
    --del: #d98a8a;
    --del-bg: #3a1f1f;
    --del-border: #4a2e2e;
    --del-hover: #d96b6b;
    --focus: #4a5a6a;
    --g0a: #0a0a0a;
    --g0d: #0d0d0d;
    --g12: #121212;
    --g14: #141414;
    --g16: #161616;
    --g17: #171717;
    --g1e: #1e1e1e;
    --g24: #242424;
    --g26: #262626;
    --g2c: #2c2c2c;
    --g33: #333;
    --g3a: #3a3a3a;
    --g55: #555;
    --g5a: #5a5a5a;
    --g5f: #5f5f5f;
    --g66: #666;
    --g6f: #6f6f6f;
    --g77: #777;
    --g7a: #7a7a7a;
    --g8a: #8a8a8a;
    --g9a: #9a9a9a;
    --gbb: #bbb;
    --gc8: #c8c8c8;
    --gcc: #ccc;
    --gdd: #ddd;
    --ge8: #e8e8e8;
    --gee: #eee;
    --gff: #fff;
    --glass: rgba(10,10,10,0.85);
    --glass-strong: rgba(10,10,10,0.94);
    --note: #d9b36a;
    --on: #cfd9e4;
    --warn: #d98a5a;
  }
  :root[data-theme="light"] {
    --del: #b33a3a;
    --del-bg: #fbe9e9;
    --del-border: #e3b5b5;
    --del-hover: #c0392b;
    --focus: #8a9aaa;
    --g0a: #f2f3f0;
    --g0d: #fafaf8;
    --g12: #f0f0ec;
    --g14: #ffffff;
    --g16: #efefeb;
    --g17: #ecece8;
    --g1e: #e4e4e0;
    --g24: #e0e0dc;
    --g26: #dcdcd8;
    --g2c: #d0d0cc;
    --g33: #c4c4c0;
    --g3a: #bdbdb8;
    --g55: #8a8a86;
    --g5a: #85857f;
    --g5f: #80807b;
    --g66: #777773;
    --g6f: #6a6a66;
    --g77: #666662;
    --g7a: #62625e;
    --g8a: #575753;
    --g9a: #4d4d49;
    --gbb: #3a3a37;
    --gc8: #333330;
    --gcc: #30302d;
    --gdd: #262624;
    --ge8: #1f1f1d;
    --gee: #1a1a18;
    --gff: #111110;
    --glass: rgba(250,250,248,0.92);
    --glass-strong: rgba(252,252,250,0.97);
    --note: #8a6a10;
    --on: #3a4a5a;
    --warn: #b3541e;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--g0a); color: var(--gee); font-family: 'Nunito', sans-serif; overflow: hidden; }
  #map { position: absolute; inset: 0; right: 340px; }
  .maplibregl-canvas-container.maplibregl-interactive,
  .maplibregl-canvas-container.maplibregl-interactive:active { cursor: default; }

  #title {
    position: absolute; top: 14px; left: 14px; z-index: 2;
    background: var(--glass); border: 1px solid var(--g26);
    padding: 9px 13px 10px; max-width: 280px;
  }
  #title h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: 0.2px; }
  /* Beside the name while the map is unfinished (Anita, 2026-10-09: deploy "with a 'in
     progress' label"). Small and plain, the panel's muted grey. */
  #title h1 .wip { font-size: 11.5px; font-weight: 400; letter-spacing: 0; color: var(--g8a);
                   border: 1px solid var(--g33); padding: 1px 6px; margin-left: 6px;
                   vertical-align: 2px; }
  #modes { display: flex; gap: 6px; margin-top: 8px; }
  #modes button, #panel-open {
    background: none; border: 1px solid var(--g33); color: var(--g8a);
    font-family: inherit; font-size: 11.5px; padding: 3px 9px; cursor: pointer;
  }
  #modes button:hover, #panel-open:hover { border-color: var(--g66); color: var(--gcc); }
  #modes button.on { border-color: var(--on); color: var(--gff); }
  #panel-open { display: none; }
  #modes button.theme { margin-left: auto; }

  #lang {
    position: absolute; top: 14px; right: 354px; z-index: 2;
    background: var(--glass); border: 1px solid var(--g26); color: var(--gcc);
    font-family: inherit; font-size: 12px; padding: 4px 6px;
  }
  #lang:focus { outline: none; border-color: var(--focus); }

  /* ---- the tracker panel ---- */
  #panel {
    position: absolute; top: 0; right: 0; bottom: 0; width: 340px; z-index: 3;
    background: var(--g0d); border-left: 1px solid var(--g26);
    display: flex; flex-direction: column; font-size: 13px;
  }
  #panel-head { padding: 12px 14px 10px; border-bottom: 1px solid var(--g1e); }
  #panel-body { flex: 1; overflow-y: auto; padding: 0 14px 20px; }
  #panel-close, #panel-size { display: none; }

  #q {
    width: 100%; background: var(--g14); border: 1px solid var(--g2c); color: var(--gee);
    font-family: inherit; font-size: 13px; padding: 7px 9px;
  }
  #q:focus { outline: none; border-color: var(--focus); }
  #results { margin-top: 6px; }
  #loadnote { display: none; margin-top: 6px; font-size: 11.5px; color: var(--g7a); }
  .hit { padding: 5px 7px; cursor: pointer; border-left: 2px solid transparent; }
  .hit:hover { background: var(--g16); border-left-color: #4a9eff; }
  .hit .t { color: var(--ge8); }
  .hit .s { color: var(--g7a); font-size: 11.5px; }
  .hit .bar { display: inline-block; width: 9px; height: 9px; border-radius: 2px;
              margin-right: 6px; vertical-align: -1px; }

  /* Sentence case, the body's size: no all-caps headings (Anita, 2026-10-07). */
  h2.sec { margin: 16px 0 6px; font-size: 13px; font-weight: 600; color: var(--g7a); }
  .muted { color: var(--g6f); font-size: 12px; line-height: 1.5; }
  .big { font-size: 26px; font-weight: 700; color: var(--gff); line-height: 1.1; }
  .big small { font-size: 12px; font-weight: 400; color: var(--g8a); display: block; margin-top: 2px; }
  .riders { font-size: 11.5px; color: var(--g7a); margin-top: 4px; }
  .riders a { color: inherit; text-decoration: none; }

  .meter { height: 4px; background: var(--g1e); margin-top: 4px; }
  .meter i { display: block; height: 100%; background: #4a9eff; }

  .lrow { padding: 7px 0; border-bottom: 1px solid var(--g17); }
  .lrow[onclick]:hover b { color: var(--gff); }
  .lrow .n { display: flex; justify-content: space-between; gap: 8px; }
  .lrow .n b { font-weight: 600; color: var(--gdd); min-width: 0; overflow: hidden;
               text-overflow: ellipsis; white-space: nowrap; }
  .lrow .n span { color: var(--g9a); font-variant-numeric: tabular-nums; flex: none; }
  .lrow .o { color: var(--g6f); font-size: 11.5px; }

  button.act {
    background: none; border: 1px solid var(--g3a); color: var(--gbb);
    font-family: inherit; font-size: 12px; padding: 5px 10px; cursor: pointer;
  }
  button.act:hover { border-color: var(--g77); color: var(--gff); }
  button.act.go { border-color: #4a9eff; color: #4a9eff; }
  button.act.go:hover { background: #4a9eff; color: #06121f; }
  .btnrow { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

  /* ---- strip diagram ---- */
  /* The rails and dots are one SVG drawn over the left of the list (drawStrip), placed from
     the rows' measured positions; the rows are only the names, pushed right by the width
     the lanes need (--w). */
  #strip { margin-top: 4px; position: relative; --w: 22px; }
  #strip > svg { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
  .st { display: flex; align-items: stretch; cursor: pointer; padding-left: var(--w); }
  .st:hover .nm { color: var(--gff); }
  .st .nm { padding: 5px 0 5px 6px; color: var(--gc8); line-height: 1.25; }
  .st .nm i { display: block; font-style: normal; color: var(--g6f); font-size: 11px; }
  .st.in .nm { color: var(--gff); }
  a.also { color: var(--gc8); text-decoration: none; border-bottom: 2px solid var(--c); }
  a.also:hover { color: var(--gff); }
  a.oplink { color: inherit; }
  a.oplink:hover { color: var(--gff); }
  .st.jn { cursor: default; }
  .st.gone .nm { color: var(--g7a); }
  .st.jn .nm { color: var(--g6f); font-size: 12px; padding-top: 3px; padding-bottom: 3px; }
  /* A junction the line only passes through: no row to see, but kept for the rails' path. */
  .st.quiet { height: 0; overflow: hidden; }
  .st.quiet .nm { padding: 0; }

  /* A loop does not end, so its diagram should not look like it does. The rail runs on past
     the first and last station and curves away to the left (drawn by drawStrip), the two
     stubs together reading as the line closing round behind the list. */
  .loopcap { position: relative; height: 22px; }
  .loopcap b {
    position: absolute; left: 20px; top: 50%; margin-top: -7px;
    font-size: 10.5px; font-weight: 400; color: var(--g5f);
  }
  .loopcap.bottom b { margin-top: -6px; }
  /* Between the pieces of a line that runs through another country (Basel to Schaffhausen
     through Germany), or whose register has a gap. */
  .stgap { padding: 6px 0 6px 6px; margin-left: var(--w); font-size: 11px; color: var(--g5f);
           border-top: 1px dashed var(--g26); border-bottom: 1px dashed var(--g26); margin-top: 4px;
           margin-bottom: 4px; }

  #addbar { position: sticky; bottom: 0; z-index: 2; background: var(--g0d); padding: 10px 0 4px;
            border-top: 1px solid var(--g1e); }
  #addbar label { display: block; color: var(--g9a); font-size: 12px; margin: 2px 0 6px;
                  cursor: pointer; }
  #addbar label input { vertical-align: -2px; margin: 0 5px 0 0; }

  .ride { position: relative; padding: 6px 0 6px 12px; border-bottom: 1px solid var(--g17);
          cursor: pointer; margin-top: 3px; }
  /* The trip's lines down its left edge, one band per leg. */
  .ride .edge { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .ride:hover b { color: var(--gff); }
  .ride.editing { background: var(--g12); }
  .ride.over { cursor: default; }
  /* A stop past a junction end, the diagram carried on to it (drawStrip draws its dot and
     track from CONT). A stop like any other; the line it is on says it in italics. */
  .st.past.pick .nm { color: var(--gff); }
  .ride.over:hover b { color: inherit; }
  .ride .legs { margin: 6px 0 2px; cursor: default; }
  .legrow { display: flex; align-items: center; gap: 7px; padding: 3px 0; font-size: 12px;
            color: var(--g9a); }
  .legrow .sw { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .legrow .t { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis;
               white-space: nowrap; }
  .legrow .t b { color: var(--gcc); font-weight: 600; }
  .legrow .km { color: var(--g6f); font-variant-numeric: tabular-nums; flex: none; }
  button.act.small { font-size: 11px; padding: 1px 6px; margin-left: 0; }
  button.act.del { margin-left: auto; color: var(--del); border-color: var(--del-border); }
  button.act.del:hover { color: var(--gff); border-color: var(--del-hover); background: var(--del-bg); }

  /* One list at a time on the home view. */
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 16px 0 10px; }
  .tabs button {
    background: none; border: 1px solid var(--g2c); color: var(--g8a);
    font-family: inherit; font-size: 12px; padding: 4px 9px; cursor: pointer;
  }
  .tabs button:hover { border-color: var(--g55); color: var(--gcc); }
  .tabs button.on { border-color: var(--on); color: var(--gff); }

  /* The bar under a row's name: dim in the row's colour, full strength for what is done. */
  .lmeter { height: 4px; margin: 5px 0 3px;
            background: var(--g24); background: color-mix(in srgb, var(--c) 28%, var(--g0d)); }
  .lmeter i { display: block; height: 100%; background: var(--c); }

  /* A ROW WITH A RING (Anita, 2026-10-07: noritsubushi's filled circles). The ring fills
     clockwise for the fraction done, dim in the row's colour behind it, the percentage inside.
     The star marks the row for the poster. */
  .rrow { display: flex; align-items: center; gap: 10px; padding: 6px 0;
          border-bottom: 1px solid var(--g17); }
  .rrow[onclick] { cursor: pointer; }
  .rrow[onclick]:hover b { color: var(--gff); }
  .rrow .tx { flex: 1; min-width: 0; }
  .rrow .tx b { display: block; font-weight: 600; color: var(--gdd); overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; }
  .rrow .o { color: var(--g6f); font-size: 11.5px; }
  .ring { flex: none; width: 42px; height: 42px; position: relative; }
  .rrow.plain { padding-top: 5px; padding-bottom: 5px; }
  .rrow .mark { flex: none; width: 4px; align-self: stretch; border-radius: 2px; }
  .ring span small { font-size: 7.5px; font-weight: 600; margin-left: 0.5px; }
  .ring svg { position: absolute; inset: 0; }
  .ring span { position: absolute; inset: 0; display: flex; align-items: center;
               justify-content: center; font-size: 11px; font-weight: 600; color: var(--gdd);
               font-variant-numeric: tabular-nums; letter-spacing: -0.2px; }
  .flag { width: 16px; height: 12px; vertical-align: -1px; margin-right: 6px;
          box-shadow: 0 0 0 1px var(--g26); }
  /* Operator logos are 2x PNGs, 28 px high or, for a wordmark wider than 2:1, 56 px wide
     and shorter (tools/operators.py LOGO_H, LOGO_W). Shown at half size with the aspect
     kept: at most 14 px high and 28 px wide, so a long logo is smaller, never squashed. */
  .oplogo { width: auto; height: auto; max-height: 14px; max-width: 28px;
            vertical-align: middle; margin-right: 6px; }
  /* Small, in the row's top right corner (Anita, 2026-10-07). */
  button.star { flex: none; align-self: flex-start; background: none; border: none;
                padding: 1px 0 4px 4px; cursor: pointer; color: var(--g3a); line-height: 0; }
  button.star svg { width: 12px; height: 12px; }
  button.star:hover { color: var(--g8a); }
  button.star.on { color: #e0a800; }
  .ride button.star { position: absolute; right: 0; top: 4px; }
  /* The countries' tree: a caret on a row that opens, children indented under it. */
  .rrow .caret { flex: none; width: 10px; margin-right: -4px; line-height: 0; color: var(--g8a); }
  .rrow .caret.open svg { transform: rotate(90deg); }
  .lv1 { padding-left: 9px; }
  .lv2 { padding-left: 18px; }
  p.lv1, p.lv2 { margin: 4px 0; }
  .rrow[draggable="true"] { cursor: grab; }
  .ride .edit { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
  .ride .edit input[type=text] { flex: 1; min-width: 120px; }

  input.fld, #addbar input[type=date], .ride .edit input, select.fld {
    background: var(--g14); border: 1px solid var(--g2c); color: var(--gdd);
    font-family: inherit; font-size: 12px; padding: 4px 6px;
  }
  input.fld:focus, .ride .edit input:focus, select.fld:focus { outline: none; border-color: var(--focus); }

  #stale {
    display: none; padding: 8px 14px; border-bottom: 1px solid var(--g1e);
    font-size: 12px; line-height: 1.45; color: var(--note);
  }
  #stale a { color: var(--gff); }
  #undobar {
    display: none; align-items: center; gap: 8px; padding: 7px 14px;
    border-bottom: 1px solid var(--g1e); font-size: 12px; color: var(--g9a);
  }
  #undobar span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
                  white-space: nowrap; }
  #undobar button { padding: 2px 9px; }

  /* A traced journey: one row per leg between two clicked stations. */
  .trip { margin: 12px 0 6px; }
  .trip .rail { width: 22px; flex: none; position: relative; }
  .tst { display: flex; align-items: center; min-height: 26px; }
  .tst b { font-weight: 600; color: var(--gee); padding-left: 6px; }
  .tst .dot {
    position: absolute; left: 5px; top: 50%; margin-top: -6px; width: 12px; height: 12px;
    border-radius: 50%; background: var(--gff); border: 2px solid var(--gff); z-index: 1;
  }
  .tleg { display: flex; align-items: stretch; min-height: 30px; }
  .tleg .rail::before {
    content: ''; position: absolute; left: 9px; top: -7px; bottom: -7px; width: 4px;
    background: var(--c);
  }
  .tleg.bad .rail::before { background: repeating-linear-gradient(var(--g3a) 0 4px, transparent 4px 8px); }
  .tleg .what { display: flex; align-items: center; gap: 8px; padding: 4px 0 4px 6px;
                font-size: 12.5px; color: var(--gc8); min-width: 0; flex: 1; }
  .tleg.bad .what { color: var(--warn); font-size: 12px; }
  .tleg .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tleg .km { margin-left: auto; color: var(--g7a); font-size: 11.5px; flex: none;
              font-variant-numeric: tabular-nums; }
  /* The real <select> sits invisibly over the name, so the choice opens the native list
     while the row reads exactly like a leg with no choice. */
  .pickline { position: relative; display: flex; align-items: center; gap: 4px; min-width: 0;
              cursor: pointer; }
  .pickline select { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%;
                     font: inherit; }
  .pickline .caret { color: var(--g8a); font-size: 11px; flex: none; }
  .pickline:hover .nm { color: var(--gff); text-decoration: underline; text-decoration-color: var(--g55); }
  .tnote { color: var(--warn); font-size: 12px; line-height: 1.45; margin: 6px 0; }

  .maplibregl-ctrl-attrib { font-size: 10px; }

  .maplibregl-popup { pointer-events: none; }
  .maplibregl-popup-content {
    background: var(--glass-strong); border: 1px solid var(--g2c); border-radius: 0;
    padding: 7px 10px 8px; font-family: 'Nunito', sans-serif; font-size: 12.5px;
    color: var(--ge8); box-shadow: none;
  }
  .maplibregl-popup-content b { display: block; font-size: 13.5px; color: var(--gff); }
  .maplibregl-popup-content .jp { color: var(--g8a); font-size: 11px; margin-bottom: 4px; }
  .maplibregl-popup-content .pl {
    display: block; font-size: 11.5px; color: var(--gc8); padding-left: 8px;
    border-left: 3px solid var(--g55); margin-top: 3px; line-height: 1.3;
  }
  .maplibregl-popup-content .more { color: var(--g6f); font-size: 11px; margin-top: 4px; }
  .maplibregl-popup-tip { display: none; }

  /* ON A PHONE THE PANEL IS A SHEET over the bottom half, and the map shrinks to the top half
     above it, so stations can still be tapped while a line's diagram is open (before, the
     panel covered the whole map and picking only worked through search). "expand" gives it
     the whole screen for a long list, "shrink" brings it back. */
  @media (max-width: 720px) {
    #map { right: 0; }
    #lang { right: 14px; }
    body.sheet #map { bottom: 52%; }
    #title { padding: 7px 11px 8px; max-width: calc(100% - 28px); }
    #panel-open { display: inline-block; margin-top: 8px; }
    #panel { width: 100%; top: auto; height: 52%; display: none;
             border-left: none; border-top: 1px solid var(--g26); }
    #panel.open { display: flex; }
    #panel.full { top: 0; height: auto; border-top: none; }
    #panel-close, #panel-size { display: inline-block; float: right; margin-left: 6px; }
    #panel-head { padding: 8px 12px 8px; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="title">
  <h1>noritetsu <span class="wip">In progress</span></h1>
  <div id="modes">
    <button data-mode="ridden" class="on" onclick="setMode('ridden')">Travel tracker</button>
    <button data-mode="browse" onclick="setMode('browse')">View all lines</button>
    <button id="theme-btn" class="theme"
            onclick="setTheme(THEME_NAME === 'dark' ? 'light' : 'dark')">Light</button>
  </div>
  <button id="panel-open" onclick="openPanel(true)">Rides</button>
</div>

<select id="lang" onchange="setLang(this.value)" title="Names">
  <option value="en">English</option>
  <option value="local">Local names</option>
</select>

<div id="panel">
  <div id="panel-head">
    <button class="act" id="panel-close" onclick="openPanel(false)">close</button>
    <button class="act" id="panel-size" onclick="sheetFull(!SHEET_FULL)">expand</button>
    <input id="q" placeholder="Search a line or a station" autocomplete="off" />
    <div id="results"></div>
    <div id="loadnote"></div>
  </div>
  <div id="stale">The line data has been rebuilt since this page loaded, so some lines will
    not draw. <a href="" onclick="location.reload(); return false">Reload</a> to pick it up;
    your rides are kept.</div>
  <div id="undobar"><span id="undolabel"></span>
    <button class="act" onclick="undo()" title="Ctrl+Z">undo</button></div>
  <div id="panel-body"><div class="muted" style="margin-top:14px">Loading…</div></div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
<script>
/* noritetsu — the map, and the record of what has been ridden.
   Data model and the decisions behind it are in ../spec.md. */

/* COUNTRIES LOAD AS THE MAP MOVES OVER THEM. Each is its own build under data/<cc>/, and
   `regions.json` (tools/build_regions.py) says where each one is before any of it has been
   fetched. A country's tiles come in the moment it is on screen or nearly; its line data
   comes in from DATA_MIN_ZOOM, and is merged into the one model everything else reads, so
   crossing a border needs nothing from the rider. Countries holding rides load at start,
   since their ridden lines are drawn at every zoom.

   LINE DATA ONLY WHERE YOU ZOOM IN (Anita, 2026-10-02: "start zoomed out and see everything,
   and only load detailed data for the places we zoom into"). The track is tiles with their
   own levels of detail, so a view of Europe draws all of it from tiles; a country's line data
   (lines, stations, footprints: Russia 11.7 MB, Germany 5.7) used to come in from z4 for
   every country in view, 33 MB and 160 MB of memory for a view of Europe. Now from z8, for
   the countries on screen. What needed it at lower zooms gets it another way: each country's
   km of line is in regions.json (`km`), so the headline and the Countries tab need none;
   not-running track is one file for every country (data/closed.json); a click on track, a
   search, or opening a country loads the country it needs.

   Line and station ids are already distinct between countries (OSM ids are global, and each
   register reader uses its own prefix). Section ids are not: both builds number them from 0,
   so they are prefixed with the country as they are read ("ch:120"). Nothing saved names a
   section, so the prefix never leaves the page. */
let REGIONS = {};                 // cc -> {name, bbox, view, parts: [{ring, w, e, s, n}]}
/* Line ids built in more than one country (regions.json `shared_lines`, id -> [cc, ...]):
   an OSM route over a border is built in every country it touches under the same id. Lets
   the app load the rest of such a line before it has seen it. Empty until the index has it;
   the app then guesses from where the line ends (neighbourRegions). */
let SHARED_LINES = {};
/* OSM line ids folded into one across countries (regions.json `line_aliases`, id -> id).
   Each country merges its OSM twins on its own, and countries disagree: Belgium and the
   Netherlands merged "Eurostar: Paris - Amsterdam" (m5189990) into "Eurostar" (m5189989),
   France kept the two apart, so France's piece had nothing to join and a ride from Paris to
   Amsterdam stopped at the Belgian border. Every line id read from a country goes through
   this before lines are joined (tools/build_regions.py says which merges are taken). */
let LINE_FOLD = {};
const foldLine = id => LINE_FOLD[id] || id;
const START = new URLSearchParams(location.search).get('region');

/* THE CAMERA IS REMEMBERED: where the map was left, and the country the headline was on.
   A first visit opens on the whole world; a `?region=` link still opens on its country. */
const CAMERA_KEY = 'noritetsu.camera';
const SAVED_CAMERA = (() => {
  try {
    const c = JSON.parse(localStorage.getItem(CAMERA_KEY) || 'null');
    if (c && Array.isArray(c.c) && isFinite(c.c[0]) && isFinite(c.c[1]) && isFinite(c.z)) return c;
  } catch (e) { }
  return null;
})();
// The country under the middle of the map: the headline's. Null over the open world.
let FOCUS = START || (SAVED_CAMERA && SAVED_CAMERA.f) || null;
const TILES = new Set();          // countries whose tiles are on the map
const LOADING = new Map();        // cc -> the promise of its line data
const LOADED = new Set();         // countries whose line data is merged in
/* From this zoom the countries on screen load their line data (above: line data only where
   you zoom in). One below the zoom station bubbles appear at, so they are in by then. At z8
   the view is about 3 degrees across; DATA_MARGIN adds a tenth of it on each side, so the
   neighbour you are about to pan into is usually in first. */
const DATA_MIN_ZOOM = 8;
const DATA_MARGIN = 0.1;
// Without the search index (data/search.json, an older deploy), a search reaches the countries
// on screen from this zoom (the old loading gate), loading them as it is typed; below it a
// whole continent is on screen.
const SEARCH_MIN_ZOOM = 4;
/* The search index (loadSearchIndex): every country's line and station names, fetched on the
   first keystroke. State '' (not asked for), 'loading', 'ready' or 'missing'. */
let SEARCH_IX = null;
let SEARCH_IX_STATE = '';
// A country's km of line from regions.json (`km`), there without loading the country.
const hasTotal = cc => !!REGIONS[cc] && typeof REGIONS[cc].km === 'number';
// Every ride saved before regions existed was in Japan.
const rideRegion = r => r.region || 'jp';
/* Every country a ride needs loaded to resolve: its own, and for a line over a border the
   others it runs through (`regions`, saved on rides on such lines, and the shared index). */
const rideRegions = r => [...new Set([rideRegion(r), ...(r.regions || []),
                                      ...(SHARED_LINES[foldLine(r.line)] || [])])];
const here = () => RIDES.filter(r => LOADED.has(rideRegion(r)));
const regionName = cc => (cc ? (REGIONS[cc] || {}).name || cc.toUpperCase() : '');
const STORE_KEY = 'noritetsu.rides.v1';

/* THE PAINT EXPRESSIONS ARE PLAIN LITERALS, and have to stay that way:
   tools/lint_map_expressions.js evaluates each addLayer object with this file's
   SCREAMING_CASE array constants hoisted, and anything it cannot evaluate it reports as
   unchecked. An expression built in a loop would skip the layer most worth checking. */

/* EACH LINE IN ITS OWN COLOUR, where the tiles give one (`c`, the colour of the line that
   runs over that track), and otherwise by kind. Decided 2026-09-30, replacing the kind-only
   palette of spec §8: the Ginza line is orange on the map as it is on the platform.
   `to-color` with two arguments takes the first that converts, so a missing or malformed
   `c` falls through to the kind colour rather than failing the whole layer.

   In Ridden mode, and with a line or a journey selected, the same colours are DARKENED,
   blended towards the background inside the expression. Not held back by opacity: double
   and quadruple track are separate pieces lying on top of each other, so four at 34%
   stacked to about 80% and the "dimmed" network came out nearly full strength. */
/* ONE BLUE FOR EVERY LINE WITHOUT A COLOUR OF ITS OWN (Anita, 2026-10-07). It was a colour
   per kind (metro purple, tram yellow...), which read as confusing beside lines in their
   own colours; the legend now says only: own colour, else blue. */
const TRACK_COLOUR = '#4a9eff';

const TRACK_LINE_COLOUR = ['to-color', ['get', 'c'], TRACK_COLOUR];

/* TRACK NO LINE RUNS OVER (`n` in the tiles, build_tiles.mark_no_line): freight lines, yard
   throats and disused track joined to the passenger network. A faint grey, thinner, never a
   click target (Anita, 2026-10-04: Mexico's freight network in passenger blue read as far
   more passenger rail than Mexico has; "a much more subtle gray ... almost invisible"). The
   grey is THEMES' `noLine`, and the legend reads it from there. Held back with the rest in
   Ridden mode and with a line selected, so it stays below every line. Tiles built before
   carry no `n`, and draw as they did. */
const NO_LINE = ['==', ['get', 'n'], 1];
/* A BRANCH IS HELD BACK IN ITS COLOUR, not its opacity: 0.867 towards the background is what
   0.78 opacity was beside a main line's 0.9 (0.78 / 0.9). The track's opacity has to stay one
   constant, because muting switches it (setMuted), and switching a data-driven paint
   property makes MapLibre re-parse every loaded tile. */
const RANK_MIX = ['match', ['get', 'r'], 0, 1, 0.867];
const TRACK_PAINT_DARK = ['case', NO_LINE, '#303030',
  ['interpolate', ['linear'], RANK_MIX, 0, '#0d0d0d', 1, TRACK_LINE_COLOUR]];
const TRACK_COLOUR_RIDDEN = ['interpolate', ['linear'], 0.36, 0, '#0d0d0d', 1, TRACK_PAINT_DARK];
const TRACK_COLOUR_MUTED = ['interpolate', ['linear'], 0.24, 0, '#0d0d0d', 1, TRACK_PAINT_DARK];
const TRACK_HIT_FILTER = ['!=', ['get', 'n'], 1];

/* THE LIGHT THEME'S KIND COLOURS are darker and more saturated: the dark theme's tram yellow
   and narrow-gauge green all but vanish on a pale basemap. Held back towards the basemap's
   own background, the way the dark theme's are held back towards black. */
const TRACK_COLOUR_LIGHT = '#1f6fd1';
const TRACK_LINE_RAW_LIGHT = ['to-color', ['get', 'c'], TRACK_COLOUR_LIGHT];
const LUM_RAW_LIGHT = ['+',
  ['*', 0.2126, ['at', 0, ['to-rgba', TRACK_LINE_RAW_LIGHT]]],
  ['*', 0.7152, ['at', 1, ['to-rgba', TRACK_LINE_RAW_LIGHT]]],
  ['*', 0.0722, ['at', 2, ['to-rgba', TRACK_LINE_RAW_LIGHT]]]];
/* A line too pale for the light basemap, darkened towards black until its luminance is 165
   (LIGHT_MAX_LUM; forTheme does the same in the panel and the ridden overlay). */
const TRACK_LINE_COLOUR_LIGHT = ['interpolate', ['linear'],
  ['min', 1, ['/', 165, ['max', 1, LUM_RAW_LIGHT]]],
  0, '#000000', 1, TRACK_LINE_RAW_LIGHT];
const TRACK_PAINT_LIGHT = ['case', NO_LINE, '#d2d2ce',
  ['interpolate', ['linear'], RANK_MIX, 0, '#f2f3f0', 1, TRACK_LINE_COLOUR_LIGHT]];
const TRACK_COLOUR_RIDDEN_LIGHT = ['interpolate', ['linear'], 0.36,
  0, '#f2f3f0', 1, TRACK_PAINT_LIGHT];
const TRACK_COLOUR_MUTED_LIGHT = ['interpolate', ['linear'], 0.24,
  0, '#f2f3f0', 1, TRACK_PAINT_LIGHT];

/* A THIN EDGE ON A LINE TOO CLOSE TO THE BACKGROUND: dark round a bright line on the light
   basemap (the Yamanote's green, the Sobu Line's yellow), light round a near-black one on the
   dark (the Yokosuka Line's navy). The brightness is worked out in the expression from the
   line's own colour, 0-255 weighted as luminance. The edge is a layer under the track at the
   track's width, and the line itself is drawn narrower (CASED_INNER) over it, so an edged
   line weighs about what it did: the edge is under half a pixel a side at most zooms, and
   reads as a firmer outline rather than a border (Anita, 2026-09-30). Dark mode's threshold
   is low because pure red scores about 50 and needs no help on black. */
const LUM_DARK = ['+',
  ['*', 0.2126, ['at', 0, ['to-rgba', TRACK_LINE_COLOUR]]],
  ['*', 0.7152, ['at', 1, ['to-rgba', TRACK_LINE_COLOUR]]],
  ['*', 0.0722, ['at', 2, ['to-rgba', TRACK_LINE_COLOUR]]]];
const LUM_LIGHT = ['+',
  ['*', 0.2126, ['at', 0, ['to-rgba', TRACK_LINE_COLOUR_LIGHT]]],
  ['*', 0.7152, ['at', 1, ['to-rgba', TRACK_LINE_COLOUR_LIGHT]]],
  ['*', 0.0722, ['at', 2, ['to-rgba', TRACK_LINE_COLOUR_LIGHT]]]];
const CASED_DARK = ['all', ['!=', ['get', 'n'], 1], ['<', LUM_DARK, 45]];
// 150, under the 165 a pale line is darkened to, so a darkened line keeps its edge.
const CASED_LIGHT = ['all', ['!=', ['get', 'n'], 1], ['>', LUM_LIGHT, 150]];

// Track no line runs over (NO_LINE) at 0.6 of a branch's width.
const RANK_W = ['case', NO_LINE, 0.6, ['match', ['get', 'r'], 0, 1.0, 0.8]];

/* THE RANK FACTOR MULTIPLIES EACH STOP, not the interpolate: ['*', ['interpolate', ['zoom'],
   ...], factor] is invalid, because ['zoom'] may only be the direct input of a top-level
   interpolate or step, and the whole layer then silently fails to add. */
const TRACK_WIDTH = ['interpolate', ['linear'], ['zoom'],
  1, ['*', 0.45, RANK_W],
  5, ['*', 0.70, RANK_W],
  8, ['*', 1.00, RANK_W],
  11, ['*', 1.50, RANK_W],
  14, ['*', 2.40, RANK_W],
  17, ['*', 4.00, RANK_W]];
// The track's width when it has an edge under it (CASED_*), per theme; TRACK_WIDTH otherwise.
const TRACK_WIDTH_DARK = ['interpolate', ['linear'], ['zoom'],
  1, ['*', 0.45, RANK_W, ['case', CASED_DARK, 0.65, 1]],
  5, ['*', 0.70, RANK_W, ['case', CASED_DARK, 0.65, 1]],
  8, ['*', 1.00, RANK_W, ['case', CASED_DARK, 0.65, 1]],
  11, ['*', 1.50, RANK_W, ['case', CASED_DARK, 0.65, 1]],
  14, ['*', 2.40, RANK_W, ['case', CASED_DARK, 0.65, 1]],
  17, ['*', 4.00, RANK_W, ['case', CASED_DARK, 0.65, 1]]];
const TRACK_WIDTH_LIGHT = ['interpolate', ['linear'], ['zoom'],
  1, ['*', 0.45, RANK_W, ['case', CASED_LIGHT, 0.65, 1]],
  5, ['*', 0.70, RANK_W, ['case', CASED_LIGHT, 0.65, 1]],
  8, ['*', 1.00, RANK_W, ['case', CASED_LIGHT, 0.65, 1]],
  11, ['*', 1.50, RANK_W, ['case', CASED_LIGHT, 0.65, 1]],
  14, ['*', 2.40, RANK_W, ['case', CASED_LIGHT, 0.65, 1]],
  17, ['*', 4.00, RANK_W, ['case', CASED_LIGHT, 0.65, 1]]];

/* With a line selected, everything else drops back (TRACK_COLOUR_MUTED) so the line can be
   read against it. The selected line is not drawn by this layer at all: it is redrawn on
   top from the `sel` source, which keeps it at its own strength while the rest fades.
   The muted track is a second layer over the same tiles (`track-mute-<cc>`), and muting
   swaps the two layers' constant opacities: no tile is re-parsed, and the basemap is
   untouched. The edge keeps the rank opacity it always had; only its colour changes. */
const TRACK_OPACITY = ['match', ['get', 'r'], 0, 0.9, 0.78];
const TRACK_ALPHA = 0.9;
const HIT_WIDTH = ['interpolate', ['linear'], ['zoom'], 8, 8, 14, 16];

/* Ridden track, drawn over everything. Wider than the base at every zoom, because at world
   scale a ridden line has to be findable, not merely present. */
const RIDDEN_WIDTH = ['interpolate', ['linear'], ['zoom'],
  1, 1.2, 5, 1.8, 8, 2.4, 11, 3.2, 14, 4.4, 17, 6.5];
const RIDDEN_CASING = ['interpolate', ['linear'], ['zoom'],
  1, 2.6, 5, 3.4, 8, 4.4, 11, 5.6, 14, 7.4, 17, 10.0];

/* Track the register lists but no train runs over (`closed`, see mergeRegion): grey and
   dashed, from the model's geometry, since the tiles have no rails there to draw. */
const CLOSED_WIDTH = ['interpolate', ['linear'], ['zoom'],
  5, 0.8, 8, 1.1, 11, 1.6, 14, 2.4, 17, 3.6];
const CLOSED_DASH = ['literal', [2, 2]];

/* The selected line: a white halo under it, so the selection reads as a selection whatever
   colour the line itself is, and its stations as rings. The two ends of the trip being
   entered are the same rings filled in. */
const SEL_HALO_WIDTH = ['interpolate', ['linear'], ['zoom'],
  1, 4.0, 5, 5.5, 8, 7.0, 11, 9.0, 14, 12.0, 17, 16.0];
const SEL_LINE_WIDTH = ['interpolate', ['linear'], ['zoom'],
  1, 1.0, 5, 1.5, 8, 2.0, 11, 2.8, 14, 3.8, 17, 5.5];
/* Deliberately much heavier than the plain station dot. Picking a trip means finding one
   named station among the hundreds on screen, and a ring only slightly larger than every
   other ring does not help with that. */
const SEL_ST_RADIUS = ['interpolate', ['linear'], ['zoom'],
  8, ['match', ['get', 'role'], 'from', 4, 'to', 4, 'via', 2.8, 'reach', 1.8, 2.4],
  12, ['match', ['get', 'role'], 'from', 6.4, 'to', 6.4, 'via', 4.4, 'reach', 3, 4],
  16, ['match', ['get', 'role'], 'from', 9.6, 'to', 9.6, 'via', 7.2, 'reach', 5, 6.4]];
/* The same figure as the strip diagram's dots: the line's own colour outside, dark inside,
   and the colour dimmed where that station has not been reached yet. `c` is set per feature,
   so one rule covers every line. The two ends of the trip being entered are filled solid,
   which is the one thing the diagram cannot show and the map should. The stations passed
   through on the way are white rings, as they are on the diagram. */
const SEL_ST_FILL = ['match', ['get', 'role'],
  'from', ['get', 'c'], 'to', ['get', 'c'], '#0a0a0a'];
const SEL_ST_STROKE = ['match', ['get', 'role'],
  'from', '#ffffff', 'to', '#ffffff', 'via', '#ffffff', ['get', 'c']];
// In the light theme what is white above is near-black, and the dark fill is white.
const SEL_ST_FILL_LIGHT = ['match', ['get', 'role'],
  'from', ['get', 'c'], 'to', ['get', 'c'], '#ffffff'];
const SEL_ST_STROKE_LIGHT = ['match', ['get', 'role'],
  'from', '#111111', 'to', '#111111', 'via', '#111111', ['get', 'c']];
/* The `sel` source holds three parts, each with its own layers:
     base  the whole selected line, held back, since most of it is usually unridden;
     done  the part of it that has been ridden (by any line over the same track), at full
           strength, so the selected line reads the way its bar in the panel does;
     run   what is being entered: the picked run on a line, white, or a traced journey, each
           leg in its own line's colour. Over everything, since it is the thing being decided. */
const SEL_RUN_WIDTH = ['interpolate', ['linear'], ['zoom'],
  1, 1.6, 5, 2.2, 8, 3.0, 11, 4.0, 14, 5.4, 17, 7.5];
const PART_BASE = ['==', ['get', 'part'], 'base'];
const PART_DONE = ['==', ['get', 'part'], 'done'];
const PART_RUN = ['==', ['get', 'part'], 'run'];
const PART_GONE = ['==', ['get', 'part'], 'gone'];
const SEL_ST_STROKE_W = ['match', ['get', 'role'], 'from', 3, 'to', 3, 'reach', 1.3, 2.4];

/* Legend text, and the zoom each kind starts appearing at (which must match MINZOOM in
   build_tiles.py -- the tiles decide, this only describes them). THE COLOURS ARE NOT
   REPEATED HERE: the legend reads them out of the live palette, so the map and the legend
   cannot drift apart, and every colour drawn is in the legend by construction. */
const KIND_LABEL = {
  rail: ['Heavy rail', 0], subway: ['Metro', 6], light_rail: ['Light rail', 6],
  monorail: ['Monorail', 6], tram: ['Tram', 7], narrow_gauge: ['Narrow gauge', 7],
  heritage: ['Heritage', 7], funicular: ['Funicular', 10],
};
const RANK_LABEL = ['main line', 'branch'];

/* The OpenFreeMap dark style draws its OWN railways, from the same OpenStreetMap data, in
   near-black. Left alone they shadow every line we draw and read as a ghost network. */
// The last two are the light theme's (Positron's).
const BASEMAP_RAIL = ['railway', 'railway_dashline', 'railway_minor',
  'railway_minor_dashline', 'railway_transit', 'railway_transit_dashline',
  'railway_service', 'railway_service_dashline'];

// Ridden first (decided 2026-09-30): the map opens on your own lines. Then as it was left.
const MODE_KEY = 'noritetsu.mode';
let MODE = (() => {
  try { const m = localStorage.getItem(MODE_KEY); if (m === 'browse' || m === 'ridden') return m; }
  catch (e) { }
  return 'ridden';
})();

/* DARK OR LIGHT. The page's colours are CSS variables (the :root blocks above); these are
   the ones CSS cannot reach: the basemap, the map's own paint, and colours the script
   writes into the strip diagram's SVG. `run` is what the dark theme draws in white (the trip
   being entered, the stations it passes); `bg` is what a held-back colour fades towards.
   Chosen with ?theme=light|dark or the button, and remembered per browser. Added
   2026-09-30 so Anita can see a light version before deciding whether to switch to it. */
const THEMES = {
  dark: {
    style: 'https://tiles.openfreemap.org/styles/dark',
    /* The halo is SOLID, the colour 20% white made over the background: at 0.2 opacity it
       doubled wherever it overlapped itself (sections meeting, tight curves), and came out
       as spiky dark fur at every turn (Anita, 2026-10-07). */
    bg: [13, 13, 13], panel: '#0d0d0d', run: '#ffffff', halo: '#3d3d3d', haloOpacity: 1,
    casing: '#0a0a0a', stFill: '#0a0a0a', stStroke: '#cfd9e4', label: '#d8dee6',
    labelHalo: '#0a0a0a', gone: '#6a6a6a', selGone: '#9a9a9a', stripGone: '#555555',
    off: '#3a3a3a', dimText: '#6f6f6f',
    noLine: '#303030',             // TRACK_PAINT_DARK's grey, for the legend
    track: TRACK_PAINT_DARK, ridden: TRACK_COLOUR_RIDDEN, muted: TRACK_COLOUR_MUTED,
    kinds: TRACK_COLOUR, selFill: SEL_ST_FILL, selStroke: SEL_ST_STROKE,
    // The edge under too-dark lines, and the same held back as the track is (0.36, 0.24).
    width: TRACK_WIDTH_DARK, cased: CASED_DARK,
    edge: '#d8d8d8', edgeRidden: '#565656', edgeMuted: '#3e3e3e',
    // No country names, and no names of seas and lakes ("Yellow Sea"; Anita, 2026-10-04).
    baseHide: ['place_country_other', 'place_country_minor', 'place_country_major', 'water_name'],
    basePaint: [['boundary_state', 'line-color', '#1c1c1c'],
                ['boundary_country_z0-4', 'line-color', '#2a2a2a'],
                ['boundary_country_z5-', 'line-color', '#2a2a2a']],
  },
  light: {
    style: 'https://tiles.openfreemap.org/styles/positron',
    // Solid, as 12% black over the background came out (see the dark theme's note).
    bg: [242, 243, 240], panel: '#fafaf8', run: '#111111', halo: '#d5d6d3', haloOpacity: 1,
    casing: '#ffffff', stFill: '#ffffff', stStroke: '#111111', label: '#2a2f35',
    labelHalo: '#ffffff', gone: '#9a9a96', selGone: '#77776f', stripGone: '#b0b0aa',
    off: '#c4c4c0', dimText: '#8a8a86',
    noLine: '#d2d2ce',             // TRACK_PAINT_LIGHT's grey, for the legend
    track: TRACK_PAINT_LIGHT, ridden: TRACK_COLOUR_RIDDEN_LIGHT,
    muted: TRACK_COLOUR_MUTED_LIGHT, kinds: TRACK_COLOUR_LIGHT,
    selFill: SEL_ST_FILL_LIGHT, selStroke: SEL_ST_STROKE_LIGHT,
    width: TRACK_WIDTH_LIGHT, cased: CASED_LIGHT,
    edge: '#2a2a2a', edgeRidden: '#aaaaaa', edgeMuted: '#c2c2c2',
    /* Positron's own labels, softened. It draws country, city and town names in pure black
       on a white halo, which stood out over the rail network more than Anita liked
       (2026-09-30); a mid grey keeps them readable without competing with the lines. */
    baseLabels: {
      label_country_1: '#a2a7ad', label_country_2: '#a2a7ad', label_country_3: '#a2a7ad',
      label_city_capital: '#a2a7ad', label_city: '#a2a7ad', label_town: '#aaafb4',
      label_village: '#b1b5ba', label_state: '#b8bcc0', label_other: '#b8bcc0',
      water_name_point_label: '#a8b4c8', water_name_line_label: '#a8b4c8',
      'highway-name-minor': '#b4b4b4', 'highway-name-major': '#b4b4b4', airport: '#b4b4b4',
    },
    baseLabelHalo: 'rgba(242,243,240,0.85)',
    /* The dots beside city and town names are black images from Positron's sprite, which
       cannot be recoloured, so they are faded instead. Removing them would move the names,
       which are placed against the dot. */
    baseIcons: ['label_city_capital', 'label_city', 'label_town', 'label_village', 'airport'],
    baseIconOpacity: 0.3,
    /* No country names: the map is of lines and the places on them, and the country is
       plain from the panel's headline. Province and country boundaries paler than Positron
       draws them (Anita, 2026-09-30). The dark theme's entries do the same. */
    baseHide: ['label_country_1', 'label_country_2', 'label_country_3',
               // Nor seas and lakes ("Yellow Sea"; Anita, 2026-10-04). Rivers keep theirs.
               'water_name_point_label', 'water_name_line_label'],
    basePaint: [['boundary_3', 'line-color', '#dcdcd8'],
                ['boundary_2', 'line-color', '#c8c8c4'],
                ['boundary_disputed', 'line-color', '#c8c8c4']],
  },
};
const THEME_KEY = 'noritetsu.theme';
let THEME_NAME = (() => {
  const q = new URLSearchParams(location.search).get('theme');
  if (THEMES[q]) return q;

  })
  .catch(() => { /* no index: the countries with rides still load, below */ });

/* NOT-RUNNING TRACK FOR EVERY COUNTRY, one file (tools/build_regions.py write_closed):
   [[cc, line id, [[lon, lat], ...]], ...]. Drawn at every zoom whether or not the country's
   line data is in. Null where the file is missing: paintClosed then reads the geometry files
   of the countries loaded, as it did before. */
let CLOSED_ALL = null;
const CLOSED_READY = dataFetch('data/closed.json')
  .then(r => (r.ok ? r.json() : null))
  .then(j => { CLOSED_ALL = Array.isArray(j) ? j : null; })
  .catch(() => { });

/* The start: a `?region=` link goes to that country; every country holding rides loads now,
   because its ridden lines are drawn at every zoom and its numbers are in the panel; then
   whatever is on screen. */
function startRegions() {
  if (START && REGIONS[START]) goRegion(START);
  for (const cc of new Set(RIDES.flatMap(rideRegions))) loadRegion(cc);
  /* The headline's country, remembered with the camera, even when it is not in the middle.
     Its total needs no loading where regions.json has it; zoomed in, the camera loads it. */
  if (FOCUS && REGIONS[FOCUS]) { if (!hasTotal(FOCUS)) loadRegion(FOCUS); }
  else if (FOCUS && !START) FOCUS = null;
  considerCamera();
  if (VIEW.kind === 'home') render();
  restoreUi();
}

/* Saved on every camera stop: one small write, and only when something moved. */
function saveCamera() {
  const c = map.getCenter();
  try {
    localStorage.setItem(CAMERA_KEY, JSON.stringify({
      c: [+c.lng.toFixed(5), +c.lat.toFixed(5)], z: +map.getZoom().toFixed(3),
      b: +map.getBearing().toFixed(1), f: FOCUS || null }));
  } catch (e) { /* remembered for this page only */ }
}

/* A country's track, as four layers under everything the app draws on top (click target,
   edge, track, muted track). The same four for every country, told apart only by id and
   source.
   NOT CHECKED TWICE (2026-10-08, "freezy for the first 3 or so seconds"): MapLibre checks every
   addSource, addLayer, setFilter and setPaintProperty against the whole style, which it
   serializes anew for each call, so with ~120 countries' 480 layers the world view spent 8.7 s
   (headless) in one frozen task adding them. The first country's layers are checked as usual;
   every later country's are the same objects under another id and source, and skip it
   (`TRACK_CHECKED`, `addTrackLayer`). Each layer is added with the colours, widths, opacities
   and edge filter the theme, mode and muting call for now (`trackNow`), and those are noted in
   TRACK_SET, so applyTrackColour has nothing to redo for it: setting a colour expression
   again compiles it again. The literals below are the dark theme's, for the lint. */
let TRACK_CHECKED = false;
const NO_CHECK = { validate: false };
function trackNow() {
  return {
    'track|line-color': MODE === 'ridden' ? THEME.ridden : THEME.track,
    'track|line-width': THEME.width,
    'track|line-opacity': MUTED_NOW ? 0 : TRACK_ALPHA,
    'track-mute|line-color': THEME.muted,
    'track-mute|line-width': THEME.width,
    'track-mute|line-opacity': MUTED_NOW ? TRACK_ALPHA : 0,
    'track-edge|line-color': MUTED_NOW ? THEME.edgeMuted
      : MODE === 'ridden' ? THEME.edgeRidden : THEME.edge,
    cased: THEME.cased,
  };
}
function addTrackLayer(layer) {
  const [, kind, cc] = /^(track-hit|track-edge|track-mute|track)-(.+)$/.exec(layer.id);
  if (kind !== 'track-hit') {
    if (!TRACK_SET.has(cc)) TRACK_SET.set(cc, {});
    const now = trackNow(), was = TRACK_SET.get(cc);
    for (const [key, v] of Object.entries(now)) {
      if (key === 'cased') { if (kind === 'track-edge') layer.filter = was.cased = v; continue; }
      const [id, k] = key.split('|');
      if (id === kind) layer.paint[k] = was[key] = v;
    }
  }
  if (!TRACK_CHECKED) return map.addLayer(layer, 'sel-halo');
  map.style.addLayer(layer, 'sel-halo', NO_CHECK);
  map._update(true);          // what Map.addLayer does after Style.addLayer
}
function addRegionTiles(cc) {
  if (TILES.has(cc) || !mapReady) return;
  TILES.add(cc);
  const src = { type: 'vector', url: `pmtiles://${dataUrl(`data/${cc}.pmtiles`)}`, attribution: OSM_ATTR };
  if (TRACK_CHECKED) { map.style.addSource(`rail-${cc}`, src, NO_CHECK); map._update(true); }
  else map.addSource(`rail-${cc}`, src);
  // A wide, near-invisible line under the visible one: the click target. Without it, hitting
  // a 1 px line with a fingertip is luck.
  // Track no line runs over is no target (NO_LINE).
  addTrackLayer({
    id: `track-hit-${cc}`, type: 'line', source: `rail-${cc}`, 'source-layer': 'track',
    filter: TRACK_HIT_FILTER,
    paint: { 'line-color': '#000', 'line-opacity': 0.01, 'line-width': HIT_WIDTH },
  });
  // The edge under a line too close to the background (CASED_*), at the full track width.
  addTrackLayer({
    id: `track-edge-${cc}`, type: 'line', source: `rail-${cc}`, 'source-layer': 'track',
    filter: CASED_DARK,
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#d8d8d8', 'line-width': TRACK_WIDTH,
             'line-opacity': TRACK_OPACITY },
  });
  addTrackLayer({
    id: `track-${cc}`, type: 'line', source: `rail-${cc}`, 'source-layer': 'track',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': TRACK_PAINT_DARK, 'line-width': TRACK_WIDTH_DARK,
             'line-opacity': TRACK_ALPHA },
  });
  // The same track muted, shown instead of the one above while a line is selected (setMuted).
  // Same source and layout, so MapLibre lays the geometry out once for both.
  addTrackLayer({
    id: `track-mute-${cc}`, type: 'line', source: `rail-${cc}`, 'source-layer': 'track',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': TRACK_COLOUR_MUTED, 'line-width': TRACK_WIDTH_DARK,
             'line-opacity': 0 },
  });
  TRACK_CHECKED = true;
}
/* A FEW COUNTRIES A TASK (2026-10-08): the world view puts ~120 countries on screen at once,
   and each country's four layers cost MapLibre ~1 ms apiece to set up, so adding them all
   at once was a half-second freeze of its own. They go in TILE_BUDGET_MS at a time, nearest
   the middle of the view first, with the page free to answer a click in between. */
const TILE_BUDGET_MS = 30;
const TILE_QUEUE = [];
let TILE_DRAIN = null;
function queueRegionTiles(ccs) {
  const c = map.getCenter();
  const off = cc => {
    const [w, s, e, n] = REGIONS[cc].bbox;
    return Math.hypot(Math.max(0, w - c.lng, c.lng - e), Math.max(0, s - c.lat, c.lat - n));
  };
  for (const cc of ccs) if (!TILES.has(cc) && !TILE_QUEUE.includes(cc)) TILE_QUEUE.push(cc);
  TILE_QUEUE.sort((a, b) => off(a) - off(b));
  if (TILE_QUEUE.length && !TILE_DRAIN) TILE_DRAIN = setTimeout(drainRegionTiles, 0);
}
function drainRegionTiles() {
  TILE_DRAIN = null;
  // A theme switch reloads the style; a layer cannot be added until it is in.
  if (!map.style || !map.style._loaded) { TILE_DRAIN = setTimeout(drainRegionTiles, 50); return; }
  const t0 = performance.now();
  do addRegionTiles(TILE_QUEUE.shift());
  while (TILE_QUEUE.length && performance.now() - t0 < TILE_BUDGET_MS);
  if (TILE_QUEUE.length) TILE_DRAIN = setTimeout(drainRegionTiles, 0);
}
const hitLayers = () => [...TILES].map(cc => `track-hit-${cc}`)
  .concat(TILES.size && map.getLayer('closed-hit') ? ['closed-hit'] : []);

/* MapLibre skips a setPaintProperty whose value is unchanged, so muting changes only the
   opacities and the edge's plain colour, none of which re-parses a tile. The colour
   expressions change with the theme and with Browse/Ridden, which re-parse, but rarely.
   What was last set on each country is remembered (`TRACK_SET`, by identity: THEMES' values
   and trackNow's are constants), so a call touches only what changed: comparing a colour
   expression is not free times 120 countries. The first country a call changes is checked by
   MapLibre, the rest, set to the same values, are not. */
let MUTED_NOW = false;
const TRACK_SET = new Map();        // cc -> {property key: the value last set}
function applyTrackColour() {
  const now = trackNow(), checked = new Set();
  for (const cc of TILES) {
    if (!map.getLayer(`track-${cc}`)) continue;
    if (!TRACK_SET.has(cc)) TRACK_SET.set(cc, {});
    const was = TRACK_SET.get(cc);
    for (const [key, v] of Object.entries(now)) {
      if (was[key] === v) continue;
      was[key] = v;
      const opt = checked.has(key) ? NO_CHECK : {};
      checked.add(key);
      if (key === 'cased') map.setFilter(`track-edge-${cc}`, v, opt);
      else {
        const [id, k] = key.split('|');
        map.setPaintProperty(`${id}-${cc}`, k, v, opt);
      }
    }
  }
}

/* Ray casting in degrees, after a bounding-box reject: religiondots' `countryAt`. The
   outlines are simplified to ~2 km, and the question is only which country the camera is
   over. Runs on `moveend`, never per frame. */
function inRegion(r, x, y) {
  for (const p of r.parts) {
    if (x < p.w || x > p.e || y < p.s || y > p.n) continue;
    const ring = p.ring;
    let inside = false;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const [xi, yi] = ring[i], [xj, yj] = ring[j];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
    }
    if (inside) return true;
  }
  return false;
}
function countryAt(lng, lat) {
  const x = ((lng + 180) % 360 + 360) % 360 - 180;
  for (const [cc, r] of Object.entries(REGIONS)) if (inRegion(r, x, lat)) return cc;
  return null;
}

/* Countries on screen, or within `margin` of it (a fraction of the view on each side), so a
   country's data is usually in before its border is. On screen means a point of its outline
   is in the box, or a 5x5 grid over the box lands in it: the second catches a view entirely
   inside one country, where no outline point is in sight. */
function regionsInView(margin) {
  const b = map.getBounds();
  const dx = (b.getEast() - b.getWest()) * margin, dy = (b.getNorth() - b.getSouth()) * margin;
  const w = b.getWest() - dx, e = b.getEast() + dx, s = b.getSouth() - dy, n = b.getNorth() + dy;
  const out = [];
  for (const [cc, r] of Object.entries(REGIONS)) {
    const [rw, rs, re, rn] = r.bbox;
    if (re < w || rw > e || rn < s || rs > n) continue;
    let hit = r.parts.some(p => p.e >= w && p.w <= e && p.n >= s && p.s <= n
      && p.ring.some(([x, y]) => x >= w && x <= e && y >= s && y <= n));
    for (let i = 0; !hit && i < 5; i++) for (let j = 0; !hit && j < 5; j++)
      hit = inRegion(r, w + (e - w) * (i + 0.5) / 5, s + (n - s) * (j + 0.5) / 5);
    if (hit) out.push(cc);
  }
  return out;
}

/* On every camera stop: bring in what is on screen, and let the country under the middle
   of the map take the headline. Over sea or an unbuilt country the headline stays where it
   was, which is the country you were last looking at. */
function considerCamera() {
  if (!mapReady || !Object.keys(REGIONS).length) return;
  const z = map.getZoom();
  queueRegionTiles(regionsInView(0.25));
  if (z >= DATA_MIN_ZOOM) for (const cc of regionsInView(DATA_MARGIN)) loadRegion(cc);
  const c = map.getCenter();
  const at = countryAt(c.lng, c.lat);
  if (at && at !== FOCUS) {
    FOCUS = at;
    // An older regions.json has no totals: then the headline needs the country loaded.
    if (!hasTotal(at)) loadRegion(at);
    if (VIEW.kind === 'home') render();
  }
}

function goRegion(cc) {
  const r = REGIONS[cc];
  if (!r) return;
  const [w, s, e, n] = r.view || r.bbox;
  FOCUS = cc;
  map.fitBounds([[w, s], [e, n]], { padding: 40, duration: 0 });
  // The whole country is a zoomed-out view: its lines load as you zoom in on part of it.
  if (!hasTotal(cc)) loadRegion(cc);
  if (VIEW.kind === 'home') render();
}

/* NO LEGEND (Anita, 2026-10-07: "lets also get rid of the legend entirely actually"). It
   had three rows (own colour else blue, faint grey for rail with no passenger trains, dashed
   for no longer running) and a zoom note; the map draws the same as before without it. */

// ---------------------------------------------------------------- data

/* ONE MODEL FOR EVERY LOADED COUNTRY. Each line and station carries its `region`. */
let LINES = [], STATIONS = {};
const REGISTER_IN = new Set();   // countries whose build has a national register
const ALIASES = {};        // cc -> {old station id: new}, for rides saved before a rebuild
const LINE_ALIASES = {};   // cc -> {OSM line id: the register line it was merged into}
const LINE_PIECES = {};    // cc -> {line id: ids of the pieces split off it} (aliases.json `pieces`)
const LINE_BY_ID = new Map(), SEC_BY_GID = new Map();
const CLOSED = new Set();  // section gids the register lists but no train runs over
const OP_EN = new Map();   // raw operator string -> the English name any of its lines gives
/* WHO RUNS THE TRAINS, per country (data/<cc>/ops.json, tools/operators.py): `keys` maps each
   operator string of that country to the key it counts under (DB Regio NRW -> "DB"; India's
   Southern Railway -> "Indian Railways", so it no longer shares a row with the British one),
   `lines` gives a register line that names its track owner (DB InfraGO, BNSF, Network Rail)
   the companies whose passenger trains run over it, [key, share of its km], biggest first. */
const OPS_CC = {};
// Latin letters, accents included, and the IPA block (Azerbaijani ə is U+0259).
const LATIN = /^[\u0000-ʯḀ-ỿ\s]+$/;
const GEOM = new Map();    // line id -> promise of {"from|to": [[lon,lat],...]}, on demand
let MIGRATION = { moved: 0 };

function loadRegion(cc) {
  if (!cc) return Promise.resolve();
  if (!LOADING.has(cc)) {
    const get = f => dataFetch(`data/${cc}/${f}`).then(r => {
      if (!r.ok) throw new Error(`${f}: ${r.status}`);
      return r.json();
    });
    LOADING.set(cc, Promise.all([
      get('lines.json'), get('stations.json'),
      // A country not yet rebuilt has no foot.json: every section then owns itself whole.
      get('foot.json').catch(() => ({ foot: {} })),
      get('aliases.json').catch(() => ({})),
      REGIONS_READY,               // LINE_FOLD has to be in before any line id is read
      // English names filled after the build (tools/english_names.py); none is fine.
      get('names_en.json').catch(() => ({})),
      get('ops.json').catch(() => null),
      // Sections running alongside each other (along.py); a country built before has none.
      get('along.json').catch(() => null),
      // Line types written after the build (tools/line_types.py); none is fine.
      get('types.json').catch(() => null),
    ]).then(([l, s, f, a, , ne, o, al, ty]) => {
      if (o) OPS_CC[cc] = o;       // before mergeRegion: its buildOps reads it
      mergeRegion(cc, l, s, f, a, ne, ty);
      readAlong(cc, al);
      LOADED.add(cc);
      // A line over a border may have just grown a piece, so every ride's run is redone.
      for (const r of RIDES) delete r._gids;
      MIGRATION.moved += migrateRides(cc);
      REACH_CACHE = { from: null, set: new Set() };
      dataArrived();
      noteLoading();
    }).catch(err => {
      LOADING.delete(cc);          // a later camera stop can try again
      console.warn(`could not load ${cc}:`, err);
      noteLoading();
    }));
    noteLoading();
  }
  return LOADING.get(cc);
}

/* "Loading Germany's lines" under the search box while any country's line data is on its
   way: a click on track or a search can wait seconds on a big one (Russia is 11.7 MB). The
   search index says so too while it comes, on the first keystroke. */
function noteLoading() {
  const el = document.getElementById('loadnote');
  if (!el) return;
  const busy = [...LOADING.keys()].filter(cc => !LOADED.has(cc)).map(regionName).sort();
  const what = [SEARCH_IX_STATE === 'loading' ? 'the search index' : '',
    busy.length > 3 ? `the lines of ${busy.length} countries`
    : busy.length ? `the lines of ${busy.join(', ')}` : ''].filter(Boolean);
  el.textContent = what.length ? `Loading ${what.join(' and ')}…` : '';
  el.style.display = what.length ? 'block' : 'none';
}

/* WHAT A COUNTRY'S ARRIVAL REDRAWS, once for a burst (2026-10-08): the station bubbles (every
   loaded station, sent to MapLibre's worker), the ridden overlay, the selection and the panel
   (whose numbers are every group's union, unionTotals) are each worked out over every loaded
   country, so doing them per country made a startup loading four countries pay for 1 + 2 + 3
   + 4. Countries arriving within ARRIVE_MS of the first share one redraw. The data itself is
   merged at once (mergeRegion), so anything awaiting loadRegion still finds it. */
const ARRIVE_MS = 80;
let ARRIVED = null;
function dataArrived() {
  if (ARRIVED) return;
  ARRIVED = setTimeout(() => {
    ARRIVED = null;
    paintStations();
    paintRidden();
    paintClosed();
    paintSelection();
    render();
    warmIndexes();
  }, ARRIVE_MS);
}
/* The indexes a selected line's junction walks read (nodeSecs, junctionsIn, sectionsNear) and
   the operator list are rebuilt whenever a country arrives; built in idle time, one per task,
   the first click after a load does not pay for them. Each builds only if stale. */
const whenIdle = f => (window.requestIdleCallback ? requestIdleCallback(f, { timeout: 3000 })
  : setTimeout(f, 200));
function warmIndexes() {
  const steps = [() => nodeSecs(''), () => junctionsIn(0, 0, 0, 0), () => sectionsNear(0, 0), opsNow];
  const next = () => { const f = steps.shift(); if (!f) return; f(); whenIdle(next); };
  whenIdle(next);
}

function mergeRegion(cc, l, s, f, a, ne, ty) {
  DATA_GEN++;
  fillEnglish(l.lines, s.stations, ne);
  fillTypes(l.lines, ty);
  ALIASES[cc] = (a && a.stations) || {};
  LINE_ALIASES[cc] = {};
  for (const [k, v] of Object.entries((a && a.lines) || {})) LINE_ALIASES[cc][k] = foldLine(v);
  LINE_PIECES[cc] = (a && a.pieces) || {};
  // Any source but OpenStreetMap is a register: 'n02' in Japan, 'schienennetz' in Switzerland.
  if (l.lines.some(x => x.src !== 'osm')) REGISTER_IN.add(cc);
  // Line ids folded across countries (LINE_FOLD); `file` keeps the id its geometry is under.
  for (const line of l.lines) {
    const to = foldLine(line.id);
    if (to !== line.id) { line.file = line.id; line.id = to; }
  }
  for (const st of Object.values(s.stations))
    if (st.l && st.l.some(id => LINE_FOLD[id])) st.l = [...new Set(st.l.map(foldLine))];
  for (const [id, st] of Object.entries(s.stations)) {
    /* A STATION IN TWO EXTRACTS (a border point, a tram stop over the line in Basel) keeps
       the object loaded first, and the lines calling there become the union of both. */
    const had = STATIONS[id];
    if (had) {
      had.l = [...new Set([...(had.l || []), ...(st.l || [])])];
      had.regions = [...new Set([...(had.regions || [had.region]), cc])];
      continue;
    }
    st.region = cc;
    st._n = norm(st.e);
    st._n2 = norm(st.n);
    st._k = norm(`${st.n} ${st.e}`);
    STATIONS[id] = st;
  }
  const g = x => `${cc}:${x}`;
  /* Footprints, [owner, from, to, a, b] with the fractions in `scale` units, in order of a.
     An entry of four numbers takes a from the last entry's b (0 for the first), one of
     three also runs to the end of the section (b = 1). */
  const scale = (f && f.scale) || 1;
  if (f && f.foot && Object.keys(f.foot).length) FOOT_REGIONS.add(cc);
  for (const [k, v] of Object.entries((f && f.foot) || {})) {
    let prev = 0;
    FOOT.set(g(k), v.map(e => {
      const a = e.length === 5 ? e[3] : prev;
      const b = e.length === 5 ? e[4] : e.length === 4 ? e[3] : scale;
      prev = b;
      return [g(e[0]), e[1] / scale, e[2] / scale, a / scale, b / scale];
    }));
  }
  for (const line of l.lines) {
    line.region = cc;
    for (const sec of line.sections) sec[3] = g(sec[3]);
    /* NOT RUNNING: sections the register lists with no rails on the map (not_running.py in
       the build). Kept, greyed and dashed, so a ride from before the closure can still be
       entered, but left out of the line's length and so out of every percentage: nobody can
       finish the 日田彦山線 by riding it now. `km_closed` is what was taken off. */
    if (line.closed && line.closed.length) {
      const shut = new Set(line.closed);
      let off = 0;
      for (const sec of line.sections)
        if (shut.has(`${sec[0]}|${sec[1]}`)) { CLOSED.add(sec[3]); off += sec[2]; }
      line.km_closed = off;
      line.km = Math.max(0, line.km - off);
    }
    searchKeys(line);
    // The same id from another country, or a second line of this one folded into it.
    const had = LINE_BY_ID.get(line.id);
    if (had) { joinLine(had, line); continue; }
    LINES.push(line);
    LINE_BY_ID.set(line.id, line);
    for (const sec of line.sections) SEC_BY_GID.set(sec[3], { line, sec });
  }
  ownTrack(cc);

  /* JR East came out as TWO operators, "East Japan Railway Company" with 86.5 km and
     東日本旅客鉄道 with 29.3 km, because `operator:en` is on some of its lines and not
     others and the panel fell back per line. So the English name is learned once per raw
     operator string from whichever of its lines carries one, and grouping is always by the
     raw string. It does not fix the other half of the problem -- Tokyo Metro is tagged
     東京地下鉄 on one line and 東京メトロ on another, which are different raw strings and
     stay two rows. That needs an operator alias table, which is a data question, not a
     display one. */
  const votes = new Map();
  for (const line of LINES) {
    const raw = line.operator || '';
    // Single-operator lines only: a joint line is tagged "A;B" with "X;Y" beside it, and
    // pairing those up by position is guesswork. Single ones teach the same names anyway.
    if (!raw || raw.includes(';') || (line.operator_en || '').includes(';')) continue;
    /* A line with no English name votes for the name it has, where that name is already in
       Latin script: one gb line tagged Network Rail with operator:en "Transport for Wales"
       outvoted 446 that gave none, and renamed all of Network Rail (2026-10-07). A name in
       another script still takes the English one however few lines give it (JR East). */
    const en = line.operator_en || (LATIN.test(raw) ? raw : null);
    if (!en) continue;
    if (!votes.has(raw)) votes.set(raw, new Map());
    const m = votes.get(raw);
    m.set(en, (m.get(en) || 0) + 1);
  }
  for (const [raw, m] of votes) {
    let best = null, n = -1;
    for (const [name, c] of m) if (c > n) { best = name; n = c; }
    OP_EN.set(raw, best);
  }
  // OPS is rebuilt when next read (opsNow).
}

/* ENGLISH NAMES FILLED AFTER THE BUILD (names_en.json, tools/english_names.py): OSM name:en
   a station merge dropped, Wikidata English labels, "<station>線" from the station's English,
   pinyin for Chinese and Revised Romanization for Korean. Only where the shipped file has no
   English, keyed by the shipped ids (before LINE_FOLD), and before the search keys are made
   so search finds them. `enFill` marks a filled name: English mode shows it like any other,

/* LINE TYPES (types.json, tools/line_types.py, line_types.md): what kind of railway a line is,
   in words a rider uses. `ltype` is the line's type; a register line (track) also has `lalso`,
   the other kinds of train over it, biggest share first (kept, no longer shown: Anita,
   2026-10-09, "we dont have to say the muted 'intercity trains also run here'"). Keyed by the

   shows no type. */

  regional: 'Regional rail', commuter: 'Commuter rail', metro: 'Metro', light_rail: 'Light rail',

}
// A search hit's type, from the loaded line where its country is in, else from the index.
function hitType(l) {

// Search keys, accent-stripped once here rather than per keystroke over 713 lines.
function searchKeys(line) {
  line._n = norm(line.name_en || line.name);

/* ONE LINE OVER A BORDER IS ONE LINE. Each country is built on its own, and an OSM route
   that crosses a border is built in every country it touches under the same id (the Eurostar
   is m5189989 in Belgium, France and the Netherlands). Kept apart, the last country loaded
   won and a click showed only its piece. So when a second country brings an id already
   loaded, the two become one line: sections concatenate (their ids are already prefixed by
   country), lengths add up, and the stations along it join end to end. Each country's piece
   is kept in `parts`, since a country's own totals count only its own piece, and geometry
   is fetched from every country the line runs through. Register lines have per-country ids

  const i = LINES.indexOf(had);

  LINE_BY_ID.set(m.id, m);
  for (const sec of m.sections) SEC_BY_GID.set(sec[3], { line: m, sec });

/* The joined line, from each country's line object as read. A section two countries both
   carry (the same two stations, as a Basel tram stop over the border is in both extracts)
   is kept once, from the country loaded first, and its length is not counted twice.
   ONE PIECE PER COUNTRY. Two lines of one country can fold into one id (LINE_FOLD: France
   keeps "Eurostar" and "Eurostar: Paris - Amsterdam" apart, Belgium merged them), and then
   they are one piece of that country, with both lines' sections and each one's geometry
   file (`files`, the ids the country built them under). */

      seen.add(k);

    const km = os.reduce((s, x) => s + x.km, 0);
    const closed = os.reduce((s, x) => s + (x.km_closed || 0), 0);
    // One country's piece, as its own totals and its geometry files see it.

             km: Math.max(0, km - drop), km_closed: closed,

             display: os.length > 1 ? chainDisplays(os) : o.display };
  });

     into the Eurostar, Belgium's "Eurostar: Amsterdam ↔ London" had the only English name
     and the whole joined line took it. */
  const named = [...origs.filter(p => !p.file), ...origs.filter(p => p.file)];
  const first = k => (named.find(p => p[k]) || {})[k] || '';

    id: origs[0].id, region: origs[0].region, regions: parts.map(p => p.region), parts,
    name: first('name'), name_en: first('name_en'), ref: first('ref'), colour: first('colour'),
    operator: first('operator'), operator_en: first('operator_en'), network: first('network'),
    kind: first('kind'), src: first('src'), service, dup: origs.some(p => p.dup),
    ltype: first('ltype'), lalso: (named.find(p => p.ltype) || {}).lalso || [],
    variants: Math.max(...origs.map(p => p.variants || 0)),
    straight_sections: origs.reduce((s, p) => s + (p.straight_sections || 0), 0),
    km: sum('km'), sections, display: chainDisplays(parts),
  };

}

/* Each piece's stations in order, joined end to end: start from whichever end gives the
   shortest jumps between pieces, then always on to the nearest end of what is left.
   Pieces meeting at one station (a tram stop in both extracts) list it once. */
function chainDisplays(parts) {
  const ds = parts.map(p => (p.display && p.display.length ? p.display
    : [...new Set(p.sections.flatMap(s => [s[0], s[1]]))])).filter(d => d.length);
  if (ds.length < 2) return ds[0] || [];
  const gap = (a, b) => {
    const A = STATIONS[a], B = STATIONS[b];
    return a === b ? 0 : A && B ? crowKm(A, B) : 1e6;
  };
  let best = null;
  for (let s = 0; s < ds.length; s++) for (const flip of [false, true]) {
    const left = ds.filter((_, i) => i !== s);
    let out = flip ? [...ds[s]].reverse() : [...ds[s]], total = 0;
    while (left.length) {
      const tail = out[out.length - 1];
      let bi = 0, bf = false, bd = Infinity;
      left.forEach((d, i) => {
        const d0 = gap(tail, d[0]), d1 = gap(tail, d[d.length - 1]);
        if (d0 < bd) { bd = d0; bi = i; bf = false; }
        if (d1 < bd) { bd = d1; bi = i; bf = true; }
      });
      const d = left.splice(bi, 1)[0];
      out = out.concat(bf ? [...d].reverse() : d);
      total += bd;
    }
    if (!best || total < best.total) best = { total, out };
  }
  const out = best.out.filter((id, i, a) => i === 0 || id !== a[i - 1]);
  // North first, as the strip diagram draws each piece.
  const y = id => (STATIONS[id] || {}).y || 0;
  return y(out[0]) < y(out[out.length - 1]) ? out.reverse() : out;
}

/* The other countries a line runs into, so that selecting it can load them: from the
   shared index in regions.json, plus the countries a border point at one of its ends names.
   A line ending at a border point under its own id (Thailand's Hat Yai - Padang Besar;
   Malaysia's line on from the point is another id) is in no shared entry, and the walk past
   the junction (throughEnds) needs the far country loaded to find a stop. The point's name is
   the two countries' names ("Malaysia – Thailand border", as regions.json names them):
   outlines simplified to 2 km cannot tell at a border town. Without the index, any country

      if (indexed) continue;

/* The promise is what is cached, so two paints asking for the same line while it is still
   in flight share one fetch rather than racing two. A line over a border is one file per
   country it runs through, merged; joining another country's piece drops the cached one. */

    // nothing drawn on the map until a reload.
    const line = LINE_BY_ID.get(lineId);
    let failed = false;
    const one = (part, file) => dataFetch(`data/${part.region}/geom/${file}.json`)
      .then(r => {
        if (r.status === 404) noteStale();
        if (!r.ok) throw new Error(r.status);

      .then(g => {

            && !part.sections.some(([a, b]) => g[`${a}|${b}`] || g[`${b}|${a}`])) noteStale();
        return g;

      .catch(() => { failed = true; return {}; });

    // of that country fold into one, LINE_FOLD).
    const files = (line ? partsOf(line) : [])
      .flatMap(part => (part.files || [part.file || lineId]).map(file => one(part, file)));
    const p = Promise.all(files).then(gs => {
      if (failed && GEOM.get(lineId) === p) GEOM.delete(lineId);
      const g = Object.assign({}, ...gs);

/* GEOMETRY ON HAND, for the walks through junctions (throughEnds, junctionRoute). Those are
   worked out synchronously inside render, so each asks geoNow, which answers with what has
   arrived and fetches the rest; when a file lands, the open line or journey is drawn again
   and the walk is redone with it. A fetch that failed is kept as {}, so no walk waits on it
   twice. */

      GEO_READY.set(id, g || {});

      const ln = LINE_BY_ID.get(id);

        ln._g = null;
        for (const r of RIDES) if (r.line === id) delete r._gids;
        GAPS_GEN++;

        if (VIEW.kind === 'home') render();
      }
      if (GEO_REDRAW) return;
      /* Not while a line just clicked is on its way to the map: the panel redrawn here is one
         long task on a big network, which would hold up drawing it (2026-10-09). */
      const t0 = performance.now();
      GEO_REDRAW = setTimeout(function redraw() {
        if (SEL_FLIGHT && SEL_FLIGHT.fresh && performance.now() - t0 < 300) {
          GEO_REDRAW = setTimeout(redraw, 15);
          return;
        }

/* THE DATA WAS REBUILT UNDER AN OPEN PAGE. The page holds the old line list and fetches

   before that build would quietly stop counting and its diagram would show raw ids. */
// Run as each country's data arrives, over the rides that need that country.
function migrateRides(cc) {

    if (!r.region) { r.region = cc; moved++; }

   lost while that country is still loading. */

  return RIDES.filter(r => rideRegions(r).every(cc => LOADED.has(cc))
    && (!STATIONS[r.from] || !STATIONS[r.to] || !LINE_BY_ID.has(r.line))).length;

   every country the ride runs through. */

    for (const k of ['from', 'to']) {
      if (!STATIONS[r[k]] && st[r[k]]) { r[k] = st[r[k]]; moved++; }
    }
    if (!LINE_BY_ID.has(r.line) && ln[r.line]) { r.line = ln[r.line]; moved++; }
    /* A line split into pieces (us_register.split_pieces, aliases.json `pieces`) keeps its id
       on the biggest piece; a ride between two stations of another piece moves to that piece,
       or it would silently stop counting. A whole-line ride stays: it now means the biggest. */
    const pc = (LINE_PIECES[cc] || {})[r.line];
    if (pc && !r.whole && LINE_BY_ID.has(r.line)) {
      const on = id => {
        const l = LINE_BY_ID.get(id);
        return l && lineStations(l).has(r.from) && lineStations(l).has(r.to);
      };
      if (!on(r.line)) { const to = pc.find(on); if (to) { r.line = to; moved++; } }
    }

    const done = new Set([s]);
    for (const t of from) {
      for (let x = t; !done.has(x) && prev.has(x);) {
        done.add(x);
        const [u, gid] = prev.get(x);
        on.add(gid);
        x = u;
      }
    }
  }
  const tails = new Set([...lineTails(line).values()].flat());
  const orphan = line.sections.filter(([a, b, km, gid]) => a !== b && !CLOSED.has(gid)
    && !on.has(gid) && !tails.has(gid) && (base.get(a) || []).some(e => e[2] === gid));
  // Chains: runs of orphan sections through nodes with exactly two orphan sections and no
  // other track or stop, so each chain has two ends where it meets the rest.
  const at = new Map();
  for (const s of orphan) for (const n of [s[0], s[1]]) {
    if (!at.has(n)) at.set(n, []);
    at.get(n).push(s);
  }
  const through = n => !isStop(n) && at.get(n).length === 2 && (base.get(n) || []).length === 2;
  const used = new Set(), chains = [];
  for (const s0 of orphan) {
    if (used.has(s0[3])) continue;
    // Walk to one end, then collect to the other.
    let n = s0[0], s = s0;
    for (let k = 0; through(n) && k < 1000; k++) {
      const nx = at.get(n).find(x => x !== s);
      if (nx === s0) break;

    let cur = u, sec = s;
    for (let k = 0; k < 1000; k++) {
      used.add(sec[3]); gids.push(sec[3]);
      cur = sec[0] === cur ? sec[1] : sec[0];
      nodes.push(cur);
      if (!through(cur) || cur === u) break;
      sec = at.get(cur).find(x => !used.has(x[3]));
      if (!sec) break;
    }
    if (cur !== u) chains.push({ u, v: cur, gids, nodes, km: gids.reduce((t, g) => t + secKm(g), 0) });
  }
  line._orph = { thru, base, dg, chains };
  return chains;
}
/* The way from `from` to `to` over one chain (lineOrphans), entering it at whichever end
   suits: the shortest way to that end, the chain, the shortest way on, never passing a node
   twice. `near`: the ways to and from the chain pass no other stop, so these two are the
   stops nearest it. Null where there is no such way. */
function chainPath(line, from, to, ch, near) {
  const g = lineGraph(line), isPick = isStop;
  let best = null;
  for (const [x, y] of [[ch.u, ch.v], [ch.v, ch.u]]) {
    const inner = new Set(ch.nodes.filter(n => n !== x));
    const A = dijkstraPrev(g, from, inner);
    if (!A.dist.has(x)) continue;
    const legA = [], ndA = [x];
    for (let n = x; n !== from;) { const [p, gid] = A.prev.get(n); legA.push(gid); ndA.push(p); n = p; }
    legA.reverse();
    if (ndA.includes(y)) continue;          // back through the chain's far end: not one way
    const avoid = new Set([...ndA, ...ch.nodes].filter(n => n !== y));
    const B = dijkstraPrev(g, y, avoid);

    const legB = [], ndB = [to];
    for (let n = to; n !== y;) { const [p, gid] = B.prev.get(n); legB.push(gid); ndB.push(p); n = p; }
    legB.reverse();
    if (near && [...ndA.slice(1, -1), ...ndB.slice(1, -1)].some(isPick)) continue;
    const gids = [...legA, ...(x === ch.u ? ch.gids : [...ch.gids].reverse()), ...legB];

// The chains a pick of these two stops offers a way over: [{key, ch, p}].
function chainWays(line, from, to) {
