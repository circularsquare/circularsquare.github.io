    if (!run.p && PICK.past) {
      h += `<p class="muted">The trains past the junction are mapped from `
        + `${esc(stName(PICK.past.board))}: pick it, or a stop before it.</p>`;
    } else if (!run.p && PICK.through && (thru.pending || (PICK.through.from && PICK.through.to
               && PICK.through.from.j === PICK.through.to.j))) {
      h += `<p class="muted">${thru.pending ? 'Looking past the junction…'
        : 'Those two are past the same junction: pick a stop of this line, or one past its '
          + 'other end.'}</p>`;
    } else if (!run.p) {
      h += `<p class="muted">No run of sections joins those two on this line.</p>`;
    } else {
      h += `<div class="o" style="margin-bottom:6px">${esc(stName(PICK.from))} → `
        + `${esc(stName(PICK.to))} · ${run.p.km.toFixed(1)} km</div>`;
      // Through a junction: the lines it goes over, each saved as a ride of its own.
      if (PICK.through && run.legs && run.legs.length > 1) {
        h += `<div class="o muted" style="margin:-2px 0 6px">${run.legs.map(l =>
          `${esc(lineName(l.line))} ${l.km.toFixed(1)} km`).join(', then ')}, through `
          + `${esc(run.legs.slice(1).map(l => stName(l.from)).join(' and '))}</div>`;
      }
      /* Offered only where there IS another way: on a loop, or where a line's branches
         close into one. The short way is the default because it is nearly always meant. */
      if (run.alt && !run.drawn && !run.ways.length) {
        h += `<label><input type="checkbox" ${run.around ? 'checked' : ''} `
          + `onchange="setAround(this.checked)" />went the other way round, `
          + `${run.alt.km.toFixed(1)} km rather than ${run.short.km.toFixed(1)}</label>`;
      } else if (run.drawn || run.ways.length) {
        /* The drawn way and the shortest differ (drawnGraph): named by the stops one calls at
           and the other does not, or by the track where both call at the same ones. */
        const stopsOn = p => new Set([...pathStations(p.gids)].filter(isStop));
        const only = (p, q) => { const o = stopsOn(q); return [...stopsOn(p)].filter(s => !o.has(s)); };
        const names = ids => (ids.length > 2
          ? `${ids.slice(0, 2).map(stName).join(', ')} and ${ids.length - 2} more`
          : ids.map(stName).join(' and '));
        const main = run.drawn || run.short;
        const viaD = run.drawn ? only(run.drawn, run.short) : [];
        const viaS = run.drawn ? only(run.short, run.drawn) : [];
        const opt = (key, on, text, km) => `<label style="display:block"><input type="radio" `
          + `name="route" ${on ? 'checked' : ''} onchange="setRoute('${esc(key)}')" />`
          + `${esc(text)}, ${km.toFixed(1)} km</label>`;
        h += opt('drawn', !run.around && !run.direct && !run.via,
                 viaD.length ? `via ${names(viaD)}` : run.drawn ? 'by the track drawn'
                   : 'the short way', main.km)
          + (run.drawn ? opt('direct', run.direct,
                viaS.length ? `via ${names(viaS)}` : viaD.length ? `not via ${names(viaD)}`
                  : 'by the other track', run.short.km) : '')
          + run.ways.map(w => opt(`via:${w.key}`, run.via === w,
                stName(w.ch.u) === stName(w.ch.v) ? `by the other track at ${stName(w.ch.u)}`
                  : `by the other track between ${stName(w.ch.u)} and ${stName(w.ch.v)}`,
                w.p.km)).join('')
          + (run.alt ? opt('around', run.around, 'the other way round', run.alt.km) : '');
      }
      h += `<div class="btnrow"><input type="date" id="ridedate" `
        + `value="${esc(LAST_DATE)}" />`
        + `<button class="act go" onclick="commitRide()">Add ride</button>`
        + `<button class="act" onclick="clearPick()">clear</button></div>`;
    }
    h += `</div>`;
  }
  // Your trips over it are the tracker's; "View all lines" shows none (Anita, 2026-10-09).
  if (MODE === 'ridden') h += tripsOverHtml(line, run && run.p ? run.p.gids : null);
  el.innerHTML = h;

  const cont = CONT;
  STRIP_REDRAW = () => drawStrip(el.querySelector('#strip'), line, lay, {
    ridden: gid => (frac.get(gid) || 0) > 0.999,
    run: gid => pathSet.has(gid),
    reached: id => reached.has(id),
    cont,
  });
  STRIP_REDRAW();

  /* Keep the station you got on at in view. Picking it on the MAP is now a way in, and the
     line it belongs to can be two hundred stops long, so the diagram would otherwise be
     showing some unrelated stretch of it. */
  if (PICK.from) {
    const row = el.querySelector(`.st[data-st="${PICK.from}"]`);
    if (row) row.scrollIntoView({ block: 'nearest' });
  }
}

/* PAST A JUNCTION END (Anita, 2026-10-02: "I want to be able to go past it to Woodside").
   A register line that ends at a junction, not a stop, ends where its trains do not: the
   FRA's Port Washington Branch stops 1 km short of Woodside, where it meets the Main Line.
   The operating patterns know where the trains go on to: "LIRR Port Washington Branch (as
   operated)" has a section Flushing -> Woodside whose footprint (foot.json) covers the
   branch's last stretch into the junction. So for each junction end, every stop beyond it
   that some pattern's section reaches from a stop of this line over that last stretch; a
   ride to it is two legs, this line to the boarding stop and the pattern from there. Cutting
   the register at such junctions was tried in us_register and dropped (it moved sections on
   double track). Returns {junction: [{st, line, board}]}. */
function pastEnds(line) {
  if (line._past && line._past.gen === DATA_GEN) return line._past.map;
  const out = new Map();
  const deg = new Map();
  for (const [a, b] of line.sections) for (const s of [a, b]) deg.set(s, (deg.get(s) || 0) + 1);
  const own = lineStations(line);
  for (const [j, n] of deg) {
    if (n !== 1 || isStop(j)) continue;
    const last = line.sections.find(s => s[0] === j || s[1] === j);
    // Where the junction is on the track under this line's last section: the owner section
    // and the position along it of the footprint entry at the junction's end. A pattern
    // counts only if it runs over that very point: sharing any of a long last section was too
    // loose (the Simplon line's Brig - tunnel portal took the RE1 Brig - Eggerberg).
    const atEnd = last[1] === j ? 1 : 0;
    const endOn = footOf(last[3]).filter(e => (atEnd ? e[4] : e[3]) === atEnd)
      .map(e => [e[0], atEnd ? e[2] : e[1]]);
    if (!endOn.length) continue;
    const covers = gid => footOf(gid).some(e => endOn.some(([t, pos]) => e[0] === t
      && pos >= Math.min(e[1], e[2]) - 0.02 && pos <= Math.max(e[1], e[2]) + 0.02));
    const found = new Map();                    // stop past it -> {st, line, board, km}
    for (const s of own) {
      if (!isStop(s)) continue;
      for (const lid of (STATIONS[s] || {}).l || []) {
        const o = LINE_BY_ID.get(lid);
        if (!o || o === line || o.service) continue;
        for (const p of partsOf(o)) for (const [a, b, km, gid] of p.sections) {
          const w = a === s ? b : b === s ? a : null;
          if (!w || own.has(w) || !isStop(w)) continue;
          if (!covers(gid)) continue;
          const back = pathBetween(line, s, j);
          const d = (back ? back.km : 1e9) + km;
          const was = found.get(w);
          if (!was || d < was.km) found.set(w, { st: w, line: o, board: s, km: d, gid });
        }
      }
    }
    // Not past a hub the line ends just beyond (hubStop): ridden from the hub instead.
    const hub = hubStop(line, j);
    const keep = [...found.values()].filter(f => !hub || !oneLineFrom(hub, f.st));
    if (keep.length) out.set(j, keep.sort((x, y) => x.km - y.km).slice(0, 2));
  }
  line._past = { gen: DATA_GEN, map: out };
  return out;
}

/* Picking a stop past a junction: as the end of a ride from a picked stop of this line, or
   as its start, with a stop of this line picked next. */
function pickPast(st, lineId, board, j) {
  if (PICK.from && !PICK.to && PICK.from !== st && !PICK.past && !PICK.through) {
    PICK.to = st;
    PICK.past = { line: lineId, board, j };
  } else {
    PICK = { from: st, to: null, around: false, past: { line: lineId, board, j } };
  }
  render();
  paintSelection();
}

/* ---------------------------------------------------------------- through junctions

   THROUGH A JUNCTION (Anita, 2026-10-04: "if after the junction it splits into 2 other lines
   and goes on to 2 other stations maybe we can show those two other stations ... as is, if
   theres no named route that crosses the junction, theres just no way to make this trip").
   Of 8,744 register lines, 3,606 end at a junction and 630 have no stop at all (a base
   tunnel, a cut-off, a curve). pastEnds only knows the stops a mapped service runs on to;
   this walks the register network itself. From a junction end, along every other register
   line meeting there, to the first stop: through further junctions on the way, never
   reversing (a train cannot turn back at a junction, so a turn sharper than THROUGH_TURN
   between the track in and the track out is no way on), within THROUGH_MAX_KM.

   A junction is usually a node of only the line that ends there; the line it meets passes
   through mid-section (passThrough finds it by drawn track, within JUNCTION_SNAP_KM: the
   junction's point lies on the other line's track to 20 m in 9 cases of 10 in Switzerland).
   A ride from there is that part of the section (cutGraph), so the credited km are the
   track's.

   A ride through a junction is saved as rides back to back, each line its own ride, joined
   at the junction: the only place a ride may end at a junction is where the next ride of
   the same trip carries on from it. trips() joins them like any trip's legs, and they are
   deleted together (throughChain). */
const JUNCTION_SNAP_KM = 0.08;
const THROUGH_MAX_KM = 80;
const THROUGH_MAX_STEPS = 6;      // sections walked past the junction, at most
const THROUGH_FAR_KM = 400, THROUGH_FAR_STEPS = 14;   // ... where that reaches no stop at all
const THROUGH_TURN = 100;         // degrees
const THROUGH_MAX_ROWS = 6;       // stops listed past one junction
const THROUGH_MAX_PATHS = 4000;   // branches tried per junction, so a walk without geometry stays quick
const HEADING_KM = 0.3;           // the stretch of track a direction is measured along
const JR_MAX_STATES = 4000;       // junctionRoute's search, at most
const JR_MAX_CHANGES = 4;         // changes of line at junctions in one leg of a journey

// Lines a walk may take: register lines that are not named trains.
const walkable = l => !!l && !l.service && isRegisterLine(l);
const kindOf = l => (l.kind === 'train' ? 'rail' : l.kind || 'rail');

// Running sections of walkable lines by their two ends, rebuilt as countries load.
let NODE_SECS = { gen: -1, by: new Map() };
function nodeSecs(u) {
  if (NODE_SECS.gen !== DATA_GEN) {
    const by = new Map();
    for (const line of LINES) {
      if (!walkable(line)) continue;
      for (const sec of line.sections) {
        if (sec[0] === sec[1] || CLOSED.has(sec[3])) continue;
        for (const s of [sec[0], sec[1]]) {
          if (!by.has(s)) by.set(s, []);
          by.get(s).push({ line, sec });
        }
      }
    }
    NODE_SECS = { gen: DATA_GEN, by };
  }
  return NODE_SECS.by.get(u) || [];
}

/* A polyline in km on a local flat projection, the one sliceLine and the build's fractions
   use, with the distance along it to each point. Cached per array. */
const POLY = new WeakMap(), REVERSED = new WeakMap();
function polyOf(pts) {
  let p = POLY.get(pts);
  if (p) return p;
  const kx = Math.cos(pts[0][1] * Math.PI / 180) * 111.32, ky = 110.57;
  const xy = pts.map(([x, y]) => [x * kx, y * ky]);
  const cum = [0];
  for (let i = 1; i < xy.length; i++)
    cum.push(cum[i - 1] + Math.hypot(xy[i][0] - xy[i - 1][0], xy[i][1] - xy[i - 1][1]));
  p = { xy, cum, total: cum[cum.length - 1], kx, ky };
  POLY.set(pts, p);
  return p;
}
function polyPoint(p, d) {
  let i = 1;
  while (i < p.xy.length - 1 && p.cum[i] < d) i++;
  const seg = p.cum[i] - p.cum[i - 1];
  const t = seg ? Math.max(0, Math.min(1, (d - p.cum[i - 1]) / seg)) : 0;
  const A = p.xy[i - 1], B = p.xy[i];
  return [A[0] + t * (B[0] - A[0]), A[1] + t * (B[1] - A[1])];
}
/* The way the track runs leaving fraction t of a polyline, towards its end (dir 1) or its
   start (-1), in radians; null where there is no track to measure. */
function headingAlong(pts, t, dir) {
  if (!pts) return null;
  const p = polyOf(pts);
  if (!(p.total > 0)) return null;
  const d0 = t * p.total;
  const d1 = Math.max(0, Math.min(p.total, d0 + dir * Math.min(HEADING_KM, p.total / 2)));
  if (Math.abs(d1 - d0) < 1e-6) return null;
  const A = polyPoint(p, d0), B = polyPoint(p, d1);
  return Math.atan2(B[1] - A[1], B[0] - A[0]);
}
const flip = h => (h == null ? null : h + Math.PI);
// The point of a polyline nearest (lon, lat): how far, in km, and the fraction along it.
function nearOnPoly(pts, lon, lat) {
  const p = polyOf(pts);
  const P = [lon * p.kx, lat * p.ky];
  let best = Infinity, at = 0;
  for (let i = 1; i < p.xy.length; i++) {
    const A = p.xy[i - 1], B = p.xy[i], dx = B[0] - A[0], dy = B[1] - A[1];
    const L2 = dx * dx + dy * dy;
    const u = L2 ? Math.max(0, Math.min(1, ((P[0] - A[0]) * dx + (P[1] - A[1]) * dy) / L2)) : 0;
    const d = Math.hypot(P[0] - A[0] - u * dx, P[1] - A[1] - u * dy);
    if (d < best) { best = d; at = p.cum[i - 1] + u * (p.cum[i] - p.cum[i - 1]); }
  }
  return { d: best, t: p.total ? at / p.total : 0 };
}
function turnOk(hIn, hOut) {
  if (hIn == null || hOut == null) return true;
  let d = Math.abs(hOut - hIn) % (2 * Math.PI);
  if (d > Math.PI) d = 2 * Math.PI - d;
  return d <= THROUGH_TURN * Math.PI / 180;
}

/* A section's drawn track from its first station to its second: null while its line's
   geometry is still on the way (geoNow fetches it), false where there is none. */
// Whether a section's points start at its second station (b) rather than its first.
function startsAtSecond(pts, A, B) {
  if (!pts || pts.length < 2 || !A || !B) return false;
  const d2 = (p, S) => (p[0] - S.x) ** 2 + (p[1] - S.y) ** 2;
  return d2(pts[0], B) + d2(pts[pts.length - 1], A) < d2(pts[0], A) + d2(pts[pts.length - 1], B);
}
function secPts(line, sec) {
  const g = geoNow(line.id);
  if (!g) return null;
  const f = g[`${sec[0]}|${sec[1]}`];
  if (f && f.length > 1) return f;
  const b = g[`${sec[1]}|${sec[0]}`];
  if (!b || b.length < 2) return false;
  if (!REVERSED.has(b)) REVERSED.set(b, b.slice().reverse());
  return REVERSED.get(b);
}

/* The walkable sections whose drawn track passes through junction u without u being one of
   their ends: [{line, sec, t}], t the fraction along the section from its first station.
   Candidates by chord first (a section's track rarely bows from the line between its ends
   by more than a quarter of its length), then measured on the track. Lines whose geometry
   is not in yet go in `missing`; such an answer is worked out again when more arrives. */
/* SECTIONS NEAR A POINT, for passThrough and nearRows (2026-10-08): both used to test every
   section of every loaded line, once per junction a walk reached, which was most of a long
   line's 200-300 ms selection (the WCML). Each running section (not closed, not a loop) goes
   in every SEC_CELL-degree cell its chord's box touches, grown by NEAR_MARGIN (0.25 of its
   length + 0.3 km, the margin both tests use) at the widest longitude scale the box reaches;
   a query returns the candidates in the cell of the point in the order the old scan met them
   (by line, then section), and each caller still applies its own exact test. */
const SEC_CELL = 0.25;
const NEAR_MARGIN = km => 0.25 * km + 0.3;
const SEC_WIDE_CELLS = 2000;     // a box over more cells than this is checked at every query
let SEC_GRID = { gen: -1, cells: new Map(), wide: [] };
function sectionsNear(x, y) {
  if (SEC_GRID.gen !== DATA_GEN) {
    const cells = new Map(), wide = [];
    let order = 0;
    for (const line of LINES) for (const sec of line.sections) {
      order++;
      if (sec[0] === sec[1] || CLOSED.has(sec[3])) continue;
      const A = STATIONS[sec[0]], B = STATIONS[sec[1]];
      if (!A || !B) continue;
      const my = NEAR_MARGIN(sec[2]) / 110.57;
      const lat = Math.min(89, Math.max(Math.abs(A.y), Math.abs(B.y)) + my);
      const mx = NEAR_MARGIN(sec[2]) / (Math.cos(lat * Math.PI / 180) * 111.32);
      const i0 = Math.floor((Math.min(A.x, B.x) - mx) / SEC_CELL), i1 = Math.floor((Math.max(A.x, B.x) + mx) / SEC_CELL);
      const k0 = Math.floor((Math.min(A.y, B.y) - my) / SEC_CELL), k1 = Math.floor((Math.max(A.y, B.y) + my) / SEC_CELL);
      const entry = { line, sec, order };
      if ((i1 - i0 + 1) * (k1 - k0 + 1) > SEC_WIDE_CELLS) { wide.push(entry); continue; }
      for (let i = i0; i <= i1; i++) for (let k = k0; k <= k1; k++) {
        const key = i * 4096 + k;
        let c = cells.get(key);
        if (!c) cells.set(key, c = []);
        c.push(entry);
      }
    }
    SEC_GRID = { gen: DATA_GEN, cells, wide };
  }
  const inCell = SEC_GRID.cells.get(Math.floor(x / SEC_CELL) * 4096 + Math.floor(y / SEC_CELL)) || [];
  return SEC_GRID.wide.length ? [...inCell, ...SEC_GRID.wide].sort((p, q) => p.order - q.order) : inCell;
}

let PASS = { gen: -1, by: new Map() };
function passThrough(u, missing, kind) {
  if (PASS.gen !== DATA_GEN) PASS = { gen: DATA_GEN, by: new Map() };
  const key = `${u}|${kind || ''}`;
  const c = PASS.by.get(key);
  if (c && (!c.need.size || c.geo === GEO_GEN)) {
    c.need.forEach(id => missing.add(id));
    return c.out;
  }
  const U = STATIONS[u];
  if (!U) return [];
  const kx = Math.cos(U.y * Math.PI / 180) * 111.32, ky = 110.57;
  const out = [], need = new Set();
  for (const { line, sec } of sectionsNear(U.x, U.y)) {
    if (!walkable(line) || (kind && kindOf(line) !== kind)) continue;
    if (sec[0] === u || sec[1] === u || sec[0] === sec[1] || CLOSED.has(sec[3])) continue;
    const A = STATIONS[sec[0]], B = STATIONS[sec[1]];
    if (!A || !B) continue;
    const m = NEAR_MARGIN(sec[2]);
    if (U.x < Math.min(A.x, B.x) - m / kx || U.x > Math.max(A.x, B.x) + m / kx
        || U.y < Math.min(A.y, B.y) - m / ky || U.y > Math.max(A.y, B.y) + m / ky) continue;
    const pts = secPts(line, sec);
    if (pts === null) { need.add(line.id); continue; }
    if (!pts) continue;
    const r = nearOnPoly(pts, U.x, U.y);
    if (r.d <= JUNCTION_SNAP_KM) out.push({ line, sec, t: r.t });
  }
  need.forEach(id => missing.add(id));
  PASS.by.set(key, { out, need, geo: GEO_GEN });
  return out;
}

/* Junction nodes by 0.1° cell, for finding the junctions a section's track passes. */
let JGRID = { gen: -1, cells: new Map() };
function junctionsIn(w, s, e, n) {
  if (JGRID.gen !== DATA_GEN) {
    const cells = new Map();
    for (const [id, st] of Object.entries(STATIONS)) {
      if (!st.j || !nodeSecs(id).length) continue;
      const key = `${Math.floor(st.x * 10)},${Math.floor(st.y * 10)}`;
      if (!cells.has(key)) cells.set(key, []);
      cells.get(key).push(id);
    }
    JGRID = { gen: DATA_GEN, cells };
  }
  const out = [];
  for (let i = Math.floor(w * 10); i <= Math.floor(e * 10); i++)
    for (let k = Math.floor(s * 10); k <= Math.floor(n * 10); k++)
      for (const id of JGRID.cells.get(`${i},${k}`) || []) out.push(id);
  return out;
}
/* The junctions a section's track passes between its two ends, [{k, t}] in order: where
   another line ends on it mid-section (Wengi-Ey on Spiez - Frutigen, where the Lötschberg
   base tunnel leaves). A walk along the section can change there. */
let SECJ = { gen: -1, by: new Map() };
function secJunctions(sec, pts) {
  if (SECJ.gen !== DATA_GEN) SECJ = { gen: DATA_GEN, by: new Map() };
  if (SECJ.by.has(sec[3])) return SECJ.by.get(sec[3]);
  let w = 180, e = -180, s = 90, n = -90;
  for (const [x, y] of pts) { w = Math.min(w, x); e = Math.max(e, x); s = Math.min(s, y); n = Math.max(n, y); }
  const out = [];
  for (const k of junctionsIn(w - 0.002, s - 0.002, e + 0.002, n + 0.002)) {
    if (k === sec[0] || k === sec[1]) continue;
    const K = STATIONS[k];
    const r = nearOnPoly(pts, K.x, K.y);
    if (r.d <= JUNCTION_SNAP_KM && r.t > 0.001 && r.t < 0.999) out.push({ k, t: r.t });
  }
  out.sort((x, y) => x.t - y.t);
  SECJ.by.set(sec[3], out);
  return out;
}

/* Every way out of node u: along each walkable section ending there, and at a junction both
   ways along each section passing through it; each as far as the section's far end, and as
   far as each junction it passes on the way. Each is {line, sec, to, km, gid (the part of the
   section taken, partGid), cut (where the junctions at either end lie on it, for the ride),
   hOut (the way the track leaves u), hArr (the way a train is heading on arriving at `to`)}. */
function departures(u, missing, kind) {
  const out = [];
  const pos = (sec, t) => [sec[0], sec[1], +t.toFixed(5)];
  const add = (line, sec, t, dir, cut, pts, k, tk) => {
    // Only onto track of the same kind: a tram in the street beside a station throat is not
    // a way on from a railway junction.
    if (kind && kindOf(line) !== kind) return;
    const end = k ? tk : dir > 0 ? 1 : 0;
    const lo = Math.min(t, end), hi = Math.max(t, end);
    // Fractions run along the points, which start at b on a third of all sections.
    const fromB = startsAtSecond(pts, STATIONS[sec[0]], STATIONS[sec[1]]);
    out.push({ line, sec, to: k || ((dir > 0) !== fromB ? sec[1] : sec[0]), km: sec[2] * (hi - lo),
               gid: partGid(sec[3], lo, hi), pts: pts || null, t, dir,
               cut: k ? { ...(cut || {}), [k]: pos(sec, tk) } : cut,
               hOut: pts ? headingAlong(pts, t, dir) : null,
               hArr: pts ? flip(headingAlong(pts, end, -dir)) : null });
  };
  // Along a section from fraction t, to its end and to each junction on the way.
  const along = (line, sec, t, dir, cut) => {
    if (kind && kindOf(line) !== kind) return;
    const pts = secPts(line, sec);
    if (pts === null) missing.add(line.id);
    add(line, sec, t, dir, cut, pts);
    if (!pts) return;
    for (const { k, t: tk } of secJunctions(sec, pts))
      if (k !== u && (dir > 0 ? tk > t + 1e-4 : tk < t - 1e-4)) add(line, sec, t, dir, cut, pts, k, tk);
  };
  for (const { line, sec } of nodeSecs(u)) {
    const pts = secPts(line, sec);
    // u's end of the points: 0 where they start at u.
    const atStart = (sec[0] === u) !== startsAtSecond(pts, STATIONS[sec[0]], STATIONS[sec[1]]);
    along(line, sec, atStart ? 0 : 1, atStart ? 1 : -1, null);
  }
  if (!isStop(u)) {
    for (const { line, sec, t } of passThrough(u, missing, kind)) {
      const cut = { [u]: pos(sec, t) };
      along(line, sec, t, 1, cut);
      along(line, sec, t, -1, cut);
    }
  }
  return out;
}

/* TWO LINES ON ONE TRACK. Where the line a walk is on carries on through a junction, another
   line leaving the same way is often the same rails (Russia's tariff sections overlap at
   their ends, and a walk from Chernyakhovsk zigzagged between two of them for 50 km). Such a
   step is left out: the walk stays on its line. Same rails means the same drawn track, half a
   kilometre and a kilometre on (or as far as both go), within SAME_RAILS_KM: a line of its
   own beside it is further off (the Lötschberg base line runs 20-50 m from the old line from
   Wengi-Ey to Frutigen, and 60 m took it for the same rails). */
const SAME_RAILS_KM = 0.012;
function depPoint(d, km) {
  const p = polyOf(d.pts);
  const at = Math.max(0, Math.min(p.total, d.t * p.total + d.dir * km));
  const [x, y] = polyPoint(p, at);
  return [x / p.kx, y / p.ky];
}
function sameRails(d, e) {
  if (!d.pts || !e.pts) return false;
  const left = x => (x.dir > 0 ? 1 - x.t : x.t) * polyOf(x.pts).total;
  const room = Math.min(1, left(d), left(e));
  if (!(room > 0.05)) return false;
  return [room / 2, room].every(km => {
    const [x1, y1] = depPoint(d, km), [x2, y2] = depPoint(e, km);
    const kx = Math.cos(y1 * Math.PI / 180) * 111.32;
    return Math.hypot((x1 - x2) * kx, (y1 - y2) * 110.57) <= SAME_RAILS_KM;
  });
}
// The ways out of u for a walk that reached it on `line` heading h: with steps onto the
// same rails as the line's own way on left out (sameRails).
function waysOn(u, line, h, missing, kind) {
  const deps = departures(u, missing, kind);
  if (!line) return deps;
  const own = deps.filter(d => d.line === line && turnOk(h, d.hOut));
  if (!own.length) return deps;
  return deps.filter(d => d.line === line || !own.some(o => sameRails(o, d)));
}

/* A walk's legs, one per line: a step on along the same line from where its last leg ended
   lengthens that leg; anything else starts a new one. */
function extendLegs(legs, d, u) {
  const last = legs[legs.length - 1];
  if (last && last.line === d.line && last.to === u) {
    const cuts = last.cuts || d.cut ? { ...(last.cuts || {}), ...(d.cut || {}) } : null;
    return [...legs.slice(0, -1), { ...last, to: d.to, cuts, gids: [...last.gids, d.gid],
                                    km: last.km + d.km }];
  }
  return [...legs, { line: d.line, from: u, to: d.to, cuts: d.cut, gids: [d.gid], km: d.km }];
}

/* Between ways of the same length, the one in fewer rides: 50 m a leg. */
const walkCost = (km, legs) => km + 0.05 * legs.length;

/* From junction j, arriving heading hIn, the first stop along each way on: [{st, km, legs}],
   the nearest way to each stop. `skip` holds lines not to walk (the line ending there). */
function walkFrom(j, hIn, skip, missing, kind, lim = {}) {
  const maxKm = lim.km || THROUGH_MAX_KM, maxSteps = lim.steps || THROUGH_MAX_STEPS;
  const found = new Map();
  const open = [{ u: j, km: 0, cost: 0, h: hIn, legs: [], steps: 0, seen: new Set([j]) }];
  const best = new Map();
  // Nearest first, so each stop is reached first by its shortest way, and the walk stops there.
  for (let n = 0; open.length && n < THROUGH_MAX_PATHS; n++) {
    let bi = 0;
    for (let i = 1; i < open.length; i++) if (open[i].cost < open[bi].cost) bi = i;
    const s = open.splice(bi, 1)[0];
    if (s.u !== j && isStop(s.u)) {
      if (!found.has(s.u)) found.set(s.u, { st: s.u, km: s.km, legs: s.legs });
      continue;
    }
    const on = s.legs.length ? s.legs[s.legs.length - 1].line : null;
    for (const d of waysOn(s.u, on, s.h, missing, kind)) {
      if (skip.has(d.line.id) || s.seen.has(d.to) || !turnOk(s.h, d.hOut)) continue;
      const km = s.km + d.km;
      if (km > maxKm) continue;
      /* A hop of no length is to a second junction at the same point (Russia files one per
         line meeting there): not a step, and the train is still heading the way it was. */
      const hop = d.km < 0.005;
      const steps = s.steps + (hop ? 0 : 1);
      if (steps > maxSteps) continue;
      const legs = extendLegs(s.legs, d, s.u), cost = walkCost(km, legs);
      const k = `${d.to}|${d.gid}`;
      if (best.has(k) && best.get(k) <= cost) continue;
      best.set(k, cost);
      open.push({ u: d.to, km, cost, h: hop ? s.h : d.hArr, legs, steps,
                  seen: new Set([...s.seen, d.to]) });
    }
  }
  return [...found.values()];
}

/* ONLY THE WAYS ON THAT TRAINS TAKE (Anita, 2026-10-04: at Hanau, 4113 Eberbach - Hanau's
   end offered stops on four lines, "a bit aggressive ... only show the ones that are
   actually usually run"). The walk follows any track; a way on is kept only where a mapped
   service (an OSM route, named trains included) runs both over this line's last stretch into
   the junction and onto the first leg of the way out. Where no service crosses the junction
   end at all, there is nothing to tell them apart by, and every way on is offered as before:
   that is the case the walk was added for. Measured on 250 lines each: de 283 -> 230 rows,
   ch 386 -> 323; at Hanau, Offenbach (3600) and Steinheim (3670/3680) go, Hanau West
   (3660, where RE85 runs) stays beside RE85's own Frankfurt East. */
const nonRegisterLineOf = g => {
  const e = SEC_BY_GID.get(g);
  return e && !isRegisterLine(e.line) ? e.line.id : null;
};
// The owner-track stretches [own, lo, hi] under fractions f0..f1 of section gid.
function ownerRanges(gid, f0, f1) {
  const out = [];
  const lo0 = Math.min(f0, f1), hi0 = Math.max(f0, f1);
  for (const [own, from, to, a, b] of footOf(gid)) {
    const lo = Math.max(Math.min(a, b), lo0), hi = Math.min(Math.max(a, b), hi0);
    if (hi < lo) continue;
    const at = x => from + (b !== a ? (x - a) / (b - a) : 0) * (to - from);
    out.push([own, Math.min(at(lo), at(hi)), Math.max(at(lo), at(hi))]);
  }
  return out;
}
// Lines of mapped services whose footprint overlaps any of those stretches (50 m slack).
function servicesOver(ranges) {
  const out = new Set();
  for (const [own, lo, hi] of ranges) {
    const tol = 0.05 / Math.max(secKm(own), 0.001);
    for (const g of FOOT_INTO.get(own) || []) {
      const lid = nonRegisterLineOf(g);
      if (lid && footOf(g).some(e => e[0] === own && Math.max(e[1], e[2]) >= lo - tol
                                && Math.min(e[1], e[2]) <= hi + tol)) out.add(lid);
    }
  }
  return out;
}
// The services over this line's end at junction j: its last section's very end there.
function servicesAtEnd(last, j) {
  const atEnd = last[1] === j ? 1 : 0;
  const ranges = footOf(last[3]).filter(e => (atEnd ? e[4] : e[3]) === atEnd)
    .map(e => { const p = atEnd ? e[2] : e[1]; return [e[0], p, p]; });
  return servicesOver(ranges);
}
// A way on is run if a service at the end also runs over its first leg of any length.
function wayRun(row, atEnd) {
  const leg = row.legs.find(l => l.km >= 0.05) || row.legs[0];
  const [base, lo, hi] = spanOf(leg.gids[0]);
  for (const lid of servicesOver(ownerRanges(base, lo, hi))) if (atEnd.has(lid)) return true;
  return false;
}

/* A LINE THAT ENDS JUST PAST A HUB (Anita, 2026-10-05: 3700 Gießen - Fulda starts at
   "Gießen, W 46", a junction 0.x km past Gießen, and offered Großen Linden and Dutenhofen past
   it; "ideally here we actually just stop the line at giessen"). Where the junction is within
   HUB_THROAT_KM of the line's last stop, a stop past it that one line takes from that last
   stop is not offered: the ride is entered on that line from the hub. Further out (the Port
   Washington Branch's end before Woodside) the stub is a real stretch, and stays. */
const HUB_THROAT_KM = 1.5;
const HUB_TWIN_KM = 0.1;          // a junction this near its hub is the hub's end of track (throughEnds)
function hubStop(line, j) {
  /* One search out from j to every stop within HUB_THROAT_KM (and a hair: it adds the same
     kms in the other order) rules the rest out; the stops left are measured exactly as before,
     in the same order, so the answer and its ties are unchanged. It was one search per stop of
     the line, per junction end (2026-10-08). */
  const g = lineGraph(line);
  if (!g.has(j)) return null;
  const near = new Map([[j, 0]]), done = new Set();
  for (;;) {
    let u = null, d = Infinity;
    for (const [k, x] of near) if (!done.has(k) && x < d) { d = x; u = k; }
    if (u === null || d > HUB_THROAT_KM + 1e-6) break;
    done.add(u);
    for (const [v, km] of g.get(u) || [])
      if (d + km < (near.has(v) ? near.get(v) : Infinity)) near.set(v, d + km);
  }
  let best = null;
  for (const s of lineStations(line)) {
    if (!isStop(s) || !done.has(s)) continue;
    const p = pathBetween(line, s, j);
    if (p && (!best || p.km < best.km)) best = { st: s, km: p.km };
  }
  return best && best.km <= HUB_THROAT_KM ? best.st : null;
}
const oneLineFrom = (s, t) => ((STATIONS[s] || {}).l || []).some(lid => {
  const o = LINE_BY_ID.get(lid);
  return o && lineStations(o).has(t);
});
/* A STOP PASSED ON THE WAY: a way on whose track runs by a nearer stop listed past the same
   junction is left out (Anita, 2026-10-05, the Midland Main Line's north end: Swinton, and
   two stops beyond it on lines that pass Swinton). Within PASS_BY_KM of the track. */
const PASS_BY_KM = 0.2;
function passesBy(row, st) {
  const S = STATIONS[st];
  if (!S) return false;
  for (const leg of row.legs) for (const g of leg.gids) {
    const [base, lo, hi] = spanOf(g);
    const e = SEC_BY_GID.get(base);
    const pts = e && secPts(e.line, e.sec);
    if (!pts) continue;
    const r = nearOnPoly(pts, S.x, S.y);
    if (r.d <= PASS_BY_KM && r.t >= lo - 0.01 && r.t <= hi + 0.01) return true;
  }
  return false;
}

/* THE STOPS PAST ONE JUNCTION END, AS SHOWN: the services' (pastEnds) and the walk's
   (throughEnds) together, less any whose track runs past another listed stop (passesBy: at
   the Midland Main Line's north end the services' Doncaster and Wakefield Westgate lie
   beyond Swinton; Anita, 2026-10-05). [{kind: 'past', st, km, line, board, gid} or {kind:
   'thru', st, km, line (its first leg's), legs, key, r}]. The ONE source for the diagram's
   rows (renderLine's contGroups) and the map's rings and track (paintSelection), so the two
   cannot disagree (they did, 2026-10-05). A service row's track is its section from the
   boarding stop, on this line up to the junction, so only stops past it can be passed. */
function contRows(line, j) {
  const past = pastEnds(line).get(j) || [];
  const thru = throughEnds(line);
  const walk = thru.pending ? [] : thru.map.get(j) || [];
  const stops = [...past, ...walk].map(r => r.st);
  const passedOn = (path, own) => stops.some(s => s !== own && passesBy(path, s));
  const out = [];
  const walked = new Set(walk.map(r => r.st));
  for (const p of past)
    if (!walked.has(p.st) && !(p.gid && passedOn({ legs: [{ gids: [p.gid] }] }, p.st)))
      out.push({ kind: 'past', ...p });
  for (const r of walk)
    if (!passedOn(r, r.st))
      out.push({ kind: 'thru', st: r.st, km: r.km, line: r.legs[0].line, legs: r.legs, key: r.key, r });
  return out;
}
// Every junction end of the line with stops past it, and those stops (contRows).
function contEnds(line) {
  const js = new Set([...pastEnds(line).keys(), ...throughEnds(line).map.keys()]);
  return new Map([...js].map(j => [j, contRows(line, j)]).filter(([, rows]) => rows.length));
}

/* JUNCTION ENDS A RIDE MAY END AT, where nothing else reaches their track. A junction is no
   stop (Anita, 2026-10-05: junctions are passed through), and a junction end with stops
   listed past it (contRows) is ridden through to one of them. But where the walk past it
   finds no stop (a US freight subdivision runs 154 km on from Hastings to the junction with
   the next one; a register line with no stop at all), and the track to it is not a stub that
   comes with its stop (lineTails), no pick of two stops could ride it, and the line could
   never be finished. Such ends were picked like stops for a day; Anita turned that down
   (2026-10-07: junctions are passed through, never got off at), and track leading to no
   station is now left out in the build (prune_dead_track). This is kept to find what is
   left (tools/line_100_probe.js). Empty while the walk past the ends waits on geometry. */
function pickableEnds(line) {
  const thru = throughEnds(line);
  if (line._pe && line._pe.thru === thru) return line._pe.set;
  const set = new Set();
  if (!thru.pending) {
    const deg = new Map(), last = new Map();
    for (const s of line.sections) {
      if (CLOSED.has(s[3]) || s[0] === s[1]) continue;
      for (const n of [s[0], s[1]]) { deg.set(n, (deg.get(n) || 0) + 1); last.set(n, s[3]); }
    }
    const tails = new Set([...lineTails(line).values()].flat());
    /* A stop past the end reached through the junction rides this line to it (pickedRun's
       `through`). One a mapped service runs on to (pastEnds) is ridden on that service from
       its boarding stop, which credits this line's track beyond the stop only as far as the
       service's own track lies on it: often a few hundred metres short (Dortmund Hbf -
       Bochum Stockumer Straße, 48%). So such an end stays pickable unless that service
       covers the whole way. */
    const covers = (c, j) => {
      if (c.kind !== 'past' || !c.gid) return c.kind === 'thru';
      const q = pathBetween(line, c.board, j);
      if (!q) return false;
      const raw = new Map();
      creditRun([c.gid], (t, lo, hi) => {
        if (hi <= lo) return;
        if (!raw.has(t)) raw.set(t, []);
        raw.get(t).push([lo, hi]);
      }, new Set());
      const R = new Map([...raw].map(([t, iv]) => [t, mergeSpans(iv, secKm(t))]));
      return q.gids.every(g => spansLength(mapBack(g, R)) >= 1);
    };
    /* Per piece of the line: a stub that comes with its stop needs a ride reaching that stop,
       so not on a piece where it is the only stop (Artern, alone with its 0.7 km to the DB
       boundary); and on a piece with no stop, ends whose rows all name the same one stop
       (Basel Schänzli: St. Jakob past both ends) cannot be ridden between. */
    const g = lineGraph(line), comp = new Map();
    for (const s of deg.keys()) {
      if (comp.has(s)) continue;
      const c = { stops: 0, ends: [] }, todo = [s];
      comp.set(s, c);
      while (todo.length) {
        const u = todo.pop();
        if (isStop(u)) c.stops++;
        if (deg.get(u) === 1) c.ends.push(u);
        for (const [v] of g.get(u) || []) if (!comp.has(v)) { comp.set(v, c); todo.push(v); }
      }
    }
    const rowsAt = new Map();
    for (const [j, n] of deg) if (n === 1 && !isStop(j))
      rowsAt.set(j, contRows(line, j).filter(c => covers(c, j)));
    for (const [j, rows] of rowsAt) {
      const c = comp.get(j);
      if (tails.has(last.get(j)) && c.stops >= 2) continue;
      if (rows.length && c.stops > 0) continue;
      // No stop on this piece: rows here and a different stop past another end.
      if (rows.length && c.ends.some(k => k !== j && (rowsAt.get(k) || [])
        .some(r => rows.some(q => q.st !== r.st)))) continue;
      set.add(j);
    }
  }
  line._pe = { thru, set };
  return set;
}

/* For each junction end of a line, the stops past it: {map: junction -> [{st, km, legs, j,
   key}], pending}. Grouped by the line taken out of the junction, nearest first. Stops the
   line itself calls at, or that pastEnds already offers there, are left out, and so are ways
   on no mapped train takes where some do (wayRun). `pending` while geometry the walk needs
   is on its way; the rows wait for it rather than appear and then change. Cached per data
   and geometry generation. */
// Whether throughEnds has an answer for the line on hand (else it walks, which takes a while).
function throughCached(line) {
  const c = line._thru;
  return !!c && c.gen === DATA_GEN && (!c.pending || c.geo === GEO_GEN);
}
function throughEnds(line) {
  const c = line._thru;
  if (throughCached(line)) return c;
  const missing = new Set(), map = new Map();
  const deg = new Map();
  for (const [a, b] of line.sections) for (const s of [a, b]) deg.set(s, (deg.get(s) || 0) + 1);
  const past = pastEnds(line), skip = new Set([line.id]);
  /* The line's own stops are not offered past its own junction end, unless they lie on
     another piece of it: an Australian register line ends at "near Robina", a junction
     beside Robina station, which is on the line's other piece, so Robina is the stop past
     that end (ridden on whatever line runs there). */
  const g0 = lineGraph(line), compOf = new Map();
  for (const s of g0.keys()) {
    if (compOf.has(s)) continue;
    const comp = new Set([s]), todo = [s];
    while (todo.length) {
      const u = todo.pop();
      for (const [v] of g0.get(u) || []) if (!comp.has(v)) { comp.add(v); todo.push(v); }
    }
    for (const x of comp) compOf.set(x, comp);
  }
  for (const [j, n] of deg) {
    if (n !== 1 || isStop(j) || !STATIONS[j]) continue;
    const own = compOf.get(j) || lineStations(line);
    const last = line.sections.find(s => s[0] === j || s[1] === j);
    if (CLOSED.has(last[3])) continue;
    const pts = secPts(line, last);
    if (pts === null) missing.add(line.id);
    // The way a train is heading as it reaches j along this line.
    // j's end of the points (they start at b on a third of all sections).
    const jAtEnd = (last[1] === j) !== startsAtSecond(pts, STATIONS[last[0]], STATIONS[last[1]]);
    const hIn = flip(pts ? headingAlong(pts, jAtEnd ? 1 : 0, jAtEnd ? -1 : 1) : null);
    const offered = new Set((past.get(j) || []).map(p => p.st));
    const atEnd = FOOT_REGIONS.has(regionOfGid(last[3])) ? servicesAtEnd(last, j) : new Set();
    /* A stop a service runs on to (pastEnds) is walked to as well: the ride through the
       junction rides this line's own track to it, all of it, where the service ride credits
       only as much of it as the service's track covers, and a pick can go through junctions
       at both ends of a line but past a service's end at one only (contRows keeps the walked
       row where both reach one stop). Anita, 2026-10-07: one pick end to end fills the line. */
    let all = walkFrom(j, hIn, skip, missing, kindOf(line))
      .filter(r => !own.has(r.st));
    /* Nothing within reach: walk on further. Track leading to no station is not built
       (build_model.prune_dead_track), so a junction end always leads somewhere, but a US
       subdivision can meet the next one 150 km from any stop (Hastings - Creston). */
    if (!all.length && !offered.size)
      all = walkFrom(j, hIn, skip, missing, kindOf(line), { km: THROUGH_FAR_KM, steps: THROUGH_FAR_STEPS })
        .filter(r => !own.has(r.st));
    let fallback = false;
    if (!all.length && !offered.size) { all = nearRows(line, j, own, missing); fallback = true; }
    /* Where the filter would leave the end with nothing to pick (its services run on beyond
       the walk's reach), the walk's ways on stay: 6 of ~380 ends in de and in ch. The last
       resort's rows are a service's own stops, and all stay. */
    const run = atEnd.size && !fallback ? all.filter(r => wayRun(r, atEnd)) : all;
    const hub = hubStop(line, j);
    // Nearest first; a way on that passes a stop already listed goes (passesBy).
    const listed = [...offered], rows = [], byHub = [];
    for (const r of (run.length || offered.size ? run : all).sort((x, y) => x.km - y.km)) {
      if (hub && oneLineFrom(hub, r.st)) { byHub.push(r); continue; }
      if (listed.some(st => st !== r.st && passesBy(r, st))) continue;
      listed.push(r.st);
      rows.push({ ...r, j, key: r.legs.map(l => l.line.id).join('>') });
    }
    /* Ridden from the hub instead, unless that leaves this line's own track to the junction
       with no way to ride it (the Seaford Branch Line's 1.1 km beside the Seaford Single). A
       junction within HUB_TWIN_KM of the hub, on a stub that comes with it (lineTails: any
       ride reaching the hub credits it), is the hub's own end of track, and nothing is
       offered past it (Anita, 2026-10-09: South Station's end 5 m on offered the Red Line,
       Newmarket and JFK/UMass). */
    const twin = hub && (lineTails(line).get(hub) || []).includes(last[3])
      && (pathBetween(line, hub, j) || { km: Infinity }).km <= HUB_TWIN_KM;
    if (!rows.length && !offered.size && !twin)
      for (const r of byHub) rows.push({ ...r, j, key: r.legs.map(l => l.line.id).join('>') });
    const out1 = r => r.legs[0].line.id;
    const near = new Map();
    for (const r of rows) near.set(out1(r), Math.min(near.has(out1(r)) ? near.get(out1(r)) : Infinity, r.km));
    rows.sort((x, y) => (near.get(out1(x)) - near.get(out1(y)))
      || (out1(x) < out1(y) ? -1 : out1(x) > out1(y) ? 1 : 0) || (x.km - y.km));
    if (rows.length) map.set(j, rows.slice(0, THROUGH_MAX_ROWS));
  }
  return (line._thru = { gen: DATA_GEN, geo: GEO_GEN, map, pending: missing.size > 0 });
}

/* THE LAST RESORT AT A JUNCTION END: the build keeps a junction end only where other track
   comes within CONTACT_M (300 m, build_model.prune_dead_track), but the walk follows only
   register lines and meets them within JUNCTION_SNAP_KM. Where it finds nothing, the stops
   at either end of any line's section of the same kind (named trains included) passing within
   NEAR_ROW_KM are offered, ridden on that
   line from the junction: at Lincoln the Hastings Subdivision ends 104 m from the next
   subdivision's second track and 3 m from the California Zephyr's, so Lincoln is offered on
   the Zephyr. [{st, km, legs}] as walkFrom gives. */
const NEAR_ROW_KM = 0.3;
function nearRows(line, j, own, missing) {
  const J = STATIONS[j];
  if (!J) return [];
  const kx = Math.cos(J.y * Math.PI / 180) * 111.32, ky = 110.57;
  const best = new Map();
  for (const { line: M, sec } of sectionsNear(J.x, J.y)) {
    // The same kind of track only, as the walk (departures): a metro under a railway's
    // terminus is no way on from it (Anita, 2026-10-09: the Red Line past South Station).
    if (M === line || kindOf(M) !== kindOf(line)) continue;
    const [a, b, km, gid] = sec;
    if (a === b || CLOSED.has(gid) || a === j || b === j) continue;
    const A = STATIONS[a], B = STATIONS[b];
    if (!A || !B) continue;
    const m = 0.25 * km + NEAR_ROW_KM;       // NEAR_MARGIN, which sectionsNear is built on
    if (J.x < Math.min(A.x, B.x) - m / kx || J.x > Math.max(A.x, B.x) + m / kx
        || J.y < Math.min(A.y, B.y) - m / ky || J.y > Math.max(A.y, B.y) + m / ky) continue;
    const pts = secPts(M, sec);
    if (pts === null) { missing.add(M.id); continue; }
    if (!pts) continue;
    const r = nearOnPoly(pts, J.x, J.y);
    if (r.d > NEAR_ROW_KM) continue;
    /* The points need not run from a to b (the Sunset Limited's Houston - Beaumont): which
       end the drawn track starts at decides which side of the junction is a's. t stays a
       fraction along the points; cutGraph places the stations by the same test. */
    const t = Math.max(0, Math.min(1, r.t));
    const fromB = startsAtSecond(pts, A, B);
    for (const [st, lo, hi] of fromB ? [[a, t, 1], [b, 0, t]] : [[a, 0, t], [b, t, 1]]) {
      if (!isStop(st) || own.has(st) || hi - lo < 1e-4) continue;
      const k = km * (hi - lo);
      const was = best.get(st);
      if (was && was.km <= k) continue;
      best.set(st, { st, km: k, legs: [{ line: M, from: j, to: st, km: k,
        gids: [partGid(gid, lo, hi)], cuts: { [j]: [a, b, +t.toFixed(5)] } }] });
    }
  }
  return [...best.values()];
}

function throughEntry(line, ref) {
  if (!ref) return null;
  const t = throughEnds(line);
  if (t.pending) return null;
  return (t.map.get(ref.j) || []).find(r => r.st === ref.st && r.key === ref.key) || null;
}
// The nearest row past any junction end of the line that is stop `st`, if one is.
function throughAt(line, st) {
  const t = throughEnds(line);
  if (t.pending) return null;
  let best = null;
  for (const rows of t.map.values())
    for (const r of rows) if (r.st === st && (!best || r.km < best.km)) best = r;
  return best;
}

/* Picking a stop past a junction end: as the end of a ride from a picked stop of this line
   (or from a stop past its other end), or as its start, with the other end picked next. */
function pickThrough(st, j, key) {
  const ref = { j, st, key };
  const T = PICK.through || {};
  if (PICK.from && !PICK.to && PICK.from !== st && !PICK.past && !(T.from && T.from.j === j)) {
    PICK.to = st;
    PICK.through = { from: T.from || null, to: ref };
  } else {
    PICK = { from: st, to: null, around: false, through: { from: ref, to: null } };
  }
  render();
  paintSelection();
}

/* A LEG OF A TRACED JOURNEY THROUGH JUNCTIONS: from stop a to stop b over register lines,
   changing line only at junctions (at a stop the rider would have clicked it), never turning
   back at one. Asked only where no one line calls at both. The shortest such way, within
   1.6 times the distance as the crow flies plus 15 km and JR_MAX_CHANGES changes: {route:
   {legs, km, gids} or null, pending}, `pending` while geometry it needs is on its way. */
let JR = { gen: -1, by: new Map() };
function junctionRoute(a, b) {
  if (JR.gen !== DATA_GEN) JR = { gen: DATA_GEN, by: new Map() };
  const key = `${a}>${b}`;
  const c = JR.by.get(key);
  if (c && (!c.pending || c.geo === GEO_GEN)) return c;
  const res = { geo: GEO_GEN, pending: false, route: null };
  JR.by.set(key, res);
  const A = STATIONS[a], B = STATIONS[b];
  if (!A || !B || a === b) return res;
  const missing = new Set();
  const cap = 1.6 * crowKm(A, B) + 15;
  const open = [{ u: a, km: 0, cost: 0, h: null, line: null, legs: [], changes: 0,
                  seen: new Set([a]) }];
  const best = new Map();
  for (let n = 0; open.length && n < JR_MAX_STATES; n++) {
    let bi = 0;
    for (let i = 1; i < open.length; i++) if (open[i].cost < open[bi].cost) bi = i;
    const s = open.splice(bi, 1)[0];
    if (s.u === b) {
      res.route = { legs: s.legs, km: s.km, gids: s.legs.flatMap(l => l.gids) };
      break;
    }
    const atStop = s.u !== a && isStop(s.u);
    // The kind of track the journey set off on, kept to all the way.
    for (const d of waysOn(s.u, s.line, s.h, missing, s.line ? kindOf(s.line) : null)) {
      if (s.seen.has(d.to)) continue;
      if (atStop && (d.line !== s.line || d.cut)) continue;       // no change at a stop
      if (s.line && !turnOk(s.h, d.hOut)) continue;
      const changes = s.changes + (s.line && d.line !== s.line ? 1 : 0);
      const km = s.km + d.km;
      if (changes > JR_MAX_CHANGES || km > cap) continue;
      const legs = extendLegs(s.legs, d, s.u), cost = walkCost(km, legs);
      const k = `${d.to}|${d.gid}`;
      if (best.has(k) && best.get(k) <= cost) continue;
      best.set(k, cost);
      open.push({ u: d.to, km, cost, h: d.km < 0.005 ? s.h : d.hArr, line: d.line, legs,
                  changes, seen: new Set([...s.seen, d.to]) });
    }
  }
  res.pending = missing.size > 0;
  return res;
}

function pickStop(id) {
  if (!PICK.from || (PICK.from && PICK.to)) PICK = { from: id, to: null, around: false };
  else if (id === PICK.from) PICK = { from: null, to: null, around: false };
  else { PICK.to = id; PICK.around = false; PICK.short = false; PICK.via = null; }
  render();
  paintSelection();
}
function clearPick() {
  PICK = { from: null, to: null, around: false };
  render();
  paintSelection();
}
function setAround(on) { PICK.around = on; PICK.short = false; PICK.via = null; render(); paintSelection(); }
// Which of the ways between the two picked stops: 'drawn' (or the short way), 'direct', 'around'.
function setRoute(r) {
  PICK.around = r === 'around';
  PICK.short = r === 'direct';
  PICK.via = r.startsWith('via:') ? r.slice(4) : null;
  render();
  paintSelection();
}

function wholeRide(line, date) {
  const ends = line.display.length ? line.display : line.sections.map(s => s[0]);
  return newRide(line.id, ends[0], ends[ends.length - 1], date || '', { whole: true });
}

function rideWhole(lineId) {
  const line = LINE_BY_ID.get(lineId);
  if (!line) return;
  addRides([wholeRide(line)], `Added all of ${lineName(line)}`);
  PICK = { from: null, to: null, around: false };
  render();
  paintSelection();
}

function commitRide() {
  const run = pickedRun();
  if (!run || !run.p || PICK.from === PICK.to) return;
  const d = document.getElementById('ridedate');
  const arrived = PICK.to;
  LAST_DATE = d ? d.value : '';
  if (run.legs) {
    // One trip of two legs, back to back: trips() groups them by the shared junction.
    const rides = run.legs.map(l => newRide(l.line.id, l.from, l.to, LAST_DATE,
                                            { cuts: l.cuts }));
    addRides(rides, `Added ${rides.map(rideLabel).join(' and ')}`);
    showStation(arrived);
    return;
  }
  addRide(VIEW.id, PICK.from, PICK.to, LAST_DATE,
          { around: run.around, via: run.via ? run.via.key : null,
            drawn: !!run.drawn && !run.around && !run.direct && !run.via });
  /* Hand back to the STATION arrived at, not to the line just ridden. The next leg nearly
     always starts by choosing a different line, and staying on the old one meant backing
     out of it first. */
  showStation(arrived);
}

// ---------------------------------------------------------------- search

/* Strip accents before matching. Station names come romanised as Tōkyō, Ōedo, Myōgadani,
   so a plain substring search for "tokyo" matched the line named "Tokyo Metro ..." and every
   other line with Tokyo in its operator, and never the station itself. */
const norm = s => String(s || '').normalize('NFD')
  .replace(/[̀-ͯ]/g, '').toLowerCase().trim();

/* Ranked, not just filtered: an exact name beats a name that starts with the word, which
   beats a mention anywhere including in the operator. Without this, "tokyo" filled up with
   the two hundred lines run by Tokyo Metro and Tokyo Metropolitan Bureau of Transportation
   before ever reaching Tokyo station. */
function score(q, primary, secondary, all) {
  // `all` holds both names, so anything not in it scores 0: checked first, as nearly
  // everything of the 125,000 names in the index fails it.
  if (!all.includes(q)) return 0;
  if (q === primary || q === secondary) return 3;
  for (const n of [primary, secondary]) {
    if (!n) continue;
    if (n.startsWith(q)) return 2;
    if (n.split(/\s+/).some(w => w.startsWith(q))) return 2;
  }
  return 1;
}

/* THE SEARCH INDEX, data/search.json (tools/build_regions.py, `write_search`): every
   country's line and station names in one file, about 2 MB gzipped, fetched on the first
   keystroke. Line data loads only zoomed in (DATA_MIN_ZOOM), and a search over a zoomed-out
   view used to load every country on screen before it could answer (Europe at z4: 33 MB,
   5.7 s); now it searches this, and picking a hit loads only that hit's country (pickHit).
   A country loaded but not in the index (built after it was written) is still searched from
   its loaded data. Without the file (an older deploy) search loads the countries on screen
   as it did before (searchWiden). */
function loadSearchIndex() {
  if (SEARCH_IX_STATE) return;
  SEARCH_IX_STATE = 'loading';
  noteLoading();
  Promise.all([
    dataFetch('data/search.json').then(r => {
      if (!r.ok) throw new Error(`search.json: ${r.status}`);
      return r.json();
    }),
    // Every country's filled English in one file (67 KB), so search finds 北陸新幹線 as
    // "Hokuriku Shinkansen" before Japan is loaded.
    dataFetch('data/names_en.json').then(r => (r.ok ? r.json() : {})).catch(() => ({})),
  ]).then(([d, ne]) => {
    SEARCH_IX = readSearchIndex(d, ne);
    SEARCH_IX_STATE = 'ready';
  }).catch(err => {
    console.warn('no search index; searching the countries on screen instead:', err);
    SEARCH_IX_STATE = 'missing';
  }).then(() => {
    noteLoading();
    if (document.getElementById('q').value.trim()) runSearch();
  });
}

/* The file is columns per country (write_search's docstring); this turns it into objects
   shaped enough like a loaded line or station for search, lineName, lineColour and the hit
   rows. A station's position is in thousandths of a degree, each the step from the one
   before it in its country's list. */
function readSearchIndex(d, ne = {}) {
  // `shown` names the passenger operators where the country has ops.json, so search on it too.
  const ops = d.ops.map(([raw, en, shown]) => ({ shown, k: `${raw} ${en} ${shown}` }));
  const lines = [], stations = [];
  for (const [cc, [ids, ns, es, refs, oi, ki, cols, kms, fl, ti]] of Object.entries(d.lines)) {
    for (let i = 0; i < ids.length; i++) {
      const o = ops[oi[i]];
      const l = { id: ids[i], region: cc, name: ns[i],
                  name_en: es[i] || (ne[cc] && ne[cc].ln[ids[i]]) || '', ref: refs[i],
                  colour: cols[i], kind: d.kinds[ki[i]], km: kms[i],
                  service: !!(fl[i] & 1), dup: !!(fl[i] & 2), opShown: o.shown,
                  // The type, where search.json has the `types` column (build_regions).
                  ltype: ti && ti[i] >= 0 ? (d.types || [])[ti[i]] : '' };
      l._n = norm(l.name_en || l.name);
      l._n2 = norm(l.name);
      l._k = norm(`${l.name} ${l.name_en} ${l.ref} ${o.k}`);
      lines.push(l);
    }
  }
  for (const [cc, [ids, ns, es, dx, dy, nl]] of Object.entries(d.stations)) {
    let x = 0, y = 0;
    for (let i = 0; i < ids.length; i++) {
      x += dx[i]; y += dy[i];
      const s = { id: ids[i], region: cc, n: ns[i], e: es[i] || (ne[cc] && ne[cc].st[ids[i]]) || '',
                  x: x / 1000, y: y / 1000,
                  nl: nl[i] };
      s._n = norm(s.e);
      s._n2 = norm(s.n);
      s._k = norm(`${s.n} ${s.e}`);
      stations.push(s);
    }
  }
  return { lines, stations,
           covers: new Set([...Object.keys(d.lines), ...Object.keys(d.stations)]) };
}

function search(raw) {
  let q = norm(raw);
  if (!q) return [];
  // "tokyo station" means the station. "yamanote line" means the line.
  let want = null;
  if (/\bstations?\b/.test(q)) { want = 'station'; q = q.replace(/\bstations?\b/g, ' '); }
  else if (/\blines?\b/.test(q)) { want = 'line'; q = q.replace(/\blines?\b/g, ' '); }
  q = q.replace(/\s+/g, ' ').trim();
  if (!q) return [];

  // The index where it is in, plus any loaded country it does not cover; else what is loaded.
  const ix = SEARCH_IX;
  const outside = ix ? [...LOADED].filter(cc => !ix.covers.has(cc)) : [];
  const out = [];
  if (want !== 'station') {
    const lines = !ix ? LINES : !outside.length ? ix.lines
      : ix.lines.concat(LINES.filter(l => regionsOf(l).every(cc => !ix.covers.has(cc))));
    /* A line named for its two ends ("GWR: London Paddington - Oxford") that matches only by
       one of the places in it ranks just below a station of that name: "paddington" listed
       13 GWR lines before London Paddington, since within a score a line's km beat a
       station's count of lines. A line whose own name it is ("Chūō Line") is unaffected. */
    const ROUTE_NAME = /\s[-–—]\s|[→↔⇔]|<=?>|=>/;
    for (const l of lines) {
      let sc = score(q, l._n, l._n2, l._k);
      if (sc === 2 && ROUTE_NAME.test(l.name_en || l.name)) sc = 1.5;
      if (sc) out.push({ kind: 'line', l, sc, w: l.km });
    }
  }
  if (!want) {
    opsNow().forEach((o, i) => {
      const sc = score(q, o._n, '', o._k);
      if (sc) out.push({ kind: 'op', o, i, sc, w: o.km });
    });
  }
  if (want !== 'line') {
    if (ix) {
      for (const s of ix.stations) {
        const sc = score(q, s._n, s._n2, s._k);
        if (sc) out.push({ kind: 'station', id: s.id, s, sc, w: s.nl });
      }
    }
    if (!ix || outside.length) {
      for (const [id, s] of Object.entries(STATIONS)) {
        if (s.j || (ix && ix.covers.has(s.region))) continue;
        const sc = score(q, s._n, s._n2, s._k);
        if (sc) out.push({ kind: 'station', id, s, sc, w: (s.l || []).length });
      }
    }
  }
  // Countries by name, loaded or not: a way to one whose lines are not in yet.
  if (!want) {
    for (const [cc, r] of Object.entries(REGIONS)) {
      const n = norm(r.name);
      const sc = score(q, n, '', n);
      if (sc) out.push({ kind: 'country', cc, r, sc, w: Infinity });
    }
  }
  out.sort((a, b) => (b.sc - a.sc) || (b.w - a.w));
  return out.slice(0, 14);
}

/* WITHOUT THE SEARCH INDEX, A SEARCH REACHES WHAT IS ON SCREEN. Line data loads only zoomed
   in (DATA_MIN_ZOOM), so a search over a view of Europe would find only the countries already
   loaded. It loads the countries on screen instead, from SEARCH_MIN_ZOOM (where loading used
   to start anyway), and searches again as each arrives; noteLoading says it is waiting. */
function searchWiden() {
  if (!mapReady || map.getZoom() < SEARCH_MIN_ZOOM) return;
  for (const cc of regionsInView(0)) {
    if (LOADING.has(cc)) continue;
    loadRegion(cc).then(() => {
      if (document.getElementById('q').value.trim()) runSearch();
    });
  }
}

function runSearch() {
  const q = document.getElementById('q').value;
  if (q.trim()) {
    loadSearchIndex();
    // Until the index is in, what is loaded is searched; it searches again when it arrives.
    if (SEARCH_IX_STATE === 'missing') searchWiden();
  }
  const hits = search(q);
  const el = document.getElementById('results');
  if (!hits.length) { el.innerHTML = ''; return; }
  el.innerHTML = hits.map(h => h.kind === 'country'
    ? `<div class="hit" onclick="pickHit('country','${h.cc}')">`
      + `<div class="t">${esc(h.r.name)}</div>`
      + `<div class="s">country${hasTotal(h.cc)
        ? ` · ${Math.round(h.r.km).toLocaleString()} km` : ''}</div></div>`
    : h.kind === 'line'
    ? `<div class="hit" onclick="pickHit('line','${h.l.id}')">`
      + `<div class="t"><span class="bar" style="background:${lineColour(h.l)}"></span>`
      + `${esc(lineName(h.l))}</div>`
      + `<div class="s">${hitType(h.l)}${esc(h.l.opShown || opName(h.l))} · `
      + `${h.l.km.toFixed(0)} km${h.l.service ? ' · named train' : ''}</div></div>`
    : h.kind === 'op'
    ? `<div class="hit" onclick="pickHit('op','${h.i}')">`
      + `<div class="t">${opLogo(h.o.key) ? `<img class="oplogo" src="${esc(opLogo(h.o.key))}" alt="" />` : ''}`
      + `${esc(opLabel(h.o.key))}</div>`
      + `<div class="s">operator · ${h.o.lines.length} line${h.o.lines.length === 1 ? '' : 's'}`
      + ` · ${Math.round(h.o.km).toLocaleString()} km</div></div>`
    : `<div class="hit" onclick="pickHit('station','${h.id}')">`
      + `<div class="t">${esc(LANG === 'local' ? (h.s.n || h.s.e) : (h.s.e || translit(h.s.n, h.s.region)))}</div>`
      + `<div class="s">station · ${h.w} line${h.w === 1 ? '' : 's'}</div></div>`).join('');
}

/* A HIT FROM THE INDEX WHOSE COUNTRY IS NOT LOADED: load that country, then open the hit as
   a loaded one opens. A station moves the camera at once, so the map is there while its
   country comes in (noteLoading says so). Opened only if nothing else was picked or opened
   meanwhile. An index older than the country's build can name an id the build has since
   moved: aliases.json's map, then the nearest station of that name within 300 m. */
let PICK_GEN = 0;
function pickHit(kind, id) {
  document.getElementById('q').value = '';
  document.getElementById('results').innerHTML = '';
  const gen = ++PICK_GEN;
  const ix = SEARCH_IX;
  const e = !ix ? null
    : kind === 'line' && !LINE_BY_ID.has(id) ? ix.lines.find(l => l.id === id)
    : kind === 'station' && !STATIONS[id] ? ix.stations.find(s => s.id === id) : null;
  if (!e) return openHit(kind, id);
  if (kind === 'station')
    map.easeTo({ center: [e.x, e.y], zoom: Math.max(map.getZoom(), 12), duration: 0 });
  const view = VIEW;
  loadRegion(e.region).then(() => {
    if (gen !== PICK_GEN || VIEW !== view) return;
    let to = id;
    if (kind === 'line' && !LINE_BY_ID.has(to)) to = (LINE_ALIASES[e.region] || {})[id];
    if (kind === 'station' && !STATIONS[to]) {
      to = (ALIASES[e.region] || {})[id];
      if (!STATIONS[to]) {
        const near = nearestStation(e.x, e.y, 300), s = STATIONS[near];
        to = s && (s.n === e.n || (e.e && s.e === e.e)) ? near : null;
      }
    }
    if (to && (kind === 'line' ? LINE_BY_ID.has(to) : STATIONS[to])) openHit(kind, to);
  });
}

function openHit(kind, id) {
  if (kind === 'line') showLine(id, null, true);
  else if (kind === 'op') showOp(+id);
  else if (kind === 'country') goRegion(id);
  else {
    const s = STATIONS[id];
    if (s) map.easeTo({ center: [s.x, s.y], zoom: Math.max(map.getZoom(), 12), duration: 0 });
    // While tracing, a searched station is the next stop, not a place to go and look at.
    if (VIEW.kind === 'trace') traceAdd(id);
    else showStation(id);
  }
}

// ---------------------------------------------------------------- export / import

function exportRides() {
  // Every country's rides, each carrying its own `region`.
  // The starred statistics and the countries' order go with them.
  const blob = new Blob([JSON.stringify({ v: 1, rides: RIDES, stars: STARS,
                                          orders: ORDERS }, dropCache, 1)],
                        { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `noritetsu-rides-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function importRides(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const parsed = JSON.parse(rd.result);
      const incoming = parsed.rides || [];
      if (!Array.isArray(incoming)) throw new Error('no rides array');
      // Merged by id, not replaced: importing a file from another device should add to what
      // is here rather than silently discard it.
      const have = new Set(RIDES.map(r => r.id));
      const fresh = [];
      for (const r of incoming) {
        if (!r || !r.line || !r.from || !r.to) continue;
        if (r.id && have.has(r.id)) continue;
        const ride = { ...r, id: r.id || ('r' + Math.random().toString(36).slice(2, 9)) };
        // Files from before regions existed say the region once, at the top, or not at all.
        ride.region = r.region || parsed.region || 'jp';
        // A file exported before a rebuild names stations and lines by their old ids.
        if (LOADED.has(ride.region)) migrateRide(ride);
        else loadRegion(ride.region);   // its lines are needed to draw and count it
        delete ride._gids;
        fresh.push(ride);
      }
      const added = fresh.length;
      // Stars are added to the ones here; a list's dragged order only where this one has none.
      if (Array.isArray(parsed.stars)) {
        STARS = [...new Set([...STARS, ...parsed.stars.filter(k => typeof k === 'string')])];
        saveStars();
      }
      if (parsed.orders && typeof parsed.orders === 'object') {
        for (const [k, v] of Object.entries(parsed.orders))
          if (!ORDERS[k] && Array.isArray(v)) ORDERS[k] = v.filter(x => typeof x === 'string');
        saveOrders();
      }
      addRides(fresh, `Imported ${added} ride${added === 1 ? '' : 's'}`);
      alert(`Imported ${added} ride${added === 1 ? '' : 's'}.`);
    } catch (e) {
      alert('That file does not look like a noritetsu export.');
    }
    input.value = '';
  };
  rd.readAsText(f);
}

// ---------------------------------------------------------------- map interaction

/* HOW FAR FROM A LINE A CLICK STILL COUNTS, in pixels. Measured 2026-09-30 before this
   existed: a click had to land within about 4 px of the line at z11, so most near misses
   did nothing. Now a box this size around the click is searched and the nearest line in
   it wins. */
const CLICK_SLOP = 10;

map.on('click', (e) => {
  const clickGen = ++CLICK_WAIT;
  const hits = map.queryRenderedFeatures(e.point, { layers: ['sel-station', 'station', 'station-ic'] });
  const tracing = VIEW.kind === 'trace';
  const near = hits.length ? [] : tracksNear(e.point, CLICK_SLOP);
  // Nothing near the cursor at all: clear the selection. Not while tracing, where a missed
  // station would otherwise throw the whole journey away.
  if (!hits.length && !near.length) {
    if (tracing) return undefined;
    /* An operator drawn from an open row is a passing highlight (Anita, 2026-10-07): open
       space clears it and the map goes back to normal. The row itself stays open. */
    if (VIEW.kind === 'home' && HOME_OP) {
      HOME_OP = null;
      render();
      return paintSelection();
    }
    return goHome();
  }

  const st = hits[0];
  if (st) {
    /* Both station layers are built from the model and carry their own id. The nearest
       lookup is a backstop for a click that lands on a feature from an older build. */
    let id = st.properties.id || null;
    if (!id || !STATIONS[id]) id = nearestStation(e.lngLat.lng, e.lngLat.lat, 400);
    if (!id) return;
    if (tracing) return traceAdd(id);

    // With a line open, a station on it sets the ends of the trip, same as the diagram.
    if (VIEW.kind === 'line') {
      const line = LINE_BY_ID.get(VIEW.id);
      if (line && lineStations(line).has(id)) return pickStop(id);
      // A stop past one of its junction ends picks it, as its row does.
      const r = line && throughAt(line, id);
      if (r) return pickThrough(r.st, r.j, r.key);
    }
    return showStation(id);
  }
  if (tracing) return;
  // Not-running track names its line, and its country (data/closed.json), loaded first.
  if (near[0].layer.id === 'closed-hit') {
    const { l, cc } = near[0].properties;
    return (cc && !LOADED.has(cc) ? loadRegion(cc) : Promise.resolve())
      .then(() => {
        if (clickGen === CLICK_WAIT && LINE_BY_ID.has(foldLine(l))) showLine(foldLine(l));
      });
  }
  const withWay = near.find(f => f.properties.w);
  if (withWay) return pickTrack(withWay);
  /* Below z10 the click is resolved from the line data, which a country zoomed out on does
     not have yet (DATA_MIN_ZOOM): the countries whose track was hit load first, and the
     click is placed again where it landed, in case the map moved meanwhile. */
  const need = [...new Set(near.map(f => f.layer.id).filter(id => id.startsWith('track-hit-'))
    .map(id => id.slice('track-hit-'.length)))].filter(cc => !LOADED.has(cc));
  if (!need.length) return pickByChord(e.point);
  const at = e.lngLat;
  Promise.all(need.map(loadRegion)).then(() => {
    if (clickGen === CLICK_WAIT) pickByChord(map.project(at));
  });
});
let CLICK_WAIT = 0;     // any later click replaces one waiting on a country's data

/* Track features in a box around the point, nearest first by their drawn geometry. */
function tracksNear(p, r) {
  const layers = hitLayers();
  if (!layers.length) return [];      // an empty list would query every layer on the map
  const feats = map.queryRenderedFeatures([[p.x - r, p.y - r], [p.x + r, p.y + r]], { layers });
  const dist = f => {
    const g = f.geometry;
    const runs = g.type === 'LineString' ? [g.coordinates]
      : g.type === 'MultiLineString' ? g.coordinates : [];
    let best = Infinity;
    for (const run of runs) {
      let prev = null;
      for (const c of run) {
        const q = map.project(c);
        if (prev) best = Math.min(best, segDist(p, prev, q));
        prev = q;
      }
    }
    return best;
  };
  return feats.map(f => ({ f, d: dist(f) })).filter(x => x.d <= r)
    .sort((a, b) => a.d - b.d).map(x => x.f);
}

// How far along the segment a..b (0 to 1) the point nearest p is.
function segT(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, len2 = dx * dx + dy * dy;
  return len2 ? Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2)) : 0;
}
function segDist(p, a, b) {
  const t = segT(p, a, b);
  return Math.hypot(p.x - (a.x + t * (b.x - a.x)), p.y - (a.y + t * (b.y - a.y)));
}

/* The point of a drawn section nearest the click: its distance on screen, and how far along
   the section (0 to 1) it is. Lengths on the same local flat projection as sliceLine, which
   is how the build measures foot.json's fractions. */
function nearOnTrack(pts, p) {
  if (!pts || pts.length < 2) return null;
  const kx = Math.cos(pts[0][1] * Math.PI / 180);
  let cum = 0, best = Infinity, at = 0, prev = map.project(pts[0]);
  for (let i = 1; i < pts.length; i++) {
    const q = map.project(pts[i]);
    const len = Math.hypot((pts[i][0] - pts[i - 1][0]) * kx, pts[i][1] - pts[i - 1][1]);
    const d = segDist(p, prev, q);
    if (d < best) { best = d; at = cum + segT(p, prev, q) * len; }
    cum += len;
    prev = q;
  }
  return cum ? { d: best, f: at / cum } : null;
}

/* EVERY LINE OVER THE TRACK AT ONE POINT OF A SECTION, `t` along it: from the footprints
   (foot.json), not from where lines are drawn. The section's footprint names the owner track
   there; every section whose footprint covers that point of the owner track is on it, named
   trains and lines over a border included. Within `tolKm` of the point, either way.
   Null where the country has no footprints. */
function linesOverTrack(gid, t, tolKm) {
  if (!FOOT_REGIONS.has(regionOfGid(gid))) return null;
  const tolOf = g => tolKm / Math.max(secKm(g), 0.001);
  const fp = footOf(gid);
  const tol = tolOf(gid);
  let at = fp.filter(e => t >= Math.min(e[3], e[4]) - tol && t <= Math.max(e[3], e[4]) + tol);
  if (!at.length) at = fp;
  const out = new Set();
  for (const [own, from, to, a, b] of at) {
    const k = b > a ? Math.max(0, Math.min(1, (t - a) / (b - a))) : 0.5;
    const u = from + k * (to - from), ut = tolOf(own);
    const covers = (lo, hi) => u >= Math.min(lo, hi) - ut && u <= Math.max(lo, hi) + ut;
    const oe = SEC_BY_GID.get(own);
    if (oe && !FOOT.has(own)) out.add(oe.line.id);       // the owner track's own line
    for (const g of FOOT_INTO.get(own) || []) {
      const e = SEC_BY_GID.get(g);
      if (e && footOf(g).some(([o, f2, t2]) => o === own && covers(f2, t2))) out.add(e.line.id);
    }
  }
  return [...out];
}

/* BELOW z10 THE TILES CARRY NO WAY ID, only merged chains, so a click there used to do
   nothing at all. It is resolved from the model instead. Parallel lines are
   indistinguishable this far out, so the nearest listed line opens (a register line first
   among those within a few pixels of each other). Only where no listed line is near at all
   is the choice offered as a list.
   NEAREST BY THE DRAWN TRACK, where a chord will not do. Each section is first measured as
   a straight line between its two stations, which for a short section sits within a few
   pixels of the track. A long one can bow far from its chord: Belgium's HSL 1 is two
   sections, Halle to the French border 74.5 km, and a click on it at Enghien was nearer the
   chord of the old line 94 beside it. So a listed line with a long chord anywhere near is
   measured again on its drawn geometry (the same files a selected line draws from).
   WHAT ELSE RUNS THERE comes from the footprints at the clicked point of the opened line's
   section (linesOverTrack), not from chords: the Eurostar's one section from Brussels-Midi
   to the French border, 87.6 km, was never near a click on HSL 1. Lines drawn within
   SAME_TRACK_PX of the opened one are listed too, with what runs over them. */
let CHORD_GEN = 0;
const LONG_CHORD = 30;    // px: a chord longer than this is checked against its drawn track
const SAME_TRACK_PX = 1.5;  // px: lines this much further than the nearest are the same track
const MAX_MEASURED = 12;    // listed lines measured on their drawn track per click, at most
async function pickByChord(p) {
  const gen = ++CHORD_GEN;
  const b = map.getBounds().toArray();
  const pad = 0.2 * (b[1][0] - b[0][0]);
  const inView = s => s && s.x > b[0][0] - pad && s.x < b[1][0] + pad
    && s.y > b[0][1] - pad && s.y < b[1][1] + pad;
  const proj = new Map();
  const at = id => {
    if (!proj.has(id)) proj.set(id, map.project([STATIONS[id].x, STATIONS[id].y]));
    return proj.get(id);
  };
  const reach = CLICK_SLOP + 4;
  // line id -> its nearest section: [distance, section, how far along it]
  const best = new Map();
  const bowed = new Map();          // listed line id -> long sections that may be near
  const keep = (id, d, sec, t) => {
    if (d < (best.has(id) ? best.get(id)[0] : Infinity)) best.set(id, [d, sec, t]);
  };
  const z = map.getZoom();
  for (const line of LINES) {
    // Only kinds the tiles draw at this zoom: a tram under a main line is not what was hit.
    const k = KIND_LABEL[line.kind === 'train' ? 'rail' : line.kind];
    if (k && z < k[1]) continue;
    let isListed = null;
    for (const sec of line.sections) {
      const [a, c] = sec;
      if (!inView(STATIONS[a]) && !inView(STATIONS[c])) continue;
      if (!STATIONS[a] || !STATIONS[c]) continue;
      const A = at(a), C = at(c);
      const d = segDist(p, A, C), len = Math.hypot(C.x - A.x, C.y - A.y);
      // A track rarely bows from its chord by more than a quarter of the chord's length.
      if (len > LONG_CHORD && d <= reach + 0.25 * len) {
        if (isListed === null) isListed = listed(line);
        if (isListed) {
          if (!bowed.has(line.id)) bowed.set(line.id, { d, secs: [] });
          const bw = bowed.get(line.id);
          bw.d = Math.min(bw.d, d);
          bw.secs.push(sec);
          continue;
        }
      }
      keep(line.id, d, sec, segT(p, A, C));
    }
  }
  // Where there is no drawn track to measure: the chord, as before.
  const byChord = (id, sec) => {
    const A = at(sec[0]), C = at(sec[1]);
    keep(id, segDist(p, A, C), sec, segT(p, A, C));
  };
  // The nearest few by chord: zoomed out over China, dozens of long sections can qualify.
  const toMeasure = [...bowed].sort((x, y) => x[1].d - y[1].d);
  for (const [id, { secs }] of toMeasure.slice(MAX_MEASURED)) secs.forEach(s => byChord(id, s));
  await Promise.all(toMeasure.slice(0, MAX_MEASURED).map(([id, { secs }]) => geomFor(id)
    .then(g => {
      for (const sec of secs) {
        const fwd = g[`${sec[0]}|${sec[1]}`], back = g[`${sec[1]}|${sec[0]}`];
        const r = nearOnTrack(fwd || back, p);
        if (r) keep(id, r.d, sec, fwd ? r.f : 1 - r.f);
        else byChord(id, sec);
      }
    })
    .catch(() => secs.forEach(s => byChord(id, s)))));
  if (gen !== CHORD_GEN) return;          // a later click won
  const min = Math.min(...[...best.values()].map(x => x[0]));
  if (!(min <= reach)) return;
  const near = [...best].filter(([, x]) => x[0] <= reach);
  const lst = near.filter(([id]) => listed(LINE_BY_ID.get(id)));
  if (!lst.length)
    return openTrackLines(near.filter(([, x]) => x[0] <= min + 4).map(([id]) => id));
  const m = Math.min(...lst.map(([, x]) => x[0]));
  const pool = lst.filter(([, x]) => x[0] <= m + 4);
  const reg = pool.filter(([id]) => isRegisterLine(LINE_BY_ID.get(id)));
  const [owner, [od]] = (reg.length ? reg : pool).reduce((a, b) => (b[1][0] < a[1][0] ? b : a));
  /* Track a pixel or so apart cannot be told apart at this zoom (Brussels - Leuven is line
     36 and line 36N side by side), so what runs over each of those is listed, with the
     lines themselves. */
  const same = pool.filter(([, x]) => x[0] <= od + SAME_TRACK_PX);
  const over = same.map(([id, [, sec, t]]) => linesOverTrack(sec[3], t, 2));
  const ids = over.every(Boolean)
    ? [...new Set([owner, ...same.map(([id]) => id), ...over.flat()])].filter(id => LINE_BY_ID.has(id))
    : near.filter(([, x]) => x[0] <= m + 4).map(([id]) => id);
  openTrackLines(ids, owner);
}

/* Clicking a piece of track opens the line that owns it (ownership.py gives every drawn way
   one owner), with every other line over it listed under it. The way id is only carried at
   z10 and above, because below that the tiles hold merged chains rather than individual
   ways and there is no single way to name.
   ways.json gives each way the indices of the lines over it, THE OWNER FIRST (build_model.main
   writes it so). A way with no owner keeps its list in index order, and is either listed in
   `unowned` or starts with a named train, which never owns. A ways.json from before owners
   has no `unowned` at all, and then no owner is read from it. */
const WAYS = new Map();     // cc -> promise of that country's ways.json
async function pickTrack(feature) {
  const w = feature.properties.w;
  if (!w) return;
  const cc = feature.layer.id.replace('track-hit-', '');
  if (!WAYS.has(cc)) {
    // 1-2 MB a country, so it is fetched the first time someone clicks a line there.
    WAYS.set(cc, dataFetch(`data/${cc}/ways.json`).then(r => r.json())
      .then(j => ({ ...j, free: Array.isArray(j.unowned) ? new Set(j.unowned) : null }))
      .catch(() => { WAYS.delete(cc); return { lines: [], ways: {}, free: null }; }));
  }
  // A click can land on a country whose tiles are in but whose lines are still arriving.
  const [ways] = await Promise.all([WAYS.get(cc), loadRegion(cc)]);
  const idxs = ways.ways[String(w)];
  if (!idxs || !idxs.length) return;
  // Folded as the lines were (LINE_FOLD), the owner still first.
