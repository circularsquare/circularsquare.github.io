}

/* Every station a run of sections passes through, ends included. A part of a section
   (spanOf) passes only the ends it reaches. */
function pathStations(gids) {
  const s = new Set();
  for (const vg of gids) {
    const [gid, lo, hi] = spanOf(vg);
    const e = SEC_BY_GID.get(gid);
    if (!e) continue;
    if (lo <= 0) s.add(e.sec[0]);
    if (hi >= 1) s.add(e.sec[1]);
  }
  return s;
}

function rideGids(ride) {
  if (ride._gids) return ride._gids;
  const line = LINE_BY_ID.get(ride.line);
  if (!line) return (ride._gids = []);
  // A whole-line ride is not expressible as from -> to on a LOOP, where the first and last
  // stop are the same station and the shortest path between them is nothing at all. It also
  // saves picking two ends on a line with branches.
  /* On a line over a border, "all of it" is the pieces the ride was saved with (`regions`).
     A ride saved before lines were joined saw only its own country's piece, and keeps
     meaning that. */
  if (ride.whole) {
    const parts = partsOf(line);
    const mine = parts.length > 1
      ? parts.filter(p => (ride.regions || [rideRegion(ride)]).includes(p.region)) : parts;
    let secs = (mine.length ? mine : parts).flatMap(p => p.sections);
    /* All of a line since folded into this one (`wholeOf`, set by migrateRide) is that line's
       own sections, by their two stations: all of France's "Eurostar: Paris - Amsterdam" is
       not the Eurostar's branch to Marne-la-Vallée as well. */
    if (ride.wholeOf) {
      const key = s => (s[0] < s[1] ? `${s[0]}|${s[1]}` : `${s[1]}|${s[0]}`);
      const own = new Set(parts.flatMap(p => (p.origs || [])
        .filter(o => o.file === ride.wholeOf).flatMap(o => o.sections.map(key))));
      if (own.size) secs = secs.filter(s => own.has(key(s)));
    }
    return (ride._gids = secs.map(s => s[3]));
  }
  // Stored as a flag rather than as the sections taken, because section ids are not stable
  // across rebuilds and the two stations are.
  const viaChain = () => {
    const [u, v] = ride.via.split('|');
    const ch = lineOrphans(line).find(c => (c.u === u && c.v === v) || (c.u === v && c.v === u));
    return ch ? chainPath(line, ride.from, ride.to, ch, false) : null;
  };
  const p = ride.around ? pathAround(line, ride.from, ride.to)
    : (ride.via && !ride.cuts && viaChain())
      || (ride.drawn && !ride.cuts && drawnPath(line, ride.from, ride.to))
      || pathBetween(line, ride.from, ride.to, null, null, ride.cuts);
  return (ride._gids = p ? p.gids : []);
}

function newRide(lineId, from, to, date, opts = {}) {
  const line = LINE_BY_ID.get(lineId) || {};
  const regions = [...new Set([...(line.regions || []), ...(SHARED_LINES[lineId] || [])])];
  // On a line over a border: the country got on in, and every country the line runs through.
  const st = STATIONS[from];
  const region = (st && regions.length > 1 && regions.includes(st.region) ? st.region
    : line.region) || FOCUS;
  const ride = {
    id: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    region,
    line: lineId, from, to, date: date || '', note: '',
    added: new Date().toISOString(),
  };
  if (regions.length > 1) ride.regions = [...regions];
  if (opts.whole) ride.whole = true;
  if (opts.around) ride.around = true;
  if (opts.drawn && !opts.around) ride.drawn = true;      // the way the diagram draws (drawnGraph)
  if (opts.via && !opts.around) ride.via = opts.via;      // over a chain no other pick rides (lineOrphans)
  // A ride from or to a junction its line passes mid-section (cutGraph).
  if (opts.cuts && Object.keys(opts.cuts).length) ride.cuts = opts.cuts;
  return ride;
}

/* Several rides as one action, so one undo takes back a whole traced journey or a whole
   operator marked at once. */
function addRides(rides, label) {
  if (!rides.length) return;
  remember(label);
  RIDES.push(...rides);
  saveRides();
  afterChange();
}

function addRide(lineId, from, to, date, opts) {
  const ride = newRide(lineId, from, to, date, opts);
  addRides([ride], `Added ${rideLabel(ride)}`);
  return ride;
}

function removeRide(id) {
  const r = RIDES.find(x => x.id === id);
  if (!r) return;
  remember(`Removed ${rideLabel(r)}`);
  RIDES = RIDES.filter(x => x.id !== id);
  if (EDITING === id) EDITING = null;
  saveRides();
  afterChange();
}

function rideLabel(r) {
  const line = LINE_BY_ID.get(r.line);
  const name = line ? lineName(line) : r.line;
  return r.whole ? `all of ${name}` : `${name}, ${stName(r.from)} → ${stName(r.to)}`;
}

/* UNDO. In memory only, so it lasts as long as the page does. Every change to RIDES goes
   through remember() first, which snapshots the whole list: rides are small, and a snapshot
   cannot get out of step with the change the way an inverse operation can. */
const UNDO = [];
function remember(label) {
  UNDO.push({ label, rides: JSON.stringify(RIDES, dropCache) });
  if (UNDO.length > 100) UNDO.shift();
}
function undo() {
  const u = UNDO.pop();
  if (!u) return;
  RIDES = JSON.parse(u.rides);
  EDITING = null;
  saveRides();
  afterChange();
}
function showUndo() {
  const el = document.getElementById('undobar');
  const u = UNDO[UNDO.length - 1];
  el.style.display = u ? 'flex' : 'none';
  if (u) document.getElementById('undolabel').textContent = u.label;
}
document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey) || e.shiftKey || e.key.toLowerCase() !== 'z') return;
  // Inside a text box, Ctrl+Z is that box's own undo.
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT'))
    return;
  e.preventDefault();
  undo();
});

// ---------------------------------------------------------------- crediting

/* ONE OWNER FOR EVERY PIECE OF TRACK (Anita, 2026-10-01). No piece of track is counted twice:
   each belongs to exactly one line, and that decides only what a ride credits. Rides are
   still entered on any service over any path.

   The build (ownership.py) gives every drawn way one owner: a register line where one lies on
   it, else an OpenStreetMap line whose route runs over it, the lowest ref first where several
   do (natural sort, empty refs last, then name, then id). Named trains own nothing. Then each
   section gets a FOOTPRINT, foot.json: the owner sections it runs over, as entries
   [owner section, from, to, a, b], meaning the stretch a..b of this section (fractions of its
   length) lies on from..to of the owner section (`to < from` where it runs the other way).
   A section not in foot.json is its own footprint, whole.

   A ride credits the footprints of the sections it rides. So riding an IC over register
   track credits the register lines it runs on and nothing beside them; riding a metro
   through-service onto a private railway credits that railway. */
const FOOT = new Map();       // section gid -> [[owner gid, from, to, a, b], ...]
const FOOT_INTO = new Map();  // owner gid -> gids whose footprint names it
const FOOT_REGIONS = new Set();  // countries whose foot.json has any footprint
const OWNSP = new Map();      // owner gid -> merged spans of it its own line owns
let OWN_GEN = 0;              // bumped whenever OWNSP changes, for the per-line caches
let DATA_GEN = 0;             // bumped whenever a country's data is merged in
const footOf = gid => FOOT.get(gid) || [[gid, 0, 1, 0, 1]];
const secKm = gid => { const e = SEC_BY_GID.get(gid); return e ? e.sec[2] : 0; };
const regionOfGid = gid => gid.slice(0, gid.indexOf(':'));
const isRegisterLine = l => !!l && partsOf(l).some(p => p.src !== 'osm');

/* Spans [lo, hi] along one section merged. GAPS UNDER 150 m ARE CLOSED, at the ends of a
   section and between two spans: a ride along one line covers a parallel one up to where the
   two part to reach their own platforms, a few tens of metres short of the station. Capped at
   10% of the section, so a short one is not completed by a ride that only touched it. */
function mergeSpans(spans, km) {
  if (!spans.length) return [];
  const tol = km > 0 ? Math.min(0.15 / km, 0.1) : 0;
  const s = spans.map(x => [x[0], x[1]]).sort((p, q) => p[0] - q[0]);
  const out = [];
  for (const [lo, hi] of s) {
    const last = out[out.length - 1];
    if (last && lo <= last[1] + tol) last[1] = Math.max(last[1], hi);
    else out.push([lo, hi]);
  }
  if (out[0][0] <= tol) out[0][0] = 0;
  if (out[out.length - 1][1] >= 1 - tol) out[out.length - 1][1] = 1;
  return out;
}
const spansLength = sp => Math.min(1, sp.reduce((n, [lo, hi]) => n + hi - lo, 0));
function spansMeet(a, b) {
  let out = 0, i = 0, j = 0;
  while (i < a.length && j < b.length) {
    const lo = Math.max(a[i][0], b[j][0]), hi = Math.min(a[i][1], b[j][1]);
    if (hi > lo) out += hi - lo;
    if (a[i][1] < b[j][1]) i++; else j++;
  }
  return out;
}

/* What each line owns, worked out as a country loads: the union of the footprints of its own
   sections onto each of them. A register section owns itself whole unless it lies on rails
   another register line owns; an OSM section owns the part of it on track its line owns. */
function ownTrack(cc) {
  const raw = new Map();
  for (const line of LINES) for (const p of partsOf(line)) {
    if (p.region !== cc) continue;
    for (const [a, b, km, gid] of p.sections) {
      const f = FOOT.get(gid);
      if (f) for (const e of f) {
        if (!FOOT_INTO.has(e[0])) FOOT_INTO.set(e[0], []);
        FOOT_INTO.get(e[0]).push(gid);
      }
      if (p.service || CLOSED.has(gid)) continue;
      for (const [t, from, to] of footOf(gid)) {
        const te = SEC_BY_GID.get(t);
        if (!te || te.line.id !== p.id || CLOSED.has(t) || to === from) continue;
        if (!raw.has(t)) raw.set(t, []);
        raw.get(t).push([Math.min(from, to), Math.max(from, to)]);
      }
    }
  }
  for (const [t, iv] of raw) OWNSP.set(t, mergeSpans(iv, secKm(t)));
  OWN_GEN++;
}

/* Km a line's piece owns, and km of it on track no register line owns. Cached per OWN_GEN. */
function ownedKm(p) {
  if (p._own && p._own.gen === OWN_GEN) return p._own.km;
  let km = 0;
  for (const [a, b, secK, gid] of p.sections)
    if (!CLOSED.has(gid)) km += secK * spansLength(OWNSP.get(gid) || []);
  p._own = { gen: OWN_GEN, km };
  return km;
}
function offRegisterKm(p) {
  if (p._off && p._off.gen === OWN_GEN) return p._off.km;
  let km = 0;
  for (const [a, b, secK, gid] of p.sections) {
    if (CLOSED.has(gid)) continue;
    for (const [t, from, to, x, y] of footOf(gid)) {
      const te = SEC_BY_GID.get(t);
      if (te && te.line.src === 'osm') km += secK * Math.abs(y - x);
    }
  }
  p._off = { gen: OWN_GEN, km };

}

/* WHICH LINES ARE LISTED as lines of their own (the lists, the operators, the finished
   count). Register lines always, unless all their track belongs to another line (one of a
   tunnel's two bores, a track the register lists as a line of its own). Named trains never.
   An OpenStreetMap line when at least OFF_REGISTER_SHARE of it runs on track no register line
   owns: RER A and B, the Paris Metro, every tram. Judged on track off the register, not on
   what the line ends up owning, so a metro sharing its trunk with a lower-numbered line
   (Brussels' 6 over the 2) is still a line. Below that it is an operating pattern over
   register lines, and the few km it owns are register gaps the build logs. */
const OFF_REGISTER_SHARE = 0.4;
function listedBase(l) {
  if (l.parts) return l.parts.some(listedBase);
  if (l.src !== 'osm') return !(l.km > 0.05) || ownedKm(l) > 0.05;
  if (l.service) return false;
  const off = offRegisterKm(l);
  return off > 0.05 && off >= OFF_REGISTER_SHARE * l.km;
}
// Listed, with the routes of ROUTE_CCS in place of the register track they cover.
function listed(l) {
  if (l.parts) return l.parts.some(listed);
  if (ROUTE_CCS.has(l.region)) return routesOf(l.region).rows.has(l.id);
  return listedBase(l);
}

/* ROUTES, NOT SUBDIVISIONS, IN THE US, CANADA AND AUSTRALIA (Anita, 2026-10-09: "routes become
   what operator lists show. though we can leave corridors that are well known and/or have lots
   of different services on them like northeast corridor"). The register there is track: the
   FRA's subdivisions ("Nevada Subdivision"), Geoscience Australia's track names. Riders know
   the routes: Amtrak's California Zephyr, Metra's BNSF Line, VIA's Canadian, Sydney's T1. So
   in these countries the LISTED lines (lists, operators, totals) are:
   - every OpenStreetMap line of the country (a ROUTE): metro and tram lines as before, and the
     operating patterns and named trains, each with a percentage of its own (option B does not
     hold here: named trains count);
   - a register line where the routes leave part of it uncovered (more than ROUTE_GAP_KM or
     ROUTE_GAP_SHARE of it), so every piece of track stays in some row;
   - a CORRIDOR: a register line of CORRIDOR_KM or more that at least CORRIDOR_SERVICES routes
     of at least CORRIDOR_OPERATORS operators each run over for CORRIDOR_SHARE of it or more,
     tourist trains aside (the Northeast Corridor, the Keystone Corridor, Metro-North's Hudson
     Line, Chicago's BNSF and Joliet lines, the Pacific Surfliner's Orange and Ventura
     Subdivisions). Many routes of one operator over the same track (Amtrak's Florida trains,
     duplicated OSM relations of one XPT) do not make one: the routes already are the lines.
   Everything is measured on the footprints (foot.json, footOf), as unionTotals counts track,
   so a country's and an operator's total stay the union of their listed lines and riding every
   one of them reads 100% (tools/line_100_probe.js). Crediting is unchanged: a ride on a route
   credits the register track under it exactly as before, and a register line not listed is
   still a line with its percentage, found by search, the Lines tab and the route's "Track".

const ROUTE_CCS = new Set(['us', 'ca', 'au']);

const ROUTE_ON_KM = 0.5, ROUTE_ON_SHARE = 0.05;
let ROUTES = { sig: null, by: new Map() };
// A piece's footprint as unionTotals counts it: owner gid -> merged spans of it.
function pieceFoot(p) {
  const raw = new Map();

    if (CLOSED.has(gid)) continue;
    for (const [t, from, to] of footOf(gid)) {
      if (to === from || CLOSED.has(t) || !SEC_BY_GID.has(t)) continue;
      if (!raw.has(t)) raw.set(t, []);
      raw.get(t).push([Math.min(from, to), Math.max(from, to)]);
    }

  for (const [t, iv] of raw) out.set(t, mergeSpans(iv, secKm(t)));
  return out;
}
function routesOf(cc) {
  const sig = OWN_GEN + '#' + DATA_GEN;
  if (ROUTES.sig !== sig) ROUTES = { sig, by: new Map() };
  let R = ROUTES.by.get(cc);
  if (R) return R;
  const routes = [], tracks = [];
  for (const line of LINES) for (const p of partsOf(line)) {
    if (p.region !== cc) continue;
    if (p.src === 'osm') { if (p.km > 0.05) routes.push({ line, p, f: pieceFoot(p) }); }
    else if (listedBase(p)) tracks.push({ line, p, f: pieceFoot(p) });
  }
  const on = new Map();             // owner gid -> [[route index, its spans there]]
  routes.forEach((r, i) => {
    for (const [t, sp] of r.f) {
      if (!on.has(t)) on.set(t, []);
      on.get(t).push([i, sp]);
    }
  });
  const rows = new Set(routes.map(r => r.p.id));
  const info = new Map();           // register line id -> what the routes do on it
  // A route's operators in this country, and whether it is a tourist train (types.json).
  const opsOf = routes.map(r => new Set((r.p.origs || [r.p]).flatMap(opKeysOf)));
  const tourist = routes.map(r => r.line.ltype === 'tourist');
  for (const tr of tracks) {

    const by = new Map();
    for (const [t, sp] of tr.f) {

      const rs = on.get(t) || [];
      km += k * mine;
      const all = rs.length ? mergeSpans(rs.flatMap(x => x[1]), k) : [];
      gap += k * Math.max(0, mine - spansMeet(sp, all));
      for (const [i, s2] of rs) {

        if (m > 0) by.set(i, (by.get(i) || 0) + m);

    }
    const on2 = [...by].filter(([, m]) => m >= Math.min(ROUTE_ON_KM, ROUTE_ON_SHARE * km))

    const covered = gap <= Math.max(ROUTE_GAP_KM, ROUTE_GAP_SHARE * km);

    info.set(tr.p.id, { km, gap, services, covered, corridor, single });

}
// What the routes do on a register line of ROUTE_CCS ({services, covered, corridor, single}).
function trackInfo(line) {
  if (!line || line.src === 'osm' || !ROUTE_CCS.has(line.region)) return null;
  return routesOf(line.region).info.get(line.id) || null;
}
/* The register lines a route runs over, in the order it reaches them, with the km of each it

function routeTracks(line) {
  if (line._tracks && line._tracks.gen === DATA_GEN) return line._tracks.list;
  const order = new Map();
  for (const p of partsOf(line)) {
    if (!ROUTE_CCS.has(p.region) || p.src !== 'osm') continue;
    const R = routesOf(p.region);
    for (const [a, b, km, gid] of p.sections) for (const [t] of footOf(gid)) {
      const e = SEC_BY_GID.get(t);
      if (!e || e.line === line || order.has(e.line.id)) continue;
      const inf = R.info.get(e.line.id);

function creditState() {

// Opens a trip in the rides list, which draws it on the map.

    let km = 0;
    // In the total's own order, term by term.
    if (m) for (const [t, own] of g.sp) {
      const r = m.get(t);
      if (r) km += secKm(t) * spansLength(spansAnd(mergeSpans(r, secKm(t)), own));
    }
    done.set(k, km);
  }
  if (of) return done;
  U.done = done;
  U.doneFor = C;
  return done;
}

/* A station with `j` is where a register line ends without stopping: a junction, or the
   national border. It is a section end, so the strip diagram shows it, but it is not
   drawn as a bubble, found by search, or offered as somewhere to get on or off. */
const isStop = id => STATIONS[id] && !STATIONS[id].j;

function stats() {
  const { frac } = creditState();
  const U = unionTotals(), D = unionDone();
  const gTotal = k => (U.groups.get(k) || { total: 0 }).total, gDone = k => D.get(k) || 0;
  const perLine = [];
  // Per country. The headline is FOCUS's; the Countries tab all of them.
  /* A LOADED COUNTRY'S TOTAL IS ITS OWN LINES' UNION (unionTotals), so that riding every line
     reads 100%. regions.json's `km` (tools/build_regions.py owned_totals: the same sum on that
     country's build alone) stands in until the country is loaded; the two differ only where a
     section two countries both built counts in whichever loaded first (a few km at most). */
  const byRegion = new Map();
  for (const cc of Object.keys(REGIONS))
    if (hasTotal(cc)) byRegion.set(cc, { done: 0, total: REGIONS[cc].km, finished: 0 });
  for (const k of U.groups.keys()) {
    if (!k.startsWith('c:')) continue;
    const cc = k.slice(2);
    byRegion.set(cc, { done: gDone(k), total: gTotal(k), finished: 0 });
  }
  for (const line of LINES) {
    const km = lineKm(line, frac);
    // A line over a border: each country its own piece.
    for (const p of partsOf(line)) {
      if (!listed(p)) continue;
      const pk = p === line ? km : lineKm(p, frac);
      const r = byRegion.get(p.region);
      if (r && pk / Math.max(p.km, 0.001) > 0.999) r.finished++;
    }
    if (km > 0.001) perLine.push({ line, km, pct: km / Math.max(line.km, 0.001) });
  }
  perLine.sort((x, y) => y.km - x.km);
  const f = byRegion.get(FOCUS) || { done: 0, total: 0 };
  const doneKm = f.done, totalKm = f.total;

  /* Operators overall, and per country (`byRegionOp`: cc -> operator -> its piece of that
     country), for the Countries tab's tree. A joint line goes under each operator. A line
     over a border goes, in each country, under the operators of that country's piece: a
     Munich - Salzburg line is DB's in Germany and ÖBB's in Austria. */
  const byOp = new Map(), byRegionOp = new Map();
  const add = (m, op) => {
    if (!m.has(op)) m.set(op, { op, label: op, km: 0, total: 0, lines: 0, done: 0, list: [] });
    return m.get(op);
  };
  for (const line of LINES) {
    if (!listed(line)) continue;
    const km = lineKm(line, frac);
    const fin = km / Math.max(line.km, 0.001) > 0.999;
    for (const op of opKeys(line)) {
      const e = add(byOp, op);
      e.lines++;
      e.list.push(line);
      if (fin) e.done++;
    }
    for (const p of partsOf(line)) {
      if (!byRegionOp.has(p.region)) byRegionOp.set(p.region, new Map());
      const here = [...new Set((p.origs || [p]).flatMap(opKeysOf))];
      for (const op of (here.length ? here : opKeys(line))) {
        const c = add(byRegionOp.get(p.region), op);
        if (!c.list.includes(line)) { c.lines++; c.list.push(line); if (fin) c.done++; }
      }
    }
  }
  // Totals and km ridden: the union of each one's lines (unionTotals).
  for (const e of byOp.values()) { e.total = gTotal(`o:${e.op}`); e.km = gDone(`o:${e.op}`); }
  for (const [cc, m] of byRegionOp)
    for (const c of m.values()) { c.total = gTotal(`r:${cc}|${c.op}`); c.km = gDone(`r:${cc}|${c.op}`); }
  const ops = [...byOp.values()].filter(e => e.km > 0.001).sort((a, b) => b.km - a.km);
  return { frac, perLine, ops, byOp, byRegionOp, doneKm, totalKm, byRegion,
           finished: perLine.filter(p => p.pct > 0.999).length };
}

// ---------------------------------------------------------------- ridden on the map

/* Only the sections actually ridden are drawn, not everything they credit: a credited
   section lies on the same rails, so drawing both would just double-draw them. */
let RIDDEN_GEN = 0;         // the same guard as paintSelection's, for the same race

async function paintRidden() {
  if (!mapReady || !map.getSource('ridden')) return;
  const gen = ++RIDDEN_GEN;
  const wanted = new Map();      // line id -> section gid -> the parts of it ridden
  for (const ride of here()) {
    const line = LINE_BY_ID.get(ride.line);
    if (!line) continue;
    if (!wanted.has(line.id)) wanted.set(line.id, new Map());
    const m = wanted.get(line.id);
    for (const vg of rideGids(ride)) {
      const [gid, lo, hi] = spanOf(vg);
      if (!m.has(gid)) m.set(gid, []);
      m.get(gid).push([lo, hi]);
    }
  }
  const features = [];
  for (const [lineId, gids] of wanted) {
    const line = LINE_BY_ID.get(lineId);
    const g = await geomFor(lineId);
    if (gen !== RIDDEN_GEN) return;
    const colour = lineColour(line);
    for (const [a, b, km, gid] of line.sections) {
      if (!gids.has(gid)) continue;
      const pts = g[`${a}|${b}`];
      if (!pts || pts.length < 2) continue;
      for (const [lo, hi] of mergeSpans(gids.get(gid), 0)) {
        const piece = hi > lo && sliceLine(pts, lo, hi);
        if (piece) features.push({ type: 'Feature', properties: { c: colour, l: lineId },
                                   geometry: { type: 'LineString', coordinates: piece } });
      }
    }
  }
  map.getSource('ridden').setData({ type: 'FeatureCollection', features });
}

/* Every not-running section of every loaded country, for the base map. A few lines a
   country, so their geometry is fetched as soon as the country's lines are in. */
let CLOSED_GEN = 0;
let CLOSED_PAINTED = false;     // closed.json is drawn once; it does not change as countries load
async function paintClosed(force) {
  if (!mapReady || !map.getSource('closed')) return;
  const gen = ++CLOSED_GEN;
  await CLOSED_READY;          // so a country loading first does not fetch geometry files
  if (gen !== CLOSED_GEN) return;
  if (CLOSED_ALL) {
    if (CLOSED_PAINTED && !force) return;
    CLOSED_PAINTED = true;
    map.getSource('closed').setData({ type: 'FeatureCollection', features: CLOSED_ALL.map(
      ([cc, l, pts]) => ({ type: 'Feature', properties: { l, cc },
                           geometry: { type: 'LineString', coordinates: pts } })) });
    return;
  }
  const features = [];
  for (const line of LINES) {
    if (!line.km_closed) continue;
    const g = await geomFor(line.id);
    if (gen !== CLOSED_GEN) return;
    for (const [a, b, km, gid] of line.sections) {
      const pts = CLOSED.has(gid) && g[`${a}|${b}`];
      if (pts && pts.length > 1)
        features.push({ type: 'Feature', properties: { l: line.id },
                        geometry: { type: 'LineString', coordinates: pts } });
    }
  }
  map.getSource('closed').setData({ type: 'FeatureCollection', features });
}

// ---------------------------------------------------------------- panel

let VIEW = { kind: 'home' };
// `around` asks for the other way between the two ends, where there is one (a loop).
let PICK = { from: null, to: null, around: false };
let EDITING = null;        // the ride whose date and note are open for editing
// The legs of one journey share a date, so the last one entered is the default.
let LAST_DATE = '';

/* The panel's state. On a phone (the CSS's 720 px) it is a sheet: `sheet` on the body shrinks
   the map above it, and the map is told its new size, keeping its centre, which is where a
   tapped station usually is. On a wider screen the classes change nothing. */
let SHEET_FULL = false;
function openPanel(on) {
  document.getElementById('panel').classList.toggle('open', on);
  if (!on) SHEET_FULL = false;
  layoutSheet();
}
function sheetFull(on) {
  SHEET_FULL = on;
  layoutSheet();
}
function layoutSheet() {
  const open = document.getElementById('panel').classList.contains('open');
  document.getElementById('panel').classList.toggle('full', open && SHEET_FULL);
  document.body.classList.toggle('sheet', open);
  const b = document.getElementById('panel-size');
  if (b) b.textContent = SHEET_FULL ? 'shrink' : 'expand';
  map.resize();
}

/* What the map draws as selected: the whole of the chosen line, every station on it, and the
   two ends of the trip being entered. Redrawn from VIEW and PICK, so there is one place that
   decides what selection looks like and no way for the panel and the map to disagree. */
/* With a line open or a journey being traced, EVERYTHING not part of it drops back,
   including the ridden overlay: the selection's own ridden part is redrawn on top from the
   `sel` source, so muting the overlay loses nothing of the line being looked at. */
function setMuted(on) {
  if (!mapReady || !map.getLayer('ridden')) return;
  MUTED_NOW = on;
  applyTrackColour();
  riddenShown();
  for (const id of ['station', 'station-ic']) {
    map.setPaintProperty(id, 'circle-opacity', on ? 0.3 : 1);
    map.setPaintProperty(id, 'circle-stroke-opacity', on ? 0.3 : 1);
  }
  map.setPaintProperty('closed', 'line-opacity', on ? 0.4 : 1);
}

/* "VIEW ALL LINES" DRAWS NO RIDDEN OVERLAY (Anita, 2026-10-09: "this is all lines mode so we
   shouldn't be thinking about that"). Its two layers go to opacity 0 there, a constant for a
   constant, so a mode switch reloads nothing; the data stays, so switching back is instant.
   The tracker's muting holds the overlay back as before. */
function riddenShown() {
  if (!mapReady || !map.getLayer('ridden')) return;
  const off = MODE !== 'ridden';
  map.setPaintProperty('ridden', 'line-opacity', off ? 0 : MUTED_NOW ? 0.25 : 1);
  map.setPaintProperty('ridden-casing', 'line-opacity', off ? 0 : MUTED_NOW ? 0.2 : 0.85);
}

/* THE SELECTED LINE AND THE DIMMING IN THE SAME FRAME (2026-10-09, Anita: "maybe we hide
   everything else and then change the draw style of the selected line. could we prioritize
   redrawing the selected line"). Muting is a paint swap and shows on the very next frame; the
   selection is GeoJSON, which goes to its worker and back twice (the data, then each tile)
   before it is drawn, after its geometry has arrived. So the map used to show everything dimmed
   with nothing selected for 1-6 frames (more when the line's file was fetched first). Now:
   - Dimming waits for the selection to be drawn (`selDrawn`, on the sources' own `sourcedata`),
     and goes on in the frame that draws it; never later than MUTE_HOLD_MS, so a slow fetch
     does not leave the map undimmed for long.
   - Clearing undims and hides the old selection in the same next frame (`selHidden`: constant
     opacities, so nothing reloads); it is shown again with the next selection drawn.
   - One selection setData in flight at a time; a newer one waits for it and replaces any
     waiting (`SEL_NEXT`), so the first one drawn is never held back by a later one.
   - A newly selected line goes out first on its own (with its stations), in the click's own
     task when its geometry is on hand; what is drawn past its junction ends follows. */
const MUTE_HOLD_MS = 250;
const SEL_WATCHDOG_MS = 1500;   // a setData never answered (a style swap under it) stops waiting
let MUTE_WANT = false, MUTE_HOLD = null;
let SEL_HIDDEN = false;
let SEL_WAIT = null;            // the watchdog timer of the setData in flight, or null
let SEL_NEXT = null;            // [lines, points] waiting for it
let SEL_KEY = null;             // the line the sources hold (or are being given), else null
const SEL_OPACITY = [['sel-line', 'line-opacity', 1], ['sel-gone', 'line-opacity', 1],
  ['sel-done-casing', 'line-opacity', 0.85], ['sel-done', 'line-opacity', 1],
  ['sel-run-casing', 'line-opacity', 0.85], ['sel-run', 'line-opacity', 1],
  ['sel-station', 'circle-opacity', 1], ['sel-station', 'circle-stroke-opacity', 1]];
// `linesOnly`: the lines shown again, the station rings left for their own source's data.
let SEL_ST_HIDDEN = false;
function selHidden(on, linesOnly) {
  if (!map.getLayer('sel-halo')) return;
  if (SEL_HIDDEN !== on) {
    SEL_HIDDEN = on;
    map.setPaintProperty('sel-halo', 'line-opacity', on ? 0 : THEME.haloOpacity);
    for (const [id, k, v] of SEL_OPACITY) if (id !== 'sel-station') map.setPaintProperty(id, k, on ? 0 : v);
  }
  if (linesOnly || SEL_ST_HIDDEN === on) return;
  SEL_ST_HIDDEN = on;
  for (const [id, k, v] of SEL_OPACITY) if (id === 'sel-station') map.setPaintProperty(id, k, on ? 0 : v);
}
function wantMuted(on) {
  MUTE_WANT = on;
  if (!on) {
    // What was selected (or is about to be drawn) goes with the dimming, in one frame; the
    // next selection drawn shows the layers again.
    if (MUTED_NOW || MUTE_HOLD) { if (MUTED_NOW) setMuted(false); selHidden(true); }
    clearTimeout(MUTE_HOLD); MUTE_HOLD = null;
    return;
  }
  if (MUTED_NOW || MUTE_HOLD) return;
  MUTE_HOLD = setTimeout(() => { MUTE_HOLD = null; if (MUTE_WANT && !MUTED_NOW) setMuted(true); },
                         MUTE_HOLD_MS);
}
let SEL_FLIGHT = null;          // the setData in flight: { gen: its paintSelection, n: features }
function selSet(lines, pts, key, gen, fresh) {
  // `fresh`: the first drawing of a newly selected line, which nothing else should hold up.
  if (fresh === undefined) fresh = !!key && key !== SEL_KEY;
  SEL_KEY = key || null;
  if (SEL_WAIT) { SEL_NEXT = [lines, pts, gen, fresh]; return; }
  SEL_FLIGHT = { gen, n: lines.features.length + pts.features.length, fresh };
  SEL_WAIT = setTimeout(selDrawn, SEL_WATCHDOG_MS);
  map.getSource('sel').setData(lines);
  map.getSource('selst').setData(pts);
}
/* The lines of the selection in flight are drawn: the dimming goes on with them, without
   waiting for the station rings (a long task between the two sources' tiles held it back a
   quarter of a second once). For the state asked for last, or for an older line on the map
   while a newer waits, since dimming is wanted around that too. */
function selLinesDrawn() {
  const f = SEL_FLIGHT || { gen: PAINT_GEN, n: 0 };
  const current = f.gen === PAINT_GEN;
  if (MUTE_WANT && !MUTED_NOW && (current || (f.n > 0 && !SEL_HIDDEN))) {
    clearTimeout(MUTE_HOLD); MUTE_HOLD = null; setMuted(true);
  }
  if (current) selHidden(false, true);
}
function selDrawn() {
  clearTimeout(SEL_WAIT); SEL_WAIT = null;
  selLinesDrawn();
  const f = SEL_FLIGHT || { gen: PAINT_GEN, n: 0 };
  SEL_FLIGHT = null;
  // Drawn for the state asked for last: shown. An older one drawn while a newer waits stays
  // hidden if hidden.
  const current = f.gen === PAINT_GEN;
  if (current) selHidden(false);
  if (SEL_NEXT) { const [l, p, g, fr] = SEL_NEXT; SEL_NEXT = null; selSet(l, p, SEL_KEY, g, fr); }
  const ws = SEL_WAITERS; SEL_WAITERS = [];
  for (const w of ws) w();
}
/* Resolves once the selection in flight has been drawn (or after `ms`), after the frame that
   draws it: work that would hold that frame up (the walks past a line's ends, the panel
   redrawn as neighbours' geometry lands) waits for this. */
let SEL_WAITERS = [];
function selSettled(ms) {
  return new Promise(res => {
    const after = () => requestAnimationFrame(() => setTimeout(res, 0));
    if (!SEL_WAIT) return res();
    const t = setTimeout(after, ms);
    SEL_WAITERS.push(() => { clearTimeout(t); after(); });
  });
}
function selReset() {
  clearTimeout(SEL_WAIT); SEL_WAIT = null; SEL_NEXT = null; SEL_KEY = null; SEL_FLIGHT = null;
}
/* Tile by tile as the worker answers; both sources loaded is the frame about to be drawn.
   Not on 'metadata': MapLibre 4.7 sends it with the worker's answer to setData, before the
   tiles are told to reload, so the source reads as loaded with the old tiles still in. */
map.on('sourcedata', e => {
  if (!SEL_WAIT || (e.sourceId !== 'sel' && e.sourceId !== 'selst')
      || e.sourceDataType === 'metadata' || !map.isSourceLoaded('sel')) return;
  if (map.isSourceLoaded('selst')) selDrawn();
  else selLinesDrawn();
});

/* Each call is numbered, and a call that finds a newer one started while it awaited
   geometry gives up. Otherwise two quick clicks race, and whichever fetch lands last draws
   the older state over the newer one. */
let PAINT_GEN = 0;

/* What is drawn held back (`base`) is blended towards the background, in new features: a
   feature already sent may not be changed (the line goes out before its continuations). In
   Browse every part is drawn at full colour (Anita, 2026-10-09: "this is all lines mode so we
   shouldn't be thinking about that"); held back means not ridden, which is the tracker's. */
function heldBack(features) {
  if (MODE !== 'ridden') return features.slice();
  return features.map(f => (f.properties.part === 'base'
    ? { ...f, properties: { ...f.properties, c: dimmed(f.properties.c, 0.45) } } : f));
}

async function paintSelection() {
  if (!mapReady || !map.getSource('sel')) return;
  const gen = ++PAINT_GEN;
  const shown = shownTrip();
  wantMuted(VIEW.kind === 'line' || VIEW.kind === 'trace' || !!opDrawn() || !!shown);
  let sent = null;                  // the line sent on its own first: [lines, points] counts
  const lines = { type: 'FeatureCollection', features: [] };
  const pts = { type: 'FeatureCollection', features: [] };
  // `at`: where the ring goes, when not at the station's own point (linePoint).
  const mark = (id, role, colour, at) => {
    const s = STATIONS[id];
    if (!s) return;
    pts.features.push({ type: 'Feature',
                        properties: { role: role || '', id, c: colour || THEME.stStroke },
                        geometry: { type: 'Point', coordinates: at || [s.x, s.y] } });
  };
  // Station -> its point on the line of each leg drawn (trips and traces over several lines).
  const legAt = new Map();
  const noteLeg = (line, g, gids) => {
    for (const s of pathStations(gids)) if (!legAt.has(s)) {
      const p = linePoint(line, g, s);
      if (p) legAt.set(s, p);
    }
  };

  if (VIEW.kind === 'line') {
    const line = LINE_BY_ID.get(VIEW.id);
    if (line) {
      // Without a wait when the geometry is in: the line then goes out in the click's task.
      let g = geomHave(line.id);
      const fetched = !g;
      if (fetched) {
        g = await geomFor(line.id);
        if (gen !== PAINT_GEN) return;   // moved on while fetching
      }
      const run = pickedRun();
      drawLine(line, g, run && run.p ? run.p.gids : null, PICK.from, PICK.to, lines, mark);
      /* A NEWLY SELECTED LINE GOES OUT ON ITS OWN, with its stations, before anything that
         would make it wait: a file to fetch for what is drawn past its ends, or (its own file
         just arrived) the walks past those ends when not worked out yet (throughCached),
         which take a while on a big network and are left until the line is up. When everything is in hand it all goes in one setData,
         which is one trip to the worker. Redrawing the line already shown always sends it
         whole: sent in two, its continuations would blink off for a frame. */
      const fresh = SEL_KEY !== line.id;
      const first = () => {
        if (!fresh || sent) return;
        sent = [lines.features.length, pts.features.length];
        selSet({ type: 'FeatureCollection', features: heldBack(lines.features) },
               { type: 'FeatureCollection', features: pts.features.slice() }, line.id, gen);
      };
      /* Another line's geometry, as `geomHave(id) || await fetchAfter(id)`: in hand, with no
         await (which would put off the setData until after the panel is drawn); else
         fetched once the line has gone out. */
      const fetchAfter = id => { first(); return geomFor(id); };
      if (fetched && fresh && !throughCached(line)) {
        first();
        await selSettled(150);
        if (gen !== PAINT_GEN) return;
      }
      // A run past a junction end: its legs on the other lines, in the run's colour.
      for (const leg of (run && run.legs) || []) {
        if (leg.line === line) continue;
        const g2 = geomHave(leg.line.id) || await fetchAfter(leg.line.id);
        if (gen !== PAINT_GEN) return;
        lines.features.push(...runFeatures(leg.line, leg.p.gids, g2, THEME.run));
      }
      /* The stops past its junction ends, as faint rings: the rows of the diagram that can be
         picked there (contRows, the diagram's own list). A picked one, off this line, filled
         like the line's own picked ends. And the track from the junction to each, drawn as
         the line is (held back, with its halo) in the colour of the line it runs on, so a
         stop past the junction is not left floating away from the line (Anita, 2026-10-05). */
      const on = lineStations(line), offLine = new Set();
      for (const [j, rows] of contEnds(line)) {
        const J = STATIONS[j];
        for (const r of rows) {
          offLine.add(r.st);
          if (r.kind === 'thru') {
            for (const leg of r.legs) {
              const g2 = geomHave(leg.line.id) || await fetchAfter(leg.line.id);
              if (gen !== PAINT_GEN) return;
              lines.features.push(...runFeatures(leg.line, leg.gids, g2, lineColour(leg.line), 'base'));
            }
          } else if (r.gid && J) {
            // The service's section runs from a stop of this line: only the part past j.
            const e = SEC_BY_GID.get(r.gid);
            const g2 = e && (geomHave(e.line.id) || await fetchAfter(e.line.id));
            if (gen !== PAINT_GEN) return;
            const pts = e && g2[`${e.sec[0]}|${e.sec[1]}`];
            if (!pts || pts.length < 2) continue;
            const t = nearOnPoly(pts, J.x, J.y).t;
            /* The half towards the stop, told by which end of the geometry lies nearer it: a
               section's points need not run in the order of its key (the Northeast
               Regional's Penn Station|New Rochelle runs New Rochelle first, and the half
               drawn lay under the Hell Gate Line itself; Anita, 2026-10-05). */
            const S = STATIONS[r.st], p0 = pts[0], p1 = pts[pts.length - 1];
            const d2 = p => (p[0] - S.x) ** 2 + (p[1] - S.y) ** 2;
            const piece = S && d2(p0) < d2(p1) ? sliceLine(pts, 0, t) : sliceLine(pts, t, 1);
            if (piece) lines.features.push({ type: 'Feature',
              properties: { part: 'base', c: lineColour(e.line) },
              geometry: { type: 'LineString', coordinates: piece } });
          }
        }
      }
      for (const s of offLine)
        if (!on.has(s) && s !== PICK.from && s !== PICK.to) mark(s, 'reach', THEME.stStroke);
      for (const [s, role] of [[PICK.from, 'from'], [PICK.to, 'to']])
        if (s && !on.has(s)) mark(s, role, THEME.run);
    }
  } else if (shown) {
    /* A trip opened in the rides list, drawn the way the line view would draw it, while the
       panel stays on the list. On one line: that line, with the trip over it in white. Over
       several: each leg in its own line's colour, as the trace draws a journey. */
    const first = shown.rides[0], last = shown.rides[shown.rides.length - 1];
    const lineIds = [...new Set(shown.rides.map(r => r.line))];
    if (lineIds.length === 1) {
      const line = LINE_BY_ID.get(lineIds[0]);
      if (line) {
        const g = await geomFor(line.id);
        if (gen !== PAINT_GEN) return;
        const gids = [...new Set(shown.rides.flatMap(rideGids))];
        drawLine(line, g, gids, first.whole ? null : first.from,
                 last.whole ? null : last.to, lines, mark);
      }
    } else {
      const via = new Set(), stops = new Set();
      for (const r of shown.rides) {
        const line = LINE_BY_ID.get(r.line);
        if (!line) continue;
        const g = await geomFor(line.id);
        if (gen !== PAINT_GEN) return;
        lines.features.push(...runFeatures(line, rideGids(r), g, lineColour(line)));
        for (const s of pathStations(rideGids(r))) via.add(s);
        noteLeg(line, g, rideGids(r));
        stops.add(r.from); stops.add(r.to);
      }
      for (const s of via) if (!stops.has(s) && isStop(s)) mark(s, 'via', null, legAt.get(s));
      // A junction between two legs is passed through, not got off at.
      for (const s of stops) if (isStop(s)) mark(s, 'from', THEME.run, legAt.get(s));
    }
    if (FIT_TRIP === shown.key) {
      FIT_TRIP = null;
      fitIfOutside(lines.features.filter(f => f.properties.part === 'run'));
    }
  } else if (opDrawn()) {
    /* An operator: all its lines drawn as a selected line is, the rest held back, and brought
       into view when first opened (Anita, 2026-10-07). No station rings: an operator's lines
       hold thousands. From its own view, or from an open row in the home lists. */
    opsNow();
    const o = OPS[OP_INDEX.get(opDrawn())];
    if (o) {
      const ls = o.lines.slice(0, OP_DRAW_MAX);
      const gs = await Promise.all(ls.map(l => geomFor(l.id)));
      if (gen !== PAINT_GEN) return;
      ls.forEach((line, i) => drawLine(line, gs[i], null, null, null, lines, () => { }));
      if (FIT_OP === o.key) {
        FIT_OP = null;
        fitIfOutside(lines.features);
      }
    }
  } else if (VIEW.kind === 'station') {
    mark(VIEW.id, 'from');
  } else if (VIEW.kind === 'trace') {
    /* Each leg in its own line's colour, so a journey reads as the trains it was. */
    const legs = traceLegs();
    const via = new Set();
    for (const leg of legs) {
      if (!leg.line || !leg.p) continue;
      // A leg through junctions is several lines, each drawn in its own colour.
      for (const part of leg.parts || [{ line: leg.line, gids: leg.p.gids }]) {
        const g = await geomFor(part.line.id);
        if (gen !== PAINT_GEN) return;
        lines.features.push(...runFeatures(part.line, part.gids, g, lineColour(part.line)));
        for (const s of pathStations(part.gids)) via.add(s);
        noteLeg(part.line, g, part.gids);
      }
    }
    const clicked = new Set(VIEW.stops);
    /* Every station the next click could land on along a line from the last stop, as a
       faint ring. A station further on through junctions is taken too (junctionRoute), but
       has no ring: that reach is a few hundred kilometres of network in Germany. */
    for (const s of traceReachable()) if (!clicked.has(s) && !via.has(s)) mark(s, 'reach');
    for (const s of via) if (!clicked.has(s) && isStop(s)) mark(s, 'via', null, legAt.get(s));
    for (const s of clicked) mark(s, 'from', THEME.run, legAt.get(s));
  }
  // Sent already, line and all: nothing to add.
  if (sent && sent[0] === lines.features.length && sent[1] === pts.features.length) return;
  // The held-back part as a solid colour (see the sel-line layer).
  lines.features = heldBack(lines.features);
  selSet(lines, pts, VIEW.kind === 'line' ? VIEW.id : null, gen);
}

/* One line as selected: the whole of it in its own colour, the way the panel's bar draws
   it, held back where it has not been ridden (`base`) and at full strength over the part
   that has (`done`). Ridden counts whatever line the ride was entered on, so the part of a
   register line covered by a ride on an operating pattern lights up too, sliced to exactly
   the stretch of track the two share. The halo is what says "selected". Over it, `runGids` in
   white, with the stations it passes through as white rings: the same thing the diagram
   lights up, in the same place. */
function drawLine(line, g, runGids, from, to, lines, mark) {
  const own = lineColour(line);
  // Browse draws the whole line at full strength, ridden or not (heldBack; Anita 2026-10-09).
  const tracker = MODE === 'ridden';
  const spans = tracker ? creditSpans() : new Map();
  for (const [a, b, km, gid] of line.sections) {
    const c = g[`${a}|${b}`];
    if (!c || c.length < 2) continue;
    lines.features.push({ type: 'Feature',
                          properties: { part: CLOSED.has(gid) ? 'gone' : 'base', c: own },
                          geometry: { type: 'LineString', coordinates: c } });
    for (const [lo, hi] of spans.get(gid) || []) {
      const piece = sliceLine(c, lo, hi);
      if (piece) lines.features.push({ type: 'Feature', properties: { part: 'done', c: own },
                                       geometry: { type: 'LineString', coordinates: piece } });
    }
  }
  /* A station counts as reached when either section beside it has been ridden, which is
     what the diagram's filled dots mean too. */
  const frac = creditRanges();
  const dim = tracker ? dimmed(own, 0.45) : own;
  const visited = new Set();
  for (const [a, b, km, gid] of line.sections) {
    if ((frac.get(gid) || 0) > 0.999) { visited.add(a); visited.add(b); }
  }
  const via = runGids ? pathStations(runGids) : new Set();
  if (runGids) lines.features.push(...runFeatures(line, runGids, g, THEME.run));

  const seen = new Set();
  for (const [a, b] of line.sections) for (const s of [a, b]) {
    if (seen.has(s) || !isStop(s)) continue;
    seen.add(s);
    mark(s, s === from ? 'from' : s === to ? 'to' : via.has(s) ? 'via' : '',
         visited.has(s) ? own : dim, linePoint(line, g, s));
  }
}

/* WHERE A SELECTED LINE MEETS ITS STATION (Anita, 2026-10-07). A station is one point per
   complex, which at a transfer station can lie on another line's platform, so a selected
   line's ring sat ~100 m off its own track (a Chinese line's stop drawn on the crossing red
   line). With a line drawn, its rings go where its own sections end at the station: of the
   ends of the geometry of its sections at s, the one nearest the station's point (a
   section's points need not run in the order of its key). The station's point where the
   line has no geometry there, or its nearest end is over LINE_POINT_MAX_KM away (a section
   drawn to somewhere else). Everywhere else (the stations layer, hover, clicks) a station
   stays one point. */
const LINE_POINT_MAX_KM = 0.5;
function linePoint(line, g, s) {
  const S = STATIONS[s];
  if (!S || !g) return null;
  let best = null, bd = Infinity;
  for (const [a, b] of line.sections) {
    if (a !== s && b !== s) continue;
    const c = g[`${a}|${b}`] || g[`${b}|${a}`];
    if (!c || c.length < 2) continue;
    for (const p of [c[0], c[c.length - 1]]) {
      const d = crowKm(S, { x: p[0], y: p[1] });
      if (d < bd) { bd = d; best = p; }
    }
  }
  return best && bd <= LINE_POINT_MAX_KM ? [best[0], best[1]] : null;
}

/* Bring features into view, but only if they are not in view already: opening a trip that
   is on screen should not move the map out from under the reader. */
function fitIfOutside(features) {
  let minx = 180, miny = 90, maxx = -180, maxy = -90, any = false;
  for (const f of features) for (const [x, y] of f.geometry.coordinates) {
    any = true;
    minx = Math.min(minx, x); maxx = Math.max(maxx, x);
    miny = Math.min(miny, y); maxy = Math.max(maxy, y);
  }
  if (!any) return;
  const v = map.getBounds();
  if (v.contains([minx, miny]) && v.contains([maxx, maxy])) return;
  map.fitBounds([[minx, miny], [maxx, maxy]], { padding: 80, duration: 0, maxZoom: 14 });
}

function runFeatures(line, gids, g, colour, part = 'run') {
  const out = [];
  for (const vg of gids) {
    const [gid, lo, hi] = spanOf(vg);
    const e = SEC_BY_GID.get(gid);
    if (!e || e.line !== line || hi <= lo) continue;
    const c = g[`${e.sec[0]}|${e.sec[1]}`];
    const piece = c && c.length > 1 && sliceLine(c, lo, hi);
    if (piece)
      out.push({ type: 'Feature', properties: { part, c: colour },
                 geometry: { type: 'LineString', coordinates: piece } });
  }
  return out;
}

/* The run of sections between the two picked stations on the open line: the short way, or
   the other way round when that was asked for and exists. */
function pickedRun() {
  if (VIEW.kind !== 'line' || !PICK.from || !PICK.to) return null;
  const line = LINE_BY_ID.get(VIEW.id);
  if (!line) return null;
  if (PICK.through) {
    /* Through a junction end (throughEnds): the walk from the stop picked past it back to the
       junction, this line between its two ends of the ride, and the walk on from the other
       junction. Either end may be a stop of this line instead. */
    const T = PICK.through;
    const ef = throughEntry(line, T.from), et = throughEntry(line, T.to);
    const none = { line, short: null, alt: null, around: false, p: null };
    if ((T.from && !ef) || (T.to && !et) || (ef && et && ef.j === et.j)) return none;
    const a = ef ? ef.j : PICK.from, b = et ? et.j : PICK.to;
    const mid = a === b ? { gids: [], km: 0 } : pathBetween(line, a, b);
    if (!mid) return none;
    const back = l => ({ ...l, from: l.to, to: l.from, gids: [...l.gids].reverse() });
    const legs = [...(ef ? [...ef.legs].reverse().map(back) : []),
                  ...(mid.gids.length ? [{ line, from: a, to: b, gids: mid.gids, km: mid.km }] : []),
                  ...(et ? et.legs : [])].map(l => ({ ...l, p: { gids: l.gids, km: l.km } }));
    const p = { gids: legs.flatMap(l => l.gids), km: legs.reduce((s, l) => s + l.km, 0) };
    /* `drawn` and `ways` as the plain pick has them: renderLine reads run.ways.length, and
       without it every pick through a junction threw there and showed no "Add ride" (Anita,
       2026-10-08: NJT Morristown Line, Dover -> Hoboken). */
    return { line, short: p, drawn: null, alt: null, ways: [], around: false, p, legs };
  }
  if (PICK.past) {
    // Two legs: this line to the boarding stop, the pattern from there past the junction (one
    // leg when the picked stop is the boarding stop).
    const other = LINE_BY_ID.get(PICK.past.line), board = PICK.past.board;
    const pastAt = lineStations(line).has(PICK.from) ? PICK.to : PICK.from;
    const mine = pastAt === PICK.to ? PICK.from : PICK.to;
    const none = { line, short: null, alt: null, around: false, p: null };
    const b = other && pathBetween(other, board, pastAt);
    const a = mine === board ? { gids: [], km: 0 } : pathBetween(line, mine, board);
    if (!a || !b) return none;
    // A stop between the boarding stop and the junction would ride that stretch twice.
    const toJ = s => { const q = pathBetween(line, s, PICK.past.j); return q ? q.km : Infinity; };
    if (mine !== board && toJ(mine) < toJ(board)) return none;
    const legs = [];
    if (pastAt === PICK.to) {
      if (mine !== board) legs.push({ line, from: mine, to: board, p: a });
      legs.push({ line: other, from: board, to: pastAt, p: b });
    } else {
      legs.push({ line: other, from: pastAt, to: board, p: b });
      if (mine !== board) legs.push({ line, from: board, to: mine, p: a });
    }
    const p = { gids: [...a.gids, ...b.gids], km: a.km + b.km };
    return { line, short: p, drawn: null, alt: null, ways: [], around: false, p, legs };
  }
  /* The way the diagram draws first (drawnGraph); the shortest way over every section where
     it differs (`direct`, PICK.short), and the other way round (PICK.around), as choices. */
  const short = pathBetween(line, PICK.from, PICK.to);
  const d = short ? drawnPath(line, PICK.from, PICK.to) : null;
  const drawn = d && !sameRun(d, short) ? d : null;
  let alt = short ? pathAround(line, PICK.from, PICK.to) : null;
  if (alt && drawn && sameRun(alt, drawn)) alt = null;
  // And the track no other pick rides, between these two stops if they are nearest it.
  const ways = short ? chainWays(line, PICK.from, PICK.to) : [];
  const around = !!(PICK.around && alt);
  const via = !around && PICK.via ? ways.find(w => w.key === PICK.via) || null : null;
  const direct = !around && !via && !!(PICK.short && drawn);
  return { line, short, drawn, alt, ways, around, direct, via,
           p: around ? alt : via ? via.p : direct || !drawn ? short : drawn };
}

function lineStations(line) {
  if (line._st) return line._st;
  const s = new Set();
  for (const [a, b] of line.sections) { s.add(a); s.add(b); }
  return (line._st = s);
}

function afterChange() {
  paintRidden();
  paintSelection();
  render();
}

function render() {
  showUndo();
  const body = document.getElementById('panel-body');
  if (VIEW.kind === 'line') renderLine(body);
  else if (VIEW.kind === 'station') renderStation(body);
  else if (VIEW.kind === 'pick') renderPick(body);
  else if (VIEW.kind === 'op') renderOp(body);
  else if (VIEW.kind === 'trace') renderTrace(body);
  else renderHome(body);
  saveUi();
}

function renderHome(el) {
  /* Worked out only for the tabs that show it (Countries, Operators, Lines): the Trips tab
     needs none of it, and on a startup it was most of each redraw (2026-10-08). */
  let s0 = null;
  const S = () => s0 || (s0 = stats());
  /* No headline (Anita, 2026-10-07: the "Ridden in <country>" block went; each country's
     numbers are its row under Countries). A country not loaded holds no rides (those load at
     start), so its numbers are 0 of its total from regions.json; one still loading may hold
     some, so it waits. */
  const known = cc => LOADED.has(cc) || (hasTotal(cc) && !LOADING.has(cc));
  let h = '';
  const mine = here();

  if (!mine.length) {
    h += `<p class="muted" style="margin-top:14px">Nothing recorded yet. Click a station on `
      + `the map, or search a line above, then pick where you got on and off.</p>`;
  }
  const lost = lostRides();
  if (lost) {
    h += `<p class="muted" style="margin-top:10px">${lost} ride`
      + `${lost === 1 ? '' : 's'} could not be matched to the current data and `
      + `count towards nothing. They are still in your export.</p>`;
  }

  /* ONE LIST AT A TIME. All four under each other made the panel a long scroll where the
     rides, the thing most often wanted, came last. */
  /* In "View all lines" only Countries and Trips (Anita, 2026-10-07: "hide the operators and
     lines views entirely"); a tab left open on one of those falls back to Countries. */
  const browse = MODE === 'browse';
  if (browse && (HOME_TAB === 'op' || HOME_TAB === 'line')) {
    // The operator a row of that tab drew goes with it, unless it is open in the tree.
    if (HOME_TAB === 'op' && HOME_OP && ![...OPEN].some(k => k.endsWith(`|op:${HOME_OP}`))) HOME_OP = null;
    HOME_TAB = 'country';
  }
  const tabs = [['country', 'Countries'], ...(browse ? [] : [['op', 'Operators'], ['line', 'Lines']]),
                ['rides', `Trips (${trips().length})`]];
  h += `<div class="tabs">` + tabs.map(([k, label]) =>
    `<button class="${HOME_TAB === k ? 'on' : ''}" onclick="setHomeTab('${k}')">${label}</button>`
  ).join('') + `</div>`;

  if (HOME_TAB === 'country') {
    const s = S();
    /* Every built country, with its numbers: its total is in regions.json, and a country
       not loaded has no rides. Only with an older regions.json does a country not visited
       show only that. A click goes there, which loads it. Most ridden first, then, among
       those equal (nearly all at 0 km), the most passenger rail (Anita, 2026-10-04). */
    /* A TREE: country, its operators, their lines (Anita, 2026-10-07). A country opens to its
       operators (and goes there, which loads it), an operator to its lines. The countries'
       order is the reader's own once one is dragged (ORDERS), else most ridden first and,
       among those equal (nearly all at 0 km), the most passenger rail. */
    const order = shown('countries', countryOrder(s));
    h += sortButton('country');
    for (const k of order) {
      const reg = REGIONS[k];
      const r = s.byRegion.get(k);
      const here_ = k === FOCUS ? ' · in view' : '';
      const key = `c:${k}`, open = OPEN.has(key);
      const drag = dragAttrs('countries', k);
      if (known(k) && r) {
        // Done is summed here and the total in the build, so it can come out a hair over.
        const p = Math.min(1, r.done / Math.max(r.total, 0.001));
        h += meterRow({ name: reg.name, frac: p, pre: flagHtml(k), open, attrs: drag,
                        plain: `${Math.round(r.total).toLocaleString()} km${here_}`,
                        colour: accent(), click: `openCountry('${k}')`, star: `country:${k}`,
                        detail: `${r.done.toFixed(1)} of ${Math.round(r.total).toLocaleString()} km${here_}` });
      } else {
        h += meterRow({ name: reg.name, frac: 0, pre: flagHtml(k), colour: accent(), open,
                        plain: `${REGIONS[k].km ? `${Math.round(REGIONS[k].km).toLocaleString()} km` : ''}${here_}`,
                        attrs: drag, click: `openCountry('${k}')`, star: `country:${k}`,
                        detail: `${LOADING.has(k) ? 'loading its lines' : 'not visited yet'}${here_}` });
      }
      if (!open) continue;
      const ops = s.byRegionOp.get(k);
      if (!LOADED.has(k) || !ops) {
        h += `<p class="muted lv1">Loading its lines…</p>`;
        continue;
      }
      const byOp = new Map([...ops.values()].map(o => [o.op, o]));
      // Most ridden first in the tracker; in "View all lines" the most line first.
      const list = shown(key, ordered(key, [...ops.values()]
        .sort((a, b) => (browse ? 0 : b.km - a.km) || (b.total - a.total)).map(o => o.op)));
      for (const op of list) h += opTreeRows(byOp.get(op), s, 1, `${key}|op:${op}`, key);
    }
  } else if (HOME_TAB === 'op') {
    const s = S();
    if (!s.ops.length) h += `<p class="muted">No operator started yet.</p>`;
    h += sortButton('op');
    const byOp = new Map(s.ops.map(o => [o.op, o]));
    for (const op of shown('ops', ordered('ops', s.ops.map(o => o.op))))
      h += opTreeRows(byOp.get(op), s, 0, `op:${op}`, 'ops');
  } else if (HOME_TAB === 'line') {
    const s = S();
    if (!s.perLine.length) h += `<p class="muted">No line started yet.</p>`;
    else h += `<p class="muted" style="margin:0 0 4px">${s.perLine.length} touched, `
      + `${s.finished} finished.</p>`;
    h += sortButton('line');
    const byId = new Map(s.perLine.map(p => [p.line.id, p]));
    const dflt = [...s.perLine].sort(lineListOrder).map(p => p.line.id);
    for (const id of shown('lines', ordered('lines', dflt))) {
      const p = byId.get(id);
      h += lineRow(p.line, p.km, { bring: true, drag: 'lines' });
    }
  } else {
    h += renderRides();
  }
  el.innerHTML = h;
}

let HOME_TAB = 'rides';
function setHomeTab(k) { HOME_TAB = k; EDITING = null; HOME_OP = null; render(); paintSelection(); }

// The operator whose lines are drawn: its own view's, or an open row's on the home lists.
function opDrawn() {
  if (VIEW.kind === 'op') return VIEW.key;
  if (VIEW.kind === 'home' && (HOME_TAB === 'country' || HOME_TAB === 'op')) return HOME_OP;
  return null;
}

/* ONLY THE HOME TAB IS REMEMBERED across a reload. A page opens with nothing selected
   (Anita, 2026-10-02): a line, station or trip restored from last time muted every other
   line, and it was not clear why the map showed so little. The view, the picked ends and the
   open trip are still saved on every render (saveUi), but bootUi no longer puts them back;
   restoreUi and UI_PENDING are what did, and are kept should a link ever want to open a
   view. */
const UI_KEY = 'noritetsu.ui';
let UI_PENDING = null;          // {saved, sig} while a saved view waits for its countries

function uiSig() {
  const v = { ...VIEW };
  delete v.note;
  return JSON.stringify({ v, p: VIEW.kind === 'line' ? PICK : null, t: HOME_TAB, e: EDITING });
}

// The countries the open view needs loaded to show again.
function viewRegions() {
  const ofLine = id => {
    const l = LINE_BY_ID.get(id);
    return [...(l ? regionsOf(l) : []), ...(SHARED_LINES[foldLine(id)] || [])];
  };
  const ofSt = id => {
    const s = STATIONS[id];
    return s ? (s.regions || [s.region]) : [];
  };
  let out = [];
  if (VIEW.kind === 'line') out = ofLine(VIEW.id);
  else if (VIEW.kind === 'station') out = ofSt(VIEW.id);
  else if (VIEW.kind === 'pick') out = VIEW.ids.flatMap(ofLine);
  else if (VIEW.kind === 'trace') out = VIEW.stops.flatMap(ofSt);
  else if (VIEW.kind === 'op') {
    opsNow();
    const o = OPS[OP_INDEX.get(VIEW.key)];
    out = o ? o.lines.flatMap(regionsOf) : [];
  }
  return [...new Set(out)];
}

function saveUi() {
  if (UI_PENDING) {
    if (uiSig() === UI_PENDING.sig) return;
    UI_PENDING = null;          // the reader moved first: theirs wins
  }
  const v = { ...VIEW };
  delete v.note;
  try {
    localStorage.setItem(UI_KEY, JSON.stringify({
      view: v, pick: VIEW.kind === 'line' ? PICK : null, tab: HOME_TAB, trip: EDITING,
      need: viewRegions() }));
  } catch (e) { /* remembered for this page only */ }
}

// At boot: the home tab only; no view, picked ends or open trip (see above).
function bootUi() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(UI_KEY) || 'null'); } catch (e) { }
  if (!s || typeof s !== 'object') return;
  if (['country', 'op', 'line', 'rides'].includes(s.tab)) HOME_TAB = s.tab;
}

function restoreUi() {
  const p = UI_PENDING;
  if (!p) return;
  const known = Object.keys(REGIONS).length;
  const need = (p.saved.need || []).filter(cc => !known || REGIONS[cc]);
  Promise.all(need.map(loadRegion)).then(() => {
    if (UI_PENDING !== p) return;
    UI_PENDING = null;
    const v = p.saved.view;
    // Ids a rebuild moved, as rides are migrated.
    const lineId = id => {
      if (LINE_BY_ID.has(id)) return id;
      if (LINE_FOLD[id]) return LINE_FOLD[id];
      for (const cc of need) if ((LINE_ALIASES[cc] || {})[id]) return LINE_ALIASES[cc][id];
      return id;
    };
    const stId = id => {
      if (STATIONS[id]) return id;
      for (const cc of need) if ((ALIASES[cc] || {})[id]) return ALIASES[cc][id];
      return id;
    };
    if (v.kind === 'line') v.id = lineId(v.id);
    if (v.kind === 'station') v.id = stId(v.id);
    if (v.kind === 'pick') v.ids = (v.ids || []).map(lineId);
    if (v.kind === 'trace') {
      v.stops = (v.stops || []).map(stId).filter(id => STATIONS[id]);
      v.choice = v.choice || {};
    }
    VIEW = v;
    const pk = p.saved.pick;
    PICK = v.kind === 'line' && pk
      ? { from: pk.from ? stId(pk.from) : null, to: pk.to ? stId(pk.to) : null, around: !!pk.around,
        short: !!pk.short, via: pk.via || null }
      : { from: null, to: null, around: false };
    // A view that no longer resolves falls back to home inside render.
    render();
    paintSelection();
    if (VIEW.kind === 'line') loadLineRegions(VIEW.id);
  });
}

/* A row with a bar under its name: the bar dim in the row's colour, filled at full strength
   for the fraction done, the way the map draws a selected line. Lines use their own colour,
   operators and countries the plain accent. */
/* `open` true or false gives the row a caret (a row that opens to more rows), `level` indents
   it under its parent, `attrs` adds attributes (a country's drag handlers). */
/* In "View all lines" (MODE browse) the app is a reference, not a tracker (Anita,
   2026-10-07): no rings, no percentages, no stars; a mark in the row's colour and `plain`,
   the row's detail without what was ridden. */
function meterRow({ name, frac, colour, click, detail, plain, star, pre, open, level, attrs }) {
  const track = MODE === 'ridden';
  const caret = open === undefined ? (level ? '<i class="caret"></i>' : '')
    : `<i class="caret${open ? ' open' : ''}"><svg width="10" height="10" viewBox="0 0 10 10">`
      + `<path d="M3 1.5L7 5L3 8.5" fill="none" stroke="currentColor" stroke-width="1.6" `
      + `stroke-linecap="round" stroke-linejoin="round" /></svg></i>`;
  return `<div class="rrow${level ? ` lv${level}` : ''}${track ? '' : ' plain'}"`
    + `${click ? ` onclick="${click}"` : ''}${attrs || ''}>`
    + caret + (track ? ringHtml(frac, colour) : `<i class="mark" style="background:${colour}"></i>`)
    + `<div class="tx"><b>${pre || ''}${esc(name)}</b>`
    + `<div class="o">${track || plain === undefined ? detail : plain}</div></div>`
    + (star && track ? starButton(star) : '') + `</div>`;
}

// ---------------------------------------------------------------- the countries' tree

const OPEN = new Set();          // open rows of the tree: c:<cc>, c:<cc>|op:<op>, op:<op>
let HOME_OP = null;              // the operator an open row has drawn on the map
/* EVERY LIST CAN BE PUT IN THE READER'S OWN ORDER BY DRAGGING (Anita, 2026-10-07):
   countries, operators (all, or a country's), lines (all, an operator's, or an operator's in
   one country). Each list's order is kept under its own key: `countries`, `ops`, `lines`,
   or the open row's key it hangs under (c:<cc>, op:<op>, c:<cc>|op:<op>). A row dragged is
   moved within its own list only. Anything not in a saved order (new, or never dragged)
   follows in the distance order. */
const ORDERS_KEY = 'noritetsu.orders.v1';
let ORDERS = (() => {
  let o = {};
  try { o = JSON.parse(localStorage.getItem(ORDERS_KEY) || '{}') || {}; } catch (e) { }
  // The countries' order from before every list had one.
  try {
    const c = JSON.parse(localStorage.getItem('noritetsu.countryOrder') || 'null');
    if (Array.isArray(c) && !o.countries) o.countries = c;
  } catch (e) { }
  return o;
})();
function saveOrders() {
  try { localStorage.setItem(ORDERS_KEY, JSON.stringify(ORDERS)); } catch (e) { }
}
// `ids` in the distance order; the saved order of `list` first.
function ordered(list, ids) {
  const saved = ORDERS[list];
  if (!saved) return ids;
  const have = new Set(ids);
  const mine = saved.filter(k => have.has(k));
  const set = new Set(mine);
  return [...mine, ...ids.filter(k => !set.has(k))];
}
// The rows each list showed last, in order, for a drop to reorder.
const SHOWN = new Map();
function shown(list, ids) { SHOWN.set(list, ids); return ids; }
const dragAttrs = (list, id) => ` draggable="true" data-list="${esc(list)}" data-id="${esc(id)}" `
  + `ondragstart="dragRow(event)" ondragover="dragOverRow(event)" ondrop="dropRow(event)"`;

// The lists a tab's sort button puts back in the distance order.
const TAB_LISTS = { country: k => k === 'countries' || k.startsWith('c:'),
                    op: k => k === 'ops' || k.startsWith('op:'), line: k => k === 'lines' };
function tabHasOrder(tab) { return Object.keys(ORDERS).some(TAB_LISTS[tab] || (() => false)); }
function sortTab(tab) {
  for (const k of Object.keys(ORDERS)) if (TAB_LISTS[tab](k)) delete ORDERS[k];
  saveOrders();
  try { localStorage.removeItem('noritetsu.countryOrder'); } catch (e) { }
  render();
}
const sortButton = tab => (tabHasOrder(tab)
  ? `<div class="btnrow" style="margin:0 0 6px"><button class="act small" `
    + `onclick="sortTab('${tab}')">${tab === 'country' && MODE === 'browse' ? 'sort by length'
      : tab === 'line' ? 'unfinished longest first' : 'sort by distance ridden'}</button></div>` : '');

/* Most ridden first in the tracker; in "View all lines" the most line first (Anita,
   2026-10-07: "sort by distance that exists"). A dragged order wins in both. */
function countryOrder(s) {
  const doneKm = k => (s.byRegion.get(k) || {}).done || 0;
  const railKm = k => REGIONS[k].km || (s.byRegion.get(k) || {}).total || 0;
  const by = MODE === 'browse' ? (a, b) => railKm(b) - railKm(a)
    : (a, b) => (doneKm(b) - doneKm(a)) || (railKm(b) - railKm(a));
  return ordered('countries', Object.keys(REGIONS).sort(by));
}

let DRAG = null;              // {list, id} of the row being dragged
function dragRow(ev) {
  const d = ev.currentTarget.dataset;
  DRAG = { list: d.list, id: d.id };
  ev.dataTransfer.effectAllowed = 'move';
  ev.dataTransfer.setData('text/plain', d.id);
}
function dragOverRow(ev) {
  if (DRAG && ev.currentTarget.dataset.list === DRAG.list) ev.preventDefault();
}
function dropRow(ev) {
  ev.preventDefault();
  const d = ev.currentTarget.dataset;
  const drag = DRAG;
  DRAG = null;
  if (!drag || d.list !== drag.list || d.id === drag.id) return;
  const box = ev.currentTarget.getBoundingClientRect();
  const after = ev.clientY > box.top + box.height / 2;
  const order = (SHOWN.get(drag.list) || []).filter(k => k !== drag.id);
  if (!order.includes(d.id)) return;
  order.splice(order.indexOf(d.id) + (after ? 1 : 0), 0, drag.id);
  ORDERS[drag.list] = order;
  saveOrders();
  render();
}

// A country opens to its operators, and the map goes there (which loads its lines).
function openCountry(cc) {
  const key = `c:${cc}`;
  if (OPEN.has(key)) { OPEN.delete(key); render(); return; }
  OPEN.add(key);
  /* The camera moves only when none of the country is on screen (Anita, 2026-10-07):
     looking at part of it already, the view stays where it is. */
  if (!regionsInView(0).includes(cc)) goRegion(cc);
  loadRegion(cc).then(render);
  render();
}

/* An operator opens to its lines, and its lines are drawn on the map and brought into view
   (the operator view's drawing, while the panel stays on the list). Closing it clears them. */
function toggleOp(key, op) {
  if (OPEN.has(key) && HOME_OP !== op) {
    // Open, but its highlight cleared by a click on the map: draw it again, keep it open.
    HOME_OP = op;
    FIT_OP = op;
  } else if (OPEN.has(key)) {
    OPEN.delete(key);
    if (HOME_OP === op) HOME_OP = null;
  } else {
    OPEN.add(key);
    HOME_OP = op;
    FIT_OP = op;
  }
  render();
  paintSelection();
}

/* THE DEFAULT ORDER OF EVERY LIST OF LINES (Anita, 2026-10-08): the longest line not yet at
   100% first, down to the shortest, then the lines at 100%, longest first. Rows are {line, km
   ridden}. A dragged order (ORDERS) still wins. In "View all lines", longest first. */
const lineDone = r => MODE === 'ridden' && r.line.km > 0 && r.km >= r.line.km;
/* In ROUTE_CCS the routes and corridors come first, the register track listed only for what
   the routes leave uncovered after them (2026-10-09). */
const trackRow = r => { const ti = trackInfo(r.line); return ti && !ti.corridor ? 1 : 0; };
function lineListOrder(a, b) {
  return (trackRow(a) - trackRow(b)) || (lineDone(a) - lineDone(b)) || (b.line.km - a.line.km);
}

// Lines listed under one open operator, at most.
const TREE_MAX_LINES = 300;
function opTreeRows(o, s, level, key, list) {
  const open = OPEN.has(key);
  const p = o.km / Math.max(o.total, 0.001);
  const logo = opLogo(o.op);
  let h = meterRow({ name: opLabel(o.op), frac: p, colour: opColour(o.op), star: `op:${o.op}`,
    pre: logo ? `<img class="oplogo" src="${esc(logo)}" alt="" />` : '', open, level,
    attrs: list ? dragAttrs(list, o.op) : '',
    click: `toggleOp(${jsArg(key)}, ${jsArg(o.op)})`,
    detail: (opLabel(o.op) !== o.op ? `${esc(o.op)} · ` : '')
      + `${o.km.toFixed(1)} of ${Math.round(o.total).toLocaleString()} km`,
    plain: (opLabel(o.op) !== o.op ? `${esc(o.op)} · ` : '')
      + `${Math.round(o.total).toLocaleString()} km · ${o.lines} line${o.lines === 1 ? '' : 's'}` });
  if (!open) return h;
  const sorted = o.list.map(line => {
    const km = lineKm(line, s.frac);
    return { line, km, pct: km / Math.max(line.km, 0.001) };
  }).sort(lineListOrder);
  // In the reader's order once dragged; the list is the open operator row's key.
  const byId = new Map(sorted.map(r => [r.line.id, r]));
  const rows = shown(key, ordered(key, sorted.map(r => r.line.id))).map(id => byId.get(id));
  for (const r of rows.slice(0, TREE_MAX_LINES))
    h += lineRow(r.line, r.km, { bring: true, level: level + 1, drag: key });
  if (rows.length > TREE_MAX_LINES) {
    h += `<p class="muted lv${level + 1}">and ${rows.length - TREE_MAX_LINES} more. `
      + `Search a line by name for the rest.</p>`;
  }
  return h;
}

/* The percentage as a ring's label: whole numbers, one decimal under 10%, so a start reads
   as a start (0.4%) and not as nothing. */
function pctLabel(frac) {
  // 0 and 100 whole, everything between to one decimal: 21.0 (Anita, 2026-10-07).
  const p = 100 * Math.max(0, Math.min(1, frac));
  if (p === 0 || p === 100) return p.toFixed(0);
  if (p < 0.05) return '<0.1';
  return Math.min(p, 99.9).toFixed(1);
}

function ringHtml(frac, colour, label) {
  const r = 16, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, frac || 0));
  return `<div class="ring"><svg viewBox="0 0 38 38">`
    + `<circle cx="19" cy="19" r="${r}" fill="none" stroke-width="3.5" `
    + `style="stroke:${colour};stroke-opacity:0.22" />`
    + (f > 0 ? `<circle cx="19" cy="19" r="${r}" fill="none" stroke-width="3.5" `
      + `stroke-dasharray="${(c * Math.max(f, 0.012)).toFixed(2)} ${c.toFixed(2)}" `
      + `transform="rotate(-90 19 19)" style="stroke:${colour}" />` : '')
    + `</svg><span>${label != null ? label : `${pctLabel(f)}<small>%</small>`}</span></div>`;
}

/* STARRED STATISTICS (Anita, 2026-10-07): any country, operator, line or trip can be
   starred, and the poster draws the starred ones as rings. Kept per browser beside the rides
   and carried in the export. Keys: country:<cc>, op:<operator key>, line:<id>, trip:<key>. */
const STAR_KEY = 'noritetsu.stars.v1';
let STARS = (() => {
  try { const s = JSON.parse(localStorage.getItem(STAR_KEY) || '[]'); return Array.isArray(s) ? s : []; }
  catch (e) { return []; }
})();
function saveStars() {
  try { localStorage.setItem(STAR_KEY, JSON.stringify(STARS)); } catch (e) { }
}
const isStarred = k => STARS.includes(k);
function toggleStar(k, ev) {
  if (ev) ev.stopPropagation();
  STARS = isStarred(k) ? STARS.filter(x => x !== k) : [...STARS, k];
  saveStars();
  render();
}
const STAR_PATH = 'M8 1.5l1.9 4 4.3.5-3.2 3 .9 4.3L8 11.1l-3.9 2.2.9-4.3-3.2-3 4.3-.5z';
function starButton(k) {
  const on = isStarred(k);
  return `<button class="star${on ? ' on' : ''}" title="${on ? 'Unstar' : 'Star for the poster'}" `
    + `onclick="toggleStar(${jsArg(k)}, event)">`
    + `<svg width="16" height="16" viewBox="0 0 16 16"><path d="${STAR_PATH}" `
    + `fill="${on ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.3" `
    + `stroke-linejoin="round" /></svg></button>`;
}

// A country's flag, from the flag-icons set. Abkhazia (xa) has none there and gets none.
const flagUrl = cc => (cc && cc !== 'xa' ? `https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/flags/4x3/${cc}.svg` : null);
const flagHtml = cc => (flagUrl(cc) ? `<img class="flag" src="${flagUrl(cc)}" alt="" />` : '');

// "2024-04-05" as "5 April 2024", for the poster.
function longDate(d) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || '');
  if (!m) return d || '';
  const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August',
                  'September', 'October', 'November', 'December'];
  return `${+m[3]} ${months[+m[2] - 1]} ${m[1]}`;
}

/* The starred statistics, in the order they were starred, for the poster. A trip has no
   fraction (frac null); its value is its length. */
function starredStats() {
  const s = stats();
  const out = [];
  const opsBy = new Map(s.ops.map(o => [o.op, o]));
  const lineBy = new Map(s.perLine.map(p => [p.line.id, p]));
  const tripBy = new Map(trips().map(t => [t.key, t]));
  for (const k of STARS) {
    const i = k.indexOf(':'), kind = k.slice(0, i);
    let id = k.slice(i + 1);
    // A star on an operator since folded into a group ("DB Regio NRW" -> "DB") follows it.
    if (kind === 'op' && !opsBy.has(id) && OP_BRAND[id] && OP_BRAND[id].group) id = OP_BRAND[id].group;
    if (kind === 'country' && REGIONS[id]) {
      const r = s.byRegion.get(id) || { done: 0, total: REGIONS[id].km || 0 };
      const f = Math.min(1, r.done / Math.max(r.total, 0.001));
      out.push({ key: k, kind, name: REGIONS[id].name, frac: f, value: `${pctLabel(f)}%`,
                 detail: `${Math.round(r.done).toLocaleString()} of ${Math.round(r.total).toLocaleString()} km`,
                 colour: accent(), flag: flagUrl(id) ? id : null });
    } else if (kind === 'op' && opsBy.has(id)) {
      const o = opsBy.get(id), f = o.km / Math.max(o.total, 0.001);
      out.push({ key: k, kind, name: opLabel(id), frac: f, value: `${pctLabel(f)}%`,
                 detail: `${Math.round(o.km).toLocaleString()} of ${Math.round(o.total).toLocaleString()} km`,
                 colour: opColour(id), flag: null });
    } else if (kind === 'line' && LINE_BY_ID.has(id)) {
      const line = LINE_BY_ID.get(id), p = lineBy.get(id), km = p ? p.km : 0;
      const f = km / Math.max(line.km, 0.001);
      out.push({ key: k, kind, name: lineName(line), frac: f, value: `${pctLabel(f)}%`,
                 detail: `${km.toFixed(1)} of ${line.km.toFixed(1)} km`,
                 colour: lineColour(line), flag: null });
    } else if (kind === 'trip' && tripBy.has(id)) {
      const t = tripBy.get(id), first = t.rides[0], last = t.rides[t.rides.length - 1];
      const km = t.rides.reduce((a, r) => a + rideKm(r), 0);
      const l = LINE_BY_ID.get(first.line);
      const name = t.rides.length === 1 && l ? lineName(l)
        : `${stName(first.from)} → ${stName(last.to)}`;
      out.push({ key: k, kind, name, frac: null, value: `${Math.round(km).toLocaleString()} km`,
                 detail: longDate(first.date), colour: l ? lineColour(l) : accent(), flag: null });
    }
  }
  return out;
}

/* Capped at the line's length: its sections can sum a rounding step over it (14.2 of 14.1).
   And every section ridden is the whole line, exactly: the rounded section lengths can sum a
   few metres under line.km, and a float sum lands a last digit short (NYCS A: 57.48399...
   of 57.484 read "99.9%"). */
/* A straight-line gap left out of riding (straightGaps: no track, and the line joins its two
   ends another way) cannot be ridden, so it is not needed for the whole line: on the named
   trains Hakone (Hon-Atsugi - Hadano, 14.7 km) and Yufu (Beppu - Yufuin) it kept the line
   from ever reaching 100% (2026-10-07). Known once the line's graph has been built. */
function lineKm(line, frac) {
  let km = 0, all = true;
  const gaps = line._gaps;
  for (const [a, b, secKm, gid] of line.sections) {
    if (CLOSED.has(gid)) continue;
    const f = frac.get(gid) || 0;
    if (f < 1 && !(gaps && gaps.has(gid))) all = false;
    km += secKm * f;
  }
  return all && km > 0 ? line.km : Math.min(km, line.km);
}

/* The one row every list of lines uses. Started lines show their percentage, untouched
   ones their length. */
function lineRow(line, km, opts = {}) {
  const f = km / Math.max(line.km, 0.001);
  const touched = km > 0.001;
  // In ROUTE_CCS a register line is track under the routes, or a corridor many run over.
  const ti = trackInfo(line);
  const notes = [opts.operator ? esc(opName(line)) : '',
                 line.service ? 'named train' : ti ? (ti.corridor ? 'corridor' : 'track') : '',
                 line.km_closed ? (line.km < 0.05 ? 'no longer running'
                   : `${line.km_closed.toFixed(0)} km no longer running`) : ''];
  const detail = [touched ? `${km.toFixed(1)} of ${line.km.toFixed(1)} km` : `${line.km.toFixed(1)} km`,
                  ...notes].filter(Boolean).join(' · ');
