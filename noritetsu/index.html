  const ids = [...new Set(idxs.map(i => foldLine(ways.lines[i])))];
  const first = LINE_BY_ID.get(ids[0]);
  const owner = ways.free && !ways.free.has(String(w)) && first && !first.service
    ? ids[0] : null;
  openTrackLines(ids.filter(id => LINE_BY_ID.has(id)), owner);
}

/* `owner`: the line to open, the others listed under it as also on this track. Without one
   (track no line owns), the one line there opens, or where exactly one REGISTER line runs
   over the track that one, since it is almost always the line meant; clicking the San'in
   coast gives 山陰線 rather than a choice between it and スーパーおき. Otherwise a list. */
function openTrackLines(ids, owner) {
  if (!ids.length) return;
  // A register line that owns nothing (a companion track) cannot own a way; guarded anyway.
  const ol = owner && LINE_BY_ID.get(owner);
  if (!ol || (isRegisterLine(ol) && !listedBase(ol))) {
    const reg = ids.filter(id => isRegisterLine(LINE_BY_ID.get(id)));
    owner = ids.length === 1 ? ids[0] : reg.length === 1 ? reg[0] : null;
  }
  /* Track one route alone runs over, all of it (ROUTE_CCS, trackInfo `single`): that route
     opens, the track a link under its name (Anita, 2026-10-09: Nevada Subdivision -> the
     California Zephyr). */
  const inf = owner && trackInfo(LINE_BY_ID.get(owner));
  if (inf && inf.single && !inf.corridor && LINE_BY_ID.has(inf.single.id)) {
    const svc = inf.single.id;
    showLine(svc);
    VIEW.track = owner;
    const also = ids.filter(id => id !== owner && id !== svc);
    if (also.length) VIEW.also = also;
    return render();
  }
  if (owner) {
    showLine(owner);
    const also = ids.filter(id => id !== owner);
    if (!also.length) return;
    VIEW.also = also;
    return render();
  }
  VIEW = { kind: 'pick', ids };
  openPanel(true);
  render();
  paintSelection();
}

function renderPick(el) {
  const lines = VIEW.ids.map(id => LINE_BY_ID.get(id)).filter(Boolean).sort(lineOrder);
  let h = `<div class="btnrow"><button class="act" onclick="goHome()">← back</button></div>`
    + `<h2 class="sec">${lines.length} lines run over this track</h2>`;
  const frac = creditRanges();
  for (const l of lines) h += lineRow(l, lineKm(l, frac), { operator: true });
  el.innerHTML = h;
}

/* Hovering a station says what it is and what calls there, so a dense area can be read
   without clicking through every dot. Three lines and a count, in the order the panel uses:
   register lines first, then patterns, then named trains. */
const hoverPop = new maplibregl.Popup({
  closeButton: false, closeOnClick: false, offset: 10, maxWidth: '240px',
});

function showHover(e) {
  const f = e.features && e.features[0];
  const id = f && f.properties.id;
  const s = id && STATIONS[id];
  if (!s) { hoverPop.remove(); return; }
  const lines = (s.l || []).map(x => LINE_BY_ID.get(x)).filter(Boolean).sort(lineOrder);
  const alt = stAlt(id) ? `<div class="jp">${esc(stAlt(id))}</div>` : '';
  const top = lines.slice(0, 3).map(l =>
    `<span class="pl" style="border-left-color:${lineColour(l)}">${esc(lineName(l))}</span>`
  ).join('');
  const more = lines.length > 3
    ? `<div class="more">and ${lines.length - 3} more</div>` : '';
  const none = lines.length ? '' : '<div class="more">no line stops here</div>';
  hoverPop.setLngLat(f.geometry.coordinates)
    .setHTML(`<b>${esc(stName(id))}</b>${alt}${top}${more}${none}`)
    .addTo(map);
}

for (const layer of ['station', 'station-ic', 'sel-station']) {
  map.on('mousemove', layer, showHover);
  map.on('mouseleave', layer, () => hoverPop.remove());
}

/* A pointer wherever a click would do something: over a station, or within CLICK_SLOP of
   a line. Once per frame at most, since a box query on every mousemove is not free. */
let cursorPending = null;
map.on('mousemove', e => {
  if (cursorPending) { cursorPending = e.point; return; }
  cursorPending = e.point;
  requestAnimationFrame(() => {
    const p = cursorPending;
    cursorPending = null;
    if (!mapReady) return;
    const r = CLICK_SLOP;
    const layers = hitLayers();
    const on = map.queryRenderedFeatures(p, { layers: ['station', 'station-ic', 'sel-station'] }).length
      || (VIEW.kind !== 'trace' && layers.length && map.queryRenderedFeatures(
        [[p.x - r, p.y - r], [p.x + r, p.y + r]], { layers }).length);
    map.getCanvas().style.cursor = on ? 'pointer' : '';
  });
});

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
// A string as a JS argument inside an onclick="..." attribute: any name, quotes and all.
const jsArg = s => esc(JSON.stringify(String(s ?? '')));

document.getElementById('q').addEventListener('input', runSearch);

loadRides();
bootUi();
render();
// Countries load from startRegions once the map is up, and then as the camera moves.
REGIONS_READY.then(() => {
  render();                  // the headline can name the country now
  if (!Object.keys(REGIONS).length) {
    document.getElementById('panel-body').innerHTML = `<p class="muted" style="margin-top:14px">`
      + `Could not load regions.json, so no country knows where it is. Run `
      + `tools/build_regions.py.</p>`;
  }
});
</script>
<script src="poster.js"></script>
<script src="share.js"></script>
</body>
