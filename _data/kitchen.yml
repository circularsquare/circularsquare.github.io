# ── plants ─────────────────────────────────────────────────────────────────
# Plants stand on the ground (the top of the footer) in a row, in the order
# their includes appear in the page. Include one twice for two of it.
# item:   what it grows. Defaults to the plant's own id.
# spots:  where fruits sit: the center of each fruit, in the plant png's own
#         pixels. The fruit is <item>onplant.png if that exists (any size),
#         otherwise the item's own sprite.
#         Fruits are drawn with the stem to the top left. Ones in the left
#         third of the plant are mirrored, in the middle third either way.
# pull:   true for roots: no fruits shown, clicking pulls up the whole plant,
#         which is gone until it regrows.
# look:   use another plant's png: look: potato uses potatoplant.png.
# png:    name the plant's png outright: png: beehive uses beehive.png.
# bare:   true for no plant at all; the item itself lies on the ground.
# repeat: that many copies side by side, a little field. Each is picked on
#         its own.
# sway:   true to lean in the wind, the top quarter most.
# stalks: true when <item>onplant.png is drawn the same size as the plant,
#         with stalks that don't touch: each stalk is picked on its own and
#         sways on its own. The plant behind stays still. No spots needed.
# bees:   bee.png flying around the plant. count, and which way the drawing
#         faces (left or right) so they turn the right way.
# regrow: minutes until a picked spot (or pulled plant) grows back.
plants:
  - id: potato
    pull: true
    regrow: 5
  - id: clementine
    spots: [[20, 22], [44, 16], [48, 34]]
    regrow: 5
  - id: blueberry
    spots: [[18, 44], [34, 50], [50, 44]]
    regrow: 5
  - id: pepper
    spots: [[22, 42], [36, 48], [48, 40]]
    regrow: 5
  - id: tomato
    look: potato
    spots: [[18, 32], [40, 26], [38, 44]]
    regrow: 5
  - id: ice
    bare: true
    regrow: 5
  - id: apple
    look: clementine            # until it has its own tree
    spots: [[20, 22], [44, 16], [48, 34]]
    regrow: 5
  - id: tea
    spots: [[16, 24], [34, 30], [22, 40]]
    regrow: 5
  - id: honey
    png: beehive
    spots: [[12, 24], [17, 27], [22, 23]]
    bees: {count: 3, faces: left}
    regrow: 5
  - id: soybean
    spots: [[7, 20], [17, 24], [12, 33]]
    regrow: 5
  - id: wheat
    stalks: true
    regrow: 5
  - id: rice
    pull: true
    repeat: 4
    sway: true
    regrow: 5

# ── stations ───────────────────────────────────────────────────────────────
# size: only for the gray stand-in until the png exists; a drawn station
#       uses the png's own size.
# <id>covered.png, if drawn, is shown while cooking (the pot with its lid).
# fire: an animated strip drawn over the station. png is the file, at is the
#       top-left corner of a frame in the station's own pixels, size is one
#       frame, the frames sit side by side in the png.
stations:
  - id: pot
    size: [32, 32]
    fire: {png: fire, at: [6, 11], size: [16, 16], frames: 4, fps: 2}
  - id: table                   # one dish, shared by everyone (shonei-server)
    table: true
  - id: pan                     # later
    size: [32, 16]

# ── recipes ────────────────────────────────────────────────────────────────
# Checked top to bottom; the first match wins, so specific ones go first and
# catch-alls last. The two ingredients can be in either order.
#   potato        that exact item
#   any leafy     any item with that tag
#   anything      any item, or an empty slot
#   nothing       an empty slot
# One entry in `in` means the other slot is empty.
recipes:
  # potato soup
  - {at: pot, in: [potato, pepper], out: spicypotatosoup}
  - {at: pot, in: [potato], out: potatosoup}
  - {at: pot, in: [potato, potato], out: potatosoup}
  - {at: pot, in: [potato, any allium], out: potatosoup}
  - {at: pot, in: [potato, any leafy], out: potatosoup}

  # sorbet: the fruit picks the color
  - {at: pot, in: [clementine, ice], out: clementinesorbet}
  - {at: pot, in: [blueberry, ice], out: blueberrysorbet}
  - {at: pot, in: [plum, ice], out: plumsorbet}
  - {at: pot, in: [any fruit, ice], out: sorbet}

  # tea
  - {at: pot, in: [any tea, ice], out: icedtea}
  - {at: pot, in: [any tea, tapioca], out: bubbletea}
  - {at: pot, in: [any tea, clementine], out: orangetea}
  - {at: pot, in: [any tea, blueberry], out: blueberrytea}
  - {at: pot, in: [any tea], out: teafood}
  - {at: pot, in: [any tea, any tea], out: teafood}
  - {at: pot, in: [any tea, any sweet], out: teafood}

  # soy
  - {at: pot, in: [soybean], out: tofu}
  - {at: pot, in: [soybean, soybean], out: tofu}
  - {at: pot, in: [tofu, pepper], out: soondubu}

  # rice
  - {at: pot, in: [rice], out: ricefood}
  - {at: pot, in: [rice, rice], out: ricefood}

  # the poison one goes before anything that could take a flower
  - {at: pot, in: [foxglove, anything], out: potslop}

  # jam: the fruit on its own, doubled, or with something sweet that isn't
  # another fruit (two different fruits make fruit salad)
  - {at: pot, in: [clementine], out: clementinejam}
  - {at: pot, in: [clementine, clementine], out: clementinejam}
  - {at: pot, in: [blueberry], out: blueberryjam}
  - {at: pot, in: [blueberry, blueberry], out: blueberryjam}
  - {at: pot, in: [any fruit, any fruit], out: fruitsalad}
  - {at: pot, in: [clementine, any sweet], out: clementinejam}
  - {at: pot, in: [blueberry, any sweet], out: blueberryjam}
  - {at: pot, in: [pepper, any sweet], out: pepperjam}

  # sweet things
  - {at: pot, in: [any flower, honey], out: syrup}
  - {at: pot, in: [any flower, birchsap], out: syrup}
  - {at: pot, in: [any nut, any sweet], out: candiednuts}
  - {at: pot, in: [any fruit, any sweet], out: jam}

  # savory
  - {at: pot, in: [russula, anything], out: mushroomsoup}
  - {at: pot, in: [pepper, any veg], out: pepperstew}
  - {at: pot, in: [pepper], out: pepperstew}
  - {at: pot, in: [egg], out: boiledegg}
  - {at: pot, in: [egg, any veg], out: eggdropsoup}
  - {at: pot, in: [any leafy, any veg], out: salad}
  - {at: pot, in: [any leafy, any fruit], out: salad}
  - {at: pot, in: [any grain], out: porridge}
  - {at: pot, in: [any grain, any fruit], out: porridge}
  - {at: pot, in: [any grain, any sweet], out: porridge}

  # plausible but unnamed
  - {at: pot, in: [any veg, anything], out: soupq}
  - {at: pot, in: [any bean, anything], out: soupq}

  # pan, later: same ingredients, different dishes
  # - {at: pan, in: [potato], out: fries}
  # - {at: pan, in: [egg], out: friedegg}
  # - {at: pan, in: [corn], out: popcorn}

  # everything else
  - {at: pot, in: [anything, anything], out: potslop}
