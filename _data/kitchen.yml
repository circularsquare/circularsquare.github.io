# The cooking game's data. Read by assets/cooking/kitchen.js.
#
# Sprites are found by name: an item, plant or station with id "potato" uses
# assets/cooking/potato.png, a plant uses <id>plant.png, a station <id>.png.
# Anything whose png doesn't exist yet is left out of the game entirely (no
# plant, no dex cell, recipes that make it are skipped), so this file can list
# far more than is drawn. Dropping in a png is what turns an entry on.
#
# Items appear in the dex in the order written here.
#
# Sizes: every png is shown at its own size, so ingredients are drawn 16x16
# and dishes 20x20 by habit, but a dish drawn 16x16 just comes out smaller.
# size: is only the space held while the png loads; leave it out normally.
#
# An ingredient and a dish can't share an id. When they'd have the same name,
# the dish gets "food" on the end: tea (leaves) and teafood (the drink).

# What eating says, by quality. good / ok / bad.
eat_text:
  good: "yum!"
  ok: "hmm..."
  bad: "..."

# What the cursor bunnies eat off the floor: items with any of these tags.
# An item with bunnies: false is left alone even so.
bunny_food: [veg, fruit, tea]

# ── ingredients ────────────────────────────────────────────────────────────
# tags: used by recipes ("any leafy"). Pick freely; a tag is just a word.
# eat:  quality when eaten raw. Leave it out for things you can't eat raw.
# page: where its plant lives. Only a note for you; placement is done with
#       {% include plant.html kind="..." %} in that page.
ingredients:
  - id: potato
    name: potato
    tags: [veg, root, starchy]
    bunnies: false               # raw potato is bad for them
    page: /thoughts/food/        # placeholder spot, move it anywhere
