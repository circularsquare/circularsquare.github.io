<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
<link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/assets/main.css?v={{ site.time | date: '%s' }}">

  {%- include head.html -%}
  <body class="staticmap-body">

    {%- include header.html -%}

    <main class="page-content staticmap-main layeredmap-main" aria-label="Content">
      <div class="staticmap-viewport" id="staticmap-viewport">
        <div class="staticmap-scene" id="staticmap-scene">
          <noscript><img class="staticmap-image" src="{{ page.image.full | default: page.image }}" alt="{{ page.title | escape }}"></noscript>
        </div>
      </div>
      <div class="layeredmap-controls" id="layeredmap-controls" hidden></div>
    </main>

    {%- include footer.html -%}

    <script src="https://unpkg.com/panzoom@9.4.0/dist/panzoom.min.js"></script>
    <script>
      // A pixel-art map made of separately exported layers (see maps/asia1m/weblayers.py), blended
      // in one shader so they can be switched on and off. Pan/zoom, cover fit, the sharp-bilinear
      // filter and the loose clamp are the same as staticmap.html. Each layer is fetched the first
      // time it is switched on. A map bigger than the GPU's texture limit is drawn in tiles.
      // On touch devices, without WebGL2, or if the map can't be put on the GPU, the flattened
      // page.image is shown instead and the controls stay hidden.
      (function() {
        var LAYERS_DIR = {{ page.layers | jsonify }};
        var FLAT_IMAGE = {{ page.image.full | default: page.image | jsonify }};
        var IMAGE_ALT = {{ page.title | jsonify }};
        var DEFAULT_LABELS = {{ page.labels | default: "" | jsonify }};
        var MAX_LINES = 4;   // line-layer slots in the shader

        var scene = document.getElementById('staticmap-scene');
        var viewport = document.getElementById('staticmap-viewport');
        var controls = document.getElementById('layeredmap-controls');

        var natW = 0, natH = 0;
        var fit = { w: 0, h: 0, left: 0, top: 0, vw: 0, vh: 0 };
        var fallbackImg = null;

        function applyFit(el) {
          el.style.width = fit.w + 'px';
          el.style.height = fit.h + 'px';
          el.style.left = fit.left + 'px';
          el.style.top = fit.top + 'px';
        }
        // Size to "cover" the viewport (fills the shorter axis, overflows the longer).
        function fitCover() {
          var vw = viewport.clientWidth, vh = viewport.clientHeight;
          if (!natW || !natH || !vw || !vh) return;
          var coverScale = Math.max(vw / natW, vh / natH);
          fit.w = natW * coverScale;
          fit.h = natH * coverScale;
          fit.left = (vw - fit.w) / 2;
          fit.top = (vh - fit.h) / 2;
          fit.vw = vw; fit.vh = vh;
          if (fallbackImg) applyFit(fallbackImg);
        }
        function imgScreenRect() {
          var t = instance.getTransform();
          return {
            left: t.x + t.scale * fit.left,
            top: t.y + t.scale * fit.top,
            width: t.scale * fit.w,
            height: t.scale * fit.h
          };
        }

        var instance = panzoom(scene, {
          maxZoom: 30,
          minZoom: 0.5,
          smoothScroll: false,
          beforeWheel: function(e) {
            e.preventDefault();
            return false;
          }
        });

        // The flattened image, in the scene so panzoom drives it. Used when WebGL2 can't
        // draw the layers, and while a lost GPU context is being restored.
        function showFallbackImg() {
          if (!fallbackImg) {
            fallbackImg = document.createElement('img');
            fallbackImg.className = 'staticmap-image';
            fallbackImg.alt = IMAGE_ALT;
            fallbackImg.addEventListener('load', function() {
              if (!natW) { natW = fallbackImg.naturalWidth; natH = fallbackImg.naturalHeight; fitCover(); }
              applyFit(fallbackImg);
            });
            fallbackImg.src = FLAT_IMAGE;
            scene.appendChild(fallbackImg);
            if (natW) applyFit(fallbackImg);
          }
          fallbackImg.style.visibility = '';
        }
        function removeFallbackImg() {
          if (fallbackImg) {
            if (fallbackImg.parentNode) fallbackImg.parentNode.removeChild(fallbackImg);
            fallbackImg = null;
          }
        }

        // ===== Layer state =====
        var meta = null;
        // What the controls ask for. labels: an id from meta.labels, or '' for none.
        var want = { colors: true, lines: {}, labels: DEFAULT_LABELS };
        // src -> { tex, loading } for every layer file fetched so far.
        var store = {};
        // The base and labels entries on screen, each kept until its replacement has loaded
        // and then freed, so only one of each is ever on the GPU.
        var shownBase = null, shownLabels = null;

        function layerUrl(src) { return LAYERS_DIR + src + '?v=' + meta.version; }

        // ===== Sharp-bilinear WebGL2 renderer =====
        // Same filter as staticmap.html: each source pixel keeps a flat centre and only a thin
        // seam at its edges is smoothed when magnifying; minifying falls through to mipmaps.
        // Every layer is sampled at the same filtered texel, so they stay registered.
        var gl = null, glCanvas = null, vao = null, quadBuf = null, prog = null, glReady = false;
        var dummyTex = null, U = {};
        var PIXEL_SCALE = 2.0;

        var VERT_SRC = `#version 300 es
in vec2 aPos;
in vec2 aUv;
out vec2 vUv;
void main(){ vUv = aUv; gl_Position = vec4(aPos, 0.0, 1.0); }`;

        // Base (the colored map, or the plain one with colors off), then line layers bottom to
        // top, then labels. A line layer is a mask (r = coverage, g = coverage of its second
        // colour) or premultiplied RGBA; rect places a cropped layer in full-map texels.
        // The plain map is its own image rather than a whitening mask over the colored one:
        // zoomed out, mipmaps average borders with the fills beside them, and whitening that
        // average leaves the borders tinted toward their neighbours.
        // vUv is in full-map texels. Each draw covers one tile, and every rect is that layer's
        // piece of the tile, so the same shader serves one tile or several.
        var FRAG_SRC = `#version 300 es
precision highp float;
uniform sampler2D uBase;
uniform sampler2D uLine0;
uniform sampler2D uLine1;
uniform sampler2D uLine2;
uniform sampler2D uLine3;
uniform sampler2D uLabels;
uniform vec4 uBaseRect;
uniform float uRegion;
uniform int uKind[5];       // 0 off, 1 mask, 2 premultiplied rgba; [4] is the labels
uniform vec4 uRect[5];
uniform vec3 uColor[5];
uniform vec3 uColor2[5];
uniform float uOpacity[5];
in vec2 vUv;
out vec4 outColor;

vec3 layer(vec3 c, sampler2D s, int i, vec2 t, vec2 dx, vec2 dy){
  if (uKind[i] == 0) return c;
  vec2 lt = t - uRect[i].xy;
  if (lt.x < 0.0 || lt.y < 0.0 || lt.x > uRect[i].z || lt.y > uRect[i].w) return c;
  vec2 sz = uRect[i].zw;
  vec4 v = textureGrad(s, lt / sz, dx / sz, dy / sz);
  if (uKind[i] == 1) {
    float a = v.r;
    vec3 lc = mix(uColor[i], uColor2[i], a > 0.0 ? clamp(v.g / a, 0.0, 1.0) : 0.0);
    return mix(c, lc, a * uOpacity[i]);
  }
  return c * (1.0 - v.a * uOpacity[i]) + v.rgb * uOpacity[i];
}

void main(){
  vec2 texel = vUv;
  vec2 dx = dFdx(texel);
  vec2 dy = dFdy(texel);
  vec2 dudv = abs(dx) + abs(dy);
  vec2 tf = floor(texel);
  vec2 cd = (texel - tf) - 0.5;
  vec2 excess = max(abs(cd) - uRegion, 0.0);
  vec2 ramp = excess / max(0.5 - uRegion, 1e-5);
  vec2 f = 0.5 + sign(cd) * 0.5 * ramp;
  vec2 t = mix(tf + f, texel, step(1.0, dudv));
  vec2 bs = uBaseRect.zw;
  vec3 c = textureGrad(uBase, (t - uBaseRect.xy) / bs, dx / bs, dy / bs).rgb;
  c = layer(c, uLine0, 0, t, dx, dy);
  c = layer(c, uLine1, 1, t, dx, dy);
  c = layer(c, uLine2, 2, t, dx, dy);
  c = layer(c, uLine3, 3, t, dx, dy);
  c = layer(c, uLabels, 4, t, dx, dy);
  outColor = vec4(c, 1.0);
}`;

        function compileShader(type, src) {
          var s = gl.createShader(type);
          gl.shaderSource(s, src);
          gl.compileShader(s);
          if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
            console.warn('[layeredmap] shader compile failed:', gl.getShaderInfoLog(s));
            return null;
          }
          return s;
        }

        // Program, quad buffer and a 1x1 stand-in for unused sampler slots. Run again after a
        // lost GPU context is restored.
        function buildGLResources() {
          var vs = compileShader(gl.VERTEX_SHADER, VERT_SRC);
          var fs = compileShader(gl.FRAGMENT_SHADER, FRAG_SRC);
          if (!vs || !fs) return false;
          prog = gl.createProgram();
          gl.attachShader(prog, vs);
          gl.attachShader(prog, fs);
          gl.linkProgram(prog);
          if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
            console.warn('[layeredmap] program link failed:', gl.getProgramInfoLog(prog));
            return false;
          }
          gl.useProgram(prog);
          ['uBaseRect', 'uRegion', 'uKind', 'uRect', 'uColor', 'uColor2', 'uOpacity'].forEach(function(n) {
            U[n] = gl.getUniformLocation(prog, n);
          });
          gl.uniform1f(U.uRegion, 0.5 - 0.5 / PIXEL_SCALE);
          ['uBase', 'uLine0', 'uLine1', 'uLine2', 'uLine3', 'uLabels'].forEach(function(n, unit) {
            gl.uniform1i(gl.getUniformLocation(prog, n), unit);
          });

          quadBuf = gl.createBuffer();
          vao = gl.createVertexArray();
          gl.bindVertexArray(vao);
          gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
          var posLoc = gl.getAttribLocation(prog, 'aPos');
          var uvLoc = gl.getAttribLocation(prog, 'aUv');
          gl.enableVertexAttribArray(posLoc);
          gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 16, 0);
          gl.enableVertexAttribArray(uvLoc);
          gl.vertexAttribPointer(uvLoc, 2, gl.FLOAT, false, 16, 8);

          dummyTex = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, dummyTex);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4));
          gl.clearColor(0, 0, 0, 0);
          return true;
        }

        // How each kind of file goes to the GPU. Masks are data, so no colour conversion; RGBA
        // layers are premultiplied so their edges filter without dark fringes.
        function formatFor(entry) {
          if (entry.kind === 'mask') {
            return entry.color2 ? { internal: gl.RG8, format: gl.RG, data: true }
                                : { internal: gl.R8, format: gl.RED, data: true };
          }
          if (entry.kind === 'rgba') return { internal: gl.RGBA8, format: gl.RGBA, premultiply: true };
          return { internal: gl.RGBA8, format: gl.RGBA };   // base
        }
        // Uploads the piece of im at (sx, sy, w, h) as one mipmapped texture, or returns null.
        function upload(im, fmt, sx, sy, w, h) {
          var tex = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, tex);
          gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, !!fmt.premultiply);
          gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, fmt.data ? gl.NONE : gl.BROWSER_DEFAULT_WEBGL);
          gl.pixelStorei(gl.UNPACK_ROW_LENGTH, im.naturalWidth);
          gl.pixelStorei(gl.UNPACK_SKIP_PIXELS, sx);
          gl.pixelStorei(gl.UNPACK_SKIP_ROWS, sy);
          // No UNPACK_FLIP_Y: texture row 0 = image top, matching the quad's top edge.
          while (gl.getError() !== gl.NO_ERROR) {}
          gl.texImage2D(gl.TEXTURE_2D, 0, fmt.internal, w, h, 0, fmt.format, gl.UNSIGNED_BYTE, im);
          var err = gl.getError();
          gl.pixelStorei(gl.UNPACK_ROW_LENGTH, 0);
          gl.pixelStorei(gl.UNPACK_SKIP_PIXELS, 0);
          gl.pixelStorei(gl.UNPACK_SKIP_ROWS, 0);
          // A truncated PNG can still fire load, then fail here (as can a GPU out of memory);
          // an empty texture would sample as opaque black, so leave the piece out instead.
          if (err !== gl.NO_ERROR) {
            gl.deleteTexture(tex);
            return null;
          }
          gl.generateMipmap(gl.TEXTURE_2D);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          return tex;
        }

        // ===== Tiles =====
        // A map wider or taller than the GPU's texture limit (8192 on many phones) is drawn as
        // a grid of tiles, one draw call each. Every layer is cut along the same grid; each
        // piece overlaps its neighbours by TILE_PAD so filtering and mipmaps near a seam still
        // see the pixels across it. One tile when the map fits, as on most desktops.
        // ?maxtex=4096 in the URL forces a smaller limit, to test the tiled path on a desktop.
        var TILE_PAD = 64, MAX_TILES = 4;
        var tiles = [];   // { x0, y0, x1, y1 } in map texels, the part each draw call covers
        function planTiles(maxTex) {
          var forced = parseInt((location.search.match(/[?&]maxtex=(\d+)/) || [])[1], 10);
          if (forced) maxTex = Math.min(maxTex, forced);
          function cuts(n) {
            var k = n <= maxTex ? 1 : Math.ceil(n / (maxTex - 2 * TILE_PAD)), out = [];
            for (var i = 0; i <= k; i++) out.push(Math.round(i * n / k));
            return out;
          }
          var xs = cuts(natW), ys = cuts(natH);
          tiles = [];
          for (var j = 0; j + 1 < ys.length; j++) {
            for (var i = 0; i + 1 < xs.length; i++) tiles.push({ x0: xs[i], y0: ys[j], x1: xs[i + 1], y1: ys[j + 1] });
          }
          return tiles.length <= MAX_TILES;
        }
        // The part of a layer (its crop rect, or the whole map) that tile k's textures hold.
        function pieceRect(entry, k) {
          var T = tiles[k];
          var lx = entry.w ? entry.x : 0, ly = entry.w ? entry.y : 0;
          var lw = entry.w || natW, lh = entry.w ? entry.h : natH;
          var x0 = Math.max(lx, T.x0 - TILE_PAD), y0 = Math.max(ly, T.y0 - TILE_PAD);
          var x1 = Math.min(lx + lw, T.x1 + TILE_PAD), y1 = Math.min(ly + lh, T.y1 + TILE_PAD);
          if (x1 <= x0 || y1 <= y0) return null;
          return { x: x0, y: y0, w: x1 - x0, h: y1 - y0, sx: x0 - lx, sy: y0 - ly };
        }

        // Fetch a layer file once and upload one texture per tile; render when it arrives.
        // The decoded image is dropped after upload, so only the GPU copies stay in memory.
        // Returns the store entry once it is on the GPU, else null.
        function ensure(entry) {
          var s = store[entry.src];
          if (s) return s.loading ? null : s;
          s = store[entry.src] = { pieces: [], loading: true, failed: false };
          var im = new Image();
          im.onload = function() {
            if (store[entry.src] !== s || !glReady) return;   // dropped, or context lost meanwhile
            var fmt = formatFor(entry);
            tiles.forEach(function(T, k) {
              var r = pieceRect(entry, k), tex = null;
              if (r) {
                tex = upload(im, fmt, r.sx, r.sy, r.w, r.h);
                if (!tex) s.failed = true;
              }
              s.pieces.push(tex ? { tex: tex, rect: r } : null);
            });
            if (s.failed) console.warn('[layeredmap] could not upload', entry.src);
            s.loading = false;
            update();
          };
          im.onerror = function() {
            console.warn('[layeredmap] could not load', entry.src);
            s.loading = false;
            s.failed = true;
            update();
          };
          im.src = layerUrl(entry.src);
          return null;
        }
        function drop(entry) {
          var s = store[entry.src];
          if (!s) return;
          if (gl) s.pieces.forEach(function(p) { if (p) gl.deleteTexture(p.tex); });
          delete store[entry.src];
        }

        // When the map itself can't be put on the GPU, show the flat image and no controls.
        function giveUp() {
          glReady = false;
          if (glCanvas) glCanvas.style.visibility = 'hidden';
          controls.hidden = true;
          showFallbackImg();
        }

        function hexRgb(h) {
          return [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
        }

        // Ask for whatever the controls want, swap base and labels once the new one has
        // loaded, and mark controls whose layer is still on its way.
        function update() {
          if (!glReady) return;
          var wantBase = want.colors || !meta.plain ? meta.base : meta.plain;
          var b = ensure(wantBase);
          if (b && b.failed) { giveUp(); return; }
          if (b) {
            if (shownBase && shownBase !== wantBase) drop(shownBase);
            shownBase = wantBase;
          }
          meta.lines.forEach(function(L) { if (want.lines[L.id]) ensure(L); });
          var wantLabels = null;
          meta.labels.forEach(function(L) { if (L.id === want.labels) wantLabels = L; });
          if (wantLabels && ensure(wantLabels)) {
            if (shownLabels && shownLabels !== wantLabels) drop(shownLabels);
            shownLabels = wantLabels;
          }
          Array.prototype.forEach.call(controls.querySelectorAll('[data-src]'), function(el) {
            var busy = el.getAttribute('data-src').split(' ').some(function(src) {
              return store[src] && store[src].loading;
            });
            el.classList.toggle('loading', busy);
          });
          render();
        }

        function bind(unit, tex) {
          gl.activeTexture(gl.TEXTURE0 + unit);
          gl.bindTexture(gl.TEXTURE_2D, tex || dummyTex);
        }

        function render() {
          if (!glReady || !fit.vw) return;
          var baseStore = shownBase && store[shownBase.src];
          var dpr = Math.min(window.devicePixelRatio || 1, 2);
          var cw = Math.max(1, Math.round(fit.vw * dpr));
          var ch = Math.max(1, Math.round(fit.vh * dpr));
          if (glCanvas.width !== cw || glCanvas.height !== ch) {
            glCanvas.width = cw;
            glCanvas.height = ch;
            glCanvas.style.width = fit.vw + 'px';
            glCanvas.style.height = fit.vh + 'px';
          }
          gl.viewport(0, 0, cw, ch);
          gl.clear(gl.COLOR_BUFFER_BIT);
          if (!baseStore || baseStore.loading) return;

          // Per-layer settings that don't change between tiles.
          var col = [], col2 = [], op = [0, 0, 0, 0, 1];
          for (var i = 0; i < 5; i++) { col.push(0, 0, 0); col2.push(0, 0, 0); }
          var slots = [];   // [i] = { L, s } for each slot drawn this frame
          function setSlot(i, L, s) {
            if (!s || s.loading) return;
            slots[i] = { L: L, s: s };
            var c = hexRgb(L.color || '#000000'), c2 = hexRgb(L.color2 || L.color || '#000000');
            col[i * 3] = c[0]; col[i * 3 + 1] = c[1]; col[i * 3 + 2] = c[2];
            col2[i * 3] = c2[0]; col2[i * 3 + 1] = c2[1]; col2[i * 3 + 2] = c2[2];
            if (L.opacity != null) op[i] = L.opacity;
          }
          meta.lines.forEach(function(L, i) { if (want.lines[L.id]) setSlot(i, L, store[L.src]); });
          if (want.labels && shownLabels) setSlot(4, Object.assign({ kind: 'rgba' }, shownLabels), store[shownLabels.src]);
          gl.uniform3fv(U.uColor, col);
          gl.uniform3fv(U.uColor2, col2);
          gl.uniform1fv(U.uOpacity, op);
          gl.bindVertexArray(vao);
          gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);

          var r = imgScreenRect();
          tiles.forEach(function(T, k) {
            var bp = baseStore.pieces[k];
            if (!bp) return;
            bind(0, bp.tex);
            gl.uniform4f(U.uBaseRect, bp.rect.x, bp.rect.y, bp.rect.w, bp.rect.h);
            var kind = [0, 0, 0, 0, 0], rect = [];
            for (var i = 0; i < 5; i++) {
              var p = slots[i] && slots[i].s.pieces[k];
              bind(1 + i, p && p.tex);
              if (p) {
                kind[i] = slots[i].L.kind === 'mask' ? 1 : 2;
                rect.push(p.rect.x, p.rect.y, p.rect.w, p.rect.h);
              } else {
                rect.push(0, 0, 1, 1);
              }
            }
            gl.uniform1iv(U.uKind, kind);
            gl.uniform4fv(U.uRect, rect);

            // This tile's quad on screen, with uv in map texels.
            var sx0 = r.left + r.width * T.x0 / natW, sx1 = r.left + r.width * T.x1 / natW;
            var sy0 = r.top + r.height * T.y0 / natH, sy1 = r.top + r.height * T.y1 / natH;
            var x0 = (sx0 / fit.vw) * 2 - 1, x1 = (sx1 / fit.vw) * 2 - 1;
            var y0 = 1 - (sy0 / fit.vh) * 2, y1 = 1 - (sy1 / fit.vh) * 2;
            var verts = new Float32Array([
              x0, y0, T.x0, T.y0,   x1, y0, T.x1, T.y0,   x0, y1, T.x0, T.y1,
              x0, y1, T.x0, T.y1,   x1, y0, T.x1, T.y0,   x1, y1, T.x1, T.y1
            ]);
            gl.bufferData(gl.ARRAY_BUFFER, verts, gl.DYNAMIC_DRAW);
            gl.drawArrays(gl.TRIANGLES, 0, 6);
          });
        }

        function setupRenderer() {
          glCanvas = document.createElement('canvas');
          glCanvas.style.position = 'absolute';
          glCanvas.style.inset = '0';
          glCanvas.style.pointerEvents = 'none';   // let pan/zoom events fall through to the scene
          glCanvas.setAttribute('aria-label', IMAGE_ALT);
          viewport.appendChild(glCanvas);

          gl = glCanvas.getContext('webgl2', { antialias: false, premultipliedAlpha: false });
          var maxTex = gl ? gl.getParameter(gl.MAX_TEXTURE_SIZE) : 0;
          if (!gl || !planTiles(maxTex) || meta.lines.length > MAX_LINES || !buildGLResources()) {
            viewport.removeChild(glCanvas); gl = null;
            return false;
          }

          // GPU context loss (common on mobile under memory pressure): show the flattened image,
          // then rebuild and refetch (from the HTTP cache) once the context is back.
          glCanvas.addEventListener('webglcontextlost', function(e) {
            e.preventDefault();              // required, or the context never restores
            glReady = false;
            glCanvas.style.visibility = 'hidden';
            showFallbackImg();
          }, false);
          glCanvas.addEventListener('webglcontextrestored', function() {
            store = {};
            shownBase = shownLabels = null;
            if (buildGLResources()) {
              glReady = true;
              glCanvas.style.visibility = '';
              removeFallbackImg();
              update();
            }
          }, false);
          glReady = true;
          return true;
        }

        // ===== Controls =====
        // One checkbox per line-layer id, a colors checkbox when there is a plain map, and one
        // radio per label set plus none. data-src lists the files a control waits on.
        function buildControls() {
          var html = [];
          var ids = [], srcs = {};
          meta.lines.forEach(function(L) {
            if (ids.indexOf(L.id) < 0) { ids.push(L.id); srcs[L.id] = []; }
            srcs[L.id].push(L.src);
          });
          ids.sort();
          ids.forEach(function(id) {
            html.push('<label data-src="' + srcs[id].join(' ') + '"><input type="checkbox" data-line="' + id + '"> ' + id + '</label>');
          });
          if (meta.plain) {
            html.push('<label data-src="' + meta.base.src + ' ' + meta.plain.src + '"><input type="checkbox" data-colors checked> colors</label>');
          }
          if (meta.labels.length) {
            html.push('<div class="layeredmap-gap"></div>');
            meta.labels.concat([{ id: '', name: 'none' }]).forEach(function(L) {
              html.push('<label' + (L.src ? ' data-src="' + L.src + '"' : '') + '><input type="radio" name="layeredmap-labels" value="' + L.id + '"' +
                        (L.id === want.labels ? ' checked' : '') + '> ' + L.name + '</label>');
            });
          }
          controls.innerHTML = html.join('');
          controls.addEventListener('change', function(e) {
            var el = e.target;
            if (el.hasAttribute('data-line')) want.lines[el.getAttribute('data-line')] = el.checked;
            else if (el.hasAttribute('data-colors')) want.colors = el.checked;
            else if (el.name === 'layeredmap-labels') want.labels = el.value;
            update();
          });
          controls.hidden = false;
        }

        // Loose clamp, as in staticmap.html: after a drag or zoom, keep at least minVis pixels
        // of the map inside the viewport on each axis.
        function clampIntoView() {
          if (!fit.vw) return;
          var im = imgScreenRect();
          var t = instance.getTransform();
          var minVis = Math.max(40, 250 / t.scale);
          var right = im.left + im.width, bottom = im.top + im.height;
          var dx = 0, dy = 0;
          if (right < minVis) {
            dx = minVis - right;
          } else if (im.left > fit.vw - minVis) {
            dx = (fit.vw - minVis) - im.left;
          }
          if (bottom < minVis) {
            dy = minVis - bottom;
          } else if (im.top > fit.vh - minVis) {
            dy = (fit.vh - minVis) - im.top;
          }
          if (dx !== 0 || dy !== 0) {
            instance.smoothMoveTo(t.x + dx, t.y + dy);
          }
        }

        instance.on('panend', clampIntoView);
        instance.on('zoomend', clampIntoView);
        instance.on('transform', render);
        window.addEventListener('resize', function() {
          fitCover();
          render();
        });

        // Layers are a desktop feature: phones and tablets (touch as the main input) get the
        // flat image. Anita's phone never showed the switches, even with tiling.
        if (window.matchMedia('(hover: none) and (pointer: coarse)').matches) {
          showFallbackImg();
          return;
        }

        fetch(LAYERS_DIR + 'layers.json?v={{ site.time | date: "%s" }}').then(function(r) {
          if (!r.ok) throw new Error(r.status);
          return r.json();
        }).then(function(m) {
          meta = m;
          natW = meta.width; natH = meta.height;
          if (!meta.labels.some(function(L) { return L.id === want.labels; })) want.labels = '';
          fitCover();
          if (!setupRenderer()) { showFallbackImg(); return; }
          buildControls();
          update();
        }).catch(function(err) {
          console.warn('[layeredmap] no layers, showing the flat image:', err);
          showFallbackImg();
        });
      })();
    </script>
  </body>

</html>
