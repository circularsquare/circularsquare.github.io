<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #07090d; color: #eee; font-family: 'Nunito', system-ui, sans-serif; overflow: hidden; }
#map { width: 100vw; height: 100vh; }

#title {
    position: absolute;
    top: 12px; left: 14px;
    background: rgba(7,9,13,0.84);
    border: 1px solid #2a2f38;
    border-radius: 8px;
    padding: 9px 13px;
    z-index: 100;
    max-width: 360px;
    font-size: 13px;
    line-height: 1.45;
}
#title .hdr { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
#title h1 { font-size: 15px; font-weight: 800; margin-bottom: 3px; }
#title .sub { color: #8b939e; font-size: 11px; }
#title a { color: #5bb6ff; text-decoration: none; }

#langtoggle { flex: none; font-size: 11px; white-space: nowrap; }
#langtoggle span { cursor: pointer; color: #8b939e; padding: 1px 5px; border-radius: 4px; }
#langtoggle span.on { color: #fff; background: #2a2f38; }

#bottomleft {
    position: absolute;
    bottom: 16px; left: 14px;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
}
#legend {
    position: relative;
    background: rgba(7,9,13,0.84);
    border: 1px solid #2a2f38;
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 11.5px;
    line-height: 1.7;
}
#legend.hidden { display: none; }
/* desktop: widen so the data-view trio (national / metro / stitched) sits on
   one line. Mobile keeps the auto-narrow column. */
@media (min-width: 701px) {
    #legend { min-width: 190px; }
    #legend .thick { width: 100%; }
}
#legend .close {
    position: absolute;
    top: 2px; right: 4px;
    color: #59616d;
    cursor: pointer;
    font-size: 20px;
    line-height: 1;
    padding: 4px 6px;
    user-select: none;
}
#legend .close:hover { color: #d8dde3; }
#ctrlbtn {
    width: 40px; height: 40px;
    background: rgba(7,9,13,0.84);
    border: 1px solid #2a2f38;
    border-radius: 50%;
    color: #c0c5cc;
    cursor: pointer;
    user-select: none;
    display: none;
    align-items: center;
    justify-content: center;
    transition: color .15s, border-color .15s;
}
#ctrlbtn svg { width: 22px; height: 22px; }
#ctrlbtn:hover { color: #fff; border-color: #4a505c; }
#ctrlbtn.show { display: flex; }
#legend .hd { color: #8b939e; font-size: 10px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; }
#legend .row { display: flex; align-items: center; gap: 6px; }
#legend .sw { width: 14px; height: 3px; border-radius: 2px; flex: none; }
#legend .widths { margin-top: 7px; padding-top: 6px; border-top: 1px solid #2a2f38; }
#legend .wrow { display: flex; align-items: center; gap: 6px; }
#legend .wbar { background: #d8dde3; border-radius: 2px; flex: none; }
#legend .thick { margin-top: 7px; width: 150px; }
#legend .thick .val { color: #d8dde3; }
#legend .thick input { width: 100%; margin-top: 0; accent-color: #5bb6ff; cursor: pointer; }
#legend .thick .hd { margin-bottom: 0; }
#legend .modetoggle { display: flex; gap: 4px; margin-bottom: 6px; }
#legend .modetoggle span { cursor: pointer; color: #8b939e; padding: 2px 7px; border-radius: 4px; border: 1px solid #2a2f38; }
#legend .modetoggle span.on { color: #fff; background: #2a2f38; }
#legend .widths .modetoggle { margin-top: 8px; }
#legend .stsec { margin-top: 7px; padding-top: 6px; border-top: 1px solid #2a2f38; }
#aboutbtn {
    position: absolute;
    top: 96px; left: 14px;
    z-index: 110;
    width: 32px; height: 32px;
    background: rgba(7,9,13,0.84);
    border: 1px solid #2a2f38;
    border-radius: 50%;
    color: #c0c5cc;
    font-size: 17px;
    font-weight: 700;
    line-height: 30px;
    text-align: center;
    cursor: pointer;
    user-select: none;
    transition: color .15s, border-color .15s;
}
#aboutbtn:hover { color: #fff; border-color: #4a505c; }
#aboutbtn.on { color: #fff; background: #2a2f38; border-color: #5bb6ff; }
#aboutpanel {
    position: absolute;
    bottom: 16px;
    left: 215px;
    width: 360px;
    max-width: calc(100vw - 235px);
    max-height: calc(80vh - 16px);
    overflow-y: auto;
    background: rgba(7,9,13,0.94);
    border: 1px solid #3a414c;
    border-radius: 8px;
    padding: 14px 16px;
    z-index: 105;
    font-size: 11.5px;
    line-height: 1.5;
    color: #c0c5cc;
    display: none;
}
#aboutpanel.open { display: block; }
@media (max-width: 700px) {
    #aboutpanel {
        left: 14px; right: 14px;
        width: auto; max-width: none;
    }
}
#aboutpanel h2 { color: #fff; font-size: 13px; font-weight: 800; margin: 14px 0 5px; letter-spacing: .3px; }
#aboutpanel h2:first-child { margin-top: 0; }
#aboutpanel p { margin-top: 6px; }
#aboutpanel p:first-of-type { margin-top: 0; }
#aboutpanel b { color: #fff; }
#aboutpanel a { color: #5bb6ff; text-decoration: none; }
#legend .strow { display: flex; align-items: center; gap: 8px; width: 150px; }
#legend .strow input[type=checkbox] { width: 13px; height: 13px; flex: none; margin: 0; accent-color: #5bb6ff; cursor: pointer; }
#legend .strow input[type=range] { flex: 1; min-width: 0; accent-color: #5bb6ff; cursor: pointer; }

#info {
    position: absolute;
    bottom: 16px; right: 14px;
    background: rgba(7,9,13,0.92);
    border: 1px solid #3a414c;
    border-radius: 8px;
    padding: 10px 13px;
    z-index: 100;
    font-size: 12.5px;
    line-height: 1.5;
    max-width: 320px;
    display: none;
}
#info .ipline { font-weight: 800; font-size: 13.5px; margin-bottom: 3px; }
#info .ipseg { color: #fff; margin-bottom: 5px; }
#info .iprow { display: flex; justify-content: space-between; gap: 20px; color: #8b939e; }
#info .iprow b { color: #eee; font-weight: 700; }
#info .iphint { margin-top: 7px; color: #59616d; font-size: 10.5px; }
#info .ipnote { color: #8b939e; font-size: 11px; margin-top: 3px; }

#tooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(7,9,13,0.96);
    border: 1px solid #3a414c;
    border-radius: 6px;
    padding: 6px 9px;
    font-size: 12px;
    line-height: 1.45;
    z-index: 200;
    display: none;
    white-space: nowrap;
}
#tooltip .line { font-weight: 800; }
#tooltip .seg { color: #fff; }
#tooltip .ri { color: #ffd66b; font-weight: 800; }
#tooltip .meta { color: #8b939e; font-size: 11px; }
/* what the tooltip is about, before its name: a pale dot for a station bubble,
   a bar in the line's own colour for a line */
#tooltip .line { display: flex; align-items: center; gap: 6px; }
#tooltip .mk-dot { width: 8px; height: 8px; border-radius: 50%; background: #e6e9ee; flex: none; }
/* 3px tall, top edge sitting where a centred 5px bar's would: the bottom margin
   lifts it off the centre line */
#tooltip .mk-bar { width: 12px; height: 3px; margin-bottom: 2px; border-radius: 1.5px; flex: none; }
/* the longer Korean notes wrap instead of stretching the tooltip across the map */
#tooltip .note { color: #8b939e; font-size: 11px; white-space: normal; max-width: 280px; }

/* the outline over Korea that adds its network. Instant hover, no transition */
#krbtn {
    border: 1.5px solid rgba(255,255,255,0.38);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.75);
    font-size: 10px;
    user-select: none;
}
#krbtn:hover { border-color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.06); }
#krbtn.loading { cursor: progress; }
#legend .krwarn { color: #a8864a; font-size: 10.5px; line-height: 1.4; width: 150px; margin-top: 2px; }
#legend .krrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 150px; }
#legend .krrow .strow { width: auto; }
#legend .krlink { color: #8b939e; padding: 0 7px; border-radius: 4px; border: 1px solid #2a2f38; text-decoration: none; white-space: nowrap; }
#legend .krlink:hover { color: #fff; border-color: #4a505c; }

.maplibregl-ctrl-attrib { font-size: 10px !important; }
/* ── loading overlay ─────────────────────────────────────────────────────
   Same shape as nycriders. The bar counts FILES, not bytes, and the megabyte
   readout underneath is a separate number rather than the bar's own scale.
   GitHub Pages serves this data gzipped, so `Content-Length` is the compressed
   size while a stream reader hands back inflated bytes; measuring one against
   the other pins the bar at 100% about a quarter of the way in, which is worse
   than a coarse bar that is right. The file count cannot overshoot. */
#loading {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-size: 18px; color: #ccc; z-index: 20; text-align: center;
    pointer-events: none;
}
#loading-bar {
    width: 220px; height: 3px; margin: 10px auto 0; border-radius: 2px;
    background: rgba(255,255,255,0.12); overflow: hidden;
}
#loading-bar-fill { width: 0; height: 100%; background: #ccc; }
#loading-sub { font-size: 11px; color: #777; margin-top: 6px; }
</style>
</head>

<script>
// ─────────────────────────── interface strings ───────────────────────────
const STR = {
    en: {
        h1: 'japan rail flow',
        sub1: 'line thickness = passenger throughput',
        legLineColors: 'line colors',
        modeOperator: 'by operator',
        modeLine: 'by line',
        legWidth: 'throughput (pax / day)',
        tipThroughput: 'throughput',
        tipCensus: 'per-segment shape: 2015 census',
        toggleStations: 'station bubbles',
        tipStationRiders: 'station traffic',
        legSource: 'data view',
        srcBase: 'national',
        srcCensus: 'metro',
        srcStitched: 'stitched',
        aboutTitle: 'about',
        aboutBody: `<h2>lines &amp; segments</h2><p>A <b>line</b> is a named route run by one operator end to end. A <b>segment</b> is the shortest piece of a line we have passenger throughput data for.</p><p><b>Left click</b> to highlight a line. <b>Right click</b> to highlight a segment.</p><h2>data views</h2><p><b>national</b>: each operator's published passenger throughput (passengers per day per km of track), the nationwide source.</p><p><b>metro</b>: per segment detail from the 2015 Metropolitan Transportation Census. Only exists inside the Tokyo, Nagoya, and Osaka census regions. The census is a weekday commuter snapshot, so it tends to undercount long distance and non commuter trips.</p><p><b>stitched</b>: inside the three census regions, the metro data is scaled to match each line's national total. Outside, lines stay at the national value. The gap between the metro census's total and the national total is added back as a uniform baseline, so the outskirts of metro areas blend smoothly into the national level.</p><h2>line thickness scale</h2><p>The <b>linear scale below</b> slider sets where line width switches from linear to logarithmic. Set it <b>high</b> to see fine differences inside busy metro areas. Set it <b>low</b> to see thin rural lines alongside thick urban ones, good for viewing the whole country at once.</p><h2>data sources</h2><p>National throughput: <a href="https://gtfs-gis.jp/railway_tsukajinin/">gtfs-gis.jp</a> (Akira Nishizawa, CC BY 4.0), 2024.</p><p>Census: Metropolitan Transportation Census 2015.</p><p>Geometry: MLIT N02.</p><p>Station ridership: <a href="https://nlftp.mlit.go.jp/ksj/">MLIT S12</a>, 2021.</p><p>Note: because the national and metropolitan census data are far apart in time, ridership numbers differ.</p>`,
        legThickness: 'line thickness',
        legFloor: 'log scale above',
        scaleLog: 'log',
        scaleLinear: 'linear',
        autocap: 'autocap',
        panelLength: 'length',
        panelSections: 'sections',
        panelRange: 'throughput',
        panelHint: 'left-click line · right-click segment · Esc clears',
        km: 'km', perday: 'pax/day',
        // ── korea ──
        krShowTitle: 'show korea',
        legKorea: 'korea',
        krShow: 'show',
        krWarn: 'segment figures are reconstructed, not published',
        krFullMap: 'full map ↗',
        legNoSvc: 'no rider figure',
        krRecon: 'reconstructed',
        krEstimated: 'estimated OD',
        krSeoulModel: 'Seoul area · modelled weekday',
        krStraight: 'straight-line shape',
        krScenario: 'scenario range, not a confidence interval',
        krDown: 'down', krUp: 'up',
        krClsHs: 'high-speed', krClsSemi: 'semi-high-speed', krClsConv: 'conventional', krClsMetro: 'metro',
        krStubTo: 'junction with {n}',
        krStubNote: 'Past the last platform. These are the passengers still aboard, riding on to join the {n}.',
        krJoinNote: '{n} trains join at a junction with no station, so the count steps up partway along.',
        krThroughNote: 'Runs past {n} more stations no intercity train stops at.',
        krNoSvcTitle: 'No intercity service',
        krNoSvcCommuter: 'Commuter rail only, {n} trains a day each way in {y}. Those riders are on the metro lines.',
        krNoSvcNone: 'No trains ran on this section in {y}.',
        krUnrecTitle: 'Riders not recorded',
        krUnrecNote: 'Intercity trains run here, {n} a day each way in {y}, but the yearbook credits this line with almost no passengers, so this grey line carries no figure. The ITX-Cheongchun on the same rails is drawn separately, from Korail station counts.',
        krPubTitle: 'Published total, not reconstructed',
        krPubTip: 'published line total for {y}, split evenly by direction',
        krPubNote: 'No station on this line reports boardings its own trains can claim, so nothing here is cumulated. The figure is the line\'s {y} passenger total from Korail\'s Railway Statistics Yearbook, split evenly between the two directions. All of it rode this stretch, the only one with intercity trains on it ({n} a day each way).',
        aboutKorea: `<h2>korea</h2><p>Click the outline over Korea to add South Korea's rail network. It is drawn at the same scale as Japan's, so a line or bubble of the same size means the same number of passengers.</p><p>Korea publishes no passenger figures per segment, so the Korean segments are <b>reconstructed</b>. Station boardings and alightings from Korail's Railway Statistics Yearbook (철도통계연보) are cumulated along each line and fitted to the passenger totals the yearbook publishes per line. Intercity figures are daily averages over the year.</p><p>Seoul's metropolitan lines are a modelled weekday built from 2023 origin and destination data. Busan, Daegu, Daejeon, Gwangju and Busan–Gimhae are estimated from station gate counts with a gravity model, and their tooltips give the range across its assumptions. The Donghae Line commuter service and the ITX-Cheongchun are estimated the same way, from Korail's commuter rail statistics board (광역수송 수송통계). Grey track has no rider figure.</p><p>Korean bubbles are yearbook counts at intercity stations and the city models' station totals everywhere else.</p><p>Geometry: OpenStreetMap.</p>`,
    },
    ja: {
        h1: '日本 鉄道輸送密度',
        sub1: '線の太さ ＝ 輸送密度',
        legLineColors: 'ラインカラー',
        modeOperator: '事業者別',
        modeLine: '路線別',
        legWidth: '輸送密度（人/日）',
        tipThroughput: '輸送密度',
        tipCensus: '区間形状：2015年センサス',
        toggleStations: '駅バブル',
        tipStationRiders: '乗降客数',
        legSource: 'データ表示',
        srcBase: '全国',
        srcCensus: '都市圏',
        srcStitched: '統合',
        aboutTitle: 'このマップについて',
        aboutBody: `<h2>路線と区間</h2><p><b>路線</b>は事業者が端から端まで運行する一本のルート。<b>区間</b>はその中で輸送密度データが取れる最小の単位。</p><p><b>左クリック</b>で路線を、<b>右クリック</b>で区間をハイライト。</p><h2>データ表示</h2><p><b>全国</b>：各事業者が公表している輸送密度（人キロ/営業キロ/日）の全国データ。</p><p><b>都市圏</b>：2015年大都市交通センサスの駅間通過人員。首都圏・中京圏・近畿圏のみ。平日の通勤利用が中心の調査なので、長距離や非通勤の利用は少なめに出やすい。</p><p><b>統合</b>：3大都市圏では、都市圏データを各路線の全国公表値に合うように再スケール。都市圏外は全国公表値のまま。センサスの合計と全国公表値の差は一様なベースラインとして各区間に上乗せしているので、都市圏の外縁でも全国レベルに滑らかにつながる。</p><h2>線の太さスケール</h2><p><b>線形スケールの上限</b>スライダーは、線の太さが線形から対数に切り替わるポイントを決める。<b>高く</b>すると、混雑した都市圏の路線同士の細かい違いが見やすい。<b>低く</b>すると、地方の閑散路線と都市の混雑路線を一度に比べやすく、全国を一望するのに向いている。</p><h2>データソース</h2><p>全国輸送密度：<a href="https://gtfs-gis.jp/railway_tsukajinin/">gtfs-gis.jp</a>（西澤明, CC BY 4.0）、2024年。</p><p>センサス：大都市交通センサス 2015年。</p><p>線形：国土数値情報 N02。</p><p>駅乗降客数：<a href="https://nlftp.mlit.go.jp/ksj/">国土数値情報 S12</a>、2021年。</p><p>注：全国データと大都市交通センサスは年次が離れているので、数字には差がある。</p>`,

        scaleLinear: '線形',
        autocap: '自動上限',
        panelLength: '営業キロ',
        panelSections: '区間数',
        panelRange: '輸送密度',
        panelHint: '左クリックで路線 · 右クリックで区間 · Esc で解除',
        km: 'km', perday: '人/日',
        // ── 韓国 ──
        krShowTitle: '韓国を表示',
        legKorea: '韓国',
        krShow: '表示',
        krWarn: '区間の数値は公表値ではなく復元値',
        krFullMap: '詳細マップ ↗',
        legNoSvc: '旅客数データなし',
        krRecon: '復元値',
        krEstimated: 'OD推計',
        krSeoulModel: 'Seoul · 平日のモデル推計',
        krStraight: '線形は直線',
        krScenario: '仮定別の範囲（信頼区間ではない）',
        krDown: '下り', krUp: '上り',
        krClsHs: '高速線', krClsSemi: '準高速線', krClsConv: '在来線', krClsMetro: '都市鉄道',
        krStubTo: '{n}との分岐点',
        krStubNote: '最後の駅より先の区間。{n}へ直通するため乗ったままの旅客数。',

        krNoSvcTitle: '一般列車の運行なし',
        krNoSvcCommuter: '{y}年は広域電鉄のみで、片道1日{n}本。その旅客は都市鉄道の線に含まれる。',

        krPubTitle: '復元値ではなく公表値',

    kneeA = 1 / (LOG_CEIL - knee + Math.LOG10E);   // log-branch slope factor

// lines that are still on the log branch around the slider midpoint (they bulge

// A super-quadratic ramp keeps effMul barely above 1× through the first half of

    map.on('contextmenu', (e) => {

// ─────────────────────────── selection / info ────────────────────────────
// does this segment feature belong to the currently selected line/segment?
// Korean features carry the same keys (see the korea section), so this and
// selCond serve both countries.
function matchesSelection(p) {
    if (!selected) return false;
    if (selected.op !== p.op || selected.line !== p.line) return false;
    if (selected.mode === 'segment') {
        // base mode groups by section (every cut piece of one operator-
        // published unit); stitched/census group by per-piece endpoints.
        const isBase = selected.sourceMode === 'base';
        return isBase
            ? (selected.from === p.base_from && selected.to === p.base_to)
            : (selected.from === p.from && selected.to === p.to);

const segHitLayers = () => map.getLayer('kr-hit') ? ['segs-hit', 'kr-hit'] : ['segs-hit'];

function selCond(s) {
    const t = [['==', ['get', 'op'], s.op], ['==', ['get', 'line'], s.line]];

        // piece of the section lights up together. census / stitched match
        // by per-piece from/to like before.
        const isBase = s.sourceMode === 'base';
        const fk = isBase ? 'base_from' : 'from';
        const tk = isBase ? 'base_to'   : 'to';

// endpoint AND the bubble is within ~400m of the line geometry. Name alone is

        && f.properties.from === p.from && f.properties.to === p.to);

function geomFromTo(p) {

    if (krSfc && map.getSource('kstations'))
        for (const f of krSfc.features)
            map.setFeatureState({ source: 'kstations', id: f.id }, { onLine: krSelStationIds.has(f.id) });

// [casing, core line, bubbles] for Japan and, once loaded, Korea. A selection
// in either country dims the other one too.
function selectionLayers() {
    const sets = [['segs-casing', 'segs-line', 'station-dots']];
    if (map.getLayer('kr-line')) sets.push(['kr-casing', 'kr-line', 'kr-dots']);
    return sets;
}

function applySelection() {
    if (!selected) {
        for (const [casing, line, dots] of selectionLayers()) {
            map.setFilter(casing, NO_MATCH);
            map.setPaintProperty(line, 'line-opacity', 0.92);
            if (map.getLayer(dots)) {
                map.setPaintProperty(dots, 'circle-opacity', 0.5);
                map.setPaintProperty(dots, 'circle-stroke-width', 0);
            }
        }
        selStationIds = new Set();
        krSelStationIds = new Set();
        pushStationFeatureState();
        return;
    }
    const cond = selCond(selected);
    recomputeSelStationIds();
    pushStationFeatureState();

    const onLine = ['boolean', ['feature-state', 'onLine'], false];
    for (const [casing, line, dots] of selectionLayers()) {
        map.setFilter(casing, cond);
        map.setPaintProperty(line, 'line-opacity', ['case', cond, 0.97, 0.13]);
        if (map.getLayer(dots)) {
            map.setPaintProperty(dots, 'circle-opacity', ['case', onLine, 0.95, 0.08]);
            map.setPaintProperty(dots, 'circle-stroke-color', selected.color);
            map.setPaintProperty(dots, 'circle-stroke-width', ['case', onLine, 1.5, 0]);

function setLineSelection(p) {
    selected = { mode: 'line', op: p.op, line: p.line, color: p.color };
    applySelection();
    renderInfo();
}

function setSegmentSelection(p) {
    // In base mode the segment unit is the whole operator-published section,
    // identified by base_from/base_to. Stitched/census stay per-piece.
    const isBase = sourceMode === 'base';
    // A Korean segment carries more than a Japanese one (the direction split,
    // service, notes) and its info panel reads all of it, so it keeps the lot.
    // The fields below overwrite with values that are the same for it.
    selected = { ...(p.op === KR_OP ? p : {}), mode: 'segment', op: p.op, line: p.line,
                 from: isBase ? p.base_from : p.from,
                 to:   isBase ? p.base_to   : p.to,
                 color: p.color, density: p.density, d_base: p.d_base,
                 d_census: p.d_census, km: p.km, base_km: p.base_km,
                 detail: p.detail, sourceMode };
    applySelection();
    renderInfo();
}

// right-click handler — toggles a segment off when clicking the same one again
function selectSegment(p) {
    const isBase = sourceMode === 'base';
    const idFrom = isBase ? p.base_from : p.from;
    const idTo   = isBase ? p.base_to   : p.to;
    if (selected && selected.mode === 'segment'
        && selected.sourceMode === sourceMode
        && selected.op === p.op && selected.line === p.line
        && selected.from === idFrom && selected.to === idTo) {
        clearSelection(); return;
    }
    setSegmentSelection(p);
}

function clearSelection() {
    if (!selected) return;
    selected = null;
    applySelection();
    document.getElementById('info').style.display = 'none';
}

// ─────────────────────────── colour mode ─────────────────────────────────
function setColorMode(mode) {
    if (mode === colorMode) return;
    colorMode = mode;
    for (const f of allFeats) {
        const p = f.properties;
        p.color = colorMode === 'line' ? p.colorLine : p.colorOp;
    }
    if (fcData) map.getSource('segs').setData(fcData);   // layers read ['get','color']
    if (krFc) {
        for (const f of krFc.features) {
            const p = f.properties;
            p.color = colorMode === 'line' ? p.colorLine : p.colorOp;
        }
        map.getSource('ksegs').setData(krFc);
    }
    if (selected) {
        const pool = selected.op === KR_OP ? krFc.features : allFeats;
        const same = x => x.properties.op === selected.op && x.properties.line === selected.line;
        // prefer a segment with a figure: a Korean line can begin in grey
        const f = pool.find(x => same(x) && !x.properties.service) || pool.find(same);
        if (f) selected.color = f.properties.color;
        applySelection();   // refresh station stroke colour
    }
    buildLegend();
    renderInfo();
}

function renderInfo() {
    if (!selected) return;
    if (selected.op === KR_OP) { renderKrInfo(); return; }
    const S = STR[lang];
    const box = document.getElementById('info');
    const head = `<div class="ipline" style="color:${selected.color}">` +
                 `${opLabel(selected.op)} ${lineLabel(selected.op, selected.line)}</div>`;

    if (selected.mode === 'segment') {
        // base mode: section unit — sum km across every cut piece; suppress
        // the per-piece census hint since the selection isn't one census row.
        const isBase = selected.sourceMode === 'base';
        let km = Number(selected.km) || 0;
        if (isBase) {
            km = Number(selected.base_km) || 0;
            if (!km) {
                km = 0;
                for (const f of allFeats) {
                    const q = f.properties;
                    if (q.op === selected.op && q.line === selected.line
                        && q.base_from === selected.from && q.base_to === selected.to)
                        km += Number(q.km) || 0;
                }
            }
        }
        // non-base: rescue mislabeled from/to via combined sibling extent
        let fromN = selected.from, toN = selected.to, fromOp = selected.op, toOp = selected.op;
        if (!isBase) {
            const g = geomFromTo({ op: selected.op, line: selected.line,
                                   from: selected.from, to: selected.to });
            fromN = g.from; toN = g.to; fromOp = g.fromOp; toOp = g.toOp;
        }
        box.innerHTML = head +
            `<div class="ipseg">${stnLabel(fromOp, fromN)} → ${stnLabel(toOp, toN)}</div>` +
            `<div class="iprow"><span>${S.panelLength}</span>` +
                `<b>${Number(km).toFixed(1)} ${S.km}</b></div>` +
            `<div class="iprow"><span>${S.panelRange}</span>` +
                `<b>${Math.round(Number(modeValue(selected))).toLocaleString()} ${S.perday}</b></div>`;
    } else {
        const parts = allFeats.filter(f =>
            f.properties.op === selected.op && f.properties.line === selected.line);
        let km = 0, dmin = Infinity, dmax = -Infinity;
        for (const f of parts) {
            const q = f.properties;
            km += Number(q.km) || 0;
            const v = modeValue(q);
            dmin = Math.min(dmin, v);
            dmax = Math.max(dmax, v);
        }
        const range = dmin === dmax ? Math.round(dmin).toLocaleString()
            : Math.round(dmin).toLocaleString() + ' – ' + Math.round(dmax).toLocaleString();
        box.innerHTML = head +
            `<div class="iprow"><span>${S.panelLength}</span><b>${km.toFixed(1)} ${S.km}</b></div>` +
            `<div class="iprow"><span>${S.panelSections}</span><b>${parts.length}</b></div>` +
            `<div class="iprow"><span>${S.panelRange}</span><b>${range} ${S.perday}</b></div>`;
    }
    box.style.display = 'block';
}

// "by operator" colours Korail the way it colours the six JR companies; every
// other Korean operator takes the grey Japan's private railways do.
const KORAIL_COLOR = '#5a6ff0';   // Korail blue, pushed off JR West's hue
const KR_KORAIL = new Set([
    ...Object.keys(KR_LINES).filter(ln => ln !== '수서고속선'),   // 수서고속선 is SR's (SRT)
    'ITX-청춘', '동해선 광역전철',
    '수도권 1호선', '수도권 수인분당선', '수도권 경의중앙선', '수도권 경춘선', '수도권 경강선',
]);
// Seoul lines that change operator partway along. Each lists the stations of
// the stretch that is NOT run by the line's operator above, and a segment
// touching one of them belongs to the other operator. The handover stations
// (서울역, 청량리, 지축, 남태령) are left out, so the segments either side of
// each handover fall the right way.
const KR_OP_SECTIONS = {
    // Seoul Metro's own subway between 서울역 and 청량리; the rest is Korail's
    '수도권 1호선': ['시청', '종각', '종로3가', '종로5가', '동대문', '동묘앞', '신설동', '제기동'],
    // Korail's 일산선, 지축 to 대화; the rest is Seoul Metro's
    '수도권 3호선': ['삼송', '원흥', '원당', '화정', '대곡', '백석', '마두', '정발산', '주엽', '대화'],
    // Korail's 과천선 and 안산선, 남태령 to 오이도; the rest is Seoul Metro's
    '수도권 4호선': ['선바위', '경마공원', '대공원', '과천', '정부과천청사', '인덕원', '평촌', '범계',
        '금정', '산본', '수리산', '대야미', '반월', '상록수', '한대앞', '중앙', '고잔', '초지',
        '안산', '신길온천', '정왕', '오이도'],

function krIsKorail(p) {
    const sec = KR_OP_SECTIONS[p.line];
    const other = !!sec && (sec.includes(p.from) || sec.includes(p.to));

// Korean names are romanised in both languages. This overlay is for seeing
// Korea beside Japan at a glance; korearail, linked from the legend, is the map
// for reading it closely.
const KR_CITY = { '부산': 'Busan', '대구': 'Daegu', '대전': 'Daejeon', '광주': 'Gwangju', '부산·김해': 'Busan–Gimhae' };

// Revised Romanization, for the station names the files carry no English for.
// koreariders' converter, unchanged: syllable decomposition plus the
// assimilation rules that change a place name's spelling (왕십리 Wangsimni,
// 청량리 Cheongnyangni, 신탄리 Sintalli).
const krRomanize = (() => {
    const CHO = ['g','kk','n','d','tt','r','m','b','pp','s','ss','','j','jj','ch','k','t','p','h'];
    const JUNG = ['a','ae','ya','yae','eo','e','yeo','ye','o','wa','wae','oe','yo','u','wo','we','wi','yu','eu','ui','i'];
    // a final as pronounced when a consonant (or nothing) follows
    const JONG = ['','k','k','k','n','n','n','t','l','k','m','p','l','l','p','l','m','p','p','t','t','ng','t','t','k','t','p','t'];
    // the sound a final carries onto a following vowel (silent ㅇ initial)
    const LINK = ['','g','kk','ks','n','nj','nh','d','r','lg','lm','lb','ls','lt','lp','lh','m','b','ps','s','ss','ng','j','ch','k','t','p','h'];
    const I_G = 0, I_N = 2, I_D = 3, I_R = 5, I_M = 6, I_S = 9, I_J = 12;   // initial-jamo indices
    // RULES[finalJamo][nextInitialJamo] = [finalRoman, replacementInitialRoman]
    const RULES = {};
    const rrule = (f, i, fr, ir) => { (RULES[f] || (RULES[f] = {}))[i] = [fr, ir]; };
    // ㄱ-sound and ㅂ-sound finals nasalise before ㄴ/ㅁ/ㄹ; RR keeps the h
    // before ㅎ in proper nouns (묵호 Mukho)
    for (const f of [1, 2, 9, 24]) { rrule(f, I_N, 'ng', 'n'); rrule(f, I_M, 'ng', 'm'); rrule(f, I_R, 'ng', 'n'); }
    for (const f of [11, 14, 17, 18]) { rrule(f, I_N, 'm', 'n'); rrule(f, I_M, 'm', 'm'); rrule(f, I_R, 'm', 'n'); }
    // ㄴ + ㄹ, and ㄹ-finals + ㄴ/ㄹ  →  ll
    rrule(4, I_R, 'l', 'l');
    for (const f of [8, 12, 13, 15]) { rrule(f, I_N, 'l', 'l'); rrule(f, I_R, 'l', 'l'); }
    // ㅁ / ㅇ + ㄹ → n
    rrule(16, I_R, 'm', 'n'); rrule(10, I_R, 'm', 'n'); rrule(21, I_R, 'ng', 'n');
    // ㄷ-sound finals: nasalise before ㄴ/ㅁ/ㄹ, aspirate before ㄱ/ㄷ/ㅈ
    for (const f of [7, 19, 20, 22, 23, 25, 27]) {
        rrule(f, I_N, 'n', 'n'); rrule(f, I_M, 'n', 'm'); rrule(f, I_R, 'n', 'n');
        rrule(f, I_G, 't', 'k'); rrule(f, I_D, 't', 't'); rrule(f, I_J, 't', 'ch');
    }
    // ㅎ-finals are the aspirator — they merge into the following consonant
    rrule(27, I_G, '', 'k'); rrule(27, I_D, '', 't'); rrule(27, I_J, '', 'ch'); rrule(27, I_S, '', 's');
    rrule(6,  I_G, 'n', 'k'); rrule(6,  I_D, 'n', 't'); rrule(6,  I_J, 'n', 'ch');
    rrule(15, I_G, 'l', 'k'); rrule(15, I_D, 'l', 't'); rrule(15, I_J, 'l', 'ch');

    function romanize(s) {
        const toks = [];
        for (const ch of s) {
            const c = ch.codePointAt(0);
            if (c >= 0xac00 && c <= 0xd7a3) {
                const k = c - 0xac00;
                toks.push({ cho: (k / 588) | 0, jung: ((k / 28) | 0) % 21, jong: k % 28 });
            } else toks.push(ch);
        }
        let out = '';
        for (let i = 0; i < toks.length; i++) {
            const t = toks[i];
            if (typeof t === 'string') { out += t; continue; }
            out += (t.ini !== undefined ? t.ini : CHO[t.cho]) + JUNG[t.jung];
            if (!t.jong) continue;
            const nx = toks[i + 1];
            if (nx && typeof nx === 'object') {
                if (nx.cho === 11) { nx.ini = LINK[t.jong]; continue; }   // silent ㅇ takes the final over
                const r = RULES[t.jong] && RULES[t.jong][nx.cho];
                if (r) { out += r[0]; nx.ini = r[1]; continue; }
            }
            out += JONG[t.jong];
        }
        return out;
    }
    const titleCase = s => s.replace(/(^|[\s\-(])([a-z])/g, (m, p, c) => p + c.toUpperCase());
    // names RR gets right but which have a settled English form of their own
    const STN_EN = {
        '천안아산': 'Cheonan-Asan', '광주송정': 'Gwangju-Songjeong', '여수엑스포': 'Yeosu-EXPO',
        '벡스코': 'BEXCO', '센텀': 'Centum', '디지털미디어시티': 'Digital Media City',
        '가산디지털단지': 'Gasan Digital Complex', '추추스테이션': 'Choo Choo Station',
        '청주공항': 'Cheongju Airport', '공항': 'Airport',
    };
    const cache = new Map();
    return function (name) {
        if (STN_EN[name]) return STN_EN[name];
        let v = cache.get(name);
        if (v !== undefined) return v;
        // "X역" is a station named after a station — 서울역, 대전역, 영월역
        v = /^..+역$/.test(name)
            ? titleCase(romanize(name.slice(0, -1))) + ' Station'
            : titleCase(romanize(name));
        cache.set(name, v);
        return v;
    };
})();

let krState = 'off';               // off → loading → on ⇄ hidden
let krFc = null, krSfc = null;     // the loaded Korean collections
let krYear = '';                   // yearbook edition, from segments.geojson
let krHasNoSvc = false;            // any grey track, which then needs its legend row
let krSelStationIds = new Set();   // kstations ids lit by a Korean selection
let krBtn = null;                  // the outline
const KR_META = { ...KR_LINES };   // plus every file's line_meta once loaded
const KR_NAMES = {};               // Korean station name → English, from the files

const krMeta = (ln) => KR_META[ln] || null;
function krLineLabel(ln) {
    const m = krMeta(ln);
    return m ? m.en : ln;
}
function krStnLabel(name) { return KR_NAMES[name] || krRomanize(name); }
function krClsLabel(cls) {
    const S = STR[lang];
    return { hs: S.krClsHs, semi: S.krClsSemi, conv: S.krClsConv, metro: S.krClsMetro }[cls] || '';
}
// {n} a count, {y} the yearbook edition
function krFill(s, n) {
    if (n != null) s = s.split('{n}').join(Number(n).toLocaleString());
    return s.split('{y}').join(krYear);
}
const krYearLabel = () => lang === 'ja' ? krYear + '年' : krYear;
// "2026-07 Mon-Fri mean" and "2023-11 weekday mean" → "2026-07 weekdays";
// a bare year stays a year
function krPeriod(s) {
    const m = /^(\d{4}-\d{2}) (Mon-Fri|weekday)/.exec(s || '');
    if (m) return m[1] + (lang === 'ja' ? ' 平日' : ' weekdays');
    if (/^\d{4}$/.test(s || '')) return lang === 'ja' ? s + '年' : s;
    return '';
}
// Where a Korean figure comes from, in one line. None of them is published per
// segment, so every Korean tooltip carries one.
function krSourceNote(p) {
    const S = STR[lang], m = krMeta(p.line) || {};
    if (p.level === 'passing') return krFill(S.krPubTip);
    let note;
    if (m.estimated) {
        const city = KR_CITY[m.city] || '';
        note = [city, S.krEstimated, krPeriod(p.period)].filter(Boolean).join(' · ');
    } else if (m.cls === 'metro') {
        note = S.krSeoulModel;
    } else {
        note = S.krRecon + ' · ' + krYearLabel();
    }
    return p.geometry_source === 'straight' ? note + ' · ' + S.krStraight : note;
}
// the city models' spread across their decay assumptions
function krScenarioNote(p, cls) {
    if (!p.estimated || p.daily_low == null) return '';
    const lo = Math.round(p.daily_low).toLocaleString();
    const hi = Math.round(p.daily_high).toLocaleString();
    return lo === hi ? '' : `<div class="${cls}">${STR[lang].krScenario}: ${lo} – ${hi}</div>`;
}

function krTipAt(pt) {
    const tip = document.getElementById('tooltip');
    tip.style.display = 'block';
    tip.style.left = (pt.x + 14) + 'px';
    tip.style.top = (pt.y + 14) + 'px';
    return tip;
}
function showKrSegTip(p, pt) {
    const S = STR[lang], tip = krTipAt(pt);
    const head = `<div class="line" style="color:${p.color}"><span class="mk-bar" style="background:${p.color}"></span>${krLineLabel(p.line)}</div>`;
    const km = `${Number(p.km).toFixed(1)} ${S.km}`;
    // Grey track says why it has no figure instead of quoting one. A number
    // exists, the fit's residual, and quoting it would answer a question the
    // map cannot.
    if (p.service) {
        const unrec = p.service === 'unrecorded';
        const why = unrec ? krFill(S.krUnrecNote, p.intercity_trains)
                  : p.service === 'commuter' ? krFill(S.krNoSvcCommuter, p.commuter_trains)
                  : krFill(S.krNoSvcNone);
        tip.innerHTML = head +
            `<div class="seg">${krStnLabel(p.from)} → ${krStnLabel(p.to)}</div>` +
            `<div class="ri" style="color:#8b939e">${unrec ? S.krUnrecTitle : S.krNoSvcTitle}</div>` +
            `<div class="note">${why}</div>` +
            `<div class="meta">${km}</div>`;
        return;
    }
    // a run-on stub ends at a junction, not a station, so `stub` names the line
    const to = p.stub ? S.krStubTo.replace('{n}', krLineLabel(p.stub)) : krStnLabel(p.to);
    tip.innerHTML = head +
        `<div class="seg">${krStnLabel(p.from)} → ${to}</div>` +
        `<div class="ri">${Math.round(Number(p.density)).toLocaleString()} ${S.perday}</div>` +
        `<div class="meta">${km} · ${krSourceNote(p)}</div>` +
        (p.stub ? `<div class="note">${S.krStubNote.replace('{n}', krLineLabel(p.stub))}</div>` : '') +
        // a flying junction: what joins is a service, so name the line
        (p.junction ? `<div class="note">${S.krJoinNote.replace('{n}',
            p.join_line ? krLineLabel(p.join_line) : krStnLabel(p.junction))}</div>` : '') +
        // a merged segment runs past bubbles, so it says why it has no break there
        (p.through ? `<div class="note">${krFill(S.krThroughNote, p.through)}</div>` : '') +
        krScenarioNote(p, 'meta');
}
function showKrStationTip(p, pt) {
    const S = STR[lang], tip = krTipAt(pt);
    // MapLibre hands array properties back as JSON text, not arrays
    const lns = Array.isArray(p.lines) ? p.lines : JSON.parse(p.lines || '[]');
    const when = p.kind === 'metro' ? krPeriod(p.period) : krYearLabel();
    tip.innerHTML =
        `<div class="line" style="color:${p.color}"><span class="mk-dot"></span>${krStnLabel(p.station)}</div>` +
        (lns.length ? `<div class="seg">${lns.map(krLineLabel).join(' · ')}</div>` : '') +
        `<div class="ri">${Math.round(p.riders).toLocaleString()} ${S.perday}</div>` +
        `<div class="meta">${[S.tipStationRiders, when].filter(Boolean).join(' · ')}</div>`;
}

function renderKrInfo() {
    const S = STR[lang], sel = selected, box = document.getElementById('info');
    const row = (k, v) => `<div class="iprow"><span>${k}</span><b>${v}</b></div>`;
    let html = `<div class="ipline" style="color:${sel.color}">${krLineLabel(sel.line)}</div>`;
    if (sel.mode === 'segment') {
        const to = sel.stub ? S.krStubTo.replace('{n}', krLineLabel(sel.stub)) : krStnLabel(sel.to);
        html += `<div class="ipseg">${krStnLabel(sel.from)} → ${to}</div>` +
                row(S.panelLength, `${Number(sel.km).toFixed(1)} ${S.km}`);
        if (sel.service) {
            // the panel refuses the figure wherever the tooltip does
            html += `<div class="ipseg">${sel.service === 'unrecorded' ? S.krUnrecTitle : S.krNoSvcTitle}</div>`;
        } else {
            const dir = (daily, annual) => Math.round(daily ?? (annual || 0) / 365).toLocaleString();
            html += row(S.panelRange, `${Math.round(Number(sel.density)).toLocaleString()} ${S.perday}`) +
                    row(S.krDown, dir(sel.daily_down, sel.down)) +
                    row(S.krUp, dir(sel.daily_up, sel.up));
            // Down and up are equal on a published total because it was halved,
            // not because two separate builds agreed, so it says so.
            html += sel.level === 'passing'
                ? `<div class="ipseg">${S.krPubTitle}</div><div class="ipnote">${krFill(S.krPubNote, sel.intercity_trains)}</div>`
                : `<div class="ipnote">${krSourceNote(sel)}</div>` + krScenarioNote(sel, 'ipnote');
        }
    } else {
        const parts = krFc.features.filter(f => f.properties.line === sel.line);
        const shown = parts.filter(f => !f.properties.service);
        let km = 0, dmin = Infinity, dmax = -Infinity;
        for (const f of parts) km += Number(f.properties.km) || 0;
        // the range is over segments with a figure; a grey one's number is
        // residual, not the low end
        for (const f of shown) {
            dmin = Math.min(dmin, f.properties.density);
            dmax = Math.max(dmax, f.properties.density);
        }
        const m = krMeta(sel.line);
        html += (m ? `<div class="ipseg">${krClsLabel(m.cls)}</div>` : '') +
                row(S.panelLength, `${km.toFixed(1)} ${S.km}`) +
                row(S.panelSections, parts.length);
        if (!shown.length) {
            const unrec = parts.length > 0 && parts[0].properties.service === 'unrecorded';
            html += `<div class="ipseg">${unrec ? S.krUnrecTitle : S.krNoSvcTitle}</div>` +
                    (unrec ? `<div class="ipnote">${krFill(S.krUnrecNote, parts[0].properties.intercity_trains)}</div>` : '');
        } else {
            const lo = Math.round(dmin), hi = Math.round(dmax);
            const range = lo === hi ? lo.toLocaleString() : lo.toLocaleString() + ' – ' + hi.toLocaleString();
            const pub = shown.every(f => f.properties.level === 'passing');
            html += row(S.panelRange, `${range} ${S.perday}`) +
                    `<div class="ipnote">${pub ? S.krPubTitle : krSourceNote(shown[0].properties)}</div>`;
        }
    }
    box.innerHTML = html;
    box.style.display = 'block';
}

// Exact rather than a proximity test: koreariders resolves each station against
// the drawn network and records the lines that call there.
function recomputeKrSelStationIds() {
    if (!krSfc) return;
    const seg = selected.mode === 'segment';
    for (const f of krSfc.features) {
        const p = f.properties;
        if (!p.lines.includes(selected.line)) continue;
        if (seg && p.station !== selected.from && p.station !== selected.to) continue;
        krSelStationIds.add(f.id);
    }
}

async function loadKorea() {
    const files = [...KR_SEG_FILES, ...KR_STN_FILES];
    let done = 0;
    const tick = () => { krBtn.textContent = Math.round(100 * done / files.length) + '%'; };
    tick();
    // A file that fails is a layer that does not draw, as on koreariders itself.
    const got = await Promise.all(files.map(name => fetch(krURL(name))
        .then(r => r.ok ? r.json() : Promise.reject(new Error(name + ': HTTP ' + r.status)))
        .catch(e => { console.error('korea', e); return null; })
        .finally(() => { done++; tick(); })));
    const segs = got.slice(0, KR_SEG_FILES.length);
    const stns = got.slice(KR_SEG_FILES.length);
    if (!segs[0]) return false;
    krYear = String(segs[0].year || '');

    // a metro line can share an English name with an intercity one (Gyeongchun Line)
    const intercityEn = new Set(Object.values(KR_LINES).map(m => m.en));
    const feats = [];
    for (const fc of segs) {
        if (!fc) continue;
        const meta = fc.line_meta || {};
        for (const m of Object.values(meta)) if (intercityEn.has(m.en)) m.en += ' (metro)';
        Object.assign(KR_META, meta);
        for (const [ko, en] of Object.entries(fc.station_names || {}))
            if (!KR_NAMES[ko]) KR_NAMES[ko] = en;
        for (const f of fc.features) if (f.geometry && f.geometry.coordinates) feats.push(f);
    }
    for (const f of feats) {
        const p = f.properties;
        p.op = KR_OP;
        p.density = p.daily;
        p.base_from = p.from; p.base_to = p.to; p.base_km = p.km;
        if (p.service) {
            // grey in both colour modes: an authored colour with a legend row of
            // its own, not the line's colour dimmed
            p.colorLine = p.colorOp = KR_NOSVC_COLOR;
            krHasNoSvc = true;
        } else {
            p.colorLine = (krMeta(p.line) || {}).color || OTHER_COLOR;
            p.colorOp = krIsKorail(p) ? KORAIL_COLOR : OTHER_COLOR;
        }
        p.color = colorMode === 'line' ? p.colorLine : p.colorOp;
    }
    feats.sort((a, b) => a.properties.density - b.properties.density);   // fat on top
    krFc = { type: 'FeatureCollection', features: feats };

    const sf = [];
    for (const fc of stns) if (fc) sf.push(...(fc.features || []));
    sf.forEach((f, i) => {
        const p = f.properties;
        if (!Array.isArray(p.lines)) p.lines = p.line ? [p.line] : [];
        p.color = (krMeta(p.line) || {}).color || '#ffffff';   // tooltip accent only
        p.r = radiusFor(p.riders);   // this map's bubble scale, not koreariders' larger one
        f.id = i + 1;
    });
    krSfc = { type: 'FeatureCollection', features: sf };

    map.addSource('ksegs', { type: 'geojson', data: krFc });
    map.addSource('kstations', { type: 'geojson', data: krSfc });
    const m = effMul();
    const lineLayout = () => ({ 'line-cap': 'round', 'line-join': 'round', visibility: 'none' });
    map.addLayer({
        id: 'kr-casing', type: 'line', source: 'ksegs', filter: NO_MATCH, layout: lineLayout(),
        paint: { 'line-color': '#fbfdff', 'line-width': casingWidth(m, true), 'line-opacity': 0.92 },
    });
    map.addLayer({
        id: 'kr-line', type: 'line', source: 'ksegs', layout: lineLayout(),
        paint: { 'line-color': ['get', 'color'], 'line-width': coreWidth(m, true), 'line-opacity': 0.92 },
    });
    map.addLayer({
        id: 'kr-hit', type: 'line', source: 'ksegs', layout: lineLayout(),
        paint: { 'line-color': '#000', 'line-width': hitWidth(m, true), 'line-opacity': 0 },
    });
    map.addLayer({
        id: 'kr-dots', type: 'circle', source: 'kstations', layout: { visibility: 'none' },
        paint: {
            'circle-radius': circleRadius(),
            'circle-color': '#ffffff',
            'circle-opacity': 0.5,
            'circle-stroke-color': '#ffffff',
            'circle-stroke-width': 0,
            // no transitions, for the same reason as station-dots
            'circle-opacity-transition': { duration: 0 },
            'circle-stroke-width-transition': { duration: 0 },
            'circle-stroke-color-transition': { duration: 0 },
        },
    });
    map.addLayer({
        id: 'kr-dothit', type: 'circle', source: 'kstations', layout: { visibility: 'none' },
        paint: { 'circle-radius': hitRadius(), 'circle-color': '#000', 'circle-opacity': 0 },
    });

    map.on('mousemove', 'kr-hit', (e) => {
        if (!e.features.length) return;
        const f = e.features.find(x => matchesSelection(x.properties)) || e.features[0];
        showKrSegTip(f.properties, e.point);
        map.getCanvas().style.cursor = 'pointer';
    });
    // registered after kr-hit, so a bubble on a line wins, unless a line is
    // selected, it is under the cursor, and the bubble is not one of its stops
    map.on('mousemove', 'kr-dothit', (e) => {
        if (!e.features.length) return;
        const f = e.features[0];
        if (selected && !krSelStationIds.has(f.id)) {
            const selHit = map.queryRenderedFeatures(e.point, { layers: ['kr-hit'] })
                .find(x => matchesSelection(x.properties));
            if (selHit) { showKrSegTip(selHit.properties, e.point); return; }
        }
        showKrStationTip(f.properties, e.point);
        map.getCanvas().style.cursor = 'pointer';
    });
    for (const id of ['kr-hit', 'kr-dothit']) {
        map.on('mouseleave', id, () => {
            document.getElementById('tooltip').style.display = 'none';
            map.getCanvas().style.cursor = '';
        });
    }
    return true;
}

function addKoreaButton() {
    krBtn = document.createElement('div');
    krBtn.id = 'krbtn';
    krBtn.title = STR[lang].krShowTitle;
    // kept from the map, which would read it as a click on empty ground and
    // clear the selection
    krBtn.addEventListener('click', (e) => { e.stopPropagation(); showKorea(); });
    new maplibregl.Marker({ element: krBtn, anchor: 'center' }).setLngLat(KR_CENTER).addTo(map);
    sizeKoreaButton();
    map.on('zoom', sizeKoreaButton);
}
// A fixed size on the map rather than on the screen: KR_BTN_DEG of longitude
// across at every zoom, so it grows and shrinks with Korea under it. Pixels
// equal ground distance both ways locally in Mercator, so equal pixel sides
// make it square on the map too. MapLibre's world is 512px wide at zoom 0.
function sizeKoreaButton() {
    const side = KR_BTN_DEG * 512 * Math.pow(2, map.getZoom()) / 360;
    krBtn.style.width = krBtn.style.height = side.toFixed(1) + 'px';
    krBtn.style.borderRadius = (side * 0.18).toFixed(1) + 'px';
    krBtn.style.fontSize = Math.min(10, side * 0.28).toFixed(1) + 'px';   // the loading %
}
async function showKorea() {
    if (krState === 'loading') return;
    if (krState === 'off') {
        krState = 'loading';
        krBtn.classList.add('loading');
        let ok = false;
        try { ok = await loadKorea(); } catch (e) { console.error('korea', e); }
        krBtn.classList.remove('loading');
        krBtn.textContent = '';
        if (!ok) { krState = 'off'; return; }
    }
    setKoreaShown(true);
}
function setKoreaShown(on) {
    krState = on ? 'on' : 'hidden';
    const vis = on ? 'visible' : 'none';
    for (const id of ['kr-casing', 'kr-line', 'kr-hit'])
        map.setLayoutProperty(id, 'visibility', vis);
    const dots = on && showStations ? 'visible' : 'none';
    for (const id of ['kr-dots', 'kr-dothit'])
        map.setLayoutProperty(id, 'visibility', dots);
    // the outline stands for "Korea is off", so it goes while Korea shows
    krBtn.style.display = on ? 'none' : '';
    if (!on) {
        document.getElementById('tooltip').style.display = 'none';
        if (selected && selected.op === KR_OP) clearSelection();
    }
    if (selected) applySelection();   // dim Korea under a Japanese selection
    applyWidths();                     // the viewport cap counts Korea only while it draws
    buildLegend();
}

// ───────────────────────────── interface ─────────────────────────────────
function buildLegend() {
    const S = STR[lang];
    let html = `<span class="close" id="lg-close" title="hide">×</span>` +
        `<div class="hd">${S.legSource}</div>` +
        `<div class="modetoggle dv">` +
        `<span id="src-base" class="${sourceMode === 'base' ? 'on' : ''}">${S.srcBase}</span>` +
        `<span id="src-census" class="${sourceMode === 'census' ? 'on' : ''}">${S.srcCensus}</span>` +
        `<span id="src-stitched" class="${sourceMode === 'stitched' ? 'on' : ''}">${S.srcStitched}</span>` +
        `</div>`;
    html += `<div class="hd" style="margin-top:7px">${S.legLineColors}</div>` +
        `<div class="modetoggle">` +
        `<span id="cm-op" class="${colorMode === 'operator' ? 'on' : ''}">${S.modeOperator}</span>` +
        `<span id="cm-line" class="${colorMode === 'line' ? 'on' : ''}">${S.modeLine}</span></div>`;

    html += `<div class="widths"><div class="hd">${S.legWidth}</div>`;
    for (const [d, label] of [[1000, '1k'], [20000, '20k'], [200000, '200k'], [1000000, '1M']]) {
        const w = widthFor(d);
        const h = Math.max(w, 1).toFixed(1);
        const op = Math.min(1, w).toFixed(2);
        html += `<div class="wrow"><span class="wbar" data-d="${d}" style="width:34px;height:${h}px;opacity:${op}"></span>${label}</div>`;
    }
    // Korea's grey track is drawn on the map, so it gets a row while it shows
    if (krState === 'on' && krHasNoSvc)
        html += `<div class="wrow"><span class="wbar" style="width:34px;height:2px;background:${KR_NOSVC_COLOR};opacity:1"></span>${S.legNoSvc}</div>`;
    html += `<div class="modetoggle">` +
        `<span id="sm-log" class="${knee === KNEE_MIN ? 'on' : ''}">${S.scaleLog}</span>` +
        `<span id="sm-lin" class="${knee === KNEE_MAX ? 'on' : ''}">${S.scaleLinear}</span>` +
        `<label style="display:inline-flex;align-items:center;gap:4px;margin-left:6px;color:#8b939e;cursor:pointer">` +
            `<input type="checkbox" id="autocap-toggle"${autocap ? ' checked' : ''}` +
                ` style="width:11px;height:11px;margin:0;accent-color:#5bb6ff;cursor:pointer">` +
            `${S.autocap}` +
        `</label>` +
        `</div>`;
    html += '</div>';
    html += `<div class="thick"><div class="hd">${S.legThickness} ` +
            `<span class="val" id="thickVal">×${widthMul.toFixed(1)}</span></div>` +
            `<input id="thickSlider" type="range" min="0.1" max="${THICK_SLIDER_MAX}" step="0.1" value="${widthSlider}"></div>`;
    html += `<div class="thick"><div class="hd">${S.legFloor} ` +
            `<span class="val" id="floorVal">${fmtFloor(knee)}</span></div>` +
            `<input id="floorSlider" type="range" min="${KNEE_MIN}" max="${KNEE_MAX}" step="0.01" value="${knee}"></div>`;

    html += `<div class="stsec">` +
            `<div class="hd">${S.toggleStations}</div>` +
            `<div class="strow">` +
            `<input type="checkbox" id="st-toggle"${showStations ? ' checked' : ''}>` +
            `<input id="bubbleSlider" type="range" min="0.1" max="${BUBBLE_SLIDER_MAX}" step="0.1" value="${stationSlider}">` +
            `</div></div>`;
    // only once Korea has loaded; until then the outline over it is the way in
    if (krState === 'on' || krState === 'hidden')
        html += `<div class="stsec"><div class="hd">${S.legKorea}</div>` +
                `<div class="krrow"><label class="strow"><input type="checkbox" id="kr-toggle"${krState === 'on' ? ' checked' : ''}>${S.krShow}</label>` +
                `<a class="krlink" href="${KR_PAGE}" target="_blank" rel="noopener">${S.krFullMap}</a></div>` +
                `<div class="krwarn">${S.krWarn}</div></div>`;
    document.getElementById('legend').innerHTML = html;

    document.getElementById('lg-close').onclick = () => setLegendOpen(false);
    document.getElementById('src-base').onclick = () => setSourceMode('base');
    document.getElementById('src-census').onclick = () => setSourceMode('census');
    document.getElementById('src-stitched').onclick = () => setSourceMode('stitched');
    document.getElementById('cm-op').onclick = () => setColorMode('operator');
    document.getElementById('cm-line').onclick = () => setColorMode('line');
    document.getElementById('sm-log').onclick = () => snapKnee('log');
    document.getElementById('sm-lin').onclick = () => snapKnee('linear');
    document.getElementById('autocap-toggle').onchange = (e) => {
        autocap = e.target.checked;
        applyWidths();   // re-runs computeViewportScale which now respects the flag
    };

    const sl = document.getElementById('thickSlider');
    sl.oninput = () => {
        widthSlider = parseFloat(sl.value);
        widthMul = thickMap(widthSlider);
        document.getElementById('thickVal').textContent = '×' + widthMul.toFixed(1);
        refreshWidths();
    };
    const fs = document.getElementById('floorSlider');
    fs.oninput = () => {
        knee = parseFloat(fs.value);
        document.getElementById('floorVal').textContent = fmtFloor(knee);
        document.getElementById('sm-log').classList.toggle('on', knee === KNEE_MIN);
        document.getElementById('sm-lin').classList.toggle('on', knee === KNEE_MAX);
        refreshWidths();
    };
    document.getElementById('st-toggle').onchange = (e) => {
        showStations = e.target.checked;
        const vis = showStations ? 'visible' : 'none';
        if (map.getLayer('station-dots'))
            map.setLayoutProperty('station-dots', 'visibility', vis);
        if (map.getLayer('station-hit'))
            map.setLayoutProperty('station-hit', 'visibility', vis);
        if (krState === 'on')
            for (const id of ['kr-dots', 'kr-dothit']) map.setLayoutProperty(id, 'visibility', vis);
    };
    const kt = document.getElementById('kr-toggle');
    if (kt) kt.onchange = (e) => setKoreaShown(e.target.checked);
    document.getElementById('bubbleSlider').oninput = (e) => {
        stationSlider = parseFloat(e.target.value);
        stationMul = bubbleMap(stationSlider);
        applyStationSize();
    };
}

function applyLang() {
    const S = STR[lang];
    document.title = S.h1;
    document.getElementById('t-h1').textContent = S.h1;
    // line 1 = tagline (+ AI-translated disclaimer for JA).
    // line 2 = link to the rest of my maps.
    const line1 = lang === 'ja' ? `${S.sub1} (AI翻訳)` : S.sub1;
    const moreMaps = lang === 'ja'
        ? '<a href="https://anita.garden/projects">他のマップ</a>もどうぞ!'
        : 'see <a href="https://anita.garden/projects">more maps</a>!';
    document.getElementById('t-sub').innerHTML = [line1, moreMaps].join('<br>');
    document.getElementById('lang-en').classList.toggle('on', lang === 'en');
    document.getElementById('lang-ja').classList.toggle('on', lang === 'ja');
    document.getElementById('aboutbtn').title = S.aboutTitle;
    document.getElementById('aboutpanel').innerHTML = S.aboutBody + S.aboutKorea;
    if (krBtn) krBtn.title = S.krShowTitle;
    buildLegend();
    renderInfo();
}

document.getElementById('lang-en').onclick = () => { lang = 'en'; applyLang(); };
document.getElementById('lang-ja').onclick = () => { lang = 'ja'; applyLang(); };
function setAboutOpen(v) {
    if (aboutOpen === v) return;
    aboutOpen = v;
    document.getElementById('aboutbtn').classList.toggle('on', aboutOpen);
    document.getElementById('aboutpanel').classList.toggle('open', aboutOpen);
}
let legendOpen = true;
function setLegendOpen(v) {
    if (legendOpen === v) return;
    legendOpen = v;
    document.getElementById('legend').classList.toggle('hidden', !legendOpen);
    document.getElementById('ctrlbtn').classList.toggle('show', !legendOpen);
}
document.getElementById('ctrlbtn').onclick = () => setLegendOpen(true);
document.getElementById('aboutbtn').onclick = (e) => {
    e.stopPropagation();
    setAboutOpen(!aboutOpen);
};
document.getElementById('aboutpanel').addEventListener('click', (e) => e.stopPropagation());
// Clicking anywhere outside the panel or the toggle closes the panel.
document.addEventListener('click', () => { if (aboutOpen) setAboutOpen(false); });
applyLang();
</script>
